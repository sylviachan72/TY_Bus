<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士天氣資訊板</title>
    <style>
        /* (CSS 保持不變，維持極慢捲動與觸控拖曳功能) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .top-bar { text-align: center; font-size: 20px; color: #A0A0A0; padding: 4px 0; background-color: #000000; flex-shrink: 0; }
        .main-container { display: flex; flex: 1; overflow: hidden; border-bottom: 2px solid #222; }
        .column { width: 50%; height: 100%; overflow-y: auto; padding: 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
        .column::-webkit-scrollbar { display: none; }
        .bus-route-box { padding: 8px 0; border-bottom: 1px solid #222; }
        .bus-header { display: flex; align-items: center; margin-bottom: 4px; }
        .bus-badge { font-size: 34px; font-weight: bold; color: #FFFFFF; padding: 2px 12px; border-radius: 10px; margin-right: 12px; display: inline-block; text-align: center; min-width: 110px; }
        .bus-info { font-size: 32px; color: #FFFFFF; font-weight: bold; }
        .bus-eta-row { font-size: 32px; color: #FFFFFF; padding-left: 4px; line-height: 1.3; }
        .eta-now { color: #FFC107; font-weight: bold; }
        .right-column { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .time-text { font-size: 100px; font-weight: bold; }
        .weather-info-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .weather-row1 { font-size: 32px; display: flex; align-items: center; justify-content: center; }
        .weather-icon { width: 45px; height: 45px; margin-right: 8px; }
        .weather-row2 { font-size: 32px; margin-bottom: 12px; font-weight: bold; }
        .temp-low { color: #5bc0de; margin-right: 15px; }
        .temp-high { color: #d9534f; }
        .warning-badge { background-color: #d9534f; color: #FFFFFF; padding: 4px 14px; border-radius: 8px; display: inline-block; margin: 3px; font-size: 28px; }
        
        .swt-box { width: 100%; font-size: 30px; text-align: left; border-top: 1px solid #111; padding: 8px 15px; }
        .swt-scroll-wrapper { height: 165px; overflow-y: auto; scrollbar-width: none; }
        .swt-scroll-wrapper::-webkit-scrollbar { display: none; }
        .swt-p { margin-bottom: 12px; line-height: 1.2; color: #FFFFFF; }
        .swt-count { color: #FFD700; font-weight: bold; margin-right: 10px; }

        .bottom-news-bar { height: 65px; background-color: #000000; position: relative; display: flex; align-items: center; flex-shrink: 0; width: 100%; }
        .news-label { background-color: #FF0000; color: #FFFFFF; font-size: 45px; font-weight: bold; padding: 0 15px; height: 100%; display: flex; align-items: center; min-width: 210px; }
        .news-scroll-wrapper { flex: 1; height: 100%; overflow-x: auto; display: flex; align-items: center; scrollbar-width: none; }
        .news-scroll-wrapper::-webkit-scrollbar { display: none; }
        .news-marquee-content { font-size: 45px; font-weight: bold; white-space: nowrap; flex-shrink: 0; padding-right: 50px; }
    </style>
</head>
<body>
    <div class="top-bar" id="last-update">系統準備中...</div>
    <div class="main-container">
        <div class="column left-column" id="bus-column">
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #0056B3;">249X</span><span class="bus-info">往博康</span></div><div class="bus-eta-row" id="eta-249X">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #28A745;">42A</span><span class="bus-info">往西九龍</span></div><div class="bus-eta-row" id="eta-42A">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #FD7E14;">43</span><span class="bus-info">往荃灣西</span></div><div class="bus-eta-row" id="eta-43">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #6F42C1;">49M</span><span class="bus-info">往青衣站</span></div><div class="bus-eta-row" id="eta-49M-ty">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #E83E8C;">49M</span><span class="bus-info">往青富苑</span></div><div class="bus-eta-row" id="eta-49M-kf">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #20C997;">68E</span><span class="bus-info">往元朗</span></div><div class="bus-eta-row" id="eta-68E">載入中...</div></div>
            <div class="bus-route-box"><div class="bus-header"><span class="bus-badge" style="background-color: #17A2B8;">243M</span><span class="bus-info">往荃灣</span></div><div class="bus-eta-row" id="eta-243M">載入中...</div></div>
        </div>
        <div class="column right-column">
            <div class="time-box"><span class="time-text" id="time-clock">00:00</span></div>
            <div class="weather-info-container">
                <div class="weather-row1"><img src="" alt="" class="weather-icon" id="wx-icon" style="display:none;"><span id="current-temp">--°C</span></div>
                <div class="weather-row2"><span class="temp-low" id="forecast-low">--°C</span><span class="temp-high" id="forecast-high">--°C</span></div>
            </div>
            <div id="warning-container" style="width:100%; text-align:center;"></div>
            <div class="swt-box">
                <div class="swt-scroll-wrapper" id="swt-scroll-wrapper">
                    <div class="swt-content" id="swt-content"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom-news-bar">
        <div class="news-label">即時新聞</div>
        <div class="news-scroll-wrapper" id="news-scroll-wrapper">
            <div class="news-marquee-content" id="news-content">載入中...</div>
        </div>
    </div>

    <script>
        // 核心邏輯：特別天氣提示更新
        async function fetchWeather() {
            try {
                // 獲取 SWT 數據
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const data = await res.json();
                const container = document.getElementById('swt-content');

                if (data && data.swt && data.swt.length > 0) {
                    let html = '';
                    const total = data.swt.length;
                    data.swt.forEach((tip, index) => {
                        // 在每則提示前加上 (1/3), (2/3)...
                        html += `<p class="swt-p"><span class="swt-count">(${index + 1}/${total})</span>${tip.desc}</p>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="swt-p">現時沒有特別天氣提示</p>`;
                }
                // ... 其他天氣更新邏輯 ...
            } catch(e) { console.error(e); }
        }

        // 啟動滾動引擎
        function initScroll() {
            const swt = document.getElementById('swt-scroll-wrapper');
            const news = document.getElementById('news-scroll-wrapper');
            let swtPos = 0, newsPos = 0;

            function loop() {
                // SWT 自動垂直捲動
                swtPos += 0.2; 
                if(swtPos > swt.scrollHeight / 2) swtPos = 0; // 簡單迴圈
                swt.scrollTop = swtPos;
                
                // News 自動水平捲動
                newsPos += 0.5;
                if(newsPos > news.scrollWidth / 2) newsPos = 0;
                news.scrollLeft = newsPos;
                
                requestAnimationFrame(loop);
            }
            loop();
        }

        initScroll();
        fetchWeather();
        // 其他計時器保持原樣
    </script>
</body>
</html>
