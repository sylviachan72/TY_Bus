<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士與天氣資訊</title>
    <style>
        /* 基礎設定 - 極致緊湊 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            /* 採用最易讀的系統無襯線字體，並預設全頁「粗體」 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang HK", sans-serif;
            font-weight: 700; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止整個網頁滾動 */
        }
        
        /* 隱藏滾動條但保持可滾動 */
        .scrollable {
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE 10+ */
        }
        .scrollable::-webkit-scrollbar { 
            display: none; /* Safari & Chrome */
        }

        /* 頂部標頭 */
        #header {
            text-align: center;
            color: #AAAAAA;
            font-size: 15px;
            padding: 3px 0; /* 縮減上下邊距 */
            background-color: #111111;
            z-index: 10;
            font-weight: 500;
        }

        /* 內容佈局 (左 60%, 右 40%) */
        #main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 24px);
        }
        #left-col {
            width: 60%;
            border-right: 2px solid #222222;
            padding: 6px 8px; /* 緊湊邊距 */
        }
        #right-col {
            width: 40%;
            padding: 6px 10px; /* 緊湊邊距 */
            display: flex;
            flex-direction: column;
            gap: 10px; /* 縮減區塊之間的間距 */
        }

        /* ================= 左欄：巴士資訊 (字體加大、間距縮小) ================= */
        .bus-route {
            border-bottom: 2px solid #222222;
            padding: 5px 0; /* 壓縮每條路線的上下空間 */
        }
        .bus-route:last-child {
            border-bottom: none;
        }
        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            font-size: 26px; /* 加大字體 */
        }
        .route-num {
            padding: 2px 10px;
            border-radius: 10px; /* 圓角標籤 */
            color: white;
            margin-right: 12px;
            font-size: 28px; /* 特大巴士號碼 */
            font-weight: 900; /* 特粗，方便認車 */
            line-height: 1.1;
        }
        .bus-dest {
            color: white;
            font-weight: 800;
        }
        .bus-etas {
            font-size: 24px; /* 加大班次字體 */
            color: #DDDDDD;
            line-height: 1.2;
            padding-left: 2px;
        }
        
        /* 閃爍動畫 (小於10分鐘) */
        @keyframes flashRed {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .urgent {
            color: #FF4D4D;
            font-weight: 800;
            animation: flashRed 1.2s infinite;
        }
        .eta-item {
            display: inline-block;
        }
        .eta-separator {
            margin: 0 8px;
            color: #555555;
            font-weight: bold;
        }

        /* ================= 右欄：時間與天氣 (清晰特大) ================= */
        #time-container {
            text-align: center;
            margin-top: 2px;
        }
        #clock {
            font-size: 76px; /* 巨大時間字體 */
            color: #FFFFFF;
            font-weight: 900; /* 極粗 */
            line-height: 1;
            margin-bottom: 2px;
        }
        #date {
            font-size: 22px; /* 加大日期 */
            color: #DDDDDD;
            font-weight: 700;
        }

        /* 卡片共用樣式 */
        .card {
            background-color: #1A1A1A;
            border-radius: 14px;
            padding: 8px 10px; /* 緊湊內邊距 */
            text-align: center;
        }

        /* 天氣資訊區塊 */
        .weather-row {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px; /* 加大天氣字體 */
            margin: 2px 0;
            gap: 8px;
        }
        #weather-icon {
            width: 52px; /* 放大圖標 */
            height: 52px;
            object-fit: contain;
        }
        .min-temp { color: #4DA6FF; font-weight: 800; }
        .max-temp { color: #FF4D4D; font-weight: 800; }

        /* 天氣警告 */
        #warning-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .warning-tag {
            background-color: #B30000;
            color: white;
            padding: 6px 16px;
            border-radius: 10px; /* 圓角標籤 */
            font-size: 22px; /* 加大警告字體 */
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* 特別天氣提示 (跑馬燈) */
        .swt-wrapper {
            background-color: #1A1A1A;
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 10px;
            font-size: 21px; /* 加大提示字體 */
            font-weight: 700;
            height: 105px; /* 精準容納約3行大字的高度 */
            overflow: hidden;
            position: relative;
        }
        .swt-content {
            position: absolute;
            width: calc(100% - 20px);
            line-height: 1.4;
        }
        /* 上下跑馬燈動畫 */
        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -160%; }
        }
        .marquee-active {
            animation: scrollUp 18s linear infinite;
        }
        .no-data {
            color: #666666;
            font-size: 21px;
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="header">最後更新：載入中... (每30秒自動刷新)</div>

    <div id="main-container">
        <!-- 左欄：巴士資訊 -->
        <div id="left-col" class="scrollable">
            <!-- 巴士路線將由 JavaScript 動態生成 -->
        </div>

        <!-- 右欄：時間與天氣 -->
        <div id="right-col" class="scrollable">
            <div id="time-container">
                <div id="clock">--:--</div>
                <div id="date">----年--月--日 星期-</div>
            </div>

            <div class="card" id="weather-card">
                <div class="weather-row">
                    <img id="weather-icon" src="" alt="" style="display:none;">
                    <span id="current-temp">--°C (青衣)</span>
                    <span style="color:#444;">|</span>
                    <span>💧 <span id="humidity">--%</span></span>
                </div>
                <div class="weather-row" style="font-size: 22px; margin-top: 4px;">
                    <span>❄️ <span id="min-temp" class="min-temp">--°C</span></span>
                    <span style="color:#444;">—</span>
                    <span>☀️ <span id="max-temp" class="max-temp">--°C</span></span>
                </div>
            </div>

            <div id="warning-container">
                <!-- 天氣警告動態生成 -->
                <div class="no-data">現時沒有生效的警告</div>
            </div>

            <div class="swt-wrapper">
                <div id="swt-content" class="swt-content no-data">現時沒有特別天氣提示</div>
            </div>
        </div>
    </div>

    <script>
        // ================= 巴士設定資料 =================
        const busRoutes = [
            { route: "249X", dir: "往 博康", stop: "📍青桃樓", color: "#1E90FF", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1" },
            { route: "42A", dir: "往 西九龍", stop: "📍青桃樓", color: "#32CD32", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1" },
            { route: "43", dir: "往 荃灣西", stop: "📍青桃樓", color: "#FF8C00", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1" },
            { route: "49M", dir: "往 青衣站", stop: "📍青富苑", color: "#9370DB", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1" },
            { route: "49M", dir: "往 青富苑", stop: "📍青衣站", color: "#9370DB", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1" },
            { route: "68E", dir: "往 元朗", stop: "📍青衣站", color: "#20B2AA", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1" },
            { route: "243M", dir: "往 荃灣", stop: "📍美景花園", color: "#8B4513", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1" }
        ];

        // 初始化佈局
        function initBusLayout() {
            const container = document.getElementById('left-col');
            container.innerHTML = '';
            busRoutes.forEach((bus, index) => {
                const div = document.createElement('div');
                div.className = 'bus-route';
                div.innerHTML = `
                    <div class="bus-header">
                        <span class="route-num" style="background-color: ${bus.color};">${bus.route}</span>
                        <span class="bus-dest">${bus.dir} ${bus.stop}</span>
                    </div>
                    <div class="bus-etas" id="eta-${index}">載入中...</div>
                `;
                container.appendChild(div);
            });
        }

        // ================= 時間更新 =================
        function updateTime() {
            const now = new Date();
            
            // 時鐘 (24小時制)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
            
            // 日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const day = days[now.getDay()];
            document.getElementById('date').innerText = `${year}年${month}月${date}日 ${day}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ================= 獲取巴士資訊 =================
        async function fetchBusData() {
            const now = new Date();
            const updateTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('header').innerText = `最後更新：${updateTimeStr} (每30秒自動刷新)`;

            for (let i = 0; i < busRoutes.length; i++) {
                try {
                    const response = await fetch(busRoutes[i].url);
                    const json = await response.json();
                    
                    if (json.data && json.data.length > 0) {
                        let validEtas = json.data
                            .filter(item => item.eta !== null)
                            .map(item => new Date(item.eta))
                            .sort((a, b) => a - b);

                        let htmlChunks = [];
                        let count = 0;

                        for (let j = 0; j < validEtas.length; j++) {
                            if (count >= 3) break; 
                            
                            const etaTime = validEtas[j];
                            const diffMs = etaTime - now;
                            const diffMins = Math.floor(diffMs / 60000);

                            if (diffMins < 0) continue; 

                            const hh = String(etaTime.getHours()).padStart(2, '0');
                            const mm = String(etaTime.getMinutes()).padStart(2, '0');
                            
                            let timeStr = `${hh}:${mm}(${diffMins}分鐘)`;
                            
                            if (diffMins < 10) {
                                htmlChunks.push(`<span class="eta-item urgent">▶ ${timeStr}</span>`);
                            } else {
                                htmlChunks.push(`<span class="eta-item">${timeStr}</span>`);
                            }
                            count++;
                        }

                        if (htmlChunks.length > 0) {
                            document.getElementById(`eta-${i}`).innerHTML = htmlChunks.join('<span class="eta-separator">|</span>');
                        } else {
                            document.getElementById(`eta-${i}`).innerHTML = '<span class="no-data" style="font-size:20px;">暫時沒有班次資料</span>';
                        }
                    } else {
                        document.getElementById(`eta-${i}`).innerHTML = '<span class="no-data" style="font-size:20px;">暫時沒有班次資料</span>';
                    }
                } catch (error) {
                    console.error("Bus API Error:", error);
                    document.getElementById(`eta-${i}`).innerHTML = '<span class="no-data" style="font-size:20px;">讀取失敗</span>';
                }
            }
        }

        // ================= 獲取天氣資訊 =================
        async function fetchWeatherData() {
            try {
                // 1. 實時天氣
                const resCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const currentData = await resCurrent.json();
                
                if (currentData.icon && currentData.icon.length > 0) {
                    const iconId = currentData.icon[0];
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                    iconImg.style.display = 'inline-block';
                }

                if (currentData.humidity && currentData.humidity.data.length > 0) {
                    document.getElementById('humidity').innerText = currentData.humidity.data[0].value + '%';
                }

                if (currentData.temperature && currentData.temperature.data) {
                    const tsingYiData = currentData.temperature.data.find(d => d.place === '青衣');
                    if (tsingYiData) {
                        document.getElementById('current-temp').innerText = tsingYiData.value + '°C (青衣)';
                    }
                }

                // 2. 天氣預報
                const resForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const forecastData = await resForecast.json();
                
                if (forecastData.weatherForecast && forecastData.weatherForecast.length > 0) {
                    const today = forecastData.weatherForecast[0];
                    document.getElementById('max-temp').innerText = today.forecastMaxtemp.value + '°C';
                    document.getElementById('min-temp').innerText = today.forecastMintemp.value + '°C';
                }

                // 3. 天氣警告
                const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await resWarn.json();
                const warnContainer = document.getElementById('warning-container');
                warnContainer.innerHTML = '';
                
                const warnKeys = Object.keys(warnData);
                if (warnKeys.length > 0) {
                    warnKeys.forEach(key => {
                        const warnName = warnData[key].name;
                        const div = document.createElement('div');
                        div.className = 'warning-tag';
                        div.innerHTML = `⚠️ ${warnName}`;
                        warnContainer.appendChild(div);
                    });
                } else {
                    warnContainer.innerHTML = '<div class="no-data">現時沒有生效的警告</div>';
                }

                // 4. 特別天氣提示
                const resSwt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await resSwt.json();
                const swtContent = document.getElementById('swt-content');
                
                if (swtData.swt && swtData.swt.length > 0) {
                    let tipsText = swtData.swt.map(item => item.desc).join('<br><br>');
                    swtContent.innerHTML = tipsText;
                    swtContent.className = 'swt-content';
                    swtContent.style.color = '#FFFFFF';
                    
                    setTimeout(() => {
                        if (swtContent.scrollHeight > 105) {
                            swtContent.classList.add('marquee-active');
                        } else {
                            swtContent.classList.remove('marquee-active');
                            swtContent.style.position = 'static';
                        }
                    }, 100);
                } else {
                    swtContent.innerHTML = '現時沒有特別天氣提示';
                    swtContent.className = 'swt-content no-data';
                    swtContent.classList.remove('marquee-active');
                    swtContent.style.position = 'static';
                }

            } catch (error) {
                console.error("Weather API Error:", error);
            }
        }

        // ================= 啟動與定時重整理 =================
        initBusLayout();
        fetchBusData();
        fetchWeatherData();

        setInterval(() => {
            fetchBusData();
            fetchWeatherData();
        }, 30000);

    </script>
</body>
</html>
