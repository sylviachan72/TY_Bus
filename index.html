<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時資訊版</title>
    <style>
        /* 全局重置與基本設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; line-height: 1.1; }
        
        /* 隱藏滾動條，但保留滾動功能 */
        ::-webkit-scrollbar { display: none; }
        
        /* 頂部更新時間 */
        #header-time { text-align: center; font-size: 20px; color: #aaa; padding: 4px 0; background-color: #111; border-bottom: 1px solid #333; z-index: 10; }
        
        /* 主體佈局 */
        #main-container { display: flex; flex: 1; overflow: hidden; width: 100vw; }
        
        /* ================= 左欄：巴士資訊 (60%) ================= */
        #left-col { width: 60%; height: 100%; overflow-y: auto; padding: 6px 12px; border-right: 2px solid #333; }
        
        .bus-card { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #333; }
        .bus-card:last-child { border-bottom: none; }
        
        .bus-header { display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 34px; font-weight: bold; }
        .bus-num { padding: 4px 16px; border-radius: 12px; margin-right: 12px; color: #fff; text-shadow: 1px 1px 2px #000; }
        .bus-dest { color: #fff; }
        
        /* 巴士 ETA 資訊 */
        .bus-eta-row { font-size: 32px; word-wrap: break-word; line-height: 1.3; }
        .eta-time { color: #fff; }
        .eta-min { color: #fff; }
        .eta-min.red { color: #FF4444; } /* 少於10分鐘顯示紅色 */
        .eta-sep { color: #555; margin: 0 8px; }

        /* 巴士路線顏色 */
        .bg-249X { background-color: #1E90FF; } /* 藍色 */
        .bg-42A  { background-color: #32CD32; } /* 綠色 */
        .bg-43   { background-color: #FF8C00; } /* 橙色 */
        .bg-49M  { background-color: #9370DB; } /* 紫色 */
        .bg-49M2 { background-color: #8B008B; } /* 深紫紅 */
        .bg-68E  { background-color: #20B2AA; } /* 青色 */
        .bg-243M { background-color: #DC143C; } /* 緋紅 */

        /* ================= 右欄：天氣與時間 (40%) ================= */
        #right-col { width: 40%; height: 100%; overflow-y: auto; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; }
        
        /* 時間與日期 */
        #clock-time { font-size: 100px; font-weight: bold; margin: 10px 0 0 0; line-height: 1; text-align: center; }
        #clock-date { font-size: 26px; color: #ddd; margin-bottom: 12px; text-align: center; }
        
        .divider { width: 90%; height: 2px; background-color: #333; margin: 8px 0; }

        /* 天氣主區塊 (現時溫度與濕度) */
        #weather-main { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 36px; margin: 8px 0; font-weight: bold; width: 100%; }
        #weather-icon { width: 70px; height: 70px; object-fit: contain; }
        
        /* 最高最低溫度 */
        #temp-minmax { display: flex; justify-content: center; gap: 24px; font-size: 34px; margin: 8px 0 12px 0; font-weight: bold; }
        .temp-max { color: #FF6666; }
        .temp-min { color: #66B2FF; }

        /* 警告與特別提示 */
        #warning-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 8px; }
        .warn-badge { padding: 6px 12px; border-radius: 8px; font-size: 30px; font-weight: bold; text-align: center; width: 95%; border: 2px solid transparent; }
        
        /* 提示跑馬燈 */
        #swt-container { width: 100%; max-height: 110px; overflow: hidden; position: relative; margin-top: 5px; }
        #swt-content { font-size: 30px; line-height: 1.2; padding: 0 5px; text-align: left; position: relative; width: 100%; }
        
        /* 跑馬燈動畫 */
        .marquee-anim { animation: scrollUp 15s linear infinite; }
        @keyframes scrollUp { 
            0% { transform: translateY(110px); } 
            100% { transform: translateY(-100%); } 
        }

        .no-data { color: #555; font-size: 24px; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="header-time">最後更新：載入中... (每30秒自動刷新)</div>

    <div id="main-container">
        
        <div id="left-col">
            <div class="no-data" id="bus-loading">載入巴士資訊中...</div>
            <div id="bus-list"></div>
        </div>

        <div id="right-col">
            <div id="clock-time">--:--</div>
            <div id="clock-date">--年--月--日 星期--</div>
            
            <div class="divider"></div>

            <div id="weather-main">
                <img id="weather-icon" src="" alt="" style="display:none;">
                <span id="current-temp">--°C(青衣)</span>
                <span style="color:#4db8ff; margin-left: 5px;">💧</span><span id="current-hum">--%</span>
            </div>

            <div id="temp-minmax">
                <div>❄️ <span class="temp-min" id="min-temp">--°C</span></div>
                <div>☀️ <span class="temp-max" id="max-temp">--°C</span></div>
            </div>

            <div class="divider"></div>

            <div id="warning-box">
                <div class="no-data">載入天氣資料中...</div>
            </div>

            <div id="swt-container">
                <div id="swt-content"></div>
            </div>
        </div>
    </div>

    <script>
        /* ================= 系統與時間設定 ================= */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            document.getElementById('clock-time').innerHTML = `${hours}:${minutes} <span style="font-size:40px;">${ampm}</span>`;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('clock-date').innerText = now.toLocaleDateString('zh-HK', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateLastRefresh() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('header-time').innerText = `最後更新：${timeString} (每30秒自動刷新)`;
        }

        /* ================= 巴士資料設定與抓取 ================= */
        const busRoutes = [
            { num: '249X', dest: '往博康', stop: '青桃樓', class: 'bg-249X', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { num: '42A', dest: '往西九龍', stop: '青桃樓', class: 'bg-42A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { num: '43', dest: '往荃灣西', stop: '青桃樓', class: 'bg-43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { num: '49M', dest: '往青衣站', stop: '青富苑', class: 'bg-49M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { num: '49M', dest: '往青富苑', stop: '青衣站', class: 'bg-49M2', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { num: '68E', dest: '往元朗', stop: '青衣站', class: 'bg-68E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { num: '243M', dest: '往荃灣', stop: '美景花園', class: 'bg-243M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        async function fetchBusData() {
            const listEl = document.getElementById('bus-list');
            document.getElementById('bus-loading').style.display = 'none';
            let htmlStr = '';

            for (const bus of busRoutes) {
                try {
                    const res = await fetch(bus.url);
                    const data = await res.json();
                    
                    let validEtas = (data.data || []).filter(item => item.eta !== null).slice(0, 3);
                    
                    let etaHtml = '';
                    if (validEtas.length > 0) {
                        const now = new Date();
                        const etaStrings = validEtas.map((item, index) => {
                            const etaTime = new Date(item.eta);
                            let diffMins = Math.floor((etaTime - now) / 60000);
                            if (diffMins < 0) diffMins = 0; 

                            const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit' });
                            const minClass = diffMins < 10 ? 'red' : '';
                            return `<span class="eta-time">${timeStr}</span>(<span class="eta-min ${minClass}">${diffMins}分鐘</span>)`;
                        });
                        etaHtml = etaStrings.join('<span class="eta-sep">｜</span>');
                    } else {
                        etaHtml = '<span style="color:#888;">暫無班次資料</span>';
                    }

                    htmlStr += `
                        <div class="bus-card">
                            <div class="bus-header">
                                <span class="bus-num ${bus.class}">${bus.num}</span>
                                <span class="bus-dest">${bus.dest} 📍${bus.stop}</span>
                            </div>
                            <div class="bus-eta-row">${etaHtml}</div>
                        </div>
                    `;
                } catch (err) {
                    console.error('Bus API Error:', err);
                }
            }
            listEl.innerHTML = htmlStr;
        }

        /* ================= 天氣資料設定與抓取 ================= */
        // 天氣警告樣式與文字映射表 (涵蓋子類型)
        const warnConfig = {
            // 火災危險
            'WFIREY': { bg: '#FFB300', color: '#000', text: '黃色火災危險警告' },
            'WFIRER': { bg: '#E53935', color: '#FFF', text: '紅色火災危險警告' },
            // 暴雨警告
            'WRAINA': { bg: '#FFCC00', color: '#000', text: '黃色暴雨警告信號' },
            'WRAINR': { bg: '#E53935', color: '#FFF', text: '紅色暴雨警告信號' },
            'WRAINB': { bg: '#000000', color: '#FFF', border: '#FFF', text: '黑色暴雨警告信號' },
            // 熱帶氣旋 (颱風)
            'TC1': { bg: '#424242', color: '#FFF', text: '一號戒備信號' },
            'TC3': { bg: '#424242', color: '#FFF', text: '三號強風信號' },
            'TC8NE': { bg: '#E53935', color: '#FFF', text: '八號東北烈風或暴風信號' },
            'TC8SE': { bg: '#E53935', color: '#FFF', text: '八號東南烈風或暴風信號' },
            'TC8SW': { bg: '#E53935', color: '#FFF', text: '八號西南烈風或暴風信號' },
            'TC8NW': { bg: '#E53935', color: '#FFF', text: '八號西北烈風或暴風信號' },
            'TC9': { bg: '#000000', color: '#FFF', border: '#FFCC00', text: '九號烈風或暴風增強信號' },
            'TC10': { bg: '#000000', color: '#FFF', border: '#E53935', text: '十號颶風信號' },
            // 其他常規型警告 (直接補齊)
            'WTS': { bg: '#263238', color: '#FFEB3B', text: '雷暴警告' },
            'WHOT': { bg: '#FF5722', color: '#FFF', text: '酷熱天氣警告' },
            'WCOLD': { bg: '#2196F3', color: '#FFF', text: '寒冷天氣警告' },
            'WMSGNL': { bg: '#5D4037', color: '#FFF', text: '強烈季候風信號' },
            'WL': { bg: '#795548', color: '#FFF', text: '山泥傾瀉警告' },
            'WFROST': { bg: '#00BCD4', color: '#000', text: '霜凍警告' },
            'WFNTSA': { bg: '#0288D1', color: '#FFF', text: '新界北部水浸特別報告' },
            'WTMW': { bg: '#673AB7', color: '#FFF', text: '海嘯警告' }
        };

        async function fetchWeatherData() {
            try {
                const [rhrreadRes, fndRes, warnRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                const rhrread = await rhrreadRes.json();
                const fnd = await fndRes.json();
                const warn = await warnRes.json();
                const swt = await swtRes.json();

                // 1. 現時溫度 (青衣) 與 濕度 與 圖標
                const tsingYiTemp = rhrread.temperature.data.find(d => d.place === '青衣');
                if (tsingYiTemp) {
                    document.getElementById('current-temp').innerText = `${tsingYiTemp.value}°C(青衣)`;
                }
                if (rhrread.humidity && rhrread.humidity.data[0]) {
                    document.getElementById('current-hum').innerText = `${rhrread.humidity.data[0].value}%`;
                }
                if (rhrread.icon && rhrread.icon[0]) {
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rhrread.icon[0]}.png`;
                    iconImg.style.display = 'block';
                }

                // 2. 最高最低溫度 (取今日預測)
                if (fnd.weatherForecast && fnd.weatherForecast[0]) {
                    document.getElementById('max-temp').innerText = `${fnd.weatherForecast[0].forecastMaxtemp.value}°C`;
                    document.getElementById('min-temp').innerText = `${fnd.weatherForecast[0].forecastMintemp.value}°C`;
                }

                // 3. 天氣警告 (修正數據解析結構路徑)
                const warnBox = document.getElementById('warning-box');
                warnBox.innerHTML = ''; 
                let hasWarning = false;
                
                // 修正點：必須讀取物件底下的 .warnsum
                const warnList = warn.warnsum || {};

                for (const key in warnList) {
                    const item = warnList[key];
                    
                    // 修正點：如果行動代號是 CANCEL，代表該警告已取消，跳過不顯示
                    if (item.actionCode === 'CANCEL') continue;
                    
                    const code = item.code;
                    const config = warnConfig[code];
                    hasWarning = true;
                    
                    // 預設兜底樣式（若未來天文台新增代號，仍能正常顯示其原生中文名稱）
                    let bg = '#555';
                    let color = '#fff';
                    let text = item.name; 
                    let borderStyle = '';
                    
                    if (config) {
                        bg = config.bg;
                        color = config.color;
                        text = config.text;
                        if (config.border) borderStyle = `border-color: ${config.border};`;
                    }
                    
                    warnBox.innerHTML += `<div class="warn-badge" style="background-color:${bg}; color:${color}; ${borderStyle}">${text}</div>`;
                }

                if (!hasWarning) {
                    warnBox.innerHTML = '<div style="color: #666; font-size: 24px; text-align: center; margin-top: 5px;">現時沒有生效的警告</div>';
                }

                // 4. 特別天氣提示
                const swtContent = document.getElementById('swt-content');
                swtContent.classList.remove('marquee-anim');
                let tipsHtml = '';
                
                if (swt.swt && swt.swt.length > 0) {
                    tipsHtml = swt.swt.map(t => t.desc).join('<br><br>');
                }

                if (!tipsHtml) {
                    swtContent.innerHTML = '<div style="color: #666; font-size: 24px; text-align: center; margin-top: 5px;">現時沒有特別天氣提示</div>';
                } else {
                    swtContent.innerHTML = tipsHtml;
                    setTimeout(() => {
                        if (swtContent.offsetHeight > 110) {
                            swtContent.classList.add('marquee-anim');
                        }
                    }, 100);
                }

            } catch (err) {
                console.error('Weather API Error:', err);
                document.getElementById('warning-box').innerHTML = '<div class="no-data">天氣資料載入失敗</div>';
            }
        }

        /* ================= 初始化與自動更新 ================= */
        function refreshAllData() {
            fetchBusData();
            fetchWeatherData();
            updateLastRefresh();
        }

        refreshAllData();
        setInterval(refreshAllData, 30000); // 每 30 秒背景更新

    </script>
</body>
</html>
