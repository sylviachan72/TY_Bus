<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊面板1</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, "PingFang HK", "Microsoft JhengHei", sans-serif;
            font-weight: bold;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 隱藏滾動條但保持可滾動 */
        .scrollable {
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }
        .scrollable::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Edge */
        }

        /* ================= 頂部狀態列 ================= */
        #top-bar {
            text-align: center;
            font-size: 14px;
            color: #AAAAAA;
            padding: 2px 0;
            height: 25px;
            line-height: 21px;
            background-color: #111;
        }

        /* ================= 主要內容區 ================= */
        #main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 25px - 70px); /* 扣除頂部和底欄 */
        }

        /* --- 左欄：巴士資訊 (50%) --- */
        #left-col {
            width: 50%;
            border-right: 1px solid #333;
            padding: 10px;
        }
        .bus-route {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }
        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        .bus-num {
            font-size: 24px;
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 10px;
            color: #FFFFFF;
        }
        .bus-dest {
            font-size: 24px;
        }
        .bus-times {
            font-size: 22px;
            line-height: 1.3;
            word-wrap: break-word;
        }
        .time-item { margin-right: 5px; }
        .time-mango { color: #FFCC00; }
        .time-white { color: #FFFFFF; }

        /* --- 右欄：時間與天氣 (50%) --- */
        #right-col {
            width: 50%;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
        }
        #time-container {
            text-align: right;
            margin-bottom: 15px;
        }
        #time-display {
            font-size: 80px;
            line-height: 1;
        }
        #date-display {
            font-size: 28px;
            line-height: 1;
            margin-top: 5px;
        }
        
        #weather-container {
            margin-top: 5px;
        }
        .weather-row1 {
            font-size: 28px;
            display: flex;
            align-items: center;
            line-height: 1;
        }
        .weather-row1 img {
            height: 35px;
            margin-right: 5px;
        }
        .weather-row2 {
            font-size: 28px;
            line-height: 1;
            margin-top: 0; /* 零縫隙貼合 */
        }
        .temp-min { color: #00BFFF; }
        .temp-max { color: #FF6347; }

        /* 天氣警告 */
        #warning-container {
            margin-top: 15px;
        }
        .warning-tag {
            display: inline-block;
            background-color: #FF0000;
            color: #FFFFFF;
            font-size: 22px;
            padding: 4px 12px;
            border-radius: 8px;
            margin-right: 8px;
            margin-bottom: 5px;
        }
        .no-warning {
            font-size: 22px;
            color: #666666;
        }

        /* 特別天氣提示 */
        #swt-container {
            margin-top: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            height: 140px; /* 約5行高度 */
            overflow: hidden;
            position: relative;
        }
        .swt-text {
            font-size: 22px;
            color: #FFFFFF;
            line-height: 1.4;
        }
        .swt-scroll {
            position: absolute;
            animation: scroll-up 20s linear infinite;
        }
        @keyframes scroll-up {
            0% { top: 100%; }
            100% { top: -100%; }
        }

        /* ================= 底部新聞跑馬燈 ================= */
        #footer-bar {
            height: 70px;
            background-color: #222;
            display: flex;
            align-items: center;
        }
        .news-label {
            background-color: #FF0000;
            color: #FFFFFF;
            font-size: 30px;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            z-index: 10;
            white-space: nowrap;
        }
        .news-marquee-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            background-color: #000;
        }
        .news-text {
            position: absolute;
            white-space: nowrap;
            /* 字體設定為要求的 45px */
            font-size: 45px; 
            line-height: 70px;
            /* 動畫起點為 0，直接顯示 */
            animation: scroll-left 35s linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translateX(10%); }
            100% { transform: translateX(-100%); }
        }

    </style>
</head>
<body>

    <div id="top-bar">最後更新：<span id="last-update">--:--:--</span> (每30秒自動刷新)</div>

    <div id="main-content">
        <div id="left-col" class="scrollable">
            <div id="bus-data-container">載入巴士資訊中...</div>
        </div>

        <div id="right-col" class="scrollable">
            <div id="time-container">
                <div id="time-display">--:--</div>
                <div id="date-display">----年--月--日 星期-</div>
            </div>
            
            <div id="weather-container">
                <div class="weather-row1" id="weather-row1">
                    載入天氣中...
                </div>
                <div class="weather-row2" id="weather-row2">
                    --
                </div>
                
                <div id="warning-container"></div>
                
                <div id="swt-container">
                    <div id="swt-content" class="swt-text no-warning">載入特別天氣提示中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-bar">
        <div class="news-label">即時新聞</div>
        <div class="news-marquee-container">
            <div id="news-text" class="news-text">加載香港電台新聞中...</div>
        </div>
    </div>

    <script>
        // 巴士設定與資料來源
        const busConfigs = [
            { id: '249X', dir: '往博康', stop: '青桃樓', color: '#1E90FF', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { id: '42A', dir: '往西九龍', stop: '青桃樓', color: '#32CD32', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { id: '43', dir: '往荃灣西', stop: '青桃樓', color: '#FFA500', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { id: '49M', dir: '往青衣站', stop: '青富苑', color: '#9370DB', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { id: '49M_2', label: '49M', dir: '往青富苑', stop: '青衣站', color: '#9370DB', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { id: '68E', dir: '往元朗', stop: '青衣站', color: '#B22222', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { id: '243M', dir: '往荃灣', stop: '美景花園', color: '#20B2AA', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        // 天氣警告代碼對照表
        const warningDict = {
            'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
            'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
            'TC1': '一號戒備信號', 'TC3': '三號強風信號', 'TC8NE': '八號東北烈風或暴風信號', 
            'TC8SE': '八號東南烈風或暴風信號', 'TC8SW': '八號西南烈風或暴風信號', 
            'TC8NW': '八號西北烈風或暴風信號', 'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號'
        };

        // 更新時間 (時鐘)
        function updateClock() {
            const now = new Date();
            
            // 處理右上角時間 (12小時制)
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('time-display').innerText = `${ampm} ${hours}:${minutes}`;

            // 處理日期
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
            document.getElementById('date-display').innerText = dateStr;
        }

        // 設置頂部最後更新時間
        function setLastUpdateTime() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('last-update').innerText = timeStr;
        }

        // 抓取巴士資料
        async function fetchBusData() {
            let htmlContent = '';
            for (const bus of busConfigs) {
                try {
                    const response = await fetch(bus.url);
                    const data = await response.json();
                    
                    const etas = data.data
                        .filter(item => item.eta !== null)
                        .map(item => {
                            const etaDate = new Date(item.eta);
                            const now = new Date();
                            const diffMs = etaDate - now;
                            const diffMins = Math.floor(diffMs / 60000);
                            return {
                                time: `${String(etaDate.getHours()).padStart(2, '0')}:${String(etaDate.getMinutes()).padStart(2, '0')}`,
                                minutes: diffMins
                            };
                        })
                        .filter(item => item.minutes >= 0)
                        .slice(0, 3); // 取最近3班

                    let timeHtml = '';
                    if (etas.length > 0) {
                        timeHtml = etas.map(eta => {
                            const minClass = eta.minutes < 10 ? 'time-mango' : 'time-white';
                            return `<span class="time-item">${eta.time}(<span class="${minClass}">${eta.minutes}分鐘</span>)</span>`;
                        }).join(' <span class="time-white">|</span> ');
                    } else {
                        timeHtml = '<span class="no-warning">暫無班次資料</span>';
                    }

                    const displayNum = bus.label || bus.id;
                    htmlContent += `
                        <div class="bus-route">
                            <div class="bus-header">
                                <span class="bus-num" style="background-color: ${bus.color};">${displayNum}</span>
                                <span class="bus-dest">往${bus.dir} 📍${bus.stop}</span>
                            </div>
                            <div class="bus-times">${timeHtml}</div>
                        </div>
                    `;
                } catch (error) {
                    console.error(`Error fetching bus ${bus.id}:`, error);
                }
            }
            document.getElementById('bus-data-container').innerHTML = htmlContent;
        }

        // 抓取天氣資料
        async function fetchWeatherData() {
            try {
                // 實時天氣
                const rhrreadRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const rhrread = await rhrreadRes.json();
                
                // 預報 (最高最低溫)
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fnd = await fndRes.json();
                
                // 警告
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warn = await warnRes.json();

                // 特別天氣提示
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swt = await swtRes.json();

                // 處理 Row 1: 圖標, 青衣溫度, 濕度
                const iconCode = rhrread.icon[0];
                const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
                
                let tsingYiTemp = '--';
                const tyData = rhrread.temperature.data.find(d => d.place === '青衣');
                if(tyData) tsingYiTemp = tyData.value;
                
                const humidity = rhrread.humidity.data[0].value;
                
                document.getElementById('weather-row1').innerHTML = `
                    <img src="${iconUrl}" alt="天氣圖標"> ${tsingYiTemp}°C(青衣) 💧${humidity}%
                `;

                // 處理 Row 2: 今日最高最低溫
                const todayForecast = fnd.weatherForecast[0];
                const minTemp = todayForecast.forecastMintemp.value;
                const maxTemp = todayForecast.forecastMaxtemp.value;
                document.getElementById('weather-row2').innerHTML = `
                    <span class="temp-min">❄️${minTemp}°C</span> 
                    <span class="temp-max">☀️${maxTemp}°C</span>
                `;

                // 處理警告
                let warningHtml = '';
                if (warn && Object.keys(warn).length > 0) {
                    for (const key in warn) {
                        // 如果字典裡有對應的名稱就用，否則用 API 給的預設名稱
                        const warnName = warningDict[warn[key].code] || warn[key].name; 
                        warningHtml += `<div class="warning-tag">${warnName}</div>`;
                    }
                } else {
                    warningHtml = '<div class="no-warning">現時沒有生效的警告</div>';
                }
                document.getElementById('warning-container').innerHTML = warningHtml;

                // 處理特別天氣提示
                const swtContent = document.getElementById('swt-content');
                if (swt && swt.swt && swt.swt.length > 0) {
                    const tips = swt.swt.map(item => item.desc).join('<br><br>');
                    swtContent.innerHTML = tips;
                    swtContent.className = 'swt-text';
                    // 判斷是否需要滾動 (字太多超過容器高度)
                    if (swtContent.offsetHeight > 140) {
                        swtContent.classList.add('swt-scroll');
                    } else {
                        swtContent.classList.remove('swt-scroll');
                    }
                } else {
                    swtContent.innerHTML = '現時沒有特別天氣提示';
                    swtContent.className = 'swt-text no-warning';
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
            }
        }

        // 抓取香港電台 RSS 新聞
        async function fetchNews() {
            try {
                // 使用 rss2json API 將 XML 轉為 JSON，解決跨域(CORS)問題
                const rssUrl = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    // 取前 10 條新聞串接
                    const newsString = data.items.slice(0, 10).map(item => `【${item.title}】${item.description.replace(/(<([^>]+)>)/gi, "")}`).join(' &nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp; ');
                    document.getElementById('news-text').innerHTML = newsString + ' &nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp; ';
                }
            } catch (error) {
                console.error("Error fetching news:", error);
                document.getElementById('news-text').innerHTML = '暫時無法載入新聞。';
            }
        }

        // 主更新函數
        function refreshData() {
            setLastUpdateTime();
            fetchBusData();
            fetchWeatherData();
        }

        // 初始化
        updateClock();
        setInterval(updateClock, 1000); // 時鐘每秒更新
        
        fetchNews(); // 新聞只需初始化載入，或可設定更長的更新頻率
        setInterval(fetchNews, 300000); // 新聞 5 分鐘更新一次

        refreshData();
        setInterval(refreshData, 30000); // 巴士與天氣 30 秒更新一次

    </script>
</body>
</html>
