<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時資訊面板</title>
    <style>
        /* 基礎色彩與字體設定 */
        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --border-color: #444444;
            --warning-red: #FF3333;
            --yellow: #FFD700;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 隱藏全頁滾動條 */
        }

        /* 頂部最後更新列 */
        #header {
            text-align: center;
            font-size: 1.2rem;
            color: #AAAAAA;
            padding: 8px 0;
            border-bottom: 2px solid var(--border-color);
            background-color: #111;
        }

        /* 主要內容區 (左右分欄) */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側：巴士資訊 (佔 60%) */
        #bus-panel {
            width: 60%;
            padding: 15px 20px;
            border-right: 2px solid var(--border-color);
            overflow-y: auto;
            /* 隱藏滾動條但保持可滾動 */
            scrollbar-width: none; 
        }
        #bus-panel::-webkit-scrollbar { display: none; }

        .bus-route-card {
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        /* 巴士路線標題列 */
        .bus-header {
            display: flex;
            align-items: center;
            font-size: 1.6rem;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .route-pill {
            padding: 4px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.8rem;
            margin-right: 12px;
            color: #FFF;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .bus-direction { margin-right: 15px; font-weight: bold; }
        .bus-stop { color: var(--yellow); }

        /* 巴士班次列 */
        .bus-times {
            display: flex;
            align-items: center;
            font-size: 1.6rem;
            color: #E0E0E0;
            white-space: nowrap;
        }

        .eta-item { display: inline-flex; align-items: center; }
        
        .urgent {
            color: var(--warning-red);
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(255,51,51,0.8); }
            50% { opacity: 0.6; text-shadow: none; }
        }

        /* 右側：天氣與時間 (佔 40%) */
        #weather-panel {
            width: 40%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #weather-panel::-webkit-scrollbar { display: none; }

        /* 巨型時鐘 */
        #clock-container {
            text-align: center;
            margin-bottom: 15px;
        }
        
        #clock-time {
            font-size: 5.5rem; /* 巨型字體 */
            font-weight: bold;
            color: var(--yellow);
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        #clock-date {
            font-size: 1.5rem;
            color: #DDDDDD;
        }

        .divider { border-top: 1px solid var(--border-color); margin: 15px 0; }

        /* 天氣基礎資訊 (緊湊橫排) */
        .weather-basic {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
            gap: 15px;
        }
        
        .weather-icon { width: 60px; height: 60px; }
        
        .weather-range {
            font-size: 1.5rem;
            color: #CCCCCC;
        }

        /* 天氣警告 (緊湊橫排標籤) */
        #warnings-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .warning-tag {
            background-color: var(--warning-red);
            color: white;
            padding: 5px 12px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 特別天氣提示 (大黃框) */
        .swt-box {
            border: 2px dashed var(--yellow);
            background-color: rgba(255, 215, 0, 0.05);
            color: var(--yellow);
            padding: 15px;
            border-radius: 8px;
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 頂部列 -->
    <div id="header">🕒 最後更新: <span id="last-update">載入中...</span> (每30秒自動刷新)</div>

    <div id="main-container">
        <!-- 左側：巴士實時資訊 -->
        <div id="bus-panel">
            <div id="bus-list">載入巴士資料中...</div>
        </div>

        <!-- 右側：時鐘與天氣 -->
        <div id="weather-panel">
            <!-- 巨型時鐘 -->
            <div id="clock-container">
                <div id="clock-time">--:--</div>
                <div id="clock-date">--年--月--日 星期-</div>
            </div>
            
            <div class="divider"></div>

            <!-- 天氣資訊 -->
            <div class="weather-basic">
                <img id="weather-icon" class="weather-icon" style="display:none;" alt="天氣圖示" />
                <span id="current-temp" style="font-weight: bold;">--°C</span>
                <span>｜</span>
                <span>濕度: <span id="current-humidity">--%</span></span>
            </div>
            <div class="weather-range" id="temp-range">今日最高及最低溫度載入中...</div>

            <div class="divider"></div>

            <!-- 天氣警告 -->
            <div id="warnings-container"></div>
            
            <!-- 特別天氣提示 -->
            <div id="swt-container"></div>
        </div>
    </div>

    <script>
        // --- 設定巴士路線資料 ---
        const busRoutes = [
            { route: '249X', dest: '博康', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', color: '#1E90FF' }, // 鮮藍
            { route: '42A', dest: '高鐵(西九龍)', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', color: '#32CD32' }, // 草綠
            { route: '43', dest: '荃灣西站', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', color: '#FF8C00' }, // 橙色
            { route: '49M', dest: '青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', color: '#9370DB' }, // 紫色
            { route: '49M', dest: '青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', color: '#8A2BE2' }, // 深紫
            { route: '68E', dest: '元朗公園', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', color: '#00CED1' }, // 湖水綠
            { route: '243M', dest: '荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', color: '#FF69B4' } // 粉紅
        ];

        // --- 功能 1：巨型時鐘 (每秒更新) ---
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${days[now.getDay()]}`;
            
            document.getElementById('clock-time').textContent = timeStr;
            document.getElementById('clock-date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock(); 

        // --- 功能 2：獲取實時巴士資料 ---
        async function fetchBusData() {
            const busListDiv = document.getElementById('bus-list');
            let newHtml = '';
            const now = new Date();

            for (const bus of busRoutes) {
                try {
                    const response = await fetch(bus.url);
                    const json = await response.json();
                    
                    let etas = json.data.filter(item => item.eta !== null && new Date(item.eta) > now);
                    etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                    etas = etas.slice(0, 3);

                    let timesHtml = '';
                    if (etas.length === 0) {
                        timesHtml = '<span style="color:#888;">暫無班次資料</span>';
                    } else {
                        etas.forEach((eta, index) => {
                            const etaDate = new Date(eta.eta);
                            const diffMins = Math.floor((etaDate - now) / 60000);
                            
                            const timeStr = etaDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                            const minStr = diffMins <= 0 ? '即將到達' : `${diffMins}分鐘`;
                            
                            const isUrgentClass = diffMins < 10 && diffMins >= 0 ? 'urgent' : '';
                            const alertIcon = diffMins < 10 && diffMins >= 0 ? ' 🚨' : '';
                            
                            const prefix = index === 0 ? '▶ ' : ' ｜ ';
                            const displayContent = `${prefix}${timeStr}(${minStr})${alertIcon}`;
                            
                            timesHtml += `<span class="eta-item ${isUrgentClass}">${displayContent}</span>`;
                        });
                    }

                    newHtml += `
                        <div class="bus-route-card">
                            <div class="bus-header">
                                <div class="route-pill" style="background-color: ${bus.color}">${bus.route}</div>
                                <div class="bus-direction">往 ${bus.dest}</div>
                                <div class="bus-stop">📍 ${bus.stop}</div>
                            </div>
                            <div class="bus-times">
                                ${timesHtml}
                            </div>
                        </div>
                    `;
                } catch (error) {
                    console.error(`無法載入巴士 ${bus.route} 資料:`, error);
                }
            }
            busListDiv.innerHTML = newHtml;
        }

        // --- 功能 3：獲取天氣資料 ---
        async function fetchWeatherData() {
            try {
                // 3.1 獲取現時天氣 (溫度、濕度、圖示)
                const resRhrread = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const dataRhrread = await resRhrread.json();
                
                if (dataRhrread.icon && dataRhrread.icon.length > 0) {
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${dataRhrread.icon[0]}.png`;
                    iconImg.style.display = 'block';
                }

                const obsTemp = dataRhrread.temperature.data.find(d => d.place === '香港天文台') || dataRhrread.temperature.data[0];
                document.getElementById('current-temp').textContent = obsTemp.value + '°C';
                
                if(dataRhrread.humidity && dataRhrread.humidity.data.length > 0) {
                    document.getElementById('current-humidity').textContent = dataRhrread.humidity.data[0].value + '%';
                }

                // 3.2 獲取九天天氣預報 (利用結構化數據直接讀取今日最高/最低溫度)
                // 這樣能保證 100% 抓到數字，不受文字描述改變影響
                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const dataFnd = await resFnd.json();
                
                if (dataFnd.weatherForecast && dataFnd.weatherForecast.length > 0) {
                    const todayForecast = dataFnd.weatherForecast[0]; // 陣列第一項就是今天
                    const maxTemp = todayForecast.forecastMaxtemp.value;
                    const minTemp = todayForecast.forecastMintemp.value;
                    document.getElementById('temp-range').innerHTML = `今日最高: <span style="color:#FFF">${maxTemp}°C</span> ｜ 最低: <span style="color:#FFF">${minTemp}°C</span>`;
                } else {
                    document.getElementById('temp-range').textContent = "未能獲取最高及最低溫度";
                }

                // 3.3 獲取天氣警告
                const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const textWarn = await resWarn.text();
                const warnsContainer = document.getElementById('warnings-container');
                warnsContainer.innerHTML = ''; 
                
                if (textWarn.trim() !== '') {
                    const dataWarn = JSON.parse(textWarn);
                    for (const key in dataWarn) {
                        warnsContainer.innerHTML += `<div class="warning-tag">🟥 ${dataWarn[key].name}</div>`;
                    }
                }

                // 3.4 獲取特別天氣提示
                const resSwt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const textSwt = await resSwt.text();
                const swtContainer = document.getElementById('swt-container');
                swtContainer.innerHTML = ''; 
                
                if (textSwt.trim() !== '') {
                    const dataSwt = JSON.parse(textSwt);
                    if (dataSwt.swt && dataSwt.swt.length > 0) {
                        dataSwt.swt.forEach(tip => {
                            swtContainer.innerHTML += `<div class="swt-box">⚠️ <b>特別天氣提示：</b><br>${tip.desc}</div>`;
                        });
                    }
                }

            } catch (error) {
                console.error('獲取天氣API時發生錯誤:', error);
            }
        }

        // --- 功能 4：統一更新排程 ---
        function updateAllData() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleTimeString('zh-HK');
            
            fetchBusData();
            fetchWeatherData();
        }

        updateAllData();
        setInterval(updateAllData, 30000);
    </script>
</body>
</html>
