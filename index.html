<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0855儀表板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .main-container { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }
    .column { width: 50%; padding: 8px 12px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .column::-webkit-scrollbar { display: none; }
    .left-column { border-right: 1px solid #222222; }
    .update-header { font-size: 20px; color: #ffffff; text-align: center; margin-bottom: 8px; white-space: nowrap; }

    /* 巴士樣式 */
    .bus-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-item { border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .bus-header { font-size: 34px; font-weight: bold; color: #ffffff; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .bus-tag { padding: 2px 12px; border-radius: 8px; color: #ffffff; display: inline-block; font-weight: bold; }
    .bus-dest-stop { color: #ffffff; }
    .bus-eta-container { font-size: 32px; color: #ffffff; display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; }
    .eta-group { white-space: nowrap; display: inline-block; }
    .eta-time { color: #ffffff; }
    .eta-min-yellow { color: #FFC107; font-weight: bold; }
    .eta-min-white { color: #ffffff; }
    .eta-sep { color: #ffffff; margin: 0 6px; }
    .no-eta { font-size: 32px; color: #888888; }

    /* 天氣與時鐘樣式 */
    .weather-column { display: flex; flex-direction: column; align-items: center; }
    .time-section { text-align: center; margin-bottom: 0px; width: 100%; }
    .time-display { display: flex; align-items: baseline; justify-content: center; line-height: 1; margin-bottom: 2px; }
    .ampm { font-size: 40px; color: #ffffff; margin-right: 12px; font-weight: bold; }
    .clock { font-size: 100px; font-weight: bold; color: #ffffff; letter-spacing: -2px; }
    .date-display { font-size: 30px; color: #ffffff; text-align: center; margin-top: -8px; margin-bottom: 6px; font-weight: 500; }
    .weather-data-box { width: 100%; text-align: center; margin-bottom: 10px; }
    .weather-row-1 { font-size: 32px; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 0; line-height: 1.1; }
    .weather-icon { height: 42px; width: auto; vertical-align: middle; }
    .weather-row-2 { font-size: 32px; display: flex; align-items: center; justify-content: center; gap: 18px; margin: 0; padding: 0; line-height: 1.1; }
    .temp-min { color: #4D94FF; font-weight: bold; }
    .temp-max { color: #FF4D4D; font-weight: bold; }
    .info-block { width: 100%; text-align: left; margin-top: 6px; }
    .warning-badge { font-size: 30px; background-color: #E53935; color: #ffffff; padding: 4px 14px; border-radius: 8px; display: inline-block; font-weight: bold; margin-bottom: 6px; margin-right: 6px; }
    .warning-none, .swt-none { font-size: 30px; color: #888888; text-align: left; }
    .swt-container { font-size: 30px; color: #ffffff; line-height: 1.35; text-align: left; max-height: 160px; overflow: hidden; position: relative; }
    .swt-scroll-content { display: inline-block; }
    @keyframes verticalMarquee {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .swt-animated { animation: verticalMarquee 15s linear infinite; }
    .swt-animated:hover { animation-play-state: paused; }

    /* 底部新聞跑馬燈 (恆定每秒 80px 勻速) */
    .news-bar { height: 65px; background-color: #000000; border-top: 2px solid #333333; display: flex; align-items: center; overflow: hidden; position: relative; width: 100vw; }
    .news-label { background-color: #E53935; color: #ffffff; font-size: 45px; font-weight: bold; padding: 0 16px; height: 100%; display: flex; align-items: center; flex-shrink: 0; z-index: 10; white-space: nowrap; }
    .news-track-wrapper { flex: 1; height: 100%; overflow: hidden; position: relative; display: flex; align-items: center; }
    .news-track { position: absolute; white-space: nowrap; font-size: 45px; color: #ffffff; display: flex; align-items: center; will-change: transform; transform: translateZ(0); }
    @keyframes marqueeNews {
      0% { transform: translateX(var(--start-x)); }
      100% { transform: translateX(var(--end-x)); }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="column left-column">
      <div class="update-header" id="bus-update-header">最後更新：--:--:--（每30秒自動刷新）</div>
      <div class="bus-list" id="bus-list-container"></div>
    </div>

    <div class="column weather-column">
      <div class="update-header" id="weather-update-header">最後更新：--:--:--（每5分鐘自動刷新）</div>
      <div class="time-section">
        <div class="time-display">
          <span class="ampm" id="clock-ampm">--</span>
          <span class="clock" id="clock-time">--:--</span>
        </div>
        <div class="date-display" id="date-display">----年--月--日 星期-</div>
      </div>

      <div class="weather-data-box">
        <div class="weather-row-1">
          <img id="wx-icon" class="weather-icon" src="" alt="" style="display:none;">
          <span id="tsing-yi-temp">--°C(青衣)</span>
          <span id="humidity">💧--%</span>
        </div>
        <div class="weather-row-2">
          <span class="temp-min" id="temp-min">❄️--°C</span>
          <span class="temp-max" id="temp-max">☀️--°C</span>
        </div>
      </div>

      <div class="info-block">
        <div id="warning-container"><div class="warning-none">現時沒有生效的警告</div></div>
      </div>

      <div class="info-block" style="margin-top: 10px;">
        <div id="swt-container" class="swt-container"><div class="swt-none">現時沒有特別天氣提示</div></div>
      </div>
    </div>
  </div>

  <div class="news-bar">
    <div class="news-label">即時新聞</div>
    <div class="news-track-wrapper" id="news-wrapper">
      <div class="news-track" id="news-track">正在載入新聞...</div>
    </div>
  </div>

  <script>
    const BUS_ROUTES = [
      { id: '249X', routeDisplay: '249X', dest: '往博康', stop: '📍青桃樓', bg: '#0052CC', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', filterDir: null },
      { id: '42A',  routeDisplay: '42A',  dest: '往西九龍', stop: '📍青桃樓', bg: '#007A33', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', filterDir: null },
      { id: '43',   routeDisplay: '43',   dest: '往荃灣西', stop: '📍青桃樓', bg: '#C64B00', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', filterDir: null },
      { id: '49M_1',routeDisplay: '49M',  dest: '往青衣站', stop: '📍青富苑', bg: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', filterDir: null },
      { id: '49M_2',routeDisplay: '49M',  dest: '往青富苑', stop: '📍青衣站', bg: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', filterDir: null },
      { id: '68E',  routeDisplay: '68E',  dest: '往元朗',   stop: '📍青衣站', bg: '#006666', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', filterDir: null },
      { id: '243M', routeDisplay: '243M', dest: '往荃灣',   stop: '📍美景花園', bg: '#5C3A21', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', filterDir: 'O' }
    ];

    function initBusLayout() {
      const container = document.getElementById('bus-list-container');
      container.innerHTML = '';
      BUS_ROUTES.forEach(route => {
        const item = document.createElement('div');
        item.className = 'bus-item';
        item.innerHTML = `
          <div class="bus-header">
            <span class="bus-tag" style="background-color: ${route.bg};">${route.routeDisplay}</span>
            <span class="bus-dest-stop">${route.dest} ${route.stop}</span>
          </div>
          <div class="bus-eta-container" id="eta-box-${route.id}"><span class="no-eta">更新中...</span></div>
        `;
        container.appendChild(item);
      });
    }

    function formatTime12h(dateObj) {
      let hours = dateObj.getHours() % 12 || 12;
      let minutes = String(dateObj.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    async function fetchBusData() {
      const now = new Date();
      document.getElementById('bus-update-header').innerText = `最後更新：${format24hTime(now)}（每30秒自動刷新）`;
      for (const route of BUS_ROUTES) {
        try {
          const res = await fetch(route.url);
          const json = await res.json();
          let dataList = json.data || [];
          if (route.filterDir) dataList = dataList.filter(item => item.dir === route.filterDir);
          const validEtas = dataList.filter(item => item.eta).sort((a, b) => new Date(a.eta) - new Date(b.eta)).slice(0, 3);
          const etaBox = document.getElementById(`eta-box-${route.id}`);
          if (validEtas.length === 0) { etaBox.innerHTML = `<span class="no-eta">暫無班次資料</span>`; continue; }
          const etaHtmlParts = validEtas.map(item => {
            const etaDate = new Date(item.eta);
            const diffMins = Math.max(0, Math.floor((etaDate - now) / 60000));
            return `<span class="eta-group"><span class="eta-time">${formatTime12h(etaDate)}</span><span class="${diffMins < 10 ? 'eta-min-yellow' : 'eta-min-white'}">(${diffMins}分鐘)</span></span>`;
          });
          etaBox.innerHTML = etaHtmlParts.join('<span class="eta-sep">|</span>');
        } catch (err) {
          const etaBox = document.getElementById(`eta-box-${route.id}`);
          if (etaBox) etaBox.innerHTML = `<span class="no-eta">暫無班次資料</span>`;
        }
      }
    }

    function format24hTime(date) {
      return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      document.getElementById('clock-ampm').innerText = hours >= 12 ? '下午' : '上午';
      hours = hours % 12 || 12;
      document.getElementById('clock-time').innerText = `${String(hours).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('date-display').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
    }

    async function fetchWeatherData() {
      const now = new Date();
      document.getElementById('weather-update-header').innerText = `最後更新：${format24hTime(now)}（每5分鐘自動刷新）`;
      try {
        const resRhr = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dataRhr = await resRhr.json();
        if (dataRhr.humidity?.[0]) document.getElementById('humidity').innerText = `💧${dataRhr.humidity.data[0].value}%`;
        const tsingYiData = dataRhr.temperature?.data?.find(t => t.place === '青衣') || dataRhr.temperature?.data?.[0];
        if (tsingYiData) document.getElementById('tsing-yi-temp').innerText = `${tsingYiData.value}°C(青衣)`;
        if (dataRhr.icon?.[0]) {
          const iconImg = document.getElementById('wx-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${dataRhr.icon[0]}.png`;
          iconImg.style.display = 'inline-block';
        }
      } catch (e) {}

      try {
        const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const dataFnd = await resFnd.json();
        if (dataFnd.weatherForecast?.[0]) {
          document.getElementById('temp-min').innerText = `❄️${dataFnd.weatherForecast[0].forecastMintemp.value}°C`;
          document.getElementById('temp-max').innerText = `☀️${dataFnd.weatherForecast[0].forecastMaxtemp.value}°C`;
        }
      } catch (e) {}
    }

    // RTHK 新聞跑馬燈（自動篩選今天與昨天新聞，每秒 80px 像素級勻速）
    async function fetchAndStartNewsMarquee() {
      const track = document.getElementById('news-track');
      const wrapper = document.getElementById('news-wrapper');
      track.style.animation = 'none';

      try {
        const rssUrl = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rssUrl);
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('RSS fetch failed');
        
        const xmlText = await res.text();
        const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = Array.from(xmlDoc.querySelectorAll('item'));

        const now = new Date();
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        yesterday.setHours(0, 0, 0, 0);

        const filteredTitles = [];
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent;
          const pubDateStr = item.querySelector('pubDate')?.textContent;
          if (title) {
            if (pubDateStr) {
              const pubDate = new Date(pubDateStr);
              if (pubDate >= yesterday) filteredTitles.push(title.trim());
            } else {
              filteredTitles.push(title.trim());
            }
          }
        });

        if (filteredTitles.length === 0) {
          track.innerText = '暫無即時新聞內容';
          return;
        }

        const formattedNews = filteredTitles.map((t, idx) => `${idx + 1}. ${t}`).join(' &nbsp;|&nbsp; ');
        track.innerHTML = `&nbsp;&nbsp;${formattedNews}&nbsp;&nbsp;`;

        const wrapperWidth = wrapper.offsetWidth;
        const trackWidth = track.scrollWidth;
        const totalDistance = wrapperWidth + trackWidth;
        const durationSec = totalDistance / 80; // 固定速度：每秒 80 像素

        track.style.setProperty('--start-x', `${wrapperWidth}px`);
        track.style.setProperty('--end-x', `-${trackWidth}px`);
        void track.offsetWidth;
        track.style.animation = `marqueeNews ${durationSec}s linear forwards`;

        track.onanimationend = () => { fetchAndStartNewsMarquee(); };
      } catch (e) {
        track.innerText = '即時新聞載入失敗，將於稍後重試';
        setTimeout(fetchAndStartNewsMarquee, 10000);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initBusLayout();
      updateClock();
      setInterval(updateClock, 1000);
      fetchBusData();
      setInterval(fetchBusData, 30000);
      fetchWeatherData();
      setInterval(fetchWeatherData, 300000);
      fetchAndStartNewsMarquee();
    });
  </script>
</body>
</html>
