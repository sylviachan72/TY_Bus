<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2139資訊網頁</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* 隱藏滾動條但保留滾動功能 */
        ::-webkit-scrollbar { display: none; }
        .scrollable { scrollbar-width: none; -ms-overflow-style: none; overflow-y: auto; }

        /* 頂部更新時間 */
        #top-bar {
            text-align: center;
            font-size: 20px;
            color: #8E8E93;
            padding: 4px 0;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }

        /* 主佈局：左右雙欄 (50/50) */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左欄：巴士資訊 */
        #left-col {
            width: 50%;
            border-right: 1px solid #333333;
            padding: 10px 15px;
        }
        
        .bus-route {
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .bus-route:last-child { border-bottom: none; }
        
        .bus-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .bus-badge {
            border-radius: 12px;
            padding: 4px 14px;
            color: #FFFFFF;
        }
        
        .bus-times {
            font-size: 32px;
            line-height: 1.3;
            word-wrap: break-word;
        }
        .time-red { color: #FF3B30; }
        .time-white { color: #FFFFFF; }

        /* 右欄：時間與天氣 */
        #right-col {
            width: 50%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 時間日期 */
        #time-display {
            font-size: 100px;
            font-weight: bold;
            line-height: 1;
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-top: 5px;
        }
        .ampm-label {
            font-size: 40px;
            font-weight: normal;
            color: #E5E5EA;
            margin-right: 10px;
        }
        #date-display {
            font-size: 30px;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        /* 天氣整合區塊 */
        #weather-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 2px 0;
        }
        .weather-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 32px;
            line-height: 1.1;
        }
        #weather-icon { height: 46px; vertical-align: middle; }
        .temp-red { color: #FF3B30; }
        .temp-blue { color: #007AFF; }

        /* 警告區塊：純圖標，橫向排列 */
        #warnings-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
            min-height: 65px;
        }
        .warning-icon {
            height: 65px;
            width: auto;
            object-fit: contain;
        }
        .warning-text-fallback {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .no-warning {
            color: #8E8E93;
            font-size: 30px;
            line-height: 1.2;
            text-align: center;
        }

        /* 特別天氣提示跑馬燈 */
        #swt-container {
            font-size: 30px;
            line-height: 1.3;
            max-height: 7.8em;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .swt-text {
            position: relative;
        }
        .marquee-up {
            animation: scrollUp 18s linear infinite;
        }
        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -150%; }
        }
    </style>
</head>
<body>

    <div id="top-bar">最後更新：--:--:--（每30秒自動刷新）</div>

    <div id="main-container">
        <!-- 左欄：巴士 -->
        <div id="left-col" class="scrollable">
            <div id="bus-list">正在載入巴士資訊...</div>
        </div>

        <!-- 右欄：時間與天氣 -->
        <div id="right-col" class="scrollable">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日 星期-</div>
            
            <div id="weather-box">
                <div id="weather-row-1" class="weather-row">載入天氣中...</div>
                <div id="weather-row-2" class="weather-row"></div>
            </div>

            <!-- 天氣警告區塊 -->
            <div id="warnings-container"></div>
            
            <!-- 特別天氣提示 -->
            <div id="swt-container">
                <div id="swt-text" class="swt-text"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 配置區域 ---
        const busConfigs = [
            { id: "249X", color: "#007AFF", dest: "博康", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1" },
            { id: "42A", color: "#34C759", dest: "西九龍", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1" },
            { id: "43", color: "#FF9500", dest: "荃灣西", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1" },
            { id: "49M", color: "#AF52DE", dest: "青衣站", stop: "青富苑", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1" },
            { id: "49M", color: "#FF2D55", dest: "青富苑", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1" },
            { id: "68E", color: "#5AC8FA", dest: "元朗", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1" },
            { id: "243M", color: "#A2845E", dest: "荃灣", stop: "美景花園", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1" }
        ];

        // --- 2. 工具函式 ---
        function updateClock() {
            const now = new Date();
            const rawHours = now.getHours();
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ampm = rawHours >= 12 ? '下午' : '上午';
            let hh = rawHours % 12;
            hh = hh ? hh : 12;
            document.getElementById('time-display').innerHTML = `<span class="ampm-label">${ampm}</span><span>${hh}:${mm}</span>`;
            
            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('date-display').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function formatBusETA(etaString) {
            const etaTime = new Date(etaString);
            const now = new Date();
            const diffMins = Math.floor((etaTime - now) / 60000);
            if (diffMins < 0) return null;
            const timeStr = `${String(etaTime.getHours()).padStart(2, '0')}:${String(etaTime.getMinutes()).padStart(2, '0')}`;
            return diffMins < 10 ? `<span class="time-white">${timeStr}</span>(<span class="time-red">${diffMins}分鐘</span>)` : `<span class="time-white">${timeStr}(${diffMins}分鐘)</span>`;
        }

        // --- 3. 資料獲取 ---
        async function fetchBuses() {
            let htmlContent = '';
            for (const bus of busConfigs) {
                try {
                    const res = await fetch(bus.url);
                    const data = await res.json();
                    let etasHtml = '暫無班次';
                    if (data?.data?.length > 0) {
                        const validETAs = data.data.map(i => i.eta).filter(i => i).map(formatBusETA).filter(i => i).slice(0, 3);
                        etasHtml = validETAs.length > 0 ? validETAs.join(' | ') : '暫無班次';
                    }
                    htmlContent += `<div class="bus-route"><div class="bus-header"><span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span>往${bus.dest} 📍${bus.stop}</div><div class="bus-times">${etasHtml}</div></div>`;
                } catch {
                    htmlContent += `<div class="bus-route"><div class="bus-header"><span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span>往${bus.dest}</div><div class="bus-times">載入失敗</div></div>`;
                }
            }
            document.getElementById('bus-list').innerHTML = htmlContent;
        }

        async function fetchWeather() {
            try {
                const [currentRes, forecastRes, warningRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                const currentData = await currentRes.json();
                const forecastData = await forecastRes.json();
                const warningData = await warningRes.json();
                let swtData = await swtRes.json().catch(() => ({}));

                // 天氣顯示
                const tsingYi = currentData.temperature.data.find(d => d.place === '青衣')?.value || '--';
                const iconCode = currentData.icon[0];
                document.getElementById('weather-row-1').innerHTML = `<img id="weather-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png"><span>${tsingYi}°C(青衣)</span><span>💧${currentData.humidity.data[0].value}%</span>`;
                document.getElementById('weather-row-2').innerHTML = `<span class="temp-blue">❄️${forecastData.weatherForecast[0].forecastMintemp.value}°C</span><span class="temp-red">☀️${forecastData.weatherForecast[0].forecastMaxtemp.value}°C</span>`;

                // 警告圖標 (修正版)
                let warningsHtml = '';
                let hasWarnings = false;
                if (Object.keys(warningData).length > 0) {
                    for (const key in warningData) {
                        const warn = warningData[key];
                        if (warn.code) {
                            const iconUrl = `https://www.hko.gov.hk/tc/wxinfo/currwx/warn/img/warn_${warn.code.toLowerCase()}.png`;
                            warningsHtml += `
                                <img src="${iconUrl}" class="warning-icon" alt="${warn.name}" title="${warn.name}" 
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <span class="warning-text-fallback" style="display:none;">${warn.name}</span>
                            `;
                            hasWarnings = true;
                        }
                    }
                }
                document.getElementById('warnings-container').innerHTML = hasWarnings ? warningsHtml : '<div class="no-warning">現時沒有生效的警告</div>';

                // 特別天氣提示
                const swtText = swtData.swt?.map(i => i.desc).join('。') || '現時沒有特別天氣提示';
                const container = document.getElementById('swt-text');
                container.textContent = swtText;
                setTimeout(() => {
                    const box = document.getElementById('swt-container');
                    if (container.scrollHeight > box.clientHeight) container.classList.add('marquee-up');
                }, 100);

            } catch (err) {
                console.error("天氣獲取失敗", err);
            }
        }

        async function updateDashboard() {
            await fetchBuses();
            await fetchWeather();
            const n = new Date();
            document.getElementById('top-bar').textContent = `最後更新：${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}（每30秒自動刷新）`;
        }

        updateDashboard();
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html>
