<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天氣資訊系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        #top-bar { text-align: center; font-size: 20px; color: #8E8E93; padding: 4px; border-bottom: 1px solid #333; }
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #left-col { width: 60%; border-right: 1px solid #333; padding: 10px; }
        #right-col { width: 40%; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        
        .bus-route { border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; }
        .bus-header { font-size: 30px; font-weight: bold; margin-bottom: 4px; }
        .bus-badge { border-radius: 8px; padding: 2px 8px; color: #fff; display: inline-block; margin-right: 8px; }
        .bus-times { font-size: 30px; }
        
        #time-display { font-size: 90px; font-weight: bold; text-align: center; line-height: 1; }
        #date-display { font-size: 26px; text-align: center; }
        .weather-line { font-size: 24px; display: flex; align-items: center; gap: 8px; }
        
        #warnings-container { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; align-items: center; }
        .warning-icon { height: 55px; width: auto; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
        
        #swt-container { font-size: 22px; max-height: 3em; overflow: hidden; color: #FF9500; }
    </style>
</head>
<body>
    <div id="top-bar">最後更新：--:--:--</div>
    <div id="main-container">
        <div id="left-col"><div id="bus-list">載入中...</div></div>
        <div id="right-col">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日</div>
            <div id="weather-info">
                <div class="weather-line" id="w-current"></div>
                <div class="weather-line" id="w-minmax"></div>
            </div>
            <div id="warnings-container"></div>
            <div id="swt-container"></div>
        </div>
    </div>

    <script>
        const warningWikiFiles = {
            "WFIREY": "Yellow_Fire_Danger_Warning.png", "WFIRER": "Red_Fire_Danger_Warning.png",
            "WRAINA": "Amber_Rainstorm_Warning_Signal_HKO.svg", "WRAINR": "Red_Rainstorm_Warning_Signal_HKO.svg", "WRAINB": "Black_Rainstorm_Warning_Signal_HKO.svg",
            "TC1": "Tropical_Cyclone_Warning_Signal_1.svg", "TC3": "Tropical_Cyclone_Warning_Signal_3.svg",
            "TC8NE": "Tropical_Cyclone_Warning_Signal_8_NE.svg", "TC8SE": "Tropical_Cyclone_Warning_Signal_8_SE.svg",
            "TC8SW": "Tropical_Cyclone_Warning_Signal_8_SW.svg", "TC8NW": "Tropical_Cyclone_Warning_Signal_8_NW.svg",
            "TC9": "Tropical_Cyclone_Warning_Signal_9.svg", "TC10": "Tropical_Cyclone_Warning_Signal_10.svg",
            "WTS": "Thunderstorm_Warning.png", "WHOT": "Very_Hot_Weather_Warning.png", "WCOLD": "Cold_Weather_Warning.png",
            "WL": "Landslip_Warning_Signal_HKO.svg", "WMSGNL": "Strong_Monsoon_Signal.svg"
        };

        async function updateData() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit', hour12:false});
            document.getElementById('date-display').innerText = now.toLocaleDateString('zh-HK', {year:'numeric', month:'long', day:'numeric', weekday:'long'});

            // 天氣 API
            const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
            const data = await res.json();
            const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
            const wData = await wRes.json();

            // 顯示當前天氣
            document.getElementById('w-current').innerHTML = `現時氣溫: ${data.temperature.data.find(d=>d.place=='青衣').value}°C | 濕度: ${data.humidity.data[0].value}%`;
            
            // 處理警告圖標
            let warnHtml = '';
            for (let key in wData) {
                if (warningWikiFiles[wData[key].code]) {
                    const url = `https://commons.wikimedia.org/wiki/Special:FilePath/${warningWikiFiles[wData[key].code]}?width=120`;
                    warnHtml += `<img src="${url}" class="warning-icon" title="${wData[key].name}">`;
                }
            }
            document.getElementById('warnings-container').innerHTML = warnHtml || "現時無生效警告";
        }

        setInterval(updateData, 30000);
        updateData();
    </script>
</body>
</html>
