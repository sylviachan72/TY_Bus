<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊站</title>
    <style>
        :root { --bg: #000; --white: #fff; --mango: #FFCC00; --gray: #444; }
        body { margin: 0; background-color: var(--bg); color: var(--white); font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 緊湊排版設定 */
        * { box-sizing: border-box; }
        .header { height: 25px; font-size: 20px; text-align: center; border-bottom: 1px solid var(--gray); }
        .main { flex: 1; display: flex; overflow: hidden; }
        .left-panel, .right-panel { width: 50%; overflow-y: auto; padding: 5px; }
        .footer { height: 50px; background: #222; overflow: hidden; display: flex; align-items: center; border-top: 1px solid var(--gray); }
        
        /* 巴士樣式 */
        .bus-item { margin-bottom: 8px; border-bottom: 1px solid #333; padding: 2px; }
        .bus-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 34px; font-weight: bold; margin-right: 10px; color: #000; }
        .bus-info { font-size: 34px; color: white; vertical-align: middle; }
        .eta-row { font-size: 32px; margin-top: 2px; }
        .highlight { color: var(--mango); }

        /* 天氣樣式 */
        .time-box { text-align: center; margin-bottom: 5px; }
        .time-main { font-size: 100px; line-height: 1; }
        .ampm { font-size: 40px; }
        .date { font-size: 30px; }
        .weather-row { font-size: 32px; text-align: center; line-height: 1.1; }
        .warning-box { margin: 10px 0; padding: 5px; border-radius: 8px; background: #cc0000; font-size: 30px; text-align: center; }
        .no-warning { color: #666; font-size: 30px; text-align: center; }
        
        /* 跑馬燈 */
        .marquee { white-space: nowrap; font-size: 45px; animation: scroll-left 30s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="header" id="last-update">最後更新：--:--:--</div>

    <div class="main">
        <div class="left-panel" id="bus-container">
            <!-- 巴士內容由 JS 注入 -->
        </div>
        <div class="right-panel" id="weather-container">
            <!-- 天氣內容由 JS 注入 -->
        </div>
    </div>

    <div class="footer">
        <div class="marquee" id="news-ticker">讀取新聞中...</div>
    </div>

    <script>
        const busRoutes = [
            { id: '249X', dir: '博康', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { id: '42A', dir: '西九龍', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { id: '43', dir: '荃灣西', stop: '長青邨青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { id: '49M', dir: '青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { id: '49M', dir: '青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { id: '68E', dir: '元朗', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { id: '243M', dir: '荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        const colors = ['#00BFFF', '#32CD32', '#FFD700', '#FF69B4', '#9370DB', '#FF4500', '#00FA9A'];

        async function updateData() {
            // 更新最後時間
            document.getElementById('last-update').innerText = `最後更新：${new Date().toLocaleTimeString('zh-HK', {hour12: false})}`;

            // 1. 巴士更新
            const busContainer = document.getElementById('bus-container');
            busContainer.innerHTML = '';
            for (let i = 0; i < busRoutes.length; i++) {
                const r = busRoutes[i];
                try {
                    const res = await fetch(r.url);
                    const data = await res.json();
                    const etas = data.data.slice(0, 3);
                    let etaHtml = etas.map(e => {
                        const time = new Date(e.eta).toLocaleTimeString('zh-HK', {hour: '2-digit', minute: '2-digit', hour12: false});
                        const diff = Math.floor((new Date(e.eta) - new Date()) / 60000);
                        const isUrgent = diff < 10;
                        return `${time}<span class="${isUrgent ? 'highlight' : ''}">(${diff > 0 ? diff : 0}分鐘)</span>`;
                    }).join(' | ');

                    busContainer.innerHTML += `
                        <div class="bus-item">
                            <span class="bus-tag" style="background:${colors[i % colors.length]}">${r.id}</span>
                            <span class="bus-info">往${r.dir} 📍${r.stop}</span>
                            <div class="eta-row">${etaHtml || '暫無班次'}</div>
                        </div>
                    `;
                } catch(e) { console.error(e); }
            }

            // 2. 天氣更新 (簡化版邏輯)
            const weatherContainer = document.getElementById('weather-container');
            // 實際應整合 API，此處為結構範例
            weatherContainer.innerHTML = `
                <div class="time-box">
                    <div class="time-main">${new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute: '2-digit', hour12: true}).replace('上午','<span class="ampm">AM</span>').replace('下午','<span class="ampm">PM</span>')}</div>
                    <div class="date">${new Date().toLocaleDateString('zh-HK', {year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'})}</div>
                </div>
                <div class="weather-row">26°C(青衣) 💧87%</div>
                <div class="weather-row">❄️27°C ☀️31°C</div>
                <div class="warning-box">酷熱天氣警告</div>
            `;
        }

        // 初始化
        updateData();
        setInterval(updateData, 30000); // 30秒更新巴士天氣
        // 新聞更新 (5分鐘) 這裡需要一個 RSS Proxy 或公開 JSON 新聞源
    </script>
</body>
</html>
