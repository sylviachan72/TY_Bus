<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巴士天氣資訊站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 頂部更新時間 */
        .header-update {
            width: 100%;
            text-align: center;
            padding: 8px 0;
            font-size: 26px;
            color: #eee;
            border-bottom: 1px solid #222;
        }
        /* 主容器 6/4分欄 */
        .main-container {
            display: flex;
            height: calc(100vh - 44px);
        }
        /* 左巴士欄 60% */
        .bus-column {
            width: 60%;
            overflow-y: auto;
            padding: 10px;
            font-size: 32px;
        }
        /* 右天氣欄 40% */
        .weather-column {
            width: 40%;
            overflow-y: auto;
            padding: 10px;
            font-size: 24px;
            border-left: 1px solid #222;
        }
        /* 巴士單條路線卡片 */
        .bus-item {
            margin-bottom: 16px;
        }
        /* 路線彩色圓角標籤 */
        .route-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            margin-right: 8px;
        }
        .tag-249X { background: #3399FF; }
        .tag-42A  { background: #39CC39; }
        .tag-43   { background: #FF9933; }
        .tag-49M  { background: #9944DD; color:#fff; }
        .tag-68E  { background: #33CCCC; }
        .tag-243M { background: #CC66BB; }
        /* 班次容器 */
        .eta-row {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        .eta-item {
            white-space: nowrap;
        }
        .min-red { color: #ff2222; font-weight: bold; }
        /* 右側超大時間 */
        .time-big {
            font-size: 96px;
            font-weight: bold;
            line-height: 1;
        }
        .date-line {
            font-size: 26px;
            margin-bottom: 12px;
        }
        /* 天氣數據區 零縫隙 */
        .weather-data {
            margin: 10px 0;
        }
        .temp-row1, .temp-row2 {
            line-height: 1.1;
        }
        .low-temp { color: #4499FF; }
        .high-temp { color: #ff4422; }
        /* 天氣警告 */
        .warn-box {
            background: #ff2222;
            border-radius: 10px;
            padding: 6px 10px;
            margin: 12px 0;
            font-weight: bold;
        }
        .empty-text {
            color: #666;
            margin: 12px 0;
        }
        /* 垂直跑馬燈容器 */
        .marquee-wrap {
            height: 96px;
            overflow: hidden;
            position: relative;
            margin-top: 8px;
        }
        .marquee-text {
            position: absolute;
            width: 100%;
            animation: scrollUp 12s linear infinite;
            line-height: 1.4;
        }
        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -180px; }
        }
        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- 頂部最後更新 -->
    <div class="header-update" id="update-time">最後更新：載入中...</div>

    <div class="main-container">
        <!-- 左欄：巴士實時ETA -->
        <div class="bus-column" id="bus-container">
            巴士資訊載入中，請稍候...
        </div>

        <!-- 右欄：天氣、時間、警告 -->
        <div class="weather-column">
            <div class="time-big" id="clock">00:00</div>
            <div class="date-line" id="date-text">載入日期</div>

            <div class="weather-data">
                <div class="temp-row1" id="temp-now">天氣數據載入中</div>
                <div class="temp-row2" id="temp-hilo"></div>
            </div>

            <div id="warn-container"></div>

            <div class="marquee-wrap">
                <div class="marquee-text" id="swt-text">特別天氣提示載入中...</div>
            </div>
        </div>
    </div>

    <script>
        // ========== 設定常數 ==========
        const REFRESH_SEC = 30;
        // 7條巴士路線配置（API、標籤、方向簡稱、站點簡稱）
        const BUS_LIST = [
            {
                route: "249X", tagClass: "tag-249X",
                destShort: "博康", stopShort: "青桃樓",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1"
            },
            {
                route: "42A", tagClass: "tag-42A",
                destShort: "西九龍", stopShort: "青桃樓",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1"
            },
            {
                route: "43", tagClass: "tag-43",
                destShort: "荃灣西", stopShort: "青桃樓",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1"
            },
            {
                route: "49M", tagClass: "tag-49M",
                destShort: "青衣站", stopShort: "青富苑",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1"
            },
            {
                route: "49M", tagClass: "tag-49M",
                destShort: "青富苑", stopShort: "青衣站",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1"
            },
            {
                route: "68E", tagClass: "tag-68E",
                destShort: "元朗", stopShort: "青衣站",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1"
            },
            {
                route: "243M", tagClass: "tag-243M",
                destShort: "荃灣", stopShort: "美景花園",
                api: "https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1"
            }
        ];

        // 天文台API列表
        const WX_API = {
            rhrread: "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc",
            fnd: "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc",
            warnsum: "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc",
            swt: "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc"
        };

        // ========== 通用工具函數 ==========
        // 格式化24小時制最後更新時間
        function formatNow24h() {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, "0");
            const m = String(d.getMinutes()).padStart(2, "0");
            const s = String(d.getSeconds()).padStart(2, "0");
            return `${h}:${m}:${s}`;
        }
        // 格式化右側12小時制時鐘
        function updateClock() {
            const d = new Date();
            let h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, "0");
            let ampm = "AM";
            if (h >= 12) {
                ampm = "PM";
                if (h > 12) h -= 12;
            }
            if (h === 0) h = 12;
            document.getElementById("clock").innerText = `${h}:${m} ${ampm}`;
            // 日期
            const weekArr = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
            const week = weekArr[d.getDay()];
            document.getElementById("date-text").innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${week}`;
        }
        // 倒數分鐘判斷顏色
        function getMinClass(min) {
            return Number(min) < 10 ? "min-red" : "";
        }

        // ========== 巴士ETA抓取與渲染 ==========
        async function fetchBusAll() {
            const busWrap = document.getElementById("bus-container");
            busWrap.innerHTML = "";
            for (const bus of BUS_LIST) {
                try {
                    const res = await fetch(bus.api);
                    const data = await res.json();
                    const etaList = data.eta || [];
                    let etaHtml = "";
                    // 只取頭3班
                    const showEta = etaList.slice(0,3);
                    for (const eta of showEta) {
                        const time = eta.eta;
                        const min = eta.min;
                        const cls = getMinClass(min);
                        etaHtml += `<div class="eta-item">${time}(<span class="${cls}">${min}分鐘</span>)</div>`;
                    }
                    // 無班次
                    if(showEta.length === 0) etaHtml = `<div class="eta-item">暫無班次</div>`;
                    const itemHtml = `
                        <div class="bus-item">
                            <div>
                                <span class="route-tag ${bus.tagClass}">${bus.route}</span>
                                往${bus.destShort}📍${bus.stopShort}
                            </div>
                            <div class="eta-row">${etaHtml}</div>
                        </div>
                    `;
                    busWrap.innerHTML += itemHtml;
                } catch(err) {
                    busWrap.innerHTML += `
                        <div class="bus-item">
                            <div>
                                <span class="route-tag ${bus.tagClass}">${bus.route}</span>
                                往${bus.destShort}📍${bus.stopShort}
                            </div>
                            <div class="eta-row"><div class="eta-item">載入失敗</div></div>
                        </div>
                    `;
                }
            }
        }

        // ========== 天文台天氣數據整合渲染 ==========
        async function fetchWeatherAll() {
            // 1. 實時溫度濕度 rhrread
            const rhr = await fetch(WX_API.rhrread).then(r=>r.json()).catch(()=>null);
            // 2. 高低溫預報 fnd
            const fnd = await fetch(WX_API.fnd).then(r=>r.json()).catch(()=>null);
            // 3. 天氣警告 warnsum
            const warn = await fetch(WX_API.warnsum).then(r=>r.json()).catch(()=>null);
            // 4. 特別天氣提示 swt
            const swt = await fetch(WX_API.swt).then(r=>r.json()).catch(()=>null);

            // 渲染實時溫度濕度
            let nowTemp = "--";
            let hum = "--";
            let iconNum = "50"; // 預設多雲
            if(rhr) {
                // 青衣溫度
                const tempArr = rhr.temperature.data;
                const ts = tempArr.find(x=>x.place === "青衣");
                if(ts) nowTemp = ts.value;
                // 濕度
                hum = rhr.humidity.data[0].value;
                // 天氣圖標編號
                iconNum = rhr.icon[0];
            }
            const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/${iconNum}.png`;
            document.getElementById("temp-now").innerHTML = `<img src="${iconUrl}" style="height:28px;vertical-align:middle;"> ${nowTemp}°C(青衣) 💧${hum}%`;

            // 渲染高低溫
            let low = "--", high = "--";
            if(fnd && fnd.forecastDay[0]) {
                low = fnd.forecastDay[0].tempLow;
                high = fnd.forecastDay[0].tempHigh;
            }
            document.getElementById("temp-hilo").innerHTML = `<span class="low-temp">❄️${low}°C</span> &nbsp; <span class="high-temp">☀️${high}°C</span>`;

            // 渲染天氣警告
            const warnWrap = document.getElementById("warn-container");
            if(warn && warn.warningSum && warn.warningSum.length > 0) {
                let warnHtml = "";
                for(const w of warn.warningSum) {
                    warnHtml += `<div class="warn-box">${w.name}</div>`;
                }
                warnWrap.innerHTML = warnHtml;
            } else {
                warnWrap.innerHTML = `<div class="empty-text">現時沒有生效的警告</div>`;
            }

            // 渲染特別天氣提示（跑馬燈）
            const swtDom = document.getElementById("swt-text");
            if(swt && swt.specialWxTip && swt.specialWxTip !== "") {
                swtDom.innerText = swt.specialWxTip;
            } else {
                swtDom.innerText = "現時沒有生效的提示";
                swtDom.style.color = "#666";
            }
        }

        // ========== 一次性全域刷新 ==========
        async function fullRefresh() {
            const nowStr = formatNow24h();
            document.getElementById("update-time").innerText = `最後更新：${nowStr}`;
            updateClock();
            await fetchBusAll();
            await fetchWeatherAll();
        }

        // ========== 初始化排程 ==========
        window.onload = async () => {
            fullRefresh();
            // 每秒更新時鐘
            setInterval(updateClock, 1000);
            // 每30秒全域重刷API
            setInterval(fullRefresh, REFRESH_SEC * 1000);
        };
    </script>
</body>
</html>
