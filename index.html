<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊看板</title>
    <style>
        /* 全局設定 */
        :root {
            --mango: #FFCC00;
            --blue: #44AAFF;
            --red: #FF4444;
            --dark-gray: #777777;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 隱藏捲動條但允許捲動 */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* 頂部最後更新時間欄 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            padding: 5px 15px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }
        .top-bar div { flex: 1; text-align: center; }

        /* 主內容區：左右分欄 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .col {
            width: 50%;
            padding: 10px 15px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .left-col { border-right: 1px solid #333; }
        .right-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 左欄：巴士資訊 */
        .bus-route {
            margin-bottom: 18px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }
        .bus-header {
            font-size: 34px;
            margin-bottom: 5px;
            line-height: 1.2;
        }
        .bus-badge {
            display: inline-block;
            color: #fff;
            padding: 2px 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-right: 5px;
        }
        .bus-etas {
            font-size: 32px;
            line-height: 1.3;
            word-break: break-word;
        }
        .eta-item { white-space: nowrap; }

        /* 右欄：時間與天氣 (極致緊湊) */
        .time-section {
            text-align: center;
            margin-bottom: 5px;
        }
        .current-time {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin: -10px 0; /* 縮減間距 */
        }
        .ampm { font-size: 40px; margin-right: 10px; }
        .time-text { font-size: 100px; font-weight: bold; line-height: 1; }
        .date-text { font-size: 30px; margin-top: -5px; }

        .weather-section {
            text-align: center;
            width: 100%;
        }
        .weather-row1 {
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0; 
            line-height: 1;
        }
        .weather-row1 img {
            height: 45px;
            margin-right: 5px;
        }
        .weather-row2 {
            font-size: 32px;
            margin: 0;
            line-height: 1.1;
        }

        /* 天氣警告 */
        .warning-container {
            margin-top: 10px;
            text-align: center;
        }
        .warning-badge {
            display: inline-block;
            background-color: #DD0000;
            color: #fff;
            font-size: 30px;
            padding: 4px 15px;
            border-radius: 10px;
        }
        .no-alert {
            font-size: 30px;
            color: var(--dark-gray);
        }

        /* 特別天氣提示 */
        .tips-wrapper {
            margin-top: 10px;
            width: 100%;
            max-height: 135px; /* 約4行高度 (30px + line-height) */
            overflow: hidden;
            position: relative;
        }
        .tips-content {
            font-size: 30px;
            line-height: 1.15;
            text-align: left;
        }
        /* 向上跑馬燈動畫 */
        @keyframes scrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        .marquee-up {
            animation: scrollUp linear infinite;
        }

        /* 底部：即時新聞跑馬燈 */
        .news-footer {
            height: 60px;
            background-color: #111;
            border-top: 1px solid #444;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .news-label {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background-color: #CC0000;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            padding: 0 15px;
            display: flex;
            align-items: center;
            z-index: 10;
        }
        .news-ticker-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .news-ticker-text {
            position: absolute;
            white-space: nowrap;
            font-size: 45px;
            line-height: 60px;
            top: 0;
            transform: translateX(100vw);
        }
        @keyframes scrollLeftNews {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- 頂部更新時間 -->
    <div class="top-bar">
        <div id="bus-update-time">最後更新：--:--:--（每30秒自動刷新）</div>
        <div id="weather-update-time">最後更新：--:--:--（每5分鐘自動刷新）</div>
    </div>

    <!-- 主內容區 -->
    <div class="main-content">
        <!-- 左欄：巴士 -->
        <div class="col left-col" id="bus-container">
            <!-- 巴士資料由 JS 載入 -->
        </div>

        <!-- 右欄：天氣與時間 -->
        <div class="col right-col">
            <div class="time-section">
                <div class="current-time">
                    <span class="ampm" id="clock-ampm"></span>
                    <span class="time-text" id="clock-time"></span>
                </div>
                <div class="date-text" id="clock-date"></div>
            </div>

            <div class="weather-section">
                <div class="weather-row1" id="weather-r1">
                    <!-- 圖標 + 溫度 + 濕度 -->
                </div>
                <div class="weather-row2" id="weather-r2">
                    <!-- 最低溫 + 最高溫 -->
                </div>
                
                <div class="warning-container" id="weather-warning">
                    <!-- 天氣警告 -->
                </div>

                <div class="tips-wrapper">
                    <div class="tips-content" id="weather-tips">
                        <!-- 特別天氣提示 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部新聞 -->
    <div class="news-footer">
        <div class="news-label">即時新聞</div>
        <div class="news-ticker-container" id="news-container">
            <div class="news-ticker-text" id="news-text">載入新聞中...</div>
        </div>
    </div>

    <script>
        // ==========================
        // 共用工具函數
        // ==========================
        function get24Time() {
            const now = new Date();
            return now.toTimeString().split(' ')[0]; // 回傳 HH:mm:ss
        }

        // ==========================
        // 1. 時間與日期系統 (每秒更新)
        // ==========================
        function updateClock() {
            const now = new Date();
            // 上下午 & 12小時制時間
            let hours = now.getHours();
            const ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            document.getElementById('clock-ampm').innerText = ampm;
            document.getElementById('clock-time').innerText = `${hours}:${minutes}`;

            // 日期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
            document.getElementById('clock-date').innerText = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==========================
        // 2. 巴士資訊系統 (每30秒更新)
        // ==========================
        const busRoutes = [
            { route: '249X', color: '#0052CC', dest: '博康', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', color: '#007A33', dest: '西九龍', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', color: '#C64B00', dest: '荃灣西', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', color: '#6B238E', dest: '青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', color: '#6B238E', dest: '青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', color: '#006666', dest: '元朗', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', color: '#5C3A21', dest: '荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', dir: 'O' }
        ];

        async function fetchBuses() {
            const container = document.getElementById('bus-container');
            let htmlStr = '';
            
            for (const bus of busRoutes) {
                htmlStr += `<div class="bus-route">
                                <div class="bus-header">
                                    <span class="bus-badge" style="background: ${bus.color}">${bus.route}</span> 
                                    往${bus.dest} 📍${bus.stop}
                                </div>
                                <div class="bus-etas">`;
                try {
                    const res = await fetch(bus.url);
                    const data = await res.json();
                    
                    // 過濾條件 (如果243M有指定 Dir='O')
                    let etas = data.data.filter(item => {
                        if (bus.dir && item.dir !== bus.dir) return false;
                        if (!item.eta) return false; 
                        return true;
                    }).slice(0, 3); // 取最近3班

                    if (etas.length === 0) {
                        htmlStr += `暫無班次資料`;
                    } else {
                        const etaHtmls = etas.map(item => {
                            const etaTime = new Date(item.eta);
                            const now = new Date();
                            let diff = Math.floor((etaTime - now) / 60000);
                            if (diff < 0) diff = 0;

                            // 12小時制時間轉換
                            let h = etaTime.getHours();
                            let m = etaTime.getMinutes().toString().padStart(2, '0');
                            h = h % 12;
                            h = h ? h : 12; 
                            const timeStr = `${h}:${m}`;

                            // 少於10分鐘變芒果黃
                            const colorStyle = diff < 10 ? `color: var(--mango); font-weight: bold;` : `color: #fff;`;
                            return `<span class="eta-item">${timeStr}(<span style="${colorStyle}">${diff}分鐘</span>)</span>`;
                        });
                        htmlStr += etaHtmls.join('<span style="white-space: pre-wrap"> | </span>');
                    }
                } catch (e) {
                    htmlStr += `無法獲取資料`;
                }
                htmlStr += `</div></div>`;
            }
            container.innerHTML = htmlStr;
            document.getElementById('bus-update-time').innerText = `最後更新：${get24Time()}（每30秒自動刷新）`;
        }
        setInterval(fetchBuses, 30000);
        fetchBuses();


        // ==========================
        // 3. 天氣資訊系統 (每5分鐘更新)
        // ==========================
        const warnCodeMap = {
            'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
            'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
            'TC1': '一號戒備信號', 'TC3': '三號強風信號',
            'TC8NE': '八號東北烈風或暴風信號', 'TC8SE': '八號東南烈風或暴風信號',
            'TC8SW': '八號西南烈風或暴風信號', 'TC8NW': '八號西北烈風或暴風信號',
            'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號',
            'WTS': '雷暴警告', 'WL': '山泥傾瀉警告', 'WFROST': '霜凍警告', 
            'WHOT': '酷熱天氣警告', 'WCOLD': '寒冷天氣警告', 'WMSGNL': '強烈季候風信號'
        };

        async function fetchWeather() {
            try {
                // 1. 現時天氣
                const curRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const curData = await curRes.json();
                
                const icon = curData.icon[0];
                const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${icon}.png`;
                const tempObj = curData.temperature.data.find(x => x.place === '青衣');
                const temp = tempObj ? tempObj.value : curData.temperature.data[0].value;
                const place = tempObj ? '青衣' : curData.temperature.data[0].place;
                const humid = curData.humidity.data[0].value;

                document.getElementById('weather-r1').innerHTML = 
                    `<img src="${iconUrl}" alt="天氣圖標"> ${temp}°C(${place}) &nbsp;💧${humid}%`;

                // 2. 天氣預報 (獲取最高最低溫)
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                const minTemp = fndData.weatherForecast[0].forecastMintemp.value;
                const maxTemp = fndData.weatherForecast[0].forecastMaxtemp.value;

                document.getElementById('weather-r2').innerHTML = 
                    `❄️<span style="color: var(--blue)">${minTemp}°C</span> &nbsp;☀️<span style="color: var(--red)">${maxTemp}°C</span>`;

                // 3. 天氣警告
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                
                let warnHtml = '';
                if (Object.keys(warnData).length === 0) {
                    warnHtml = `<div class="no-alert">現時沒有生效的警告</div>`;
                } else {
                    // 解析子類型或主類型名稱
                    for (const key in warnData) {
                        const code = warnData[key].code;
                        const warnName = warnCodeMap[code] || warnData[key].name;
                        warnHtml += `<div class="warning-badge" style="margin: 3px;">${warnName}</div>`;
                    }
                }
                document.getElementById('weather-warning').innerHTML = warnHtml;

                // 4. 特別天氣提示
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await swtRes.json();
                
                const tipsWrapper = document.querySelector('.tips-wrapper');
                const tipsDiv = document.getElementById('weather-tips');
                
                // 重置動畫
                tipsDiv.style.animationDuration = '0s';
                tipsDiv.classList.remove('marquee-up');

                if (!swtData.swt || swtData.swt.length === 0) {
                    tipsDiv.innerHTML = `<div class="no-alert" style="text-align: center;">現時沒有特別天氣提示</div>`;
                } else {
                    let tipsHtml = '';
                    swtData.swt.forEach((item, index) => {
                        tipsHtml += `${index + 1}. ${item.desc}<br>`;
                    });
                    tipsDiv.innerHTML = tipsHtml;

                    // 判斷高度是否超過4行 (約135px)，需等DOM渲染完
                    setTimeout(() => {
                        if (tipsDiv.offsetHeight > 135) {
                            const speed = 25; // 捲動速度 (像素/秒)
                            const duration = (tipsDiv.offsetHeight + 135) / speed;
                            tipsDiv.style.animationDuration = `${duration}s`;
                            tipsDiv.classList.add('marquee-up');
                        }
                    }, 100);
                }

                document.getElementById('weather-update-time').innerText = `最後更新：${get24Time()}（每5分鐘自動刷新）`;
            } catch (e) {
                console.error("天氣資料獲取失敗", e);
            }
        }
        setInterval(fetchWeather, 300000); // 5 mins
        fetchWeather();


        // ==========================
        // 4. 即時新聞走馬燈系統
        // ==========================
        const newsTextElement = document.getElementById('news-text');
        const newsContainer = document.getElementById('news-container');

        async function fetchNews() {
            try {
                // 使用 corsproxy.io 解決跨域問題讀取明報 RSS
                const rssUrl = 'https://news.mingpao.com/rss/ins/all.xml';
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rssUrl);
                
                const res = await fetch(proxyUrl);
                const xmlText = await res.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                const items = xmlDoc.querySelectorAll("item");
                let newsArr = [];
                items.forEach((item, index) => {
                    const title = item.querySelector("title").textContent;
                    newsArr.push(`${index + 1}. ${title}`);
                });

                if (newsArr.length === 0) throw new Error("無新聞資料");

                const fullNewsStr = newsArr.join(' &nbsp;|&nbsp; ');
                
                // 停止當前動畫並準備重新計算
                newsTextElement.style.animation = 'none';
                newsTextElement.innerHTML = fullNewsStr;

                // 強制瀏覽器重繪 (Reflow) 以取得最新寬度
                void newsTextElement.offsetWidth;

                // 像素級勻速運算: 80px/s
                const textWidth = newsTextElement.offsetWidth;
                const containerWidth = newsContainer.offsetWidth;
                const distance = textWidth + containerWidth; // 從最右進到最左出的總距離
                const duration = distance / 80; // 秒

                // 套用動畫
                newsTextElement.style.animation = `scrollLeftNews ${duration}s linear forwards`;
                
            } catch (e) {
                console.error("新聞獲取失敗", e);
                newsTextElement.innerHTML = "暫時無法獲取即時新聞資料";
                newsTextElement.style.animation = `scrollLeftNews 10s linear forwards`;
            }
        }

        // 當走馬燈跑完一圈，觸發動畫結束事件，重新抓取新聞
        newsTextElement.addEventListener('animationend', () => {
            fetchNews();
        });

        // 初次載入新聞
        fetchNews();

    </script>
</body>
</html>
