<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TY資訊面板</title>
    <style>
        :root {
            --mango-yellow: #FFCC00;
            --blue-249x: #0052CC;
            --green-42a: #007A33;
            --orange-43: #C64B00;
            --purple-49m: #6B238E;
            --teal-68e: #006666;
            --choco-243m: #5C3A21;
            --dark-gray: #888888;
            --bg-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #FFFFFF;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            overflow: hidden; /* 防止整個網頁出現滾動條 */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 主內容區：左右分欄 */
        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px); /* 扣除底部跑馬燈高度 */
        }

        .left-col, .right-col {
            width: 50%;
            height: 100%;
            padding: 10px 15px;
            overflow-y: auto; /* 內容過多時可垂直滑動 */
        }

        .right-col {
            border-left: 1px solid #333; /* 輕微分隔線 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 隱藏滾動條但保留滑動功能 */
        .left-col::-webkit-scrollbar, .right-col::-webkit-scrollbar {
            display: none;
        }
        .left-col, .right-col {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 最後更新時間 */
        .update-time {
            font-size: 20px;
            color: #CCCCCC;
            text-align: center;
            margin-bottom: 10px;
        }

        /* ================= 巴士資訊區 ================= */
        .bus-route {
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .bus-badge {
            font-size: 34px;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 8px;
            margin-right: 10px;
        }

        .bus-dest {
            font-size: 34px;
            font-weight: bold;
        }

        .bus-eta-container {
            font-size: 32px;
            line-height: 1.3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .bus-eta-item {
            white-space: nowrap;
        }

        .eta-mango {
            color: var(--mango-yellow);
        }
        
        .eta-separator {
            margin: 0 8px;
            color: #FFF;
        }

        /* 巴士顏色分配 */
        .bg-249X { background-color: var(--blue-249x); }
        .bg-42A { background-color: var(--green-42a); }
        .bg-43 { background-color: var(--orange-43); }
        .bg-49M { background-color: var(--purple-49m); }
        .bg-68E { background-color: var(--teal-68e); }
        .bg-243M { background-color: var(--choco-243m); }

        /* ================= 天氣與時間區 ================= */
        .time-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-top: -10px; /* 極致緊湊 */
        }

        .ampm {
            font-size: 40px;
            margin-right: 10px;
        }

        .current-time {
            font-size: 100px;
            font-weight: bold;
            line-height: 1;
        }

        .current-date {
            font-size: 30px;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .weather-line {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            line-height: 1;
        }

        .weather-icon {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        .temp-low { color: #5B9BD5; margin-right: 15px;}
        .temp-high { color: #FF0000; }

        .warning-badge {
            font-size: 30px;
            background-color: #FF0000;
            color: #FFFFFF;
            padding: 4px 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .no-warning {
            font-size: 30px;
            color: var(--dark-gray);
            margin-top: 15px;
        }

        /* 特別天氣提示：向上跑馬燈 */
        .tips-container {
            width: 100%;
            height: 130px; /* 約4行高度 (30px * 1.1 line-height) */
            overflow: hidden;
            position: relative;
            margin-top: 15px;
            border: 1px solid #222;
            padding: 5px;
        }

        .weather-tips {
            font-size: 30px;
            line-height: 1.1;
            position: absolute;
            width: 100%;
            text-align: left;
        }

        .no-tips {
            font-size: 30px;
            color: var(--dark-gray);
            text-align: center;
            margin-top: 15px;
        }

        /* ================= 底部新聞跑馬燈 ================= */
        .news-footer {
            height: 65px;
            background-color: #111;
            display: flex;
            align-items: center;
            border-top: 2px solid #333;
            position: relative;
            z-index: 10;
        }

        .news-label {
            background-color: #CC0000;
            color: #FFF;
            font-size: 40px;
            font-weight: bold;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            white-space: nowrap;
            z-index: 11;
        }

        .news-ticker-container {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .news-ticker {
            position: absolute;
            white-space: nowrap;
            font-size: 45px;
            line-height: 65px;
            display: inline-block;
            will-change: transform;
        }
        
        .news-separator {
            margin: 0 15px;
            color: #FFF;
        }

        /* CSS 動畫 keyframes (JS 會動態設定 duration) */
        @keyframes scrollLeft {
            0% { transform: translateX(var(--start-pos)); }
            100% { transform: translateX(var(--end-pos)); }
        }

        @keyframes scrollUp {
            0% { transform: translateY(var(--start-y)); }
            100% { transform: translateY(var(--end-y)); }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="left-col">
            <div class="update-time" id="bus-update-time">最後更新：--:--:--（每30秒自動刷新）</div>
            <div id="bus-list">
                </div>
        </div>

        <div class="right-col">
            <div class="update-time" id="weather-update-time">最後更新：--:--:--（每5分鐘自動刷新）</div>
            
            <div class="time-wrapper">
                <div class="ampm" id="ampm">--</div>
                <div class="current-time" id="current-time">--:--</div>
            </div>
            <div class="current-date" id="current-date">----年--月--日 星期-</div>

            <div class="weather-line">
                <img id="weather-icon" class="weather-icon" src="" alt="天氣圖標" style="display:none;">
                <span id="current-temp">--°C(青衣)</span>&nbsp;&nbsp;💧<span id="current-humidity">--%</span>
            </div>
            <div class="weather-line" style="margin-top: 5px;">
                ❄️<span class="temp-low" id="temp-low">--°C</span> ☀️<span class="temp-high" id="temp-high">--°C</span>
            </div>

            <div id="weather-warning-container"></div>
            <div id="weather-tips-container" class="tips-container" style="display:none;">
                <div id="weather-tips" class="weather-tips"></div>
            </div>
            <div id="no-tips-msg" class="no-tips" style="display:none;">現時沒有特別天氣提示</div>

        </div>
    </div>

    <div class="news-footer">
        <div class="news-label">即時新聞</div>
        <div class="news-ticker-container" id="news-ticker-container">
            <div class="news-ticker" id="news-ticker">載入中...</div>
        </div>
    </div>

    <script>
        // ================= 常數設定 =================
        const CORS_PROXY = 'https://corsproxy.io/?';
        const MINGPAO_RSS = encodeURIComponent('https://news.mingpao.com/rss/ins/all.xml');
        const NEWS_SPEED_PX_PER_SEC = 80; 
        const TIPS_SPEED_PX_PER_SEC = 30; // 向上跑馬燈速度

        const BUS_ROUTES = [
            { id: "249X", apiId: "249X", stopId: "CA60760D2303E6D0", dir: "O", destName: "博康", stopName: "青桃樓", colorClass: "bg-249X" },
            { id: "42A", apiId: "42A", stopId: "B085DDE8E381E370", dir: "O", destName: "西九龍", stopName: "青桃樓", colorClass: "bg-42A" },
            { id: "43", apiId: "43", stopId: "B085DDE8E381E370", dir: "O", destName: "荃灣西", stopName: "青桃樓", colorClass: "bg-43" },
            { id: "49M_1", apiId: "49M", stopId: "333E9F98EEB84849", dir: "O", destName: "青衣站", stopName: "青富苑", colorClass: "bg-49M" },
            { id: "49M_2", apiId: "49M", stopId: "68CD99B45DDE014B", dir: "I", destName: "青富苑", stopName: "青衣站", colorClass: "bg-49M" },
            { id: "68E", apiId: "68E", stopId: "83D9B6BE39530EEF", dir: "O", destName: "元朗", stopName: "青衣站", colorClass: "bg-68E" },
            { id: "243M", apiId: "243M", stopId: "97411601C5B851AD", dir: "O", destName: "荃灣", stopName: "美景花園", colorClass: "bg-243M" }
        ];

        // 天氣警告字典
        const WARN_DICT = {
            "WFIREY": "黃色火災危險警告", "WFIRER": "紅色火災危險警告",
            "WRAINA": "黃色暴雨警告信號", "WRAINR": "紅色暴雨警告信號", "WRAINB": "黑色暴雨警告信號",
            "TC1": "一號戒備信號", "TC3": "三號強風信號", 
            "TC8NE": "八號東北烈風或暴風信號", "TC8SE": "八號東南烈風或暴風信號",
            "TC8SW": "八號西南烈風或暴風信號", "TC8NW": "八號西北烈風或暴風信號",
            "TC9": "九號烈風或暴風風力增強信號", "TC10": "十號颶風信號"
        };

        // ================= 工具函數 =================
        function format24hTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + 
                   date.getMinutes().toString().padStart(2, '0') + ':' + 
                   date.getSeconds().toString().padStart(2, '0');
        }

        // 轉換為12小時制時間 (回傳格式如 10:15 或 02:30)
        function format12hTime(date) {
            let h = date.getHours();
            let m = date.getMinutes().toString().padStart(2, '0');
            h = h % 12;
            h = h ? h : 12; // 0點顯示為12
            return h.toString().padStart(2, '0') + ':' + m;
        }

        // ================= 時間日期模組 =================
        function updateClock() {
            const now = new Date();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            document.getElementById('current-date').innerText = 
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
            
            let h = now.getHours();
            let ampm = h >= 12 ? '下午' : '上午';
            document.getElementById('ampm').innerText = ampm;
            
            h = h % 12;
            h = h ? h : 12;
            let m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = `${h.toString().padStart(2, '0')}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================= 巴士模組 =================
        async function fetchBuses() {
            const nowTime = new Date();
            document.getElementById('bus-update-time').innerText = `最後更新：${format24hTime(nowTime)}（每30秒自動刷新）`;
            
            const busListDiv = document.getElementById('bus-list');
            // 保留原有HTML直到更新完畢以防閃爍
            let newHTML = "";

            for (const route of BUS_ROUTES) {
                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${route.stopId}/${route.apiId}/1`);
                    const data = await res.json();
                    
                    // 過濾對應方向及站點
                    let etas = data.data.filter(d => d.dir === route.dir).slice(0, 3);
                    
                    let etaHTML = "";
                    if (etas.length > 0) {
                        etaHTML = etas.map((etaObj, index) => {
                            if (!etaObj.eta) return '<span class="bus-eta-item">暫無班次</span>';
                            
                            const etaTime = new Date(etaObj.eta);
                            const diffMs = etaTime - nowTime;
                            let diffMins = Math.floor(diffMs / 60000);
                            if (diffMins < 0) diffMins = 0;

                            const timeStr12h = format12hTime(etaTime);
                            
                            // 判斷是否需要變黃色
                            let timeClass = "";
                            let minClass = "";
                            if (diffMins <= 10) {
                                timeClass = ""; // 到達時間為白色 (依據需求)
                                minClass = "eta-mango"; // 倒數時間芒果黃
                            }

                            return `<span class="bus-eta-item">${timeStr12h}(<span class="${minClass}">${diffMins}分鐘</span>)</span>`;
                        }).join('<span class="eta-separator">|</span>');
                    } else {
                        etaHTML = '<span class="bus-eta-item">暫無班次提供</span>';
                    }

                    newHTML += `
                        <div class="bus-route">
                            <div class="bus-header">
                                <div class="bus-badge ${route.colorClass}">${route.apiId}</div>
                                <div class="bus-dest">往${route.destName} 📍${route.stopName}</div>
                            </div>
                            <div class="bus-eta-container">${etaHTML}</div>
                        </div>
                    `;
                } catch (err) {
                    console.error("Bus Fetch Error:", err);
                }
            }
            busListDiv.innerHTML = newHTML;
        }

        // ================= 天氣模組 =================
        async function fetchWeather() {
            document.getElementById('weather-update-time').innerText = `最後更新：${format24hTime(new Date())}（每5分鐘自動刷新）`;
            
            try {
                // 1. 實時天氣 (溫度/濕度/圖標)
                const resWeather = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const weatherData = await resWeather.json();
                
                // 圖標
                if (weatherData.icon && weatherData.icon.length > 0) {
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${weatherData.icon[0]}.png`;
                    iconImg.style.display = 'inline-block';
                }
                
                // 濕度
                if (weatherData.humidity && weatherData.humidity.data.length > 0) {
                    document.getElementById('current-humidity').innerText = weatherData.humidity.data[0].value + '%';
                }

                // 溫度 (尋找青衣，若無則拿全港預設)
                if (weatherData.temperature && weatherData.temperature.data) {
                    const tyTemp = weatherData.temperature.data.find(t => t.place === "青衣");
                    if (tyTemp) {
                        document.getElementById('current-temp').innerText = `${tyTemp.value}°C(青衣)`;
                    } else {
                        document.getElementById('current-temp').innerText = `${weatherData.temperature.data[0].value}°C(${weatherData.temperature.data[0].place})`;
                    }
                }

                // 2. 預報 (最高最低溫)
                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await resFnd.json();
                if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const todayFnd = fndData.weatherForecast[0];
                    document.getElementById('temp-low').innerText = `${todayFnd.forecastMintemp.value}°C`;
                    document.getElementById('temp-high').innerText = `${todayFnd.forecastMaxtemp.value}°C`;
                }

                // 3. 警告信號
                const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await resWarn.json();
                const warnContainer = document.getElementById('weather-warning-container');
                warnContainer.innerHTML = '';
                let hasWarn = false;
                
                if (Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        const warnObj = warnData[key];
                        // 嘗試尋找子類型
                        let warnCode = warnObj.code || key;
                        let warnText = WARN_DICT[warnCode] || warnObj.name;
                        
                        if (warnText && warnCode !== 'CANCEL') {
                            warnContainer.innerHTML += `<div class="warning-badge">${warnText}</div>`;
                            hasWarn = true;
                        }
                    }
                }
                if (!hasWarn) {
                    warnContainer.innerHTML = `<div class="no-warning">現時沒有生效的警告</div>`;
                }

                // 4. 特別天氣提示
                const resTips = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const tipsData = await resTips.json();
                const tipsDiv = document.getElementById('weather-tips');
                const tipsContainer = document.getElementById('weather-tips-container');
                const noTipsMsg = document.getElementById('no-tips-msg');

                if (tipsData.swt && tipsData.swt.length > 0) {
                    let tipsHTML = tipsData.swt.map((tip, index) => `${index + 1}. ${tip.desc}`).join('<br>');
                    tipsDiv.innerHTML = tipsHTML;
                    tipsContainer.style.display = 'block';
                    noTipsMsg.style.display = 'none';

                    // 判斷是否需要跑馬燈
                    setTimeout(() => {
                        const cHeight = tipsContainer.clientHeight;
                        const tHeight = tipsDiv.clientHeight;
                        if (tHeight > cHeight) {
                            tipsDiv.style.animation = 'none';
                            void tipsDiv.offsetWidth; // 觸發重繪
                            
                            const duration = (tHeight + cHeight) / TIPS_SPEED_PX_PER_SEC;
                            tipsDiv.style.setProperty('--start-y', `${cHeight}px`);
                            tipsDiv.style.setProperty('--end-y', `-${tHeight}px`);
                            tipsDiv.style.animation = `scrollUp ${duration}s linear infinite`;
                        } else {
                            tipsDiv.style.animation = 'none';
                            tipsDiv.style.transform = 'translateY(0)';
                        }
                    }, 100);

                } else {
                    tipsContainer.style.display = 'none';
                    noTipsMsg.style.display = 'block';
                }

            } catch (err) {
                console.error("Weather Fetch Error:", err);
            }
        }

        // ================= 新聞模組 =================
        async function fetchNews() {
            try {
                const res = await fetch(CORS_PROXY + MINGPAO_RSS);
                const str = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(str, "text/xml");
                const items = xml.querySelectorAll("item");
                
                let newsArr = [];
                items.forEach((item, index) => {
                    let title = item.querySelector("title").textContent;
                    newsArr.push(`${index + 1}. ${title}`);
                });

                const ticker = document.getElementById('news-ticker');
                const container = document.getElementById('news-ticker-container');
                
                if (newsArr.length > 0) {
                    ticker.innerHTML = newsArr.join('<span class="news-separator">|</span>');
                    
                    // 取消舊動畫
                    ticker.style.animation = 'none';
                    void ticker.offsetWidth; // 觸發重繪

                    // 確保元素已經渲染好以獲取寬度
                    setTimeout(() => {
                        const containerWidth = container.clientWidth;
                        const tickerWidth = ticker.scrollWidth;
                        
                        // 計算勻速時間: 距離 = 容器寬 + 文字寬度
                        const distance = containerWidth + tickerWidth;
                        const duration = distance / NEWS_SPEED_PX_PER_SEC;

                        ticker.style.setProperty('--start-pos', `${containerWidth}px`);
                        ticker.style.setProperty('--end-pos', `-${tickerWidth}px`);
                        
                        // 設置新動畫
                        ticker.style.animation = `scrollLeft ${duration}s linear`;
                        
                        // 動畫結束後重新拉取新聞
                        ticker.onanimationend = () => {
                            fetchNews();
                        };
                    }, 50);
                } else {
                    ticker.innerText = "暫無新聞資料";
                    setTimeout(fetchNews, 60000); // 1分鐘後重試
                }
            } catch (err) {
                console.error("News Fetch Error:", err);
                setTimeout(fetchNews, 30000); // 失敗30秒後重試
            }
        }

        // ================= 啟動設定 =================
        // 初始化執行
        fetchBuses();
        fetchWeather();
        fetchNews();

        // 輪詢定時器
        setInterval(fetchBuses, 30 * 1000);    // 巴士：每30秒
        setInterval(fetchWeather, 5 * 60 * 1000); // 天氣：每5分鐘
        // 新聞輪詢則由動畫結束(onanimationend)自動觸發，確保每次播完才會刷新。
    </script>
</body>
</html>
