<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長者專用巴士與天氣資訊板</title>
    <style>
        /* 基本重置與全域設定 */
        body {
            background-color: #111111;
            color: #FFFFFF;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止滾動，固定畫面 */
        }

        /* 頂部更新時間 */
        #header {
            text-align: center;
            color: #AAAAAA;
            font-size: 1rem;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }

        /* 主要內容區 - 分左右兩欄 */
        #main-container {
            display: flex;
            flex: 1;
            gap: 15px;
        }

        /* 左欄：巴士資訊 (60%) */
        #bus-panel {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bus-route {
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .bus-route:last-child {
            border-bottom: none;
        }

        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 1.25rem;
        }

        .route-no {
            border-radius: 8px;
            padding: 4px 10px;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.3rem;
            text-align: center;
            min-width: 55px;
        }
        /* 巴士路線顏色 */
        .bg-249X { background-color: #2F80ED; }
        .bg-42A  { background-color: #27AE60; }
        .bg-43   { background-color: #F2994A; }
        .bg-49M  { background-color: #9B51E0; }
        .bg-68E  { background-color: #2D9CDB; }
        .bg-243M { background-color: #824C28; }

        .bus-dest {
            color: #EEEEEE;
        }
        .bus-stop {
            color: #F2C94C;
            margin-left: 10px;
        }

        .bus-etas {
            display: flex;
            font-size: 1.15rem;
            color: #CCCCCC;
            padding-left: 5px;
        }
        .eta-item {
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .eta-item::before {
            content: "▶";
            font-size: 0.8rem;
            margin-right: 5px;
            color: #888;
        }

        /* 緊急狀態：小於10分鐘紅色閃爍 */
        .urgent {
            color: #FF4136;
            font-weight: bold;
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.5; }
        }

        /* 右欄：天氣與時間 (40%) */
        #weather-panel {
            flex: 0 0 calc(40% - 15px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
            padding-left: 15px;
        }

        /* 時間與日期 */
        #clock-time {
            font-size: 4.5rem;
            font-weight: bold;
            color: #F2C94C;
            text-align: center;
            line-height: 1;
            margin-top: 10px;
        }
        #clock-date {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            color: #DDDDDD;
        }

        /* 天氣概況 */
        .weather-info {
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .weather-info img {
            width: 50px;
            height: 50px;
        }

        /* 天氣警告 */
        #weather-warnings {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            min-height: 35px;
        }
        .warning-badge {
            background-color: #B32D2E; /* 暗紅色 */
            color: #F2C94C; /* 黃字 */
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #FF4136;
        }

        /* 特別天氣提示 */
        #special-weather-tips {
            border: 2px dashed #F2C94C;
            border-radius: 10px;
            padding: 10px;
            font-size: 1.1rem;
            color: #FFFFFF;
            flex-grow: 1;
            overflow: hidden;
            display: none; /* 預設隱藏，有資料才顯示 */
        }
        .tips-title {
            color: #F2C94C;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="header">🕒 載入中...</div>

    <div id="main-container">
        
        <div id="bus-panel">
            </div>

        <div id="weather-panel">
            <div id="clock-time">--:--</div>
            <div id="clock-date">----年--月--日 星期-</div>

            <div class="weather-info">
                <img id="weather-icon" src="" alt="Weather" style="display:none;">
                <span id="current-temp">--°C</span>
                <span style="color:#888;">|</span>
                <span id="current-humidity">濕度：--%</span>
            </div>
            
            <div class="weather-info" style="font-size: 1.3rem;">
                <span style="color:#00BFFF;">❄️ <span id="min-temp">--°C</span></span>
                <span style="color:#888;">|</span>
                <span style="color:#FF4136;">☀️ <span id="max-temp">--°C</span></span>
            </div>

            <div id="weather-warnings"></div>

            <div id="special-weather-tips">
                <div class="tips-title">⚠️ 特別天氣提示：</div>
                <div id="tips-content"></div>
            </div>
        </div>

    </div>

<script>
    // ----------------------------------------------------
    // 1. 設定巴士路線與 API 對應表
    // ----------------------------------------------------
    const busRoutes = [
        { route: '249X', dirText: '往博康', stopText: '青桃樓', colorClass: 'bg-249X', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
        { route: '42A', dirText: '往西九龍', stopText: '青桃樓', colorClass: 'bg-42A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
        { route: '43', dirText: '往荃灣西', stopText: '青桃樓', colorClass: 'bg-43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
        { route: '49M', dirText: '往青衣站', stopText: '青富苑', colorClass: 'bg-49M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
        { route: '49M', dirText: '往青富苑', stopText: '青衣站', colorClass: 'bg-49M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
        { route: '68E', dirText: '往元朗', stopText: '青衣站', colorClass: 'bg-68E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
        { route: '243M', dirText: '往荃灣', stopText: '美景花園', colorClass: 'bg-243M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
    ];

    // ----------------------------------------------------
    // 2. 時間更新功能
    // ----------------------------------------------------
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const day = days[now.getDay()];

        document.getElementById('clock-time').textContent = `${hours}:${minutes}`;
        document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 星期${day}`;
    }
    setInterval(updateClock, 1000); // 每秒更新時間
    updateClock();

    function updateLastRefreshTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('zh-HK');
        document.getElementById('header').innerHTML = `🕒 最後更新：${timeString} (每30秒自動刷新)`;
    }

    // ----------------------------------------------------
    // 3. 巴士資料更新功能
    // ----------------------------------------------------
    async function fetchBusData() {
        const busPanel = document.getElementById('bus-panel');
        busPanel.innerHTML = ''; // 清空舊資料

        for (const bus of busRoutes) {
            try {
                const response = await fetch(bus.url);
                const json = await response.json();
                
                // 建立 HTML 結構
                let html = `
                    <div class="bus-route">
                        <div class="bus-header">
                            <span class="route-no ${bus.colorClass}">${bus.route}</span>
                            <span class="bus-dest">${bus.dirText}</span>
                            <span class="bus-stop">📍${bus.stopText}</span>
                        </div>
                        <div class="bus-etas">
                `;

                if (json.data && json.data.length > 0) {
                    let count = 0;
                    for (const eta of json.data) {
                        if (eta.eta && count < 3) { // 顯示最近3班車
                            const etaTime = new Date(eta.eta);
                            const now = new Date();
                            const diffMs = etaTime - now;
                            const diffMins = Math.floor(diffMs / 60000);
                            
                            const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
                            
                            if (diffMins <= 0) {
                                html += `<div class="eta-item urgent">即將抵達🚨</div>`;
                            } else if (diffMins < 10) {
                                html += `<div class="eta-item urgent">${timeStr}(${diffMins}分鐘)🚨</div>`;
                            } else {
                                html += `<div class="eta-item">${timeStr}(${diffMins}分鐘)</div>`;
                            }
                            count++;
                        }
                    }
                    if(count === 0) html += `<div class="eta-item">暫無班次資料</div>`;
                } else {
                    html += `<div class="eta-item">暫無班次資料</div>`;
                }

                html += `</div></div>`;
                busPanel.innerHTML += html;

            } catch (error) {
                console.error(`Error fetching bus ${bus.route}:`, error);
                busPanel.innerHTML += `
                    <div class="bus-route">
                        <div class="bus-header">
                            <span class="route-no ${bus.colorClass}">${bus.route}</span>
                            <span class="bus-dest">${bus.dirText}</span>
                        </div>
                        <div class="bus-etas"><div class="eta-item">無法載入資料</div></div>
                    </div>`;
            }
        }
    }

    // ----------------------------------------------------
    // 4. 天氣資料更新功能
    // ----------------------------------------------------
    async function fetchWeatherData() {
        try {
            // 讀取現時天氣 (rhrread)
            const rhrreadRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
            const rhrread = await rhrreadRes.json();
            
            // 處理溫度與濕度
            if(rhrread.temperature && rhrread.temperature.data.length > 0) {
                document.getElementById('current-temp').textContent = `${rhrread.temperature.data[0].value}°C`;
            }
            if(rhrread.humidity && rhrread.humidity.data.length > 0) {
                document.getElementById('current-humidity').textContent = `濕度：${rhrread.humidity.data[0].value}%`;
            }
            // 處理天氣圖標
            if(rhrread.icon && rhrread.icon.length > 0) {
                const iconId = rhrread.icon[0];
                const iconImg = document.getElementById('weather-icon');
                iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                iconImg.style.display = 'inline';
            }

            // 讀取天氣預報 (fnd) - 獲取今日最高最低溫
            const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
            const fnd = await fndRes.json();
            if(fnd.weatherForecast && fnd.weatherForecast.length > 0) {
                const todayForecast = fnd.weatherForecast[0];
                document.getElementById('min-temp').textContent = `${todayForecast.forecastMintemp.value}°C`;
                document.getElementById('max-temp').textContent = `${todayForecast.forecastMaxtemp.value}°C`;
            }

            // 讀取天氣警告 (warnsum)
            const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
            const warn = await warnRes.json();
            const warningContainer = document.getElementById('weather-warnings');
            warningContainer.innerHTML = '';
            
            if (Object.keys(warn).length > 0) {
                for (const key in warn) {
                    const warningName = warn[key].name;
                    warningContainer.innerHTML += `<div class="warning-badge">⚠️ ${warningName}</div>`;
                }
            }

            // 讀取特別天氣提示 (swt)
            const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
            const swt = await swtRes.json();
            const tipsContainer = document.getElementById('special-weather-tips');
            const tipsContent = document.getElementById('tips-content');
            
            if (swt.swt && swt.swt.length > 0) {
                // 將所有提示用換行符號連接，並限制顯示長度以免排版過長
                tipsContent.innerHTML = swt.swt.map(item => item.desc).join('<br><br>');
                tipsContainer.style.display = 'block';
            } else {
                tipsContainer.style.display = 'none';
            }

        } catch (error) {
            console.error("Error fetching weather data:", error);
        }
    }

    // ----------------------------------------------------
    // 5. 啟動與自動刷新機制
    // ----------------------------------------------------
    function refreshAllData() {
        fetchBusData();
        fetchWeatherData();
        updateLastRefreshTime();
    }

    // 初次載入
    refreshAllData();

    // 每 30 秒自動更新一次
    setInterval(refreshAllData, 30000);

</script>
</body>
</html>
