<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時資訊版</title>
    <style>
        /* 全局設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        ::-webkit-scrollbar {
            display: none;
        }

        #header {
            text-align: center;
            font-size: 20px;
            color: #CCCCCC;
            padding: 2px 0;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左欄：巴士資訊 */
        #left-panel {
            width: 60%;
            padding: 8px 10px;
            overflow-y: auto;
            border-right: 1px solid #333333;
        }

        .bus-route {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333333;
        }
        .bus-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            line-height: 1.2;
        }
        .bus-badge {
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 10px;
        }
        .bus-dest { margin-right: 10px; }
        .bus-eta-container {
            font-size: 32px;
            line-height: 1.2;
            display: flex;
            flex-wrap: wrap;
        }
        .eta-divider { color: #666666; margin: 0 8px; }
        .text-red { color: #FF4444; }

        /* 右欄：天氣與時間 (已緊湊化) */
        #right-panel {
            width: 40%;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #time-display {
            font-size: 90px;
            font-weight: bold;
            text-align: center;
            line-height: 1;
        }
        #date-display {
            font-size: 26px;
            text-align: center;
            margin-bottom: 10px;
        }
        .weather-current {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            gap: 10px;
            margin-bottom: 5px;
        }
        .weather-icon {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        .weather-minmax {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            gap: 15px;
            margin-bottom: 15px;
        }
        .temp-min { color: #44AAFF; }
        .temp-max { color: #FF4444; }

        .section-title {
            font-size: 20px;
            color: #888888;
            margin-bottom: 4px;
        }
        #warnings-container {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .warn-badge {
            background-color: #FF4444;
            color: #FFFFFF;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
        }
        .no-alert { font-size: 24px; color: #666666; }

        #swt-container {
            height: 150px; 
            overflow: hidden;
            position: relative;
            font-size: 24px;
            line-height: 1.3;
            flex-grow: 1;
        }
        #swt-content {
            position: absolute;
            width: 100%;
        }
        .marquee { animation: scrollUp 20s linear infinite; }
        @keyframes scrollUp {
            0% { transform: translateY(150px); }
            100% { transform: translateY(-100%); }
        }
    </style>
</head>
<body>

    <div id="header">最後更新：--:--:-- (每30秒自動刷新)</div>

    <div id="main-container">
        <div id="left-panel">
            <div id="bus-list"></div>
        </div>

        <div id="right-panel">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日 星期-</div>

            <div class="weather-current">
                <img id="weather-img" class="weather-icon" src="" alt="" style="display:none;">
                <span id="current-temp">--°C(青衣)</span>
                <span id="current-hum">💧 --%</span>
            </div>
            
            <div class="weather-minmax">
                <span class="temp-min">❄️ <span id="min-temp">--</span>°C</span>
                <span class="temp-max">☀️ <span id="max-temp">--</span>°C</span>
            </div>

            <div class="section-title">天氣警告</div>
            <div id="warnings-container"><div class="no-alert">載入中...</div></div>

            <div class="section-title">特別天氣提示</div>
            <div id="swt-container">
                <div id="swt-content" class="no-alert">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        const busConfig = [
            { route: '249X', color: '#1A75FF', dest: '往博康', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', color: '#33CC33', dest: '往西九龍', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', color: '#FF9900', dest: '往荃灣西', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', color: '#9933FF', dest: '往青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', color: '#9933FF', dest: '往青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', color: '#00CCCC', dest: '往元朗', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', color: '#FF3399', dest: '往荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('time-display').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date-display').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
        }

        function updateLastRefreshTime() {
            const now = new Date();
            document.getElementById('header').innerText = `最後更新：${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} (每30秒自動刷新)`;
        }

        async function fetchBusData() {
            const listContainer = document.getElementById('bus-list');
            listContainer.innerHTML = '';
            for (const bus of busConfig) {
                try {
                    const response = await fetch(bus.url);
                    const json = await response.json();
                    const etas = (json.data || []).filter(eta => eta.eta !== null).slice(0, 3);
                    let html = `<div class="bus-route"><div class="bus-title"><span class="bus-badge" style="background-color: ${bus.color};">${bus.route}</span><span class="bus-dest">${bus.dest}</span><span class="bus-stop">📍${bus.stop}</span></div><div class="bus-eta-container">`;
                    if (etas.length === 0) html += `<span>暫無班次</span>`;
                    else {
                        const now = new Date();
                        etas.forEach((item, index) => {
                            const etaTime = new Date(item.eta);
                            let diffMin = Math.max(0, Math.floor((etaTime - now) / 60000));
                            html += `<span class="eta-item">${String(etaTime.getHours()).padStart(2, '0')}:${String(etaTime.getMinutes()).padStart(2, '0')}(<span class="${diffMin < 10 ? 'text-red' : ''}">${diffMin}分鐘</span>)</span>${index < etas.length - 1 ? '<span class="eta-divider">|</span>' : ''}`;
                        });
                    }
                    listContainer.innerHTML += html + `</div></div>`;
                } catch (e) { console.error(e); }
            }
        }

        async function fetchWeatherData() {
            try {
                const resCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const dataCurrent = await resCurrent.json();
                const iconIds = dataCurrent.icon;
                if (iconIds && iconIds.length > 0) {
                    const imgEl = document.getElementById('weather-img');
                    imgEl.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconIds[0]}.png`;
                    imgEl.style.display = 'inline-block';
                }
                let tsingYiTemp = dataCurrent.temperature.data.find(d => d.place === '青衣');
                document.getElementById('current-temp').innerText = `${tsingYiTemp ? tsingYiTemp.value : dataCurrent.temperature.data[0].value}°C(青衣)`;
                document.getElementById('current-hum').innerText = `💧 ${dataCurrent.humidity.data[0].value}%`;

                const resForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const dataForecast = await resForecast.json();
                document.getElementById('max-temp').innerText = dataForecast.weatherForecast[0].forecastMaxtemp.value;
                document.getElementById('min-temp').innerText = dataForecast.weatherForecast[0].forecastMintemp.value;

                const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const dataWarn = await resWarn.json();
                const warnContainer = document.getElementById('warnings-container');
                warnContainer.innerHTML = Object.keys(dataWarn).length > 0 ? Object.keys(dataWarn).map(key => `<span class="warn-badge">${dataWarn[key].name}</span>`).join('') : `<span class="no-alert">現時沒有生效的警告/提示</span>`;

                const resTips = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const dataTips = await resTips.json();
                const swtContent = document.getElementById('swt-content');
                if (dataTips.swt && dataTips.swt.length > 0) {
                    swtContent.innerHTML = dataTips.swt.map(t => t.desc).join('<br><br>');
                    swtContent.classList.remove('no-alert');
                    setTimeout(() => swtContent.offsetHeight > document.getElementById('swt-container').offsetHeight ? swtContent.classList.add('marquee') : swtContent.classList.remove('marquee'), 100);
                } else {
                    swtContent.innerHTML = `現時沒有生效的警告/提示`;
                    swtContent.className = 'no-alert';
                }
            } catch (e) { console.error(e); }
        }

        setInterval(() => { updateClock(); }, 1000);
        setInterval(() => { fetchBusData(); fetchWeatherData(); updateLastRefreshTime(); }, 30000);
        updateClock(); fetchBusData(); fetchWeatherData(); updateLastRefreshTime();
    </script>
</body>
</html>
