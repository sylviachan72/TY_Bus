<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巴士與天氣實時資訊</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
        }
        body {
            background-color: #121212;
            color: #FFFFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= 頂部狀態列 ================= */
        .top-bar {
            text-align: center;
            font-size: 16px;
            color: #A0A0A0;
            padding: 2px 0;
            background-color: #1A1A1A;
            border-bottom: 1px solid #333;
            letter-spacing: 1px;
        }

        /* ================= 主內容區塊 ================= */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 24px);
        }

        /* ================= 左側：巴士資訊 (60%) ================= */
        .bus-panel {
            width: 60%;
            border-right: 1px solid #333;
            overflow-y: auto;
            padding: 2px 6px;
        }
        .bus-panel::-webkit-scrollbar { display: none; }
        
        .bus-card {
            border-bottom: 1px dashed #444;
            padding: 4px 0;
        }
        .bus-card:last-child { border-bottom: none; }
        
        .bus-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .route-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 30px;
            color: #FFF;
            line-height: 1.1;
        }
        .bg-249X { background-color: #007BFF; }
        .bg-42A  { background-color: #28A745; }
        .bg-43   { background-color: #FD7E14; }
        .bg-49M  { background-color: #8E44AD; }
        .bg-68E  { background-color: #00BCD4; }
        .bg-243M { background-color: #8B4513; }

        .stop-name { color: #FFD700; margin-left: 4px; }

        .eta-container {
            font-size: 24px;
            color: #E0E0E0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
            line-height: 1.2;
        }
        
        .eta-urgent {
            color: #FF4C4C;
            font-weight: bold;
            animation: flash 1.2s infinite;
        }
        @keyframes flash {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px #FF4C4C; }
            50% { opacity: 0.6; text-shadow: none; }
        }

        /* ================= 右側：天氣與時間 (40%) ================= */
        .weather-panel {
            width: 40%;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 時間與日期區塊 */
        .time-box {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .time-text {
            font-size: 85px;
            color: #FFD700;
            font-weight: bold;
            line-height: 0.9;
            margin-bottom: 2px;
        }
        .date-text {
            font-size: 24px;
            color: #FFF;
        }

        /* 實時天氣區塊 */
        .weather-box {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .weather-icon {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0px 0px 4px rgba(255,255,255,0.3));
        }
        .weather-details {
            font-size: 26px;
            margin-left: 6px;
            line-height: 1.2;
            width: 100%;
        }
        .temp-row {
            display: flex;
            justify-content: space-between;
        }
        .temp-place {
            color: #A0A0A0; /* 地點使用淺灰色，與溫度數字做層次區隔 */
            font-size: 22px;
            margin-left: 2px;
        }
        .temp-row-bottom {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-size: 24px;
        }
        .temp-max { color: #FF4C4C; }
        .temp-min { color: #4CABFF; }

        /* ====== 天氣警告與特別提示的共用外框 ====== */
        .alert-section {
            border: 2px dashed #444;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .alert-title {
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 2px;
            color: #888;
        }
        .alert-empty-text {
            color: #777;
            font-size: 20px;
        }

        /* 警告區塊內部標籤 */
        .warn-content {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .warn-badge {
            background-color: #CC0000;
            color: #FFD700;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 22px;
            font-weight: bold;
        }

        /* 提示區塊內部文字 */
        .swt-content {
            font-size: 22px;
            line-height: 1.2;
            color: #FFF;
            flex: 1;
        }
        marquee { height: 100%; }
        
    </style>
</head>
<body>

    <div class="top-bar" id="update-bar">🕒 最後更新：載入中... (每30秒自動刷新)</div>

    <div class="main-container">
        
        <div class="bus-panel" id="bus-panel">
            <h2 style="text-align: center; color: #aaa; margin-top: 20px;">載入巴士資訊中...</h2>
        </div>

        <div class="weather-panel">
            
            <div class="time-box">
                <div class="time-text" id="clock-time">--:--</div>
                <div class="date-text" id="clock-date">----年--月--日 星期-</div>
            </div>

            <div class="weather-box">
                <img id="weather-icon" class="weather-icon" src="" alt="天氣圖標" style="display:none;">
                <div class="weather-details">
                    <div class="temp-row">
                        <span><span id="current-temp">--</span>°C<span id="current-place" class="temp-place">(青衣)</span></span>
                        <span>濕度:<span id="current-hum">--</span>%</span>
                    </div>
                    <div class="temp-row-bottom">
                        <span class="temp-min">❄️<span id="min-temp">--</span>°C</span>
                        <span class="temp-max">☀️<span id="max-temp">--</span>°C</span>
                    </div>
                </div>
            </div>

            <div class="alert-section" id="warn-container">
                <div class="alert-title" id="warn-title">⚠️ 天氣警告：</div>
                <div class="warn-content" id="warn-box">
                    <span class="alert-empty-text">載入中...</span>
                </div>
            </div>

            <div class="alert-section" id="swt-container" style="flex: 1;">
                <div class="alert-title" id="swt-title">⚠️ 特別天氣提示：</div>
                <div class="swt-content" id="swt-content">
                    <span class="alert-empty-text">載入中...</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const busRoutes = [
            { route: '249X', dest: '博康', stop: '青桃樓', bg: 'bg-249X', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', dest: '西九龍', stop: '青桃樓', bg: 'bg-42A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', dest: '荃灣西', stop: '青桃樓', bg: 'bg-43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', dest: '青衣站', stop: '青富苑', bg: 'bg-49M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', dest: '青富苑', stop: '青衣站', bg: 'bg-49M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', dest: '元朗', stop: '青衣站', bg: 'bg-68E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', dest: '荃灣', stop: '美景花園', bg: 'bg-243M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = days[now.getDay()];
            document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 星期${day}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchBusData() {
            const panel = document.getElementById('bus-panel');
            let htmlContent = '';
            const nowTime = new Date();

            for (const bus of busRoutes) {
                try {
                    const response = await fetch(bus.url);
                    const json = await response.json();
                    let etas = json.data;

                    etas = etas.filter(e => e.eta != null && new Date(e.eta) >= nowTime).slice(0, 3);

                    htmlContent += `
                        <div class="bus-card">
                            <div class="bus-header">
                                <span class="route-badge ${bus.bg}">${bus.route}</span>
                                <span>往 ${bus.dest}</span>
                                <span class="stop-name">📍${bus.stop}</span>
                            </div>
                            <div class="eta-container">▶ 
                    `;

                    if (etas.length === 0) {
                        htmlContent += `<span>暫無班次資料</span>`;
                    } else {
                        const etaStrings = etas.map(e => {
                            const etaDate = new Date(e.eta);
                            const h = String(etaDate.getHours()).padStart(2, '0');
                            const m = String(etaDate.getMinutes()).padStart(2, '0');
                            const diffMins = Math.floor((etaDate - nowTime) / 60000);
                            
                            if (diffMins <= 10) {
                                return `<span class="eta-urgent">${h}:${m}(${diffMins}分鐘)🚨</span>`;
                            } else {
                                return `<span>${h}:${m}(${diffMins}分鐘)</span>`;
                            }
                        });
                        htmlContent += etaStrings.join(' <span style="color:#666; margin:0 4px;">|</span> ');
                    }
                    htmlContent += `</div></div>`;

                } catch (error) {
                    htmlContent += `
                        <div class="bus-card">
                            <div class="bus-header">
                                <span class="route-badge ${bus.bg}">${bus.route}</span>
                                <span>往 ${bus.dest} 📍${bus.stop}</span>
                            </div>
                            <div class="eta-container">▶ <span style="color:#999;">暫時無法連線</span></div>
                        </div>`;
                }
            }
            panel.innerHTML = htmlContent;
            
            const updateTime = String(nowTime.getHours()).padStart(2, '0') + ':' + 
                               String(nowTime.getMinutes()).padStart(2, '0') + ':' + 
                               String(nowTime.getSeconds()).padStart(2, '0');
            const ampm = nowTime.getHours() >= 12 ? '下午' : '上午';
            document.getElementById('update-bar').textContent = `🕒 最後更新：${ampm} ${updateTime} (每30秒自動刷新)`;
        }

        async function fetchWeatherData() {
            try {
                // 1. 實時天氣
                const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const rhrData = await rhrRes.json();
                
                if (rhrData.icon && rhrData.icon.length > 0) {
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rhrData.icon[0]}.png`;
                    iconImg.style.display = 'block';
                }

                // 動態抓取溫度，並將地點格式化為 (地點) 放在溫度後方
                const tsingYiTemp = rhrData.temperature.data.find(d => d.place === '青衣');
                if (tsingYiTemp) {
                    document.getElementById('current-temp').textContent = tsingYiTemp.value;
                    document.getElementById('current-place').textContent = `(${tsingYiTemp.place})`;
                } else if (rhrData.temperature.data.length > 0) {
                    document.getElementById('current-temp').textContent = rhrData.temperature.data[0].value;
                    document.getElementById('current-place').textContent = `(${rhrData.temperature.data[0].place})`;
                }

                if (rhrData.humidity && rhrData.humidity.data.length > 0) {
                    document.getElementById('current-hum').textContent = rhrData.humidity.data[0].value;
                }

                // 2. 預報天氣
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    document.getElementById('max-temp').textContent = fndData.weatherForecast[0].forecastMaxtemp.value;
                    document.getElementById('min-temp').textContent = fndData.weatherForecast[0].forecastMintemp.value;
                }

                // 3. 天氣警告 (常駐標題並切換亮/暗模式)
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('warn-box');
                const warnContainer = document.getElementById('warn-container');
                const warnTitle = document.getElementById('warn-title');
                
                warnBox.innerHTML = '';
                if (Object.keys(warnData).length > 0) {
                    warnContainer.style.borderColor = '#CC0000';
                    warnContainer.style.backgroundColor = 'rgba(204, 0, 0, 0.05)';
                    warnTitle.style.color = '#FF4C4C';
                    
                    for (const key in warnData) {
                        warnBox.innerHTML += `<div class="warn-badge">${warnData[key].name}</div>`;
                    }
                } else {
                    warnContainer.style.borderColor = '#444';
                    warnContainer.style.backgroundColor = 'transparent';
                    warnTitle.style.color = '#888';
                    warnBox.innerHTML = '<span class="alert-empty-text">現時沒有生效的警告</span>';
                }

                // 4. 特別天氣提示 (常駐標題並切換亮/暗模式)
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await swtRes.json();
                const swtContainer = document.getElementById('swt-container');
                const swtContent = document.getElementById('swt-content');
                const swtTitle = document.getElementById('swt-title');
                
                if (swtData.swt && swtData.swt.length > 0) {
                    swtContainer.style.borderColor = '#FFD700';
                    swtContainer.style.backgroundColor = 'rgba(255, 215, 0, 0.05)';
                    swtTitle.style.color = '#FFD700';
                    
                    let text = swtData.swt.map(item => item.desc).join('； ');
                    if (text.length > 35) {
                        swtContent.innerHTML = `<marquee direction="up" scrollamount="2" scrolldelay="60">${text}</marquee>`;
                    } else {
                        swtContent.innerHTML = text;
                    }
                } else {
                    swtContainer.style.borderColor = '#444';
                    swtContainer.style.backgroundColor = 'transparent';
                    swtTitle.style.color = '#888';
                    swtContent.innerHTML = '<span class="alert-empty-text">現時沒有特別天氣提示</span>';
                }

            } catch (error) {
                console.error("獲取天氣資料失敗:", error);
            }
        }

        // 初次載入與定時更新
        fetchBusData();
        fetchWeatherData();
        setInterval(() => {
            fetchBusData();
            fetchWeatherData();
        }, 30000);

    </script>
</body>
</html>
