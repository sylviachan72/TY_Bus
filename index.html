<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長青邨青桃樓資訊顯示屏</title>
    <style>
        /* 全域樣式：深色背景，適合長者觀看 */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden;
        }

        /* 左右分欄佈局 */
        .container {
            display: flex;
            gap: 25px;
            height: calc(100vh - 40px);
        }

        .panel {
            flex: 1;
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 頂部標題列 */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #2c2c2e;
            padding-bottom: 12px;
        }

        .panel-title {
            font-size: 32px;
            font-weight: bold;
            color: #ffcc00; /* 黃色醒目標題 */
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .update-time {
            font-size: 18px;
            color: #8e8e93;
        }

        /* 巴士路線區塊外框 */
        .bus-route-card {
            background-color: #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 根據 image.png 為不同路線加上專屬顏色左邊框 */
        .route-249x { border-left: 8px solid #4cd964; } /* 綠色 */
        .route-42a  { border-left: 8px solid #ffcc00; } /* 黃色 */
        .route-43   { border-left: 8px solid #5ac8fa; } /* 藍色 */

        .route-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .route-number {
            background-color: #1c1c1e;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 28px;
            font-weight: bold;
            border: 1px solid #444;
        }

        .route-destination {
            font-size: 26px;
            color: #eaeaea;
        }

        /* 班次到站時間列表 */
        .eta-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .eta-row {
            display: flex;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 24px;
        }

        .eta-time {
            color: #d1d1d6;
        }

        .eta-countdown {
            font-weight: bold;
            color: #ffcc00;
        }

        /* 少於10分鐘時的紅色閃爍特效 */
        .critical-alert {
            color: #ff453a !important;
            animation: blinker 1.2s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.2; }
        }

        /* 右手面：天氣報告佈局 */
        .weather-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .weather-location {
            font-size: 28px;
            color: #d1d1d6;
        }

        .weather-range {
            font-size: 32px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .weather-temp {
            font-size: 86px; /* 超大字體方便長者觀看 */
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }

        .weather-humidity {
            font-size: 64px;
            font-weight: bold;
            color: #5ac8fa;
            line-height: 1.2;
        }

        /* 天氣警告區塊 */
        .warning-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .warning-badge {
            background-color: #ff453a;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .no-warning {
            background-color: #2c2c2e;
            color: #8e8e93;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左手面：巴士實時到站系統 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🚌 長青邨青桃樓巴士實時到站</div>
                <div class="update-time" id="bus-update-time">最後更新: --:--:--</div>
            </div>
            
            <div style="flex-grow: 1; overflow-y: auto;">
                <!-- 249X -->
                <div class="bus-route-card route-249x">
                    <div class="route-header">
                        <span class="route-number">249X</span>
                        <span class="route-destination">往 博康</span>
                    </div>
                    <div class="eta-list" id="eta-249x">
                        <div class="eta-row"><span class="eta-time">正在載入...</span></div>
                    </div>
                </div>

                <!-- 42A -->
                <div class="bus-route-card route-42a">
                    <div class="route-header">
                        <span class="route-number">42A</span>
                        <span class="route-destination">往 高鐵（西九龍站）</span>
                    </div>
                    <div class="eta-list" id="eta-42a">
                        <div class="eta-row"><span class="eta-time">正在載入...</span></div>
                    </div>
                </div>

                <!-- 43 -->
                <div class="bus-route-card route-43">
                    <div class="route-header">
                        <span class="route-number">43</span>
                        <span class="route-destination">往 荃灣西站</span>
                    </div>
                    <div class="eta-list" id="eta-43">
                        <div class="eta-row"><span class="eta-time">正在載入...</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右手面：香港天文台天氣報告 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">☀️ 天氣報告</div>
                <div class="update-time" id="weather-update-time">最後更新: --:--:--</div>
            </div>
            
            <div class="weather-content">
                <div class="weather-main">
                    <div class="weather-location">香港天文台</div>
                    <!-- 最高及最低溫度 -->
                    <div class="weather-range" id="weather-range">↓ --°C  ↑ --°C</div>
                    <!-- 現時溫度 -->
                    <div class="weather-temp" id="current-temp">--°C</div>
                    <!-- 現時濕度 -->
                    <div class="weather-humidity" id="current-humidity">濕度: --%</div>
                </div>

                <!-- 天氣警告 -->
                <div>
                    <div style="font-size: 22px; color: #8e8e93; margin-bottom: 8px;">現時天氣警告：</div>
                    <div class="warning-container" id="warning-box">
                        <div class="warning-badge no-warning">現時無生效警告</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API 網址設定
        const apiUrls = {
            '249X': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1',
            '42A': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1',
            '43': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1',
            'weather': 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'
        };

        // 取得當前時間字串 (HH:mm:ss)
        function getTimeString() {
            const now = new Date();
            return now.toTimeString().split(' ')[0];
        }

        // 計算剩餘分鐘數
        function calculateRemainingMinutes(etaTimeStr) {
            if (!etaTimeStr) return null;
            const now = new Date();
            const eta = new Date(etaTimeStr);
            const diffMs = eta - now;
            return Math.max(0, Math.floor(diffMs / 1000 / 60));
        }

        // 格式化顯示時間 (HH:mm)
        function formatEtaTime(etaTimeStr) {
            if (!etaTimeStr) return '--:--';
            const eta = new Date(etaTimeStr);
            return eta.toTimeString().split(' ')[0].substring(0, 5);
        }

        // 更新巴士 ETA
        async function updateBusData(route, elementId) {
            try {
                const response = await fetch(apiUrls[route]);
                const json = await response.data ? response : await response.json(); 
                const container = document.getElementById(elementId);
                
                // 過濾並排序有效的隨後3個班次
                let etaList = json.data || [];
                // 確保只抓取對應站點與方向的資料
                etaList = etaList.filter(item => item.eta).slice(0, 3);

                if (etaList.length === 0) {
                    container.innerHTML = '<div class="eta-row"><span class="eta-time">暫無班次資料</span></div>';
                    return;
                }

                let html = '';
                etaList.forEach(item => {
                    const formattedTime = formatEtaTime(item.eta);
                    const minutesLeft = calculateRemainingMinutes(item.eta);
                    
                    let countdownText = `${minutesLeft} 分鐘`;
                    let alertClass = '';

                    if (minutesLeft === 0) {
                        countdownText = '即將到站';
                        alertClass = 'critical-alert';
                    } else if (minutesLeft < 10) {
                        countdownText = `即將到站 (${minutesLeft}分鐘)`;
                        alertClass = 'critical-alert'; // 少於10分鐘加入紅字閃爍樣式
                    }

                    html += `
                        <div class="eta-row">
                            <span class="eta-time">預計：${formattedTime}</span>
                            <span class="eta-countdown ${alertClass}">${countdownText}</span>
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('bus-update-time').innerText = `最後更新: ${getTimeString()}`;
            } catch (error) {
                console.error(`更新資料失敗 ${route}:`, error);
            }
        }

        // 更新天氣數據
        async function updateWeatherData() {
            try {
                const response = await fetch(apiUrls['weather']);
                const data = await response.json();

                // 1. 現時溫度 (預設尋找天文台或總覽溫度)
                if (data.temperature && data.temperature.data) {
                    const hkoTemp = data.temperature.data.find(t => t.place === '香港天文台') || data.temperature.data[0];
                    if (hkoTemp) {
                        document.getElementById('current-temp').innerText = `${hkoTemp.value}°C`;
                    }
                    
                    // 從各地區溫度中計算出今日最高最低溫（作為即時報告的參考範圍）
                    const tempValues = data.temperature.data.map(t => t.value);
                    const minTemp = Math.min(...tempValues);
                    const maxTemp = Math.max(...tempValues);
                    document.getElementById('weather-range').innerText = `↓ ${minTemp}°C  ↑ ${maxTemp}°C`;
                }

                // 2. 現時濕度
                if (data.humidity && data.humidity.data && data.humidity.data[0]) {
                    document.getElementById('current-humidity').innerText = `濕度: ${data.humidity.data[0].value}%`;
                }

                // 3. 天氣警告
                const warningBox = document.getElementById('warning-box');
                if (data.warningMessage && data.warningMessage.length > 0) {
                    let warningHtml = '';
                    data.warningMessage.forEach(msg => {
                        // 簡化長者的警告字句，擷取前半段
                        const shortMsg = msg.split('現正生效')[0] || msg;
                        warningHtml += `<div class="warning-badge">${shortMsg}</div>`;
                    });
                    warningBox.innerHTML = warningHtml;
                } else {
                    warningBox.innerHTML = '<div class="warning-badge no-warning">現時無生效警告</div>';
                }

                document.getElementById('weather-update-time').innerText = `最後更新: ${getTimeString()}`;
            } catch (error) {
                console.error('更新天氣失敗:', error);
            }
        }

        // 總執行函數
        function refreshAllData() {
            updateBusData('249X', 'eta-249x');
            updateBusData('42A', 'eta-42a');
            updateBusData('43', 'eta-43');
            updateWeatherData();
        }

        // 網頁載入時立刻執行一次
        refreshAllData();

        // 每 30 秒自動更新數據
        setInterval(refreshAllData, 30000);
    </script>
</body>
</html>
