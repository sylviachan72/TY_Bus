<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊網頁3</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #FFFFFF; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        .scrollable { scrollbar-width: none; overflow-y: auto; }
        #top-bar { text-align: center; font-size: 20px; color: #8E8E93; padding: 4px 0; border-bottom: 1px solid #333; flex-shrink: 0; }
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #left-col { width: 50%; border-right: 1px solid #333; padding: 10px 15px; }
        #right-col { width: 50%; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .bus-header { font-size: 34px; font-weight: bold; margin-bottom: 8px; }
        .bus-times { font-size: 32px; }
        #time-display { font-size: 100px; font-weight: bold; text-align: center; }
        #date-display { font-size: 30px; text-align: center; }
        #weather-box { display: flex; flex-direction: column; align-items: center; }
        .weather-row { font-size: 32px; }
        .warning-badge { background-color: #FF3B30; color: #FFFFFF; padding: 4px 10px; border-radius: 8px; font-size: 30px; }
        
        /* 跑馬燈 */
        #news-ticker-container { display: flex; background-color: #0A0A0A; border-top: 2px solid #333; height: 75px; align-items: center; overflow: hidden; flex-shrink: 0; }
        .ticker-title { background-color: #FF3B30; color: #FFF; font-size: 34px; padding: 0 18px; height: 100%; display: flex; align-items: center; }
        .ticker-move { white-space: nowrap; font-size: 45px; color: #FFF; font-weight: bold; animation: marquee 60s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div id="top-bar">資訊更新中...</div>
    <div id="main-container">
        <div id="left-col" class="scrollable"><div id="bus-list">載入巴士...</div></div>
        <div id="right-col" class="scrollable">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日</div>
            <div id="weather-box"><div id="weather-row-1" class="weather-row">載入天氣...</div></div>
            <div id="warnings-container"></div>
        </div>
    </div>
    <div id="news-ticker-container">
        <span class="ticker-title">即時新聞</span>
        <div id="news-ticker-text" class="ticker-move">正在連接新聞系統...</div>
    </div>

    <script>
        // 替換為直接請求 RTHK 的 JSON 格式 (有些瀏覽器可以直接存取)
        async function fetchNews() {
            const newsEl = document.getElementById('news-ticker-text');
            try {
                // 如果 rss2json 不行，我們嘗試用一個極簡的 CORS 繞過方式
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://rthk.hk/rthk/news/rss/c_expressnews_gnews.xml');
                const data = await response.json();
                if(data.items) {
                    newsEl.textContent = data.items.map(i => i.title).join(' ❖ ');
                } else {
                    newsEl.textContent = "請檢查網絡連線是否允許存取外部數據。";
                }
            } catch (e) {
                // 最後手段：如果完全無法連線，顯示此訊息
                newsEl.textContent = "新聞系統目前無法連線，請檢查網絡設定。";
            }
        }
        
        // 簡易刷新
        setInterval(fetchNews, 60000);
        fetchNews();
        // 補上基礎時鐘 (簡化版)
        setInterval(() => {
            const n = new Date();
            document.getElementById('time-display').textContent = n.getHours() + ":" + String(n.getMinutes()).padStart(2,'0');
        }, 1000);
    </script>
</body>
</html>
