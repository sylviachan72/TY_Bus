<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長者即時資訊看板 - 巴士、天氣與新聞</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Main Split Layout: 50% Left / 50% Right */
  .main-container {
    width: 100%;
    height: calc(100vh - 70px); /* Leave space for bottom ticker */
    display: table;
    table-layout: fixed;
  }

  .column {
    display: table-cell;
    width: 50%;
    vertical-align: top;
    height: 100%;
    padding: 10px 15px;
    overflow-y: auto;
  }

  /* Border line between columns */
  .left-col {
    border-right: 1px solid #222222;
  }

  /* Hide scrollbars for both columns */
  .column::-webkit-scrollbar {
    display: none;
  }
  .column {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  /* Update timestamp styles */
  .update-header {
    font-size: 20px;
    color: #ffffff;
    text-align: center;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  /* ==================== LEFT COLUMN: BUS STYLES ==================== */
  .bus-card {
    border-bottom: 1px solid #222222;
    padding: 10px 0;
  }
  .bus-card:last-child {
    border-bottom: none;
  }

  .bus-header {
    font-size: 34px;
    color: #ffffff;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .bus-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 8px;
    font-size: 34px;
    font-weight: bold;
    color: #ffffff;
    margin-right: 8px;
    vertical-align: middle;
  }

  /* Route Tag Colors */
  .bg-249x { background-color: #0052CC; } /* 寶藍色 */
  .bg-42a  { background-color: #007A33; } /* 正綠色 */
  .bg-43   { background-color: #C64B00; } /* 深橙色 */
  .bg-49m  { background-color: #6B238E; } /* 深紫色 */
  .bg-68e  { background-color: #006666; } /* 深松綠 */
  .bg-243m { background-color: #5C3A21; } /* 深朱古力色 */

  .bus-eta-line {
    font-size: 32px;
    color: #ffffff;
    line-height: 1.35;
  }

  .bus-eta-item {
    display: inline-block;
    white-space: nowrap;
  }

  .eta-time {
    color: #ffffff;
  }

  .eta-count-yellow {
    color: #FFC107; /* 芒果黃 (<10 mins) */
  }

  .eta-count-white {
    color: #ffffff; /* 白色 (>=10 mins) */
  }

  .bus-sep {
    color: #ffffff;
    margin: 0 4px;
    font-weight: normal;
  }

  .no-bus-msg {
    font-size: 32px;
    color: #ffffff;
  }

  /* ==================== RIGHT COLUMN: CLOCK & WEATHER ==================== */
  .clock-box {
    text-align: center;
    margin-bottom: 2px;
  }

  .time-display {
    text-align: center;
    line-height: 0.95;
    margin-bottom: 2px;
  }

  .ampm-text {
    font-size: 40px;
    color: #ffffff;
    display: inline-block;
    margin-right: 12px;
    vertical-align: baseline;
  }

  .clock-text {
    font-size: 100px;
    font-weight: bold;
    color: #ffffff;
    display: inline-block;
    vertical-align: baseline;
    letter-spacing: -2px;
  }

  .date-text {
    font-size: 30px;
    color: #ffffff;
    text-align: center;
    margin-top: 0px;
    margin-bottom: 8px;
  }

  /* Weather Box */
  .weather-box {
    text-align: center;
    margin-bottom: 8px;
  }

  .weather-row1 {
    font-size: 32px;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 0px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .weather-icon-img {
    height: 38px;
    width: auto;
    vertical-align: middle;
  }

  .weather-row2 {
    font-size: 32px;
    line-height: 1.1;
    margin-top: 0px;
    text-align: center;
  }

  .temp-min {
    color: #4DA6FF; /* 藍色 */
    margin-right: 15px;
  }

  .temp-max {
    color: #FF4D4D; /* 紅色 */
  }

  /* Warnings & Special Weather Tips */
  .warning-container, .swt-container {
    text-align: left;
    margin-top: 8px;
  }

  .warning-tag {
    display: inline-block;
    background-color: #D32F2F;
    color: #ffffff;
    font-size: 30px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    margin-right: 6px;
  }

  .no-info-grey {
    font-size: 30px;
    color: #888888; /* 暗灰色 */
    text-align: left;
    margin-bottom: 6px;
  }

  .swt-list {
    font-size: 30px;
    color: #ffffff;
    line-height: 1.3;
    text-align: left;
    max-height: 5.2em; /* ~4 lines max before scrolling */
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .swt-list::-webkit-scrollbar {
    display: none;
  }

  .swt-item {
    margin-bottom: 6px;
  }

  /* ==================== BOTTOM MARQUEE TICKER ==================== */
  .news-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: 70px;
    background-color: #111111;
    border-top: 2px solid #333333;
    display: table;
    table-layout: fixed;
    z-index: 1000;
  }

  .news-label {
    display: table-cell;
    width: 210px;
    vertical-align: middle;
    background-color: #D32F2F;
    color: #ffffff;
    font-size: 45px;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
  }

  .news-wrapper {
    display: table-cell;
    vertical-align: middle;
    overflow: hidden;
    position: relative;
    white-space: nowrap;
    width: auto;
  }

  .news-content {
    display: inline-block;
    white-space: nowrap;
    font-size: 45px;
    color: #ffffff;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    will-change: transform;
  }

  .news-sep {
    color: #ffffff;
    margin: 0 14px;
    font-weight: normal;
  }
</style>
</head>
<body>

<div class="main-container">
  <!-- LEFT COLUMN: BUS INFO -->
  <div class="column left-col">
    <div class="update-header" id="bus-update-time">最後更新：00:00:00（每30秒自動刷新）</div>
    <div id="bus-routes-list">
      <!-- Bus items dynamically rendered -->
    </div>
  </div>

  <!-- RIGHT COLUMN: WEATHER & TIME -->
  <div class="column right-col">
    <div class="update-header" id="weather-update-time">最後更新：00:00:00（每5分鐘自動刷新）</div>
    
    <!-- Real-time Clock -->
    <div class="clock-box">
      <div class="time-display">
        <span class="ampm-text" id="clock-ampm">上午</span>
        <span class="clock-text" id="clock-time">00:00</span>
      </div>
      <div class="date-text" id="clock-date">2026年1月1日 星期一</div>
    </div>

    <!-- Weather Info -->
    <div class="weather-box">
      <div class="weather-row1">
        <img id="wx-icon" class="weather-icon-img" src="" alt="天氣圖標" style="display:none;">
        <span id="wx-temp-hum">--°C(青衣) 💧--%</span>
      </div>
      <div class="weather-row2">
        <span class="temp-min" id="wx-min-temp">❄️--°C</span>
        <span class="temp-max" id="wx-max-temp">☀️--°C</span>
      </div>
    </div>

    <!-- Weather Warnings -->
    <div class="warning-container" id="warning-box">
      <div class="no-info-grey">現時沒有生效的警告</div>
    </div>

    <!-- Special Weather Tips -->
    <div class="swt-container" id="swt-box">
      <div class="no-info-grey">現時沒有特別天氣提示</div>
    </div>
  </div>
</div>

<!-- BOTTOM TICKER: INSTANT NEWS -->
<div class="news-bar">
  <div class="news-label">即時新聞</div>
  <div class="news-wrapper" id="news-wrapper">
    <div class="news-content" id="news-content">正在加載即時新聞...</div>
  </div>
</div>

<script>
  // ==========================================
  // 1. CLOCK & DATE LOGIC
  // ==========================================
  const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    const ampm = hours >= 12 ? '下午' : '上午';
    hours = hours % 12;
    hours = hours ? hours : 12; // 0 converted to 12
    const timeStr = `${hours}:${minutes}`;

    document.getElementById('clock-ampm').textContent = ampm;
    document.getElementById('clock-time').textContent = timeStr;

    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const day = WEEKDAYS[now.getDay()];
    document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${day}`;
  }

  setInterval(updateClock, 1000);
  updateClock();

  function get24HourTimeString() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  // ==========================================
  // 2. BUS REAL-TIME ETA SYSTEM
  // ==========================================
  const BUS_CONFIGS = [
    {
      route: '249X',
      dirName: '博康',
      stopName: '青桃樓',
      badgeClass: 'bg-249x',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1',
      filterFn: (item) => true
    },
    {
      route: '42A',
      dirName: '西九龍',
      stopName: '青桃樓',
      badgeClass: 'bg-42a',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1',
      filterFn: (item) => true
    },
    {
      route: '43',
      dirName: '荃灣西',
      stopName: '青桃樓',
      badgeClass: 'bg-43',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1',
      filterFn: (item) => true
    },
    {
      route: '49M',
      dirName: '青衣站',
      stopName: '青富苑',
      badgeClass: 'bg-49m',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1',
      filterFn: (item) => true
    },
    {
      route: '49M',
      dirName: '青富苑',
      stopName: '青衣站',
      badgeClass: 'bg-49m',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1',
      filterFn: (item) => true
    },
    {
      route: '68E',
      dirName: '元朗',
      stopName: '青衣站',
      badgeClass: 'bg-68e',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1',
      filterFn: (item) => true
    },
    {
      route: '243M',
      dirName: '荃灣',
      stopName: '美景花園',
      badgeClass: 'bg-243m',
      url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1',
      filterFn: (item) => item.dir === 'O' // 只顯示荃灣方向 (Dir: O)
    }
  ];

  async function fetchBusETAs() {
    const listContainer = document.getElementById('bus-routes-list');
    let htmlOutput = '';

    const now = new Date();

    for (const cfg of BUS_CONFIGS) {
      let etaItems = [];
      try {
        const resp = await fetch(cfg.url);
        if (resp.ok) {
          const data = await resp.json();
          if (data && data.data && Array.isArray(data.data)) {
            etaItems = data.data.filter(item => {
              if (!item.eta) return false;
              return cfg.filterFn(item);
            });
          }
        }
      } catch (err) {
        console.error(`Bus fetch error for ${cfg.route}:`, err);
      }

      // Calculate minutes and sort
      const parsedEtas = [];
      for (const item of etaItems) {
        const etaDate = new Date(item.eta);
        const diffMs = etaDate - now;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins >= 0) {
          // Format 12-hour clock time (e.g. 13:05 -> 1:05 or 13:05 depending on 12h representation)
          let h = etaDate.getHours();
          const m = String(etaDate.getMinutes()).padStart(2, '0');
          h = h % 12;
          h = h ? h : 12;
          const timeStr = `${h}:${m}`;

          parsedEtas.push({
            timeStr,
            diffMins,
            etaDate
          });
        }
      }

      parsedEtas.sort((a, b) => a.etaDate - b.etaDate);
      const top3 = parsedEtas.slice(0, 3);

      // Build HTML
      htmlOutput += `
        <div class="bus-card">
          <div class="bus-header">
            <span class="bus-badge ${cfg.badgeClass}">${cfg.route}</span>
            往${cfg.dirName} 📍${cfg.stopName}
          </div>
          <div class="bus-eta-line">
      `;

      if (top3.length === 0) {
        htmlOutput += `<span class="no-bus-msg">暫無班次資料</span>`;
      } else {
        const etaStrings = top3.map(item => {
          const countClass = item.diffMins < 10 ? 'eta-count-yellow' : 'eta-count-white';
          return `<span class="bus-eta-item"><span class="eta-time">${item.timeStr}</span><span class="${countClass}">(${item.diffMins}分鐘)</span></span>`;
        });
        htmlOutput += etaStrings.join('<span class="bus-sep">|</span>');
      }

      htmlOutput += `
          </div>
        </div>
      `;
    }

    listContainer.innerHTML = htmlOutput;
    document.getElementById('bus-update-time').textContent = `最後更新：${get24HourTimeString()}（每30秒自動刷新）`;
  }

  // Initial fetch & 30s timer
  fetchBusETAs();
  setInterval(fetchBusETAs, 30000);

  // ==========================================
  // 3. WEATHER DATA SYSTEM
  // ==========================================
  const SUBTYPE_MAP = {
    'WFIREY': '黃色火災危險警告',
    'WFIRER': '紅色火災危險警告',
    'WRAINA': '黃色暴雨警告信號',
    'WRAINR': '紅色暴雨警告信號',
    'WRAINB': '黑色暴雨警告信號',
    'TC1': '一號戒備信號',
    'TC3': '三號強風信號',
    'TC8NE': '八號東北烈風或暴風信號',
    'TC8SE': '八號東南烈風或暴風信號',
    'TC8SW': '八號西南烈風或暴風信號',
    'TC8NW': '八號西北烈風或暴風信號',
    'TC9': '九號烈風或暴風風力增強信號',
    'TC10': '十號颶風信號',
    'CANCEL': '取消所有熱帶氣旋警告信號'
  };

  const WARNING_NAMES = {
    'WFIRE': '火災危險警告',
    'WRAIN': '暴雨警告信號',
    'WTCSGNL': '熱帶氣旋警告信號',
    'WCOLD': '寒冷天氣警告',
    'WHOT': '酷熱天氣警告',
    'WTS': '雷暴警告',
    'WMSGNL': '強烈季候風信號',
    'WFNTS': '新界北部水浸特別報告',
    'WL': '山泥傾瀉警告',
    'WFOG': '大霧警告',
    'WTMW': '海嘯警告'
  };

  async function fetchWeatherData() {
    try {
      // 1. Current Weather (rhrread)
      const rhrResp = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      if (rhrResp.ok) {
        const rhrData = await rhrResp.json();
        
        // Tsing Yi Temp
        let tsingYiTemp = '--';
        if (rhrData.temperature && Array.isArray(rhrData.temperature.data)) {
          const tyItem = rhrData.temperature.data.find(d => d.place === '青衣');
          if (tyItem) tsingYiTemp = tyItem.value;
        }

        // Humidity
        let humidity = '--';
        if (rhrData.humidity && Array.isArray(rhrData.humidity.data) && rhrData.humidity.data.length > 0) {
          humidity = rhrData.humidity.data[0].value;
        }

        // Weather Icon (HKOWxIconOutline)
        if (rhrData.icon && rhrData.icon.length > 0) {
          const iconCode = rhrData.icon[0];
          const imgElem = document.getElementById('wx-icon');
          imgElem.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
          imgElem.style.display = 'inline-block';
        }

        document.getElementById('wx-temp-hum').textContent = `${tsingYiTemp}°C(青衣) 💧${humidity}%`;
      }

      // 2. 9-Day Forecast for Today's Min/Max Temp (fnd)
      const fndResp = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
      if (fndResp.ok) {
        const fndData = await fndResp.json();
        if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          const todayFcst = fndData.weatherForecast[0];
          const minT = todayFcst.forecastMintemp ? todayFcst.forecastMintemp.value : '--';
          const maxT = todayFcst.forecastMaxtemp ? todayFcst.forecastMaxtemp.value : '--';
          document.getElementById('wx-min-temp').textContent = `❄️${minT}°C`;
          document.getElementById('wx-max-temp').textContent = `☀️${maxT}°C`;
        }
      }

      // 3. Warnings (warnsum)
      const warnResp = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
      const warningBox = document.getElementById('warning-box');
      if (warnResp.ok) {
        const warnData = await warnResp.json();
        const activeWarnings = [];

        for (const key in warnData) {
          const item = warnData[key];
          if (item && item.actionCode !== 'CANCEL') {
            const subCode = item.code;
            let label = '';
            if (subCode && SUBTYPE_MAP[subCode]) {
              label = SUBTYPE_MAP[subCode];
            } else if (item.name) {
              label = item.name;
            } else if (WARNING_NAMES[key]) {
              label = WARNING_NAMES[key];
            }
            if (label) activeWarnings.push(label);
          }
        }

        if (activeWarnings.length > 0) {
          warningBox.innerHTML = activeWarnings.map(w => `<div class="warning-tag">${w}</div>`).join('');
        } else {
          warningBox.innerHTML = `<div class="no-info-grey">現時沒有生效的警告</div>`;
        }
      } else {
        warningBox.innerHTML = `<div class="no-info-grey">現時沒有生效的警告</div>`;
      }

      // 4. Special Weather Tips (swt)
      const swtResp = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
      const swtBox = document.getElementById('swt-box');
      if (swtResp.ok) {
        const swtData = await swtResp.json();
        if (swtData.swt && Array.isArray(swtData.swt) && swtData.swt.length > 0) {
          let swtHtml = '<div class="swt-list">';
          swtData.swt.forEach((item, index) => {
            const desc = item.desc || '';
            if (desc) {
              swtHtml += `<div class="swt-item">${index + 1}. ${desc}</div>`;
            }
          });
          swtHtml += '</div>';
          swtBox.innerHTML = swtHtml;
        } else {
          swtBox.innerHTML = `<div class="no-info-grey">現時沒有特別天氣提示</div>`;
        }
      } else {
        swtBox.innerHTML = `<div class="no-info-grey">現時沒有特別天氣提示</div>`;
      }

    } catch (err) {
      console.error('Weather fetch error:', err);
    }

    document.getElementById('weather-update-time').textContent = `最後更新：${get24HourTimeString()}（每5分鐘自動刷新）`;
  }

  // Initial fetch & 5min timer
  fetchWeatherData();
  setInterval(fetchWeatherData, 300000);

  // ==========================================
  // 4. INSTANT NEWS RSS & UNIFORM SCROLL TICKER
  // ==========================================
  let newsAnimId = null;

  async function fetchNews() {
    const newsContent = document.getElementById('news-content');
    const proxyUrl = 'https://api.corsproxy.io/?url=' + encodeURIComponent('https://news.mingpao.com/rss/ins/all.xml');
    const fallbackProxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://news.mingpao.com/rss/ins/all.xml');

    let xmlText = '';
    try {
      let resp = await fetch(proxyUrl);
      if (resp.ok) {
        xmlText = await resp.text();
      } else {
        resp = await fetch(fallbackProxyUrl);
        if (resp.ok) xmlText = await resp.text();
      }
    } catch (e) {
      try {
        const resp = await fetch(fallbackProxyUrl);
        if (resp.ok) xmlText = await resp.text();
      } catch (err) {
        console.error('News fetch error:', err);
      }
    }

    if (!xmlText) {
      newsContent.textContent = '暫未能加載即時新聞';
      startNewsTicker();
      return;
    }

    try {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const items = xmlDoc.querySelectorAll('item');

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const yesterdayStart = todayStart - (24 * 60 * 60 * 1000);

      const filteredTitles = [];

      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || '';
        const pubDateStr = item.querySelector('pubDate')?.textContent || item.querySelector('dc\:date')?.textContent || '';
        
        let isTodayOrYesterday = true;
        if (pubDateStr) {
          const pDate = new Date(pubDateStr).getTime();
          if (!isNaN(pDate) && pDate < yesterdayStart) {
            isTodayOrYesterday = false;
          }
        }

        if (title && isTodayOrYesterday) {
          filteredTitles.push(title.trim());
        }
      });

      if (filteredTitles.length === 0) {
        // Fallback: take first 15 titles if date parse resulted in empty
        items.forEach((item, idx) => {
          if (idx < 15) {
            const t = item.querySelector('title')?.textContent;
            if (t) filteredTitles.push(t.trim());
          }
        });
      }

      const newsItemsHtml = filteredTitles.map((t, idx) => `${idx + 1}. ${t}`).join('<span class="news-sep">|</span>');
      newsContent.innerHTML = newsItemsHtml;

    } catch (err) {
      console.error('XML Parse Error:', err);
      newsContent.textContent = '即時新聞加載失敗';
    }

    startNewsTicker();
  }

  function startNewsTicker() {
    const wrapper = document.getElementById('news-wrapper');
    const content = document.getElementById('news-content');
    if (!wrapper || !content) return;

    if (newsAnimId) cancelAnimationFrame(newsAnimId);

    const wrapperWidth = wrapper.offsetWidth;
    const contentWidth = content.offsetWidth;

    let currentPos = wrapperWidth;
    const endPos = -contentWidth;
    const speed = 80; // 恒定速度 80px/s

    let lastTime = performance.now();

    function step(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      currentPos -= speed * dt;
      content.style.transform = `translate(${currentPos}px, -50%)`;

      if (currentPos <= endPos) {
        // Finished full cycle -> Refresh news and restart loop
        fetchNews();
        return;
      }

      newsAnimId = requestAnimationFrame(step);
    }

    newsAnimId = requestAnimationFrame((now) => {
      lastTime = now;
      step(now);
    });
  }

  fetchNews();

</script>
</body>
</html>
