<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實時資訊網頁</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 隱藏整體滾動 */
        }

        /* 隱藏滾動條但保留滾動功能 */
        ::-webkit-scrollbar { display: none; }
        .scrollable { scrollbar-width: none; -ms-overflow-style: none; overflow-y: auto; }

        /* 頂部更新時間 */
        #top-bar {
            text-align: center;
            font-size: 20px;
            color: #8E8E93;
            padding: 4px 0;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }

        /* 主佈局：左右雙欄 */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左欄：巴士資訊 (60%) */
        #left-col {
            width: 60%;
            border-right: 1px solid #333333;
            padding: 10px 15px;
        }
        
        .bus-route {
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .bus-route:last-child { border-bottom: none; }
        
        .bus-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .bus-badge {
            border-radius: 12px;
            padding: 4px 14px;
            color: #FFFFFF;
        }
        
        .bus-times {
            font-size: 32px;
            line-height: 1.3;
            word-wrap: break-word;
        }
        .time-red { color: #FF3B30; }
        .time-white { color: #FFFFFF; }

        /* 右欄：時間與天氣 (40%) 極致緊湊 */
        #right-col {
            width: 40%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px; /* 緊湊間距 */
        }

        /* 時間日期 */
        #time-display {
            font-size: 96px;
            font-weight: bold;
            text-align: center;
            line-height: 1;
        }
        #date-display {
            font-size: 28px;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        /* 天氣整合區域 */
        #weather-info-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .weather-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            line-height: 1.1;
        }
        #weather-icon { height: 44px; vertical-align: middle; }
        .temp-red { color: #FF3B30; }
        .temp-blue { color: #007AFF; }

        /* 警告圖標區域 */
        #warnings-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 52px; /* 預留圖標空間 */
            align-items: center;
        }
        .warning-icon {
            height: 52px; /* 適合長者觀賞的圖標高度 */
            width: auto;
            object-fit: contain;
        }
        /* 極端備用文字樣式 (當所有網路圖片皆無法讀取時) */
        .warning-text-fallback {
            background-color: #FF3B30;
            color: #FFFFFF;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 24px;
            font-weight: bold;
        }
        .no-warning {
            color: #8E8E93;
            font-size: 24px;
        }

        /* 特別天氣提示跑馬燈 (最多3行高度) */
        #swt-container {
            font-size: 24px;
            line-height: 1.3;
            max-height: 3.9em;
            overflow: hidden;
            position: relative;
            width: 100%;
            margin-top: 4px;
        }
        .swt-text {
            position: relative;
        }
        .marquee-up {
            animation: scrollUp 15s linear infinite;
        }
        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -150%; }
        }
    </style>
</head>
<body>

    <div id="top-bar">最後更新：--:--:--（每30秒自動刷新）</div>

    <div id="main-container">
        <div id="left-col" class="scrollable">
            <div id="bus-list">正在載入巴士資訊...</div>
        </div>

        <div id="right-col" class="scrollable">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日 星期-</div>
            
            <div id="weather-info-container">
                <div class="weather-line" id="weather-current-data">載入天氣中...</div>
                <div class="weather-line" id="weather-minmax-data"></div>
            </div>

            <div id="warnings-container"></div>
            
            <div id="swt-container">
                <div id="swt-text" class="swt-text"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 配置區域 ---

        // 巴士路線與站點設定
        const busConfigs = [
            { id: "249X", color: "#007AFF", dest: "博康", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1" },
            { id: "42A", color: "#34C759", dest: "西九龍", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1" },
            { id: "43", color: "#FF9500", dest: "荃灣西", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1" },
            { id: "49M", color: "#AF52DE", dest: "青衣站", stop: "青富苑", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1" },
            { id: "49M", color: "#FF2D55", dest: "青富苑", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1" },
            { id: "68E", color: "#5AC8FA", dest: "元朗", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1" },
            { id: "243M", color: "#A2845E", dest: "荃灣", stop: "美景花園", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1" }
        ];

        // 天氣警告代號對應的中文名稱
        const warningNames = {
            "WFIREY": "黃色火災危險警告", "WFIRER": "紅色火災危險警告",
            "WRAINA": "黃色暴雨警告信號", "WRAINR": "紅色暴雨警告信號", "WRAINB": "黑色暴雨警告信號",
            "TC1": "一號戒備信號", "TC3": "三號強風信號", 
            "TC8NE": "八號東北烈風或暴風信號", "TC8SE": "八號東南烈風或暴風信號", 
            "TC8SW": "八號西南烈風或暴風信號", "TC8NW": "八號西北烈風或暴風信號", 
            "TC9": "九號烈風或暴風風力增強信號", "TC10": "十號颶風信號", 
            "WTS": "雷暴警告", "WHOT": "酷熱天氣警告", "WCOLD": "寒冷天氣警告", 
            "WL": "山泥傾瀉警告", "WTMW": "海嘯警告", "WMSGNL": "強烈季候風信號",
            "WFROST": "霜凍警告"
        };

        // 天氣警告圖標可能的主檔名映射（涵蓋所有天文台新舊命名習慣）
        const warningIconFileNames = {
            "WFIREY": ["wfirey", "firey"],
            "WFIRER": ["wfirer", "firer"],
            "WRAINA": ["wraina", "raina"],
            "WRAINR": ["wrainr", "rainr"],
            "WRAINB": ["wrainb", "rainb"],
            "TC1": ["tc1"], "TC3": ["tc3"], 
            "TC8NE": ["tc8ne"], "TC8SE": ["tc8se"], "TC8SW": ["tc8sw"], "TC8NW": ["tc8nw"], 
            "TC9": ["tc9"], "TC10": ["tc10"], 
            "WTS": ["wts", "ts"],
            "WHOT": ["whot", "vhot"],
            "WCOLD": ["wcold", "cold"],
            "WL": ["wl", "landslip"],
            "WTMW": ["wtmw", "tsunami"],
            "WMSGNL": ["wmsgnl", "sms"],
            "WFROST": ["wfrost", "frost"]
        };


        // --- 2. 警告圖標自動偵測與加載引擎 ---
        function getWarningIconHtml(code, name) {
            const altText = warningNames[code] || name || "天氣警告";
            const possibleNames = warningIconNames[code] || [code.toLowerCase()];
            
            const candidateUrls = [];
            // 自動生成覆蓋新舊目錄、gif 與 png 的 8 組網址
            possibleNames.forEach(imgName => {
                candidateUrls.push(`https://www.hko.gov.hk/tc/wxinfo/warning/images/${imgName}.gif`);
                candidateUrls.push(`https://www.hko.gov.hk/tc/wxinfo/warning/images/${imgName}.png`);
                candidateUrls.push(`https://www.hko.gov.hk/images/wxicon/warn/${imgName}.gif`);
                candidateUrls.push(`https://www.hko.gov.hk/images/wxicon/warn/${imgName}.png`);
            });
            
            const urlsJson = JSON.stringify(candidateUrls).replace(/"/g, '&quot;');
            
            // 建立帶有自動重試鏈 (handleIconError) 的 HTML 圖片標籤
            return `<img src="${candidateUrls[0]}" alt="${altText}" class="warning-icon" 
                     data-urls="${urlsJson}" data-index="0" 
                     onerror="handleIconError(this, '${altText}')">`;
        }

        // 當單個網址失效時，無縫嘗試下一個備用網址
        function handleIconError(img, altText) {
            const urls = JSON.parse(img.getAttribute('data-urls'));
            let index = parseInt(img.getAttribute('data-index'), 10) + 1;
            
            if (index < urls.length) {
                img.setAttribute('data-index', index);
                img.src = urls[index]; // 嘗試下一個 URL
            } else {
                // 如果所有圖片 URL 皆無法讀取（例如無網路環境），優雅降級為文字標籤
                const fallbackDiv = document.createElement('div');
                fallbackDiv.className = 'warning-text-fallback';
                fallbackDiv.textContent = altText;
                if (img.parentNode) {
                    img.parentNode.replaceChild(fallbackDiv, img);
                }
            }
        }


        // --- 3. 時鐘與日期邏輯 ---
        function updateClock() {
            const now = new Date();
            
            // 右欄大時鐘 (12小時制)
            let hh = now.getHours();
            hh = hh % 12;
            hh = hh ? hh : 12; // 將 0 轉換為 12
            hh = String(hh).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${hh}:${mm}`;

            // 右欄日期
            const yyyy = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const dayName = days[now.getDay()];
            document.getElementById('date-display').textContent = `${yyyy}年${month}月${date}日 ${dayName}`;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // --- 4. 數據抓取與渲染 ---

        // 格式化到站時間 HTML
        function formatBusETA(etaString) {
            const etaTime = new Date(etaString);
            const now = new Date();
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 0) return null; // 過期班次

            const hh = String(etaTime.getHours()).padStart(2, '0');
            const mm = String(etaTime.getMinutes()).padStart(2, '0');
            const timeStr = `${hh}:${mm}`;

            // <10分鐘到達為白色，倒數為紅色；>=10分鐘全白
            if (diffMins < 10) {
                return `<span class="time-white">${timeStr}</span>(<span class="time-red">${diffMins}分鐘</span>)`;
            } else {
                return `<span class="time-white">${timeStr}(${diffMins}分鐘)</span>`;
            }
        }

        async function fetchBuses() {
            let htmlContent = '';
            for (const bus of busConfigs) {
                try {
                    const res = await fetch(bus.url);
                    const data = await res.json();
                    
                    let etasHtml = '暫無班次資料';
                    if (data && data.data && data.data.length > 0) {
                        const validETAs = data.data
                            .map(item => item.eta)
                            .filter(eta => eta != null)
                            .map(eta => formatBusETA(eta))
                            .filter(eta => eta != null)
                            .slice(0, 3); // 取得最近 3 班

                        if (validETAs.length > 0) {
                            etasHtml = validETAs.join(' | ');
                        }
                    }

                    htmlContent += `
                        <div class="bus-route">
                            <div class="bus-header">
                                <span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span>
                                往${bus.dest} 📍${bus.stop}
                            </div>
                            <div class="bus-times">${etasHtml}</div>
                        </div>
                    `;
                } catch (error) {
                    htmlContent += `
                        <div class="bus-route">
                            <div class="bus-header">
                                <span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span>
                                往${bus.dest} 📍${bus.stop}
                            </div>
                            <div class="bus-times">無法載入資料</div>
                        </div>
                    `;
                }
            }
            document.getElementById('bus-list').innerHTML = htmlContent;
        }

        async function fetchWeather() {
            try {
                const [currentRes, forecastRes, warningRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                const currentData = await currentRes.json();
                const forecastData = await forecastRes.json();
                const warningData = await warningRes.json();
                let swtData = {};
                if(swtRes.status === 200) swtData = await swtRes.json();

                // 1. 處理天氣、溫度、濕度
                let currentTemp = '--';
                let tsingYiTempObj = currentData.temperature.data.find(d => d.place === '青衣');
                if (tsingYiTempObj) currentTemp = tsingYiTempObj.value;

                let humidity = currentData.humidity && currentData.humidity.data.length > 0 ? currentData.humidity.data[0].value : '--';
                let iconCode = currentData.icon[0];
                let maxTemp = forecastData.weatherForecast[0].forecastMaxtemp.value;
                let minTemp = forecastData.weatherForecast[0].forecastMintemp.value;

                // 拆分顯示：第一行 (圖標、現時溫度、濕度)
                document.getElementById('weather-current-data').innerHTML = `
                    <img id="weather-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png" alt="天氣圖標">
                    <span>${currentTemp}°C(青衣)</span>
                    <span>💧${humidity}%</span>
                `;
                
                // 拆分顯示：第二行 (最低、最高溫度)
                document.getElementById('weather-minmax-data').innerHTML = `
                    <span class="temp-blue">❄️${minTemp}°C</span>
                    <span class="temp-red">☀️${maxTemp}°C</span>
                `;

                // 2. 處理天氣警告 (強烈使用圖標與子類型)
                let warningsHtml = '';
                let hasAlerts = false;
                
                if (Object.keys(warningData).length > 0) {
                    for (const key in warningData) {
                        const warn = warningData[key];
                        // 優先使用 warn.code (如 WRAINA, TC3)，若無則使用 key
                        const code = warn.code || key; 
                        
                        if (code && code !== "CANCEL" && warn.actionCode !== "CANCEL") {
                            warningsHtml += getWarningIconHtml(code, warn.name);
                            hasAlerts = true;
                        }
                    }
                }

                // 3. 處理特別天氣提示
                let swtText = '';
                if (swtData.swt && swtData.swt.length > 0) {
                    swtText = swtData.swt.map(item => item.desc).join('。');
                    hasAlerts = true;
                }

                const warningsContainer = document.getElementById('warnings-container');
                const swtContainerText = document.getElementById('swt-text');
                const swtContainerBox = document.getElementById('swt-container');

                if (!hasAlerts) {
                    warningsContainer.innerHTML = `<div class="no-warning">現時沒有生效的警告/提示</div>`;
                    swtContainerText.innerHTML = '';
                    swtContainerText.classList.remove('marquee-up');
                } else {
                    // 渲染警告圖標
                    warningsContainer.innerHTML = warningsHtml;
                    // 渲染特別天氣提示文字
                    swtContainerText.innerHTML = swtText;
                    
                    // 判斷是否需要跑馬燈 (當文字超出容器 3 行高度時啟動)
                    setTimeout(() => {
                        if (swtContainerText.scrollHeight > swtContainerBox.clientHeight) {
                            swtContainerText.classList.add('marquee-up');
                        } else {
                            swtContainerText.classList.remove('marquee-up');
                        }
                    }, 100);
                }

            } catch (error) {
                console.error("天氣獲取失敗", error);
            }
        }

        // --- 5. 初始化與自動刷新 ---
        async function updateDashboard() {
            await fetchBuses();
            await fetchWeather();
            
            // 更新頂部時間 (24小時制)
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('top-bar').textContent = `最後更新：${hh}:${mm}:${ss}（每30秒自動刷新）`;
        }

        // 首次加載
        updateDashboard();
        // 設定每 30 秒異步更新
        setInterval(updateDashboard, 30000);

    </script>
</body>
</html>
