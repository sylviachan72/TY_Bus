<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊面板1</title>
    <style>
        /* 全域設定：黑底白字、無捲動軸、字體設定 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 隱藏所有區域的捲動軸，但保留滑動功能 */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* 頂部：最後更新時間 */
        #top-bar {
            text-align: center;
            font-size: 20px;
            color: #666666; /* 較暗的灰色 */
            padding: 4px 0;
            line-height: 1.2;
            flex-shrink: 0;
        }

        /* 中間：左右兩欄佈局 */
        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-bottom: 1px solid #333;
        }

        /* 左右各佔 50%，獨立滑動 */
        .half-col {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 0 10px;
            box-sizing: border-box;
        }
        
        #left-col { border-right: 1px solid #222; }

        /* --- 巴士區塊樣式 --- */
        .bus-route {
            margin-bottom: 15px;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            line-height: 1.3;
        }
        .bus-route:last-child { border-bottom: none; }
        
        .bus-header { margin-bottom: 5px; }
        
        .bus-badge {
            display: inline-block;
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 10px;
        }
        
        .bus-info-text {
            font-size: 32px;
            color: #FFFFFF;
        }
        
        .bus-times {
            font-size: 32px;
            color: #FFFFFF;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .text-mango { color: #FFCC00; } /* 芒果黃 */
        .text-white { color: #FFFFFF; }

        /* --- 天氣與時間區塊樣式 --- */
        #time-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        #ampm-text { font-size: 40px; margin-bottom: -15px; z-index: 2;}
        #time-text { font-size: 100px; font-weight: bold; line-height: 1; margin-bottom: 0;}
        #date-text { font-size: 30px; line-height: 1; margin-top: 0; } /* 極致緊湊，零縫隙貼合時間 */

        #weather-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* 極致緊湊 */
            margin-bottom: 10px;
        }

        .weather-row {
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .weather-icon { height: 40px; margin-right: 5px; }
        .temp-low { color: #5599FF; margin-right: 15px;} /* 藍色 */
        .temp-high { color: #FF5555; } /* 紅色 */

        #warning-container {
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: left;
        }

        .warning-badge {
            background-color: #FF3333;
            color: #FFFFFF;
            font-size: 30px;
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .text-dark-gray { color: #666666; font-size: 30px; }

        #tips-container {
            margin-top: 5px;
            text-align: left;
            position: relative;
            /* 4行高度約為 4 * 1.3 * 30px = 156px，設定 max-height 做跑馬燈遮罩 */
            max-height: 156px; 
            overflow: hidden;
        }

        #tips-content {
            font-size: 30px;
            line-height: 1.3;
            white-space: pre-wrap; /* 允許換行 */
            position: relative;
        }

        /* --- 新聞跑馬燈樣式 --- */
        #news-bar {
            height: 60px;
            background-color: #000000;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        #news-badge {
            background-color: #FF0000;
            color: #FFFFFF;
            font-size: 35px;
            font-weight: bold;
            padding: 0 10px;
            height: 100%;
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            z-index: 10;
        }

        #news-content {
            font-size: 45px;
            color: #FFFFFF;
            white-space: nowrap;
            position: absolute;
            left: 0;
            will-change: transform;
        }

    </style>
</head>
<body>

    <!-- 頂部資訊 -->
    <div id="top-bar">載入中...</div>

    <!-- 中間雙欄內容 -->
    <div id="main-content">
        <!-- 左欄：巴士 -->
        <div id="left-col" class="half-col">
            <div id="bus-list"></div>
        </div>

        <!-- 右欄：天氣與時間 -->
        <div id="right-col" class="half-col">
            <div id="time-container">
                <div id="ampm-text">--</div>
                <div id="time-text">--:--</div>
                <div id="date-text">----年--月--日 星期-</div>
            </div>
            
            <div id="weather-container">
                <div class="weather-row" id="weather-row-1">--</div>
                <div class="weather-row" id="weather-row-2">--</div>
            </div>

            <div id="warning-container">
                <div id="warning-content" class="text-dark-gray">現時沒有生效的警告</div>
            </div>

            <div id="tips-container">
                <div id="tips-content" class="text-dark-gray">現時沒有特別天氣提示</div>
            </div>
        </div>
    </div>

    <!-- 底部新聞跑馬燈 -->
    <div id="news-bar">
        <div id="news-badge">即時新聞</div>
        <div id="news-content">新聞載入中...</div>
    </div>

<script>
    // ==========================================
    // 1. 設定與資料定義區
    // ==========================================
    
    // 巴士路線設定 (包含顏色、網址、方向、站點)
    const busConfigs = [
        { route: '249X', color: '#1E90FF', dir: '往博康', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
        { route: '42A', color: '#32CD32', dir: '往西九龍', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
        { route: '43', color: '#FFA500', dir: '往荃灣西', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
        { route: '49M', color: '#9370DB', dir: '往青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
        { route: '49M', color: '#9370DB', dir: '往青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
        { route: '68E', color: '#DC143C', dir: '往元朗', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
        { route: '243M', color: '#20B2AA', dir: '往荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
    ];

    // 天氣警告代碼對應表
    const warningMap = {
        'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
        'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
        'TC1': '一號戒備信號', 'TC3': '三號強風信號', 'TC8NE': '八號東北烈風或暴風信號',
        'TC8SE': '八號東南烈風或暴風信號', 'TC8SW': '八號西南烈風或暴風信號', 'TC8NW': '八號西北烈風或暴風信號',
        'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號'
    };

    // 新聞 RSS 網址
    const rssUrls = [
        'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml',
        'https://rthk.hk/rthk/news/rss/c_expressnews_greaterchina.xml',
        'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml',
        'https://rthk.hk/rthk/news/rss/c_expressnews_cfinance.xml',
        'https://rthk.hk/rthk/news/rss/c_expressnews_csport.xml'
    ];

    // ==========================================
    // 2. 時鐘與頂部更新邏輯
    // ==========================================
    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    
    function updateClock() {
        const now = new Date();
        
        // 更新頂部
        const topH = String(now.getHours()).padStart(2, '0');
        const topM = String(now.getMinutes()).padStart(2, '0');
        const topS = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('top-bar').innerText = `最後更新：${topH}:${topM}:${topS}（每30秒自動刷新）`;

        // 更新大時鐘 (12小時制)
        let hours12 = now.getHours() % 12;
        hours12 = hours12 ? hours12 : 12; 
        const ampm = now.getHours() >= 12 ? '下午' : '上午';
        const mins = String(now.getMinutes()).padStart(2, '0');
        
        document.getElementById('ampm-text').innerText = ampm;
        document.getElementById('time-text').innerText = `${hours12}:${mins}`;
        document.getElementById('date-text').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
    }

    // ==========================================
    // 3. 巴士資料獲取與渲染
    // ==========================================
    async function updateBuses() {
        const busListEl = document.getElementById('bus-list');
        let htmlContent = '';
        const now = new Date();

        for (const bus of busConfigs) {
            try {
                const response = await fetch(bus.url);
                const data = await response.json();
                
                // 篩選有效的預計到達時間 (ETA > 現在時間)
                let validEtas = [];
                if (data.data && Array.isArray(data.data)) {
                    validEtas = data.data
                        .filter(item => item.eta != null)
                        .map(item => new Date(item.eta))
                        .filter(etaDate => etaDate > now)
                        .sort((a, b) => a - b)
                        .slice(0, 3); // 取最近3班
                }

                htmlContent += `
                    <div class="bus-route">
                        <div class="bus-header">
                            <span class="bus-badge" style="background-color: ${bus.color};">${bus.route}</span>
                            <span class="bus-info-text">${bus.dir} 📍${bus.stop}</span>
                        </div>
                        <div class="bus-times">
                `;

                if (validEtas.length > 0) {
                    const timeStrings = validEtas.map(etaDate => {
                        const h = String(etaDate.getHours()).padStart(2, '0');
                        const m = String(etaDate.getMinutes()).padStart(2, '0');
                        const diffMs = etaDate - now;
                        const diffMins = Math.floor(diffMs / 60000);
                        
                        // 判斷是否少於 10 分鐘，套用芒果黃色
                        const colorClass = diffMins < 10 ? 'text-mango' : 'text-white';
                        return `${h}:${m}(<span class="${colorClass}">${diffMins}分鐘</span>)`;
                    });
                    htmlContent += timeStrings.join(' | ');
                } else {
                    htmlContent += '<span class="text-white">暫無班次資料</span>';
                }
                htmlContent += `</div></div>`;
            } catch (error) {
                console.error(`Error fetching bus ${bus.route}:`, error);
                htmlContent += `
                    <div class="bus-route">
                        <div class="bus-header">
                            <span class="bus-badge" style="background-color: ${bus.color};">${bus.route}</span>
                            <span class="bus-info-text">${bus.dir} 📍${bus.stop}</span>
                        </div>
                        <div class="bus-times"><span class="text-dark-gray">讀取失敗</span></div>
                    </div>`;
            }
        }
        busListEl.innerHTML = htmlContent;
    }

    // ==========================================
    // 4. 天氣資料獲取與渲染
    // ==========================================
    async function updateWeather() {
        try {
            // 獲取現時天氣 (rhrread)
            const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
            const rhrData = await rhrRes.json();
            
            const iconIndex = rhrData.icon[0];
            const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconIndex}.png`;
            const humidity = rhrData.humidity.data[0].value;
            const tsingYiTempData = rhrData.temperature.data.find(d => d.place === '青衣');
            const currentTemp = tsingYiTempData ? tsingYiTempData.value : '--';

            // 獲取預報溫度 (fnd)
            const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
            const fndData = await fndRes.json();
            const minTemp = fndData.weatherForecast[0].forecastMintemp.value;
            const maxTemp = fndData.weatherForecast[0].forecastMaxtemp.value;

            // 渲染天氣數字列 (零縫隙)
            document.getElementById('weather-row-1').innerHTML = `
                <img src="${iconUrl}" class="weather-icon" alt="天氣圖標"> 
                ${currentTemp}°C(青衣)&nbsp;&nbsp;&nbsp;💧${humidity}%
            `;
            document.getElementById('weather-row-2').innerHTML = `
                <span class="temp-low">❄️${minTemp}°C</span>&nbsp;&nbsp;
                <span class="temp-high">☀️${maxTemp}°C</span>
            `;

            // 獲取天氣警告 (warnsum)
            const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
            const warnData = await warnRes.json();
            let warnHtml = '';
            
            // 天文台如果沒有警告，會回傳空物件或不含警告代碼的屬性
            const activeWarnings = Object.keys(warnData).filter(key => warningMap[key]);
            
            if (activeWarnings.length > 0) {
                activeWarnings.forEach(code => {
                    warnHtml += `<div class="warning-badge">${warningMap[code]}</div><br>`;
                });
                document.getElementById('warning-content').innerHTML = warnHtml;
                document.getElementById('warning-content').className = ''; // 移除暗灰色
            } else {
                // 回歸預設狀態
                const defaultWarnKeys = Object.keys(warnData);
                // 檢查是否有未定義的特殊警告 (一般不用，依要求顯示沒有)
                let hasRealWarn = false;
                for(let k in warnData) {
                    if(warnData[k].name) {
                        warnHtml += `<div class="warning-badge">${warnData[k].name}</div><br>`;
                        hasRealWarn = true;
                    }
                }
                
                if(!hasRealWarn) {
                    document.getElementById('warning-content').innerHTML = '現時沒有生效的警告';
                    document.getElementById('warning-content').className = 'text-dark-gray';
                } else {
                    document.getElementById('warning-content').innerHTML = warnHtml;
                    document.getElementById('warning-content').className = '';
                }
            }

            // 獲取特別天氣提示 (swt)
            const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
            const swtData = await swtRes.json();
            
            const tipsEl = document.getElementById('tips-content');
            if (swtData.swt && swtData.swt.length > 0) {
                let tipsHtml = '';
                swtData.swt.forEach((item, index) => {
                    tipsHtml += `${index + 1}. ${item.desc}\n`;
                });
                tipsEl.innerText = tipsHtml.trim();
                tipsEl.className = 'text-white';
                
                // 檢查是否超過 4 行高度以啟動垂直跑馬燈
                setTimeout(() => initTipsMarquee(), 500); 
            } else {
                tipsEl.innerText = '現時沒有特別天氣提示';
                tipsEl.className = 'text-dark-gray';
                cancelTipsMarquee();
            }

        } catch (error) {
            console.error('Weather fetch error:', error);
        }
    }

    // ==========================================
    // 5. 新聞 RSS 獲取與跑馬燈處理
    // ==========================================
    async function updateNews() {
        const newsContentEl = document.getElementById('news-content');
        let allNews = [];

        for (const url of rssUrls) {
            try {
                // 使用 AllOrigins 代理避免 CORS 跨域問題
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const items = xml.querySelectorAll('item title');
                
                items.forEach(item => {
                    // 去除可能包含的 CDATA 或多餘空白
                    const titleText = item.textContent.replace("<![CDATA[", "").replace("]]>", "").trim();
                    if(titleText) allNews.push(titleText);
                });
            } catch (error) {
                console.error('News fetch error:', error);
            }
        }

        if (allNews.length > 0) {
            // 隨機打亂或直接串接，這裡直接以特定分隔符號串接
            const separator = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;🔶&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
            newsContentEl.innerHTML = allNews.join(separator) + separator;
            initNewsMarquee(); // 重啟動畫計算
        } else {
            newsContentEl.innerText = '暫時無法獲取新聞';
        }
    }

    // ==========================================
    // 6. 絲滑跑馬燈核心引擎 (支援觸控拖曳)
    // ==========================================

    // --- 水平新聞跑馬燈 ---
    let newsAnimId;
    let newsX = window.innerWidth;
    let isNewsTouching = false;
    let newsLastTouchX = 0;
    let newsResumeTimeout;

    function animateNews() {
        const el = document.getElementById('news-content');
        if (!isNewsTouching) {
            newsX -= 1.5; // 滾動速度，數值越大越快
            const contentWidth = el.offsetWidth;
            // 當整條新聞滾出左側邊界，從右側重新出現
            if (newsX < -contentWidth) {
                newsX = window.innerWidth;
            }
            el.style.transform = `translateX(${newsX}px)`;
        }
        newsAnimId = requestAnimationFrame(animateNews);
    }

    function initNewsMarquee() {
        cancelAnimationFrame(newsAnimId);
        newsX = window.innerWidth; // 從最右側開始
        animateNews();
    }

    // 新聞觸控事件監聽
    const newsBar = document.getElementById('news-bar');
    newsBar.addEventListener('touchstart', (e) => {
        isNewsTouching = true;
        clearTimeout(newsResumeTimeout);
        newsLastTouchX = e.touches[0].clientX;
    }, {passive: true});

    newsBar.addEventListener('touchmove', (e) => {
        if (!isNewsTouching) return;
        const deltaX = e.touches[0].clientX - newsLastTouchX;
        newsX += deltaX;
        document.getElementById('news-content').style.transform = `translateX(${newsX}px)`;
        newsLastTouchX = e.touches[0].clientX;
    }, {passive: true});

    newsBar.addEventListener('touchend', () => {
        clearTimeout(newsResumeTimeout);
        // 放開手後，等待 1 秒鐘繼續滾動
        newsResumeTimeout = setTimeout(() => {
            isNewsTouching = false;
        }, 1000);
    });

    // --- 垂直特別天氣提示跑馬燈 ---
    let tipsAnimId;
    let tipsY = 0;
    let isTipsTouching = false;
    let tipsLastTouchY = 0;
    let tipsResumeTimeout;
    let tipsNeedsMarquee = false;

    function animateTips() {
        if(!tipsNeedsMarquee) return;
        const el = document.getElementById('tips-content');
        const containerHeight = document.getElementById('tips-container').offsetHeight;
        
        if (!isTipsTouching) {
            tipsY -= 0.5; // 垂直滾動速度較慢
            const contentHeight = el.scrollHeight;
            // 滾到最上方後，從底下重新出現
            if (tipsY < -contentHeight) {
                tipsY = containerHeight;
            }
            el.style.transform = `translateY(${tipsY}px)`;
        }
        tipsAnimId = requestAnimationFrame(animateTips);
    }

    function initTipsMarquee() {
        const el = document.getElementById('tips-content');
        const container = document.getElementById('tips-container');
        cancelAnimationFrame(tipsAnimId);
        
        // 判斷實際高度是否超過容器 (大約4行的高度)
        if (el.scrollHeight > container.offsetHeight) {
            tipsNeedsMarquee = true;
            tipsY = container.offsetHeight; // 從底部浮現
            animateTips();
        } else {
            tipsNeedsMarquee = false;
            el.style.transform = `translateY(0px)`;
        }
    }

    function cancelTipsMarquee() {
        tipsNeedsMarquee = false;
        cancelAnimationFrame(tipsAnimId);
        document.getElementById('tips-content').style.transform = `translateY(0px)`;
    }

    // 天氣提示觸控事件監聽
    const tipsContainer = document.getElementById('tips-container');
    tipsContainer.addEventListener('touchstart', (e) => {
        if(!tipsNeedsMarquee) return;
        isTipsTouching = true;
        clearTimeout(tipsResumeTimeout);
        tipsLastTouchY = e.touches[0].clientY;
        // 阻止預設事件，避免干擾整個右欄的捲動
        e.stopPropagation(); 
    }, {passive: true});

    tipsContainer.addEventListener('touchmove', (e) => {
        if (!isTipsTouching || !tipsNeedsMarquee) return;
        const deltaY = e.touches[0].clientY - tipsLastTouchY;
        tipsY += deltaY;
        document.getElementById('tips-content').style.transform = `translateY(${tipsY}px)`;
        tipsLastTouchY = e.touches[0].clientY;
        e.stopPropagation();
    }, {passive: true});

    tipsContainer.addEventListener('touchend', () => {
        if(!tipsNeedsMarquee) return;
        clearTimeout(tipsResumeTimeout);
        tipsResumeTimeout = setTimeout(() => {
            isTipsTouching = false;
        }, 1000);
    });


    // ==========================================
    // 7. 初始化與定時更新排程
    // ==========================================
    
    // 立即執行一次
    updateClock();
    updateBuses();
    updateWeather();
    updateNews();

    // 時鐘每 1 秒更新
    setInterval(updateClock, 1000);

    // 巴士與天氣每 30 秒更新
    setInterval(() => {
        updateBuses();
        updateWeather();
    }, 30000);

    // 新聞每 5 分鐘更新 (300000 ms)
    setInterval(updateNews, 300000);

</script>
</body>
</html>
