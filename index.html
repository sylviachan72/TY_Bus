<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資訊儀表板</title>
  <style>
    /* 全局樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: "PingFang HK", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
      overflow: hidden; /* 防止全頁滾動 */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部最後更新時間欄 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      padding: 6px 16px;
      background-color: #111111;
      border-bottom: 1px solid #222222;
      font-size: 20px;
      color: #FFFFFF;
      font-weight: bold;
    }
    .top-bar-item {
      width: 50%;
      text-align: center;
    }

    /* 主要內容區域 (左右兩欄) */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding-bottom: 60px; /* 為底部走馬燈留出空間 */
    }

    /* 隱藏滾動條，但保留滾動功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 左欄：巴士資訊 */
    .left-panel {
      width: 50%;
      border-right: 1px solid #333333;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .bus-card {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222222;
    }

    .bus-header {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .bus-tag {
      font-size: 34px;
      font-weight: bold;
      color: #FFFFFF;
      padding: 2px 12px;
      border-radius: 12px;
      margin-right: 10px;
      display: inline-block;
    }

    /* 巴士路線指定標籤背景色 */
    .tag-249x { background-color: #0052CC; } /* 寶藍色 */
    .tag-42a  { background-color: #007A33; } /* 正綠色 */
    .tag-43   { background-color: #C64B00; } /* 深橙色 */
    .tag-49m  { background-color: #6B238E; } /* 深紫色 */
    .tag-68e  { background-color: #006666; } /* 天青色 */
    .tag-243m { background-color: #5C3A21; } /* 深朱古力色 */

    .bus-info {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: bold;
    }

    .bus-eta-container {
      font-size: 32px;
      font-weight: bold;
      line-height: 1.3;
      word-break: break-word;
    }

    .time-white { color: #FFFFFF; }
    .time-yellow { color: #FFC107; } /* 芒果黃 */

    /* 右欄：時間與天氣 */
    .right-panel {
      width: 50%;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .clock-section {
      text-align: center;
      margin-bottom: 2px;
    }

    .clock-time {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1.0;
    }

    .clock-ampm {
      font-size: 40px;
      color: #FFFFFF;
      margin-right: 12px;
      font-weight: bold;
    }

    .clock-hhmm {
      font-size: 100px;
      color: #FFFFFF;
      font-weight: bold;
    }

    .clock-date {
      font-size: 30px;
      color: #FFFFFF;
      margin-top: -5px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    /* 天氣數據列 */
    .weather-data-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .weather-row-1 {
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      line-height: 1.1;
    }

    .weather-icon {
      width: 45px;
      height: 45px;
      vertical-align: middle;
    }

    .weather-row-2 {
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      line-height: 1.0;
      margin-top: 0px; /* 零縫隙貼合 */
    }

    .temp-min { color: #4FC3F7; } /* 藍色 */
    .temp-max { color: #FF5252; } /* 紅色 */

    /* 警告標籤區塊 */
    .warnings-container {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .warning-badge {
      background-color: #D32F2F;
      color: #FFFFFF;
      font-size: 30px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .no-data-text {
      color: #888888;
      font-size: 30px;
      width: 100%;
      text-align: left;
    }

    /* 特別天氣提示垂直走馬燈 */
    .swt-container {
      width: 100%;
      text-align: left;
      font-size: 30px;
      font-weight: bold;
      height: 160px; /* 約可顯示4行 */
      overflow: hidden;
      position: relative;
    }

    .swt-marquee-content {
      position: absolute;
      width: 100%;
      animation: marqueeUp 25s linear infinite;
    }

    .swt-marquee-content:hover {
      animation-play-state: paused;
    }

    @keyframes marqueeUp {
      0% { top: 100%; }
      100% { top: -100%; }
    }

    .swt-item {
      margin-bottom: 8px;
      line-height: 1.3;
    }

    /* 底部新聞走馬燈 */
    .news-ticker-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #000000;
      border-top: 2px solid #333333;
      display: flex;
      align-items: center;
      z-index: 100;
      overflow: hidden;
    }

    .news-label {
      background-color: #E53935;
      color: #FFFFFF;
      font-size: 45px;
      font-weight: bold;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 10;
    }

    .news-marquee-container {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .news-marquee-content {
      display: inline-block;
      white-space: nowrap;
      font-size: 45px;
      font-weight: bold;
      animation: marqueeLeft 65s linear infinite; /* 極慢速 */
      padding-left: 100%;
    }

    @keyframes marqueeLeft {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    .news-separator {
      color: #FFD700; /* 金黃色 */
      margin: 0 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 頂部自動刷新時間 -->
  <div class="top-bar">
    <div class="top-bar-item" id="bus-update-time">最後更新：--:--:--（每30秒自動刷新）</div>
    <div class="top-bar-item" id="weather-update-time">最後更新：--:--:--（每5分鐘自動刷新）</div>
  </div>

  <!-- 主要內容區 -->
  <div class="main-content">
    
    <!-- 左欄：巴士實時資訊 -->
    <div class="left-panel no-scrollbar" id="bus-list">
      <!-- 由 JavaScript 動態生成 7 條路線 -->
    </div>

    <!-- 右欄：時間與天氣 -->
    <div class="right-panel no-scrollbar">
      
      <!-- 時間與日期 -->
      <div class="clock-section">
        <div class="clock-time">
          <span class="clock-ampm" id="clock-ampm">上午</span>
          <span class="clock-hhmm" id="clock-hhmm">08:34</span>
        </div>
        <div class="clock-date" id="clock-date">2026年7月25日 星期六</div>
      </div>

      <!-- 天氣數據區塊 -->
      <div class="weather-data-container">
        <div class="weather-row-1">
          <img id="wx-icon" class="weather-icon" src="" alt="天氣圖標" style="display:none;">
          <span id="tsing-yi-temp">--°C(青衣)</span>
          <span id="humidity">💧--%</span>
        </div>
        <div class="weather-row-2">
          <span>❄️ <span id="temp-min" class="temp-min">--°C</span></span>
          <span>☀️ <span id="temp-max" class="temp-max">--°C</span></span>
        </div>
      </div>

      <!-- 天氣警告 -->
      <div class="warnings-container" id="warnings-box">
        <div class="no-data-text">現時沒有生效的警告</div>
      </div>

      <hr style="width: 100%; border: 0.5px solid #222; margin: 6px 0;">

      <!-- 特別天氣提示 -->
      <div class="swt-container" id="swt-box">
        <div class="no-data-text">現時沒有特別天氣提示</div>
      </div>

    </div>
  </div>

  <!-- 底部即時新聞跑馬燈 -->
  <div class="news-ticker-bar">
    <div class="news-label">即時新聞</div>
    <div class="news-marquee-container">
      <div class="news-marquee-content" id="news-content">
        正在加載即時新聞...
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. 配置與路線清單
    // ----------------------------------------------------
    const BUS_ROUTES = [
      {
        id: '249X',
        tagClass: 'tag-249x',
        dir: '往博康',
        stop: '📍青桃樓',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1'
      },
      {
        id: '42A',
        tagClass: 'tag-42a',
        dir: '往西九龍',
        stop: '📍青桃樓',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1'
      },
      {
        id: '43',
        tagClass: 'tag-43',
        dir: '往荃灣西',
        stop: '📍青桃樓',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1'
      },
      {
        id: '49M',
        tagClass: 'tag-49m',
        dir: '往青衣站',
        stop: '📍青富苑',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1'
      },
      {
        id: '49M',
        tagClass: 'tag-49m',
        dir: '往青富苑',
        stop: '📍青衣站',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1'
      },
      {
        id: '68E',
        tagClass: 'tag-68e',
        dir: '往元朗',
        stop: '📍青衣站',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1'
      },
      {
        id: '243M',
        tagClass: 'tag-243m',
        dir: '往荃灣',
        stop: '📍美景花園',
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1'
      }
    ];

    // 天氣警告代碼映射表
    const WARNING_MAP = {
      'WFIREY': '黃色火災危險警告',
      'WFIRER': '紅色火災危險警告',
      'WRAINA': '黃色暴雨警告信號',
      'WRAINR': '紅色暴雨警告信號',
      'WRAINB': '黑色暴雨警告信號',
      'TC1': '一號戒備信號',
      'TC3': '三號強風信號',
      'TC8NE': '八號東北烈風或暴風信號',
      'TC8SE': '八號東南烈風或暴風信號',
      'TC8SW': '八號西南烈風或暴風信號',
      'TC8NW': '八號西北烈風或暴風信號',
      'TC9': '九號烈風或暴風風力增強信號',
      'TC10': '十號颶風信號',
      'CANCEL': '取消所有熱帶氣旋警告信號'
    };

    // ----------------------------------------------------
    // 2. 時鐘與日期更新
    // ----------------------------------------------------
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? '下午' : '上午';
      
      hours = hours % 12;
      hours = hours ? hours : 12; // 0點轉為12點
      
      document.getElementById('clock-ampm').textContent = ampm;
      document.getElementById('clock-hhmm').textContent = `${hours}:${minutes}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = weekDays[now.getDay()];

      document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${dayName}`;
    }

    function get24HourTimeString() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    // ----------------------------------------------------
    // 3. 巴士 ETA 數據獲取與渲染
    // ----------------------------------------------------
    async function fetchBusData() {
      const busListContainer = document.getElementById('bus-list');
      busListContainer.innerHTML = '';

      for (const route of BUS_ROUTES) {
        try {
          const res = await fetch(route.url);
          const json = await res.json();
          const etas = json.data || [];

          // 過濾非空的 eta，並按時間排序取前 3 個
          const validEtas = etas
            .filter(item => item.eta)
            .slice(0, 3);

          let etaHtmlArr = [];
          const now = new Date();

          validEtas.forEach(item => {
            const etaTime = new Date(item.eta);
            const diffMin = Math.round((etaTime - now) / 60000);

            if (diffMin >= 0) {
              const hh = String(etaTime.getHours()).padStart(2, '0');
              const mm = String(etaTime.getMinutes()).padStart(2, '0');
              const timeStr = `${hh}:${mm}`;

              // 倒數 < 10 分鐘，時間為芒果黃，否則白色
              const colorClass = diffMin < 10 ? 'time-yellow' : 'time-white';
              etaHtmlArr.push(`<span class="time-white">${timeStr}</span>(<span class="${colorClass}">${diffMin}分鐘</span>)`);
            }
          });

          let etaDisplay = etaHtmlArr.join(' | ');
          if (!etaDisplay) {
            etaDisplay = '<span class="time-white">暫無班次資料</span>';
          }

          const card = document.createElement('div');
          card.className = 'bus-card';
          card.innerHTML = `
            <div class="bus-header">
              <span class="bus-tag ${route.tagClass}">${route.id}</span>
              <span class="bus-info">${route.dir} ${route.stop}</span>
            </div>
            <div class="bus-eta-container">
              ${etaDisplay}
            </div>
          `;
          busListContainer.appendChild(card);

        } catch (e) {
          console.error(`獲取巴士 ${route.id} 資料失敗:`, e);
        }
      }

      document.getElementById('bus-update-time').textContent = `最後更新：${get24HourTimeString()}（每30秒自動刷新）`;
    }

    // ----------------------------------------------------
    // 4. 天氣數據獲取與渲染
    // ----------------------------------------------------
    async function fetchWeatherData() {
      try {
        // 4.1 現時天氣報告 (rhrread)
        const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const rhrData = await rhrRes.json();

        // 青衣現時溫度
        const tsingYiData = rhrData.temperature.data.find(t => t.place === '青衣');
        if (tsingYiData) {
          document.getElementById('tsing-yi-temp').textContent = `${tsingYiData.value}°C(青衣)`;
        }

        // 濕度
        if (rhrData.humidity && rhrData.humidity.data.length > 0) {
          document.getElementById('humidity').textContent = `💧${rhrData.humidity.data[0].value}%`;
        }

        // 透明線條版天氣圖標 (HKOWxIconOutline)
        if (rhrData.icon && rhrData.icon.length > 0) {
          const iconCode = rhrData.icon[0];
          const iconImg = document.getElementById('wx-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
          iconImg.style.display = 'inline-block';
        }

        // 4.2 今日預測最高/最低溫度 (fnd)
        const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const fndData = await fndRes.json();
        if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          const todayForecast = fndData.weatherForecast[0];
          document.getElementById('temp-min').textContent = `${todayForecast.forecastMintemp.value}°C`;
          document.getElementById('temp-max').textContent = `${todayForecast.forecastMaxtemp.value}°C`;
        }

        // 4.3 天氣警告摘要 (warnsum)
        const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const warnData = await warnRes.json();
        const warningsBox = document.getElementById('warnings-box');
        warningsBox.innerHTML = '';

        let hasWarning = false;
        if (warnData && Object.keys(warnData).length > 0) {
          for (const key in warnData) {
            const item = warnData[key];
            let code = item.code || key;
            if (item.actionCode && item.actionCode !== 'CANCEL') {
              let warnName = WARNING_MAP[code] || item.name || code;
              const badge = document.createElement('div');
              badge.className = 'warning-badge';
              badge.textContent = warnName;
              warningsBox.appendChild(badge);
              hasWarning = true;
            }
          }
        }

        if (!hasWarning) {
          warningsBox.innerHTML = '<div class="no-data-text">現時沒有生效的警告</div>';
        }

        // 4.4 特別天氣提示 (swt)
        const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
        const swtData = await swtRes.json();
        const swtBox = document.getElementById('swt-box');
        swtBox.innerHTML = '';

        if (swtData.swt && swtData.swt.length > 0) {
          const marqueeContent = document.createElement('div');
          marqueeContent.className = 'swt-marquee-content';

          swtData.swt.forEach((item, index) => {
            const swtDiv = document.createElement('div');
            swtDiv.className = 'swt-item';
            swtDiv.textContent = `${index + 1}. ${item.desc}`;
            marqueeContent.appendChild(swtDiv);
          });

          swtBox.appendChild(marqueeContent);
        } else {
          swtBox.innerHTML = '<div class="no-data-text">現時沒有特別天氣提示</div>';
        }

        document.getElementById('weather-update-time').textContent = `最後更新：${get24HourTimeString()}（每5分鐘自動刷新）`;

      } catch (e) {
        console.error('獲取天氣資料失敗:', e);
      }
    }

    // ----------------------------------------------------
    // 5. 明報即時新聞 RSS 獲取與渲染
    // ----------------------------------------------------
    async function fetchMingPaoNews() {
      const newsContent = document.getElementById('news-content');
      const rssUrl = 'https://news.mingpao.com/rss/ins/all.xml';
      
      // 使用 AllOrigins CORS Proxy 解析 XML
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        if (data.contents) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(data.contents, 'text/xml');
          const items = xmlDoc.querySelectorAll('item');

          let newsArr = [];
          items.forEach((item, index) => {
            const title = item.querySelector('title')?.textContent || '';
            if (title) {
              // 編號 + 新聞標題
              newsArr.push(`${index + 1}. ${title.trim()}`);
            }
          });

          if (newsArr.length > 0) {
            // 使用厚垂直線 │ 作為分隔符號
            const separator = `<span class="news-separator">│</span>`;
            newsContent.innerHTML = newsArr.join(separator);
          } else {
            newsContent.textContent = '現時沒有即時新聞';
          }
        }
      } catch (e) {
        console.error('獲取新聞 RSS 失敗:', e);
        newsContent.textContent = '即時新聞更新中...';
      }
    }

    // ----------------------------------------------------
    // 6. 初始化與計時器設定
    // ----------------------------------------------------
    function init() {
      // 立即更新一次
      updateClock();
      fetchBusData();
      fetchWeatherData();
      fetchMingPaoNews();

      // 時間秒針更新 (每秒)
      setInterval(updateClock, 1000);

      // 巴士數據與畫面更新 (每30秒)
      setInterval(fetchBusData, 30000);

      // 天氣與新聞更新 (每5分鐘 = 300000毫秒)
      setInterval(() => {
        fetchWeatherData();
        fetchMingPaoNews();
      }, 300000);
    }

    // 頁面加載完畢後執行
    window.onload = init;
  </script>
</body>
</html>
