<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資訊</title>
  <style>
    /* 全局與重置樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部最後更新時間列 (20px) */
    .top-bar {
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      background-color: #000000;
      font-size: 20px;
      color: #FFFFFF;
      border-bottom: 1px solid #222222;
      flex-shrink: 0;
    }

    /* 主體左右 50% 佈局 */
    .main-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 36px - 70px);
      overflow: hidden;
    }

    /* 左右欄位設定 (隱藏滾動條，支援隱藏滑動) */
    .column-left, .column-right {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      padding: 10px 15px;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    .column-left::-webkit-scrollbar, .column-right::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .column-left {
      border-right: 1px solid #333333;
    }

    /* 巴士路線項目 */
    .bus-item {
      padding: 8px 0;
      border-bottom: 1px solid #222222;
    }
    .bus-item:last-child {
      border-bottom: none;
    }

    .bus-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 4px;
    }

    /* 巴士路線號碼圓角標籤 (34px) */
    .bus-badge {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 12px;
      font-size: 34px;
      font-weight: bold;
      color: #FFFFFF;
      line-height: 1.2;
    }

    /* 各路線指定標籤顏色 */
    .badge-249x { background-color: #0052CC; } /* 寶藍色 */
    .badge-42a  { background-color: #007A33; } /* 正綠色 */
    .badge-43   { background-color: #C64B00; } /* 深橙色 */
    .badge-49m  { background-color: #6B238E; } /* 深紫色 */
    .badge-68e  { background-color: #006666; } /* 深松綠 */
    .badge-243m { background-color: #5C3A21; } /* 深朱古力色 */

    .bus-title {
      font-size: 34px;
      font-weight: bold;
      color: #FFFFFF;
    }

    /* 巴士時間區塊 (32px) */
    .bus-times-container {
      font-size: 32px;
      color: #FFFFFF;
      line-height: 1.3;
      word-break: break-word;
    }

    .bus-time-group {
      display: inline-block;
      white-space: nowrap;
    }

    .time-val {
      color: #FFFFFF;
    }

    .countdown-urgent {
      color: #FFC107; /* 芒果黃 (少於 10 分鐘) */
      font-weight: bold;
    }

    .countdown-normal {
      color: #FFFFFF; /* 白色 (10 分鐘或以上) */
    }

    .time-separator {
      color: #888888;
      margin: 0 4px;
    }

    /* 右欄天氣與時間設定 (置中，極致緊湊) */
    .column-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .clock-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0px;
    }

    .time-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
    }

    /* 上下午 (40px) */
    .ampm-text {
      font-size: 40px;
      color: #FFFFFF;
      margin-right: 15px;
      font-weight: bold;
    }

    /* 現在時間 (100px) */
    .time-text {
      font-size: 100px;
      font-weight: bold;
      color: #FFFFFF;
      letter-spacing: -2px;
    }

    /* 日期 (30px)，極致貼近時間 */
    .date-text {
      font-size: 30px;
      color: #FFFFFF;
      margin-top: -6px;
      margin-bottom: 10px;
    }

    /* 天氣區塊 */
    .weather-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 天氣第一行：圖標、溫濕度 (32px) */
    .weather-row-1 {
      font-size: 32px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      line-height: 1.1;
      margin-bottom: 0px; /* 零縫隙 */
    }

    .weather-icon-img {
      height: 42px;
      width: auto;
      vertical-align: middle;
    }

    /* 天氣第二行：高低溫 (32px)，零縫隙貼合第一行 */
    .weather-row-2 {
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      line-height: 1.1;
      margin-top: 0px; /* 零縫隙 */
      margin-bottom: 12px;
    }

    .temp-min {
      color: #448AFF; /* 藍色 (最低溫) */
      font-weight: bold;
    }

    .temp-max {
      color: #FF5252; /* 紅色 (最高溫) */
      font-weight: bold;
    }

    /* 天氣警告 (30px，紅色圓角) */
    .warnings-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
    }

    .warning-badge {
      background-color: #CC0000;
      color: #FFFFFF;
      font-size: 30px;
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 12px;
      display: inline-block;
    }

    .no-warning-text {
      font-size: 30px;
      color: #666666; /* 較暗灰色 */
      margin-bottom: 12px;
    }

    /* 特別天氣提示 (30px，靠左對齊) */
    .swt-section {
      width: 100%;
      text-align: left;
      padding: 0 10px;
    }

    .swt-container {
      font-size: 30px;
      color: #FFFFFF;
      line-height: 1.4;
      max-height: 170px; /* 約4行高度 */
      overflow: hidden;
      position: relative;
    }

    .swt-marquee-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .swt-item {
      word-break: break-word;
    }

    .no-swt-text {
      font-size: 30px;
      color: #666666; /* 較暗灰色 */
      text-align: center;
    }

    /* 特別天氣提示：慢速從下往上跑馬燈動畫 */
    @keyframes verticalMarquee {
      0% { transform: translateY(0%); }
      100% { transform: translateY(-50%); }
    }

    .swt-animate {
      animation: verticalMarquee 30s linear infinite;
    }

    /* 底部即時新聞跑馬燈 (45px) */
    .bottom-news-bar {
      height: 70px;
      background-color: #111111;
      display: flex;
      align-items: center;
      border-top: 2px solid #333333;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .news-label {
      background-color: #D32F2F;
      color: #FFFFFF;
      font-size: 45px;
      font-weight: bold;
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      z-index: 10;
      flex-shrink: 0;
    }

    .news-ticker-wrap {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    /* 慢速跑馬燈方便長者閱讀 */
    .news-ticker-content {
      display: inline-block;
      white-space: nowrap;
      font-size: 45px;
      color: #FFFFFF;
      padding-left: 100%;
      animation: newsMarquee 180s linear infinite;
    }

    @keyframes newsMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .news-item-sep {
      color: #FFC107;
      margin: 0 20px;
    }
  </style>
</head>
<body>

  <!-- 頂部最後更新時間 -->
  <div class="top-bar">
    <div id="bus-update-time">最後更新：--:--:--（每30秒自動刷新）</div>
    <div id="weather-update-time">最後更新：--:--:--（每5分鐘自動刷新）</div>
  </div>

  <!-- 主區塊 (左右各半 50%) -->
  <div class="main-container">

    <!-- 左欄：巴士實時報站資訊 -->
    <div class="column-left" id="bus-container">
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-249x">249X</span><span class="bus-title">往博康 📍青桃樓</span></div><div class="bus-times-container" id="times-249x">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-42a">42A</span><span class="bus-title">往西九龍 📍青桃樓</span></div><div class="bus-times-container" id="times-42a">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-43">43</span><span class="bus-title">往荃灣西 📍青桃樓</span></div><div class="bus-times-container" id="times-43">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-49m">49M</span><span class="bus-title">往青衣站 📍青富苑</span></div><div class="bus-times-container" id="times-49m-tsingyi">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-49m">49M</span><span class="bus-title">往青富苑 📍青衣站</span></div><div class="bus-times-container" id="times-49m-chingfu">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-68e">68E</span><span class="bus-title">往元朗 📍青衣站</span></div><div class="bus-times-container" id="times-68e">載入中...</div></div>
      <div class="bus-item"><div class="bus-header"><span class="bus-badge badge-243m">243M</span><span class="bus-title">往荃灣 📍美景花園</span></div><div class="bus-times-container" id="times-243m">載入中...</div></div>
    </div>

    <!-- 右欄：天氣與時間 -->
    <div class="column-right">
      <div class="clock-section">
        <div class="time-row"><span class="ampm-text" id="clock-ampm">上午</span><span class="time-text" id="clock-time">00:00</span></div>
        <div class="date-text" id="clock-date">----年--月--日 星期-</div>
      </div>
      <div class="weather-section">
        <div class="weather-row-1">
          <img id="weather-icon" class="weather-icon-img" src="" alt="天氣圖標" style="display:none;">
          <span id="weather-tsingyi-temp">--°C(青衣)</span>
          <span id="weather-humidity">💧--%</span>
        </div>
        <div class="weather-row-2">
          <span class="temp-min" id="weather-min-temp">❄️--°C</span>
          <span class="temp-max" id="weather-max-temp">☀️--°C</span>
        </div>
      </div>
      <!-- 天氣警告 -->
      <div id="warnings-area" class="warnings-container">
        <div class="no-warning-text">現時沒有生效的警告</div>
      </div>
      <!-- 特別天氣提示 -->
      <div class="swt-section">
        <div class="swt-container" id="swt-container">
          <div class="no-swt-text" id="no-swt-msg">現時沒有特別天氣提示</div>
          <div class="swt-marquee-content" id="swt-list"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部明報即時新聞橫向跑馬燈 -->
  <div class="bottom-news-bar">
    <div class="news-label">即時新聞</div>
    <div class="news-ticker-wrap">
      <div class="news-ticker-content" id="news-content">載入明報即時新聞中...</div>
    </div>
  </div>

  <script>
    // 7 條巴士路線 API 設定
    const BUS_CONFIGS = [
      { id: 'times-249x', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', filter: (item) => item.dir === 'O' || (item.dest_tc && item.dest_tc.includes('博康')) },
      { id: 'times-42a', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', filter: (item) => item.dir === 'O' || (item.dest_tc && item.dest_tc.includes('西九龍')) },
      { id: 'times-43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', filter: (item) => item.dir === 'I' || (item.dest_tc && item.dest_tc.includes('荃灣西')) },
      { id: 'times-49m-tsingyi', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', filter: (item) => item.dest_tc && item.dest_tc.includes('青衣站') },
      { id: 'times-49m-chingfu', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', filter: (item) => item.dest_tc && item.dest_tc.includes('青富苑') },
      { id: 'times-68e', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', filter: (item) => item.dest_tc && item.dest_tc.includes('元朗') },
      { id: 'times-243m', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', filter: (item) => item.dest_tc && item.dest_tc.includes('荃灣') }
    ];

    // 天氣警告子類別名稱對應表
    const WEATHER_WARN_MAP = {
      'WFIREY': '黃色火災危險警告',
      'WFIRER': '紅色火災危險警告',
      'WRAINA': '黃色暴雨警告信號',
      'WRAINR': '紅色暴雨警告信號',
      'WRAINB': '黑色暴雨警告信號',
      'TC1': '一號戒備信號',
      'TC3': '三號強風信號',
      'TC8NE': '八號東北烈風或暴風信號',
      'TC8SE': '八號東南烈風或暴風信號',
      'TC8SW': '八號西南烈風或暴風信號',
      'TC8NW': '八號西北烈風或暴風信號',
      'TC9': '九號烈風或暴風風力增強信號',
      'TC10': '十號颶風信號',
      'CANCEL': '取消所有熱帶氣旋警告信號'
    };

    function get24hTimeString(date = new Date()) {
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      const ss = String(date.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const ampm = hours >= 12 ? '下午' : '上午';
      let h12 = hours % 12;
      if (h12 === 0) h12 = 12;

      const minutes = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('clock-ampm').textContent = ampm;
      document.getElementById('clock-time').textContent = `${h12}:${minutes}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = days[now.getDay()];

      document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${dayName}`;
    }

    async function fetchBusData() {
      const now = new Date();
      for (const config of BUS_CONFIGS) {
        const el = document.getElementById(config.id);
        try {
          const res = await fetch(config.url);
          const json = await res.json();
          if (!json.data || !Array.isArray(json.data)) {
            el.textContent = '暫無數據';
            continue;
          }
          let list = json.data.filter(item => item.eta && config.filter(item));
          if (list.length === 0) list = json.data.filter(item => item.eta);
          
          list.sort((a, b) => new Date(a.eta) - new Date(b.eta));
          const top3 = list.slice(0, 3);

          if (top3.length === 0) {
            el.textContent = '現時沒有預計班次';
            continue;
          }

          const htmlParts = top3.map((item) => {
            const etaDate = new Date(item.eta);
            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            const diffMins = Math.max(0, Math.round((etaDate - now) / 60000));
            const countdownClass = diffMins < 10 ? 'countdown-urgent' : 'countdown-normal';
            return `<span class="bus-time-group"><span class="time-val">${hh}:${mm}</span><span class="${countdownClass}">(${diffMins}分鐘)</span></span>`;
          });
          el.innerHTML = htmlParts.join('<span class="time-separator">|</span>');
        } catch (err) {
          el.textContent = '資料載入失敗';
        }
      }
      document.getElementById('bus-update-time').textContent = `最後更新：${get24hTimeString()}（每30秒自動刷新）`;
    }

    async function fetchWeatherData() {
      try {
        // 1. 實時天氣
        const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const rhrData = await rhrRes.json();
        if (rhrData.icon && rhrData.icon.length > 0) {
          const iconImg = document.getElementById('weather-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rhrData.icon[0]}.png`;
          iconImg.style.display = 'inline-block';
        }

        let tsingYiTemp = null;
        if (rhrData.temperature && rhrData.temperature.data) {
          const tyItem = rhrData.temperature.data.find(i => i.place && i.place.includes('青衣'));
          if (tyItem) tsingYiTemp = tyItem.value;
        }
        if (tsingYiTemp !== null) document.getElementById('weather-tsingyi-temp').textContent = `${tsingYiTemp}°C(青衣)`;

        if (rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
          document.getElementById('weather-humidity').textContent = `💧${rhrData.humidity.data[0].value}%`;
        }

        // 2. 天氣預報
        const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const fndData = await fndRes.json();
        if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          document.getElementById('weather-min-temp').textContent = `❄️${fndData.weatherForecast[0].forecastMintemp.value}°C`;
          document.getElementById('weather-max-temp').textContent = `☀️${fndData.weatherForecast[0].forecastMaxtemp.value}°C`;
        }

        // 3. 天氣警告 (套用子類別名稱表)
        const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const warnData = await warnRes.json();
        const warnArea = document.getElementById('warnings-area');
        warnArea.innerHTML = '';
        const warningKeys = Object.keys(warnData);
        
        if (warningKeys.length === 0) {
          warnArea.innerHTML = '<div class="no-warning-text">現時沒有生效的警告</div>';
        } else {
          warningKeys.forEach(key => {
            const w = warnData[key];
            if (w) {
              const displayName = (w.code && WEATHER_WARN_MAP[w.code]) ? WEATHER_WARN_MAP[w.code] : w.name;
              const badge = document.createElement('div');
              badge.className = 'warning-badge';
              badge.textContent = displayName;
              warnArea.appendChild(badge);
            }
          });
        }

        // 4. 特別天氣提示
        const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
        const swtData = await swtRes.json();
        const noSwtMsg = document.getElementById('no-swt-msg');
        const swtList = document.getElementById('swt-list');
        swtList.innerHTML = '';

        if (swtData.swt && swtData.swt.length > 0) {
          noSwtMsg.style.display = 'none';
          let swtItemsHTML = '';
          swtData.swt.forEach((item, index) => {
            if (item.desc) swtItemsHTML += `<div class="swt-item">${index + 1}. ${item.desc}</div>`;
          });
          swtList.innerHTML = swtItemsHTML;
          if (swtData.swt.length >= 4) {
            swtList.innerHTML += swtItemsHTML;
            swtList.classList.add('swt-animate');
          } else {
            swtList.classList.remove('swt-animate');
          }
        } else {
          noSwtMsg.style.display = 'block';
        }
      } catch (err) {
        console.error('Error fetching weather:', err);
      }
      document.getElementById('weather-update-time').textContent = `最後更新：${get24hTimeString()}（每5分鐘自動刷新）`;
    }

    // 抓取明報全部即時新聞 (使用 raw 代理繞過限制，並篩選今天及昨天)
    async function fetchNewsData() {
      const newsContent = document.getElementById('news-content');
      const rssUrl = 'https://news.mingpao.com/rss/ins/all.xml';
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('Network response was not ok');
        const xmlText = await res.text();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.querySelectorAll("item");
        
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        let headlines = [];
        
        items.forEach(item => {
          const titleNode = item.querySelector("title");
          const dateNode = item.querySelector("pubDate");
          
          if (titleNode && dateNode) {
            const pubDate = new Date(dateNode.textContent);
            const itemDate = new Date(pubDate.getFullYear(), pubDate.getMonth(), pubDate.getDate());
            
            if (itemDate.getTime() === today.getTime() || itemDate.getTime() === yesterday.getTime()) {
              headlines.push(titleNode.textContent);
            }
          }
        });

        if (headlines.length === 0 && items.length > 0) {
          for (let i = 0; i < Math.min(30, items.length); i++) {
            const titleNode = items[i].querySelector("title");
            if (titleNode) headlines.push(titleNode.textContent);
          }
        }

        if (headlines.length > 0) {
          const fullMarqueeText = headlines.join(' <span class="news-item-sep">⚡</span> ');
          newsContent.innerHTML = `${fullMarqueeText} <span class="news-item-sep">⚡</span> ${fullMarqueeText}`;
        } else {
          newsContent.textContent = '今日及昨日暫無即時新聞';
        }
      } catch (err) {
        console.error('Error fetching RSS news:', err);
        newsContent.textContent = '即時新聞載入中（如持續未顯示請檢查網絡連線）';
      }
    }

    function init() {
      updateClock();
      fetchBusData();
      fetchWeatherData();
      fetchNewsData();

      setInterval(updateClock, 1000);
      setInterval(fetchBusData, 30000);
      setInterval(fetchWeatherData, 300000);
      setInterval(fetchNewsData, 300000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
