<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天氣新聞資訊</title>
    <style>
        /* 基本樣式重置，防止平板出現意外邊界，全面優化觸控體驗 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }

        /* 網頁背景為純黑，高度填滿螢幕且禁止整頁滾動 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部置中更新時間：24小時制，20px，淺灰色 */
        .top-bar {
            text-align: center;
            padding: 4px 0;
            font-size: 20px;
            color: #CCCCCC;
            background-color: #080808;
            border-bottom: 1px solid #222222;
            flex-shrink: 0;
        }

        /* 主要內容區左右 50% 比例分開 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 32px - 65px); 
        }

        /* 左欄：巴士實時資訊 (佔寬 50%) - 支援隱藏式滑動 */
        .left-column {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            border-right: 2px solid #333333;
            padding: 6px;
            scrollbar-width: none; /* 隱藏滾動條 (Firefox) */
            -ms-overflow-style: none; /* 隱藏滾動條 (IE/Edge) */
        }
        .left-column::-webkit-scrollbar {
            display: none; /* 隱藏滾動條 (Chrome/Safari) */
        }

        /* 右欄：天氣與時間 (佔寬 50%) */
        .right-column {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .right-column::-webkit-scrollbar {
            display: none;
        }

        /* 巴士卡片排版：極致緊湊結構壓縮 */
        .bus-card {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 5px 10px;
            margin-bottom: 4px;
        }

        .bus-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 2px;
        }

        /* 巴士號碼：34px，白字，高對比圓角背景 */
        .bus-badge {
            font-size: 34px;
            font-weight: bold;
            color: #FFFFFF;
            padding: 0px 10px;
            border-radius: 10px;
            display: inline-block;
            line-height: 1.1;
        }

        /* 巴士方向與站點名稱：34px，白色 */
        .bus-info {
            font-size: 34px;
            font-weight: bold;
            color: #FFFFFF;
            line-height: 1.1;
        }

        /* 預計到達時間區塊：32px，單一巴士路線資訊自動換行，極致貼合行高 */
        .bus-eta-list {
            font-size: 32px;
            color: #FFFFFF;
            word-break: break-all;
            line-height: 1.1;
            padding-left: 2px;
        }

        .eta-item {
            display: inline-block;
            margin-right: 12px;
        }

        /* 到達時間一律白色 */
        .eta-time {
            color: #FFFFFF;
        }

        /* 剩餘時間少於10分鐘時，倒數時間為芒果黃 */
        .eta-min-yellow {
            color: #FFCC00;
            font-weight: bold;
        }

        /* 剩餘時間多於10分鐘時，倒數時間為白色 */
        .eta-min-white {
            color: #FFFFFF;
        }

        /* 右欄：時間與日期區塊 (零縫隙壓縮) */
        .time-section {
            text-align: center;
            margin-bottom: 2px;
        }

        /* 現在時間 100px，AMPM 40px，白色 */
        .current-time {
            font-size: 100px;
            font-weight: bold;
            line-height: 0.95;
            color: #FFFFFF;
        }

        .ampm {
            font-size: 40px;
            font-weight: bold;
            margin-right: 12px;
            vertical-align: baseline;
        }

        /* 今日日期 30px，白色，緊貼時間 */
        .current-date {
            font-size: 30px;
            color: #FFFFFF;
            margin-top: 2px;
        }

        /* 天氣數據列區塊 (全置中，零縫隙貼合) */
        .weather-section {
            text-align: center;
            margin-top: 4px;
        }

        /* 第一行：[圖標] 26°C(青衣) 💧87% */
        .weather-row1 {
            font-size: 32px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.1;
        }

        /* 天文台透明線條版天氣圖標 */
        .weather-icon {
            width: 48px;
            height: 48px;
            vertical-align: middle;
        }

        /* 第二行：❄️27°C ☀️31°C，與第一行零縫隙貼合 */
        .weather-row2 {
            font-size: 32px;
            margin: 0;
            padding: 0;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* 最高溫為紅色，最低溫為藍色 */
        .temp-max {
            color: #FF5050;
        }

        .temp-min {
            color: #5DB0F9;
        }

        /* 天氣警告：30px，置中 */
        .weather-warning-container {
            text-align: center;
            margin: 6px 0;
            min-height: 38px;
        }

        /* 有警告時：紅色圓角底/白字 */
        .weather-warning {
            display: inline-block;
            font-size: 30px;
            font-weight: bold;
            background-color: #CC0000;
            color: #FFFFFF;
            padding: 2px 14px;
            border-radius: 8px;
            margin: 2px;
        }

        /* 沒有警告時：較暗的灰色 */
        .no-warning {
            font-size: 30px;
            color: #555555;
            font-weight: normal;
        }

        /* 特別天氣提示面板 */
        .special-alert-panel {
            flex: 1;
            border-top: 1px solid #333333;
            margin-top: 4px;
            padding-top: 6px;
            overflow: hidden;
            position: relative;
        }

        /* 硬件加速垂直跑馬燈容器 */
        .special-alert-marquee {
            width: 100%;
            height: 160px; 
            overflow: hidden;
            position: relative;
        }

        /* 真正實施平滑位移的滾動箱 */
        #weather-scroll-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            text-align: left;
            font-size: 30px;
            color: #FFFFFF;
            line-height: 1.35;
            will-change: transform;
            cursor: ns-resize;
        }

        /* 沒有特別提示時：置中、較暗的灰色 */
        .no-alert {
            color: #555555;
            text-align: center;
            font-size: 30px;
            width: 100%;
            margin-top: 10px;
        }

        .alert-item {
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 底部固定電視新聞跑馬燈：總高 65px */
        .bottom-news-bar {
            height: 65px;
            background-color: #151515;
            border-top: 2px solid #333333;
            display: flex;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            flex-shrink: 0;
        }

        /* 即時新聞標籤：紅底白字，固定在左側 */
        .news-label {
            background-color: #CC0000;
            color: #FFFFFF;
            font-size: 45px;
            font-weight: bold;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 4px 0 8px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        /* 橫向滾動容器 */
        .news-marquee-container {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* 滾動內容箱：支援 GPU 硬件加速與手指左右拉動 */
        .news-scroll-box {
            display: flex;
            white-space: nowrap;
            position: absolute;
            left: 0;
            height: 100%;
            align-items: center;
            padding-left: 10px;
            will-change: transform;
            cursor: grab;
            touch-action: pan-x;
        }

        .news-scroll-box:active {
            cursor: grabbing;
        }

        /* 即時新聞文字：45px，白色 */
        .news-text {
            font-size: 45px;
            color: #FFFFFF;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="last-update">最後更新：--:--:--（每30秒自動刷新）</div>

    <div class="bottom-news-bar">
        <div class="news-label">即時新聞</div>

    <script>
        // 巴士 API 網址設定
        const busConfigs = {
            '249X': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', elementId: 'eta-249X' },
            '42A': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', elementId: 'eta-42A' },
            '43': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', elementId: 'eta-43' },
            '49M-to-ty': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', elementId: 'eta-49M-to-ty' },
            '49M-to-kfy': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', elementId: 'eta-49M-to-kfy' },
            '68E': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', elementId: 'eta-68E' },
            '243M': { url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', elementId: 'eta-243M' }
        };

        // 天氣警告映射字典
        const warningMap = {
            'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
            'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
            'TC1': '一號戒備信號', 'TC3': '三號強風信號',
            'TC8NE': '八號東北烈風或暴風信號', 'TC8SE': '八號東南烈風或暴風信號',
            'TC8SW': '八號西南烈風或暴風信號', 'TC8NW': '八號西北烈風或暴風信號',
            'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號'
        };

        // 1. 更新系統時間與日期 (12小時制)
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampmText = hours >= 12 ? '下午' : '上午';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            document.getElementById('time-ampm').innerText = ampmText;
            document.getElementById('time-clock').innerText = `${hours}:${minutes}`;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('current-date').innerText = `${year}年${month}月${date}日 ${weekDays[now.getDay()]}`;
        }

        // 頂部更新時間戳記 (24小時制)
        function updateLastUpdateTimestamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('last-update').innerText = `最後更新：${h}:${m}:${s}（每30秒自動刷新）`;
        }

        // 2. 獲取九巴實時到達時間 (ETA)
        async function fetchBusETA(key, config) {
            try {
                const response = await fetch(config.url);
                const json = await response.json();
                
                if (!json.data || json.data.length === 0) {
                    document.getElementById(config.elementId).innerText = '暫無班次或服務已結束';
                    return;
                }

                let etaData = json.data.slice(0, 3);
                let html = '';
                const now = new Date();

                etaData.forEach((item, index) => {
                    if (!item.eta) return;
                    
                    const etaTime = new Date(item.eta);
                    let diffMins = Math.floor((etaTime - now) / 60000);
                    if (diffMins < 0) diffMins = 0;

                    const hh = String(etaTime.getHours()).padStart(2, '0');
                    const mm = String(etaTime.getMinutes()).padStart(2, '0');
                    
                    let minClass = diffMins < 10 ? 'eta-min-yellow' : 'eta-min-white';
                    let minText = diffMins === 0 ? '即將抵達' : `${diffMins}分鐘`;

                    html += `<span class="eta-item"><span class="eta-time">${hh}:${mm}</span>(<span class="${minClass}">${minText}</span>)</span>`;
                    if (index < etaData.length - 1) html += ' | ';
                });

                document.getElementById(config.elementId).innerHTML = html || '暫無班次資訊';
            } catch (error) {
                console.error(`Error loading bus ${key}:`, error);
                document.getElementById(config.elementId).innerText = '連線超時';
            }
        }

        function updateAllBuses() {
            Object.keys(busConfigs).forEach(key => {
                fetchBusETA(key, busConfigs[key]);
            });
        }

        // 3. 獲取香港天文台數據
        async function fetchWeather() {
            // 現時天氣 (青衣溫度、濕度、圖標)
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();

                if (data.temperature && data.temperature.data) {
                    const tyTemp = data.temperature.data.find(item => item.place === '青衣');
                    if (tyTemp) document.getElementById('current-temp').innerText = `${tyTemp.value}°C`;
                }
                if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                    document.getElementById('current-humidity').innerText = `💧${data.humidity.data[0].value}%`;
                }
                if (data.icon && data.icon.length > 0) {
                    const iconImg = document.getElementById('wx-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.icon[0]}.png`;
                    iconImg.style.display = 'inline-block';
                }
            } catch (e) { console.error("Error reading rhrread:", e); }

            // 最高最低溫
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const data = await res.json();
                if (data.weatherForecast && data.weatherForecast.length > 0) {
                    document.getElementById('forecast-min').innerText = data.weatherForecast[0].forecastMintemp.value;
                    document.getElementById('forecast-max').innerText = data.weatherForecast[0].forecastMaxtemp.value;
                }
            } catch (e) { console.error("Error reading fnd:", e); }

            // 天氣警告摘要
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();
                const warningBox = document.getElementById('warning-box');
                let html = '';

                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).forEach(key => {
                        if (warningMap[key]) {
                            html += `<div class="weather-warning">${warningMap[key]}</div>`;
                        } else if (key !== 'CANCEL' && data[key].name) {
                            html += `<div class="weather-warning">${data[key].name}</div>`;
                        }
                    });
                }
                warningBox.innerHTML = html ? html : '<div class="no-warning">現時沒有生效的警告</div>';
            } catch (e) { console.error("Error reading warnsum:", e); }

            // 特別天氣提示 (雙重複製以支持無縫垂直滾動)
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const data = await res.json();
                const alertScrollContent = document.getElementById('weather-scroll-content');

                if (data.swt && data.swt.length > 0) {
                    let html = '';
                    data.swt.forEach((item, index) => {
                        let text = item.desc.replace(/<br\s*\/?>/gi, '\n').trim();
                        html += `<div class="alert-item">${index + 1}. ${text}</div>`;
                    });
                    // 重複拼接兩次以進行無縫硬件滾動
                    alertScrollContent.innerHTML = html + html;
                } else {
                    alertScrollContent.innerHTML = '<div class="no-alert">現時沒有特別天氣提示</div>';
                }
                weatherY = 0; 
            } catch (e) {
                document.getElementById('weather-scroll-content').innerHTML = '<div class="no-alert">現時沒有特別天氣提示</div>';
            }
        }

        // 4. 香港電台(RTHK) 新聞抓取設定
        const rssFeeds = [
            'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_greaterchina.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cfinance.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_csport.xml'
        ];

        async function fetchNews() {
            let combinedTitles = [];
            const fetchPromises = rssFeeds.map(url => 
                fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.items) {
                            data.items.slice(0, 4).forEach(item => {
                                if (item.title) combinedTitles.push(item.title.trim());
                            });
                        }
                    })
                    .catch(e => console.error("RSS load error:", e))
            );

            await Promise.all(fetchPromises);
            const contentEl = document.getElementById('news-content');

            if (combinedTitles.length > 0) {
                // 三重複製確保覆蓋足夠寬度進行無縫流暢循環
                const tickerText = combinedTitles.join('    |    ') + '    |    ';
                contentEl.innerText = tickerText + tickerText + tickerText;
                newsX = 0; 
            } else {
                contentEl.innerText = '暫時無法獲取最新新聞，將於稍後重試。';
            }
        }

        // 5. 即時新聞橫向跑馬燈核心引擎 (GPU加速 + requestAnimationFrame)
        const newsContainer = document.getElementById('news-container');
        const newsScrollBox = document.getElementById('news-scroll-box');
        
        let newsX = 0;
        const newsSpeed = 1.2; 
        let isNewsDragging = false;
        let isNewsWaiting = false;
        let newsResumeTimer = null;

        let dragStartX = 0;
        let dragStartNewsX = 0;

        function animateNewsMarquee() {
            if (!isNewsDragging && !isNewsWaiting) {
                newsX -= newsSpeed;
                const totalWidth = newsScrollBox.scrollWidth;
                const singleWidth = totalWidth / 3;
                
                // 無縫臨界點判定歸零
                if (Math.abs(newsX) >= singleWidth) {
                    newsX += singleWidth;
                }
                newsScrollBox.style.transform = `translate3d(${newsX}px, 0, 0)`;
            }
            requestAnimationFrame(animateNewsMarquee);
        }

        // 新聞橫向手勢互動處理 (放手延遲1秒恢復)
        function onNewsDragStart(e) {
            isNewsDragging = true;
            clearTimeout(newsResumeTimer);
            dragStartX = e.pageX || e.touches[0].pageX;
            dragStartNewsX = newsX;
        }

        function onNewsDragMove(e) {
            if (!isNewsDragging) return;
            const currentX = e.pageX || e.touches[0].pageX;
            const distance = currentX - dragStartX;
            newsX = dragStartNewsX + distance;

            const totalWidth = newsScrollBox.scrollWidth;
            const singleWidth = totalWidth / 3;

            if (newsX > 0) newsX -= singleWidth;
            if (Math.abs(newsX) >= singleWidth * 2) newsX += singleWidth;

            newsScrollBox.style.transform = `translate3d(${newsX}px, 0, 0)`;
        }

        function onNewsDragEnd() {
            if (!isNewsDragging) return;
            isNewsDragging = false;
            isNewsWaiting = true;
            
            clearTimeout(newsResumeTimer);
            newsResumeTimer = setTimeout(() => {
                isNewsWaiting = false;
            }, 1000); 
        }

        newsContainer.addEventListener('mousedown', onNewsDragStart);
        newsContainer.addEventListener('mousemove', onNewsDragMove);
        window.addEventListener('mouseup', onNewsDragEnd);

        newsContainer.addEventListener('touchstart', onNewsDragStart, { passive: true });
        newsContainer.addEventListener('touchmove', onNewsDragMove, { passive: true });
        window.addEventListener('touchend', onNewsDragEnd);


        // 6. 特別天氣提示縱向跑馬燈引擎 (GPU加速 + requestAnimationFrame)
        const weatherContainer = document.getElementById('weather-alert-marquee');
        const weatherScrollContent = document.getElementById('weather-scroll-content');
        
        let weatherY = 0;
        const weatherSpeed = 0.4; 
        let isWeatherDragging = false;
        let isWeatherWaiting = false;
        let weatherResumeTimer = null;

        let dragStartY = 0;
        let dragStartWeatherY = 0;

        function animateWeatherMarquee() {
            if (!isWeatherDragging && !isWeatherWaiting) {
                const contentHeight = weatherScrollContent.scrollHeight;
                const containerHeight = weatherContainer.clientHeight;

                // 只有內容超出高度時才啟動絲滑滾動
                if (contentHeight > containerHeight * 1.5) {
                    weatherY -= weatherSpeed;
                    const singleHeight = contentHeight / 2;

                    if (Math.abs(weatherY) >= singleHeight) {
                        weatherY += singleHeight;
                    }
                    weatherScrollContent.style.transform = `translate3d(0, ${weatherY}px, 0)`;
                } else {
                    weatherY = 0;
                    weatherScrollContent.style.transform = `translate3d(0, 0, 0)`;
                }
            }
            requestAnimationFrame(animateWeatherMarquee);
        }

        // 天氣提示縱向手勢互動處理 (放手延遲1秒恢復)
        function onWeatherDragStart(e) {
            const contentHeight = weatherScrollContent.scrollHeight;
            const containerHeight = weatherContainer.clientHeight;
            if (contentHeight <= containerHeight) return;

            isWeatherDragging = true;
            clearTimeout(weatherResumeTimer);
            dragStartY = e.pageY || e.touches[0].pageY;
            dragStartWeatherY = weatherY;
        }

        function onWeatherDragMove(e) {
            if (!isWeatherDragging) return;
            const currentY = e.pageY || e.touches[0].pageY;
            const distance = currentY - dragStartY;
            weatherY = dragStartWeatherY + distance;

            const contentHeight = weatherScrollContent.scrollHeight;
            const singleHeight = contentHeight / 2;

            if (weatherY > 0) weatherY -= singleHeight;
            if (Math.abs(weatherY) >= singleHeight) weatherY += singleHeight;

            weatherScrollContent.style.transform = `translate3d(0, ${weatherY}px, 0)`;
        }

        function onWeatherDragEnd() {
            if (!isWeatherDragging) return;
            isWeatherDragging = false;
            isWeatherWaiting = true;

            clearTimeout(weatherResumeTimer);
            weatherResumeTimer = setTimeout(() => {
                isWeatherWaiting = false;
            }, 1000); 
        }

        weatherContainer.addEventListener('mousedown', onWeatherDragStart);
        weatherContainer.addEventListener('mousemove', onWeatherDragMove);
        window.addEventListener('mouseup', onWeatherDragEnd);

        weatherContainer.addEventListener('touchstart', onWeatherDragStart, { passive: true });
        weatherContainer.addEventListener('touchmove', onWeatherDragMove, { passive: true });
        window.addEventListener('touchend', onWeatherDragEnd);


        // 7. 系統初始設定與定時排程機制
        function initializeDashboard() {
            updateClock();
            updateAllBuses();
            fetchWeather();
            fetchNews();
            updateLastUpdateTimestamp();
            
            // 每秒跳動時間
            setInterval(updateClock, 1000);
            
            // 巴士路線與天氣資訊：每 30 秒自動刷新
            setInterval(() => {
                updateAllBuses();
                fetchWeather();
                updateLastUpdateTimestamp();
            }, 30000);

            // 即時新聞：每 5 分鐘自動重新抓取
            setInterval(fetchNews, 300000);

            // 啟動雙跑馬燈硬件加速引擎
            requestAnimationFrame(animateNewsMarquee);
            requestAnimationFrame(animateWeatherMarquee);
        }

        window.onload = initializeDashboard;
    </script>
</body>
</html>
