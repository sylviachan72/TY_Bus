<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天氣新聞資訊頁面</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部更新時間欄 (字體 20px) */
    #top-bar {
      height: 32px;
      display: flex;
      align-items: center;
      font-size: 20px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .top-col {
      width: 50%;
      text-align: center;
      white-space: nowrap;
    }

    /* 主內容區：左右 50% */
    #main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 左欄 - 巴士資訊區 (隱藏滾動條) */
    #left-column {
      width: 50%;
      border-right: 1px solid #444;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 4px 10px;
    }
    #left-column::-webkit-scrollbar {
      display: none;
    }

    .bus-row {
      border-bottom: 1px solid #222;
      padding: 6px 0;
    }
    .bus-header {
      font-size: 34px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bus-tag {
      padding: 2px 10px;
      border-radius: 8px;
      color: #ffffff;
      display: inline-block;
    }
    .bus-dir-stop {
      color: #ffffff;
    }
    .bus-eta-list {
      font-size: 32px;
      font-weight: bold;
      margin-top: 2px;
      color: #ffffff;
      line-height: 1.2;
    }
    .eta-item {
      display: inline-block;
      white-space: nowrap;
    }
    /* 少於 10 分鐘：芒果黃 */
    .eta-yellow {
      color: #FFC107;
    }
    .eta-divider {
      color: #ffffff;
      margin: 0 4px;
    }

    /* 右欄 - 天氣與時間區 (隱藏滾動條) */
    #right-column {
      width: 50%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #right-column::-webkit-scrollbar {
      display: none;
    }

    .clock-section {
      text-align: center;
      margin-bottom: 0px;
    }
    .time-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      line-height: 1;
    }
    #ampm {
      font-size: 40px;
      font-weight: bold;
      color: #ffffff;
    }
    #clock {
      font-size: 100px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: -2px;
    }
    #date-box {
      font-size: 30px;
      font-weight: bold;
      color: #ffffff;
      margin-top: -6px;
    }

    /* 天氣數據列 (極致緊湊、置中) */
    .weather-section {
      text-align: center;
      margin-top: 2px;
    }
    .weather-row1, .weather-row2 {
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.0;
      margin: 0;
      padding: 0;
    }
    #wx-icon {
      height: 36px;
      width: auto;
    }
    .min-temp {
      color: #4FC3F7; /* 藍色 */
    }
    .max-temp {
      color: #FF4D4D; /* 紅色 */
    }

    /* 警告與特別提示 (靠左) */
    #warning-container, #swt-container {
      width: 100%;
      text-align: left;
      font-size: 30px;
      font-weight: bold;
      margin-top: 6px;
    }

    .warning-badge {
      background-color: #FF0000;
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .no-info-text {
      color: #888888;
      font-size: 30px;
    }

    /* 特別天氣提示：內容過長時垂直向上跑馬燈 */
    .swt-box {
      width: 100%;
      max-height: 150px;
      overflow: hidden;
      position: relative;
    }
    .swt-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .swt-content.scroll-up {
      animation: swtScrollUp linear infinite;
    }
    @keyframes swtScrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    /* 底部即時新聞跑馬燈 (45px) */
    #bottom-ticker {
      height: 60px;
      background-color: #000000;
      border-top: 2px solid #333;
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    #news-label {
      background-color: #E50914;
      color: #ffffff;
      font-size: 45px;
      font-weight: bold;
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      z-index: 10;
      flex-shrink: 0;
    }
    #marquee-wrapper {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    #marquee-content {
      display: inline-block;
      font-size: 45px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      will-change: transform;
    }
    .news-divider {
      margin: 0 10px;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 頂部刷新時間 -->
  <div id="top-bar">
    <div class="top-col">最後更新：<span id="bus-update-time">00:00:00</span>（每30秒自動刷新）</div>
    <div class="top-col">最後更新：<span id="weather-update-time">00:00:00</span>（每5分鐘自動刷新）</div>
  </div>

  <!-- 主內容區 -->
  <div id="main-container">
    <!-- 左欄：巴士實時資訊 -->
    <div id="left-column">
      <!-- 由 JavaScript 動態渲染 -->
    </div>

    <!-- 右欄：時間與天氣資訊 -->
    <div id="right-column">
      <div class="clock-section">
        <div class="time-box">
          <span id="ampm">--</span>
          <span id="clock">00:00</span>
        </div>
        <div id="date-box">----年--月--日 星期-</div>
      </div>

      <div class="weather-section">
        <div class="weather-row1">
          <img id="wx-icon" src="" alt="天氣" style="display:none;">
          <span id="tsing-yi-temp">--°C(青衣)</span>
          <span id="humidity">💧--%</span>
        </div>
        <div class="weather-row2">
          <span class="min-temp">❄️<span id="min-temp-val">--°C</span></span>
          <span class="max-temp">☀️<span id="max-temp-val">--°C</span></span>
        </div>
      </div>

      <div id="warning-container">
        <!-- 動態顯示天氣警告 -->
      </div>

      <div id="swt-container">
        <!-- 動態顯示特別天氣提示 -->
      </div>
    </div>
  </div>

  <!-- 底部即時新聞跑馬燈 -->
  <div id="bottom-ticker">
    <div id="news-label">即時新聞</div>
    <div id="marquee-wrapper">
      <div id="marquee-content">載入即時新聞中...</div>
    </div>
  </div>

  <script>
    // 巴士路線與標籤顏色設定
    const BUS_ROUTES = [
      {
        num: '249X',
        dir: '往博康',
        stop: '📍青桃樓',
        color: '#0052CC', // 寶藍色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1'
      },
      {
        num: '42A',
        dir: '往西九龍',
        stop: '📍青桃樓',
        color: '#007A33', // 正綠色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1'
      },
      {
        num: '43',
        dir: '往荃灣西',
        stop: '📍青桃樓',
        color: '#C64B00', // 深橙色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1'
      },
      {
        num: '49M',
        dir: '往青衣站',
        stop: '📍青富苑',
        color: '#6B238E', // 深紫色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1'
      },
      {
        num: '49M',
        dir: '往青富苑',
        stop: '📍青衣站',
        color: '#6B238E', // 深紫色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1'
      },
      {
        num: '68E',
        dir: '往元朗',
        stop: '📍青衣站',
        color: '#006666', // 深松綠
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1'
      },
      {
        num: '243M',
        dir: '往荃灣',
        stop: '📍美景花園',
        color: '#5C3A21', // 深朱古力色
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1'
      }
    ];

    // 天氣警告子類別對應表
    const WARNING_SUBTYPES = {
      WFIREY: "黃色火災危險警告",
      WFIRER: "紅色火災危險警告",
      WRAINA: "黃色暴雨警告信號",
      WRAINR: "紅色暴雨警告信號",
      WRAINB: "黑色暴雨警告信號",
      TC1: "一號戒備信號",
      TC3: "三號強風信號",
      TC8NE: "八號東北烈風或暴風信號",
      TC8SE: "八號東南烈風或暴風信號",
      TC8SW: "八號西南烈風或暴風信號",
      TC8NW: "八號西北烈風或暴風信號",
      TC9: "九號烈風或暴風風力增強信號",
      TC10: "十號颶風信號",
      CANCEL: "取消所有熱帶氣旋警告信號"
    };

    // 格式化 24 小時制時間 (HH:mm:ss)
    function get24HourTimeStr(date = new Date()) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // 1. 即時時鐘與日期更新
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? '下午' : '上午';
      
      hours = hours % 12;
      hours = hours ? hours : 12;
      const timeStr = `${hours}:${minutes}`;

      document.getElementById('ampm').textContent = ampm;
      document.getElementById('clock').textContent = timeStr;

      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];

      document.getElementById('date-box').textContent = `${year}年${month}月${date}日 ${dayName}`;
    }

    // 2. 獲取巴士實時報站資料
    async function fetchBusData() {
      const container = document.getElementById('left-column');
      const now = new Date();
      document.getElementById('bus-update-time').textContent = get24HourTimeStr(now);

      let htmlContent = '';

      for (const route of BUS_ROUTES) {
        let etaItems = [];
        try {
          const res = await fetch(route.url);
          const json = await res.json();
          
          if (json.data && Array.isArray(json.data)) {
            // 排序並取前 3 個班次
            const validEtas = json.data
              .filter(item => item.eta)
              .sort((a, b) => new Date(a.eta) - new Date(b.eta))
              .slice(0, 3);

            etaItems = validEtas.map(item => {
              const etaTime = new Date(item.eta);
              const diffMs = etaTime - now;
              const mins = Math.max(0, Math.floor(diffMs / 60000));
              
              const hh = String(etaTime.getHours()).padStart(2, '0');
              const mm = String(etaTime.getMinutes()).padStart(2, '0');
              const clockDisplay = `${hh}:${mm}`;

              const isYellow = mins < 10;
              const minClass = isYellow ? 'eta-yellow' : '';

              return `<span class="eta-item">${clockDisplay}(<span class="${minClass}">${mins}分鐘</span>)</span>`;
            });
          }
        } catch (err) {
          console.error('Bus API Error:', route.num, err);
        }

        let etaHtml = '';
        if (etaItems.length > 0) {
          etaHtml = etaItems.join('<span class="eta-divider">|</span>');
        } else {
          etaHtml = '暫無班次資料';
        }

        htmlContent += `
          <div class="bus-row">
            <div class="bus-header">
              <span class="bus-tag" style="background-color: ${route.color};">${route.num}</span>
              <span class="bus-dir-stop">${route.dir} ${route.stop}</span>
            </div>
            <div class="bus-eta-list">
              ${etaHtml}
            </div>
          </div>
        `;
      }

      container.innerHTML = htmlContent;
    }

    // 3. 獲取天文台天氣報告
    async function fetchWeatherData() {
      const now = new Date();
      document.getElementById('weather-update-time').textContent = get24HourTimeStr(now);

      // 3a. 現時天氣 (rhrread)
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();

        // 青衣現時溫度
        if (data.temperature && data.temperature.data) {
          const tyTemp = data.temperature.data.find(t => t.place === '青衣');
          if (tyTemp) {
            document.getElementById('tsing-yi-temp').textContent = `${tyTemp.value}°C(青衣)`;
          }
        }

        // 現時濕度
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').textContent = `💧${data.humidity.data[0].value}%`;
        }

        // 透明線條版天氣圖標 (HKOWxIconOutline)
        if (data.icon && data.icon.length > 0) {
          const iconCode = data.icon[0];
          const iconImg = document.getElementById('wx-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
          iconImg.style.display = 'inline-block';
        }
      } catch (err) {
        console.error('rhrread Error:', err);
      }

      // 3b. 九天天氣預報 (fnd) - 獲取當天最高及最低溫
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const data = await res.json();

        if (data.weatherForecast && data.weatherForecast.length > 0) {
          const todayFcst = data.weatherForecast[0];
          document.getElementById('min-temp-val').textContent = `${todayFcst.forecastMintemp.value}°C`;
          document.getElementById('max-temp-val').textContent = `${todayFcst.forecastMaxtemp.value}°C`;
        }
      } catch (err) {
        console.error('fnd Error:', err);
      }

      // 3c. 天氣警告摘要 (warnsum) 及 CODE 匹配子類型
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const data = await res.json();

        const warnContainer = document.getElementById('warning-container');
        let warningsHtml = '';

        if (data && Object.keys(data).length > 0) {
          for (const key in data) {
            const warnObj = data[key];
            const code = warnObj.code || key;
            // 比對 CODE 內的子類型對應表
            const name = WARNING_SUBTYPES[code] || warnObj.name || code;
            warningsHtml += `<div class="warning-badge">${name}</div>`;
          }
        }

        if (warningsHtml) {
          warnContainer.innerHTML = warningsHtml;
        } else {
          warnContainer.innerHTML = `<div class="no-info-text">現時沒有生效的警告</div>`;
        }
      } catch (err) {
        console.error('warnsum Error:', err);
        document.getElementById('warning-container').innerHTML = `<div class="no-info-text">現時沒有生效的警告</div>`;
      }

      // 3d. 特別天氣提示 (swt)
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
        const data = await res.json();

        const swtContainer = document.getElementById('swt-container');

        if (data.swt && data.swt.length > 0) {
          let items = data.swt.map((item, index) => `${index + 1}. ${item.desc}`);
          let fullText = items.join('<br>');

          swtContainer.innerHTML = `
            <div class="swt-box">
              <div class="swt-content" id="swt-content-el">
                ${fullText}
              </div>
            </div>
          `;

          const contentEl = document.getElementById('swt-content-el');
          // 當文字超過 4 行，啟用自下而上跑馬燈
          if (items.length > 3 || contentEl.scrollHeight > 150) {
            contentEl.innerHTML = fullText + '<br>' + fullText;
            contentEl.classList.add('scroll-up');
            const scrollHeight = contentEl.scrollHeight / 2;
            const duration = Math.max(10, scrollHeight / 15);
            contentEl.style.animationDuration = `${duration}s`;
          }
        } else {
          swtContainer.innerHTML = `<div class="no-info-text">現時沒有特別天氣提示</div>`;
        }
      } catch (err) {
        console.error('swt Error:', err);
        document.getElementById('swt-container').innerHTML = `<div class="no-info-text">現時沒有特別天氣提示</div>`;
      }
    }

    // 4. 明報 RSS 即時新聞 (corsproxy.io 跨域解析與像素級勻速跑馬燈)
    let marqueeAnimKeyframes = null;

    async function fetchNewsData() {
      const marqueeEl = document.getElementById('marquee-content');
      const rssUrl = 'https://news.mingpao.com/rss/ins/all.xml';
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rssUrl);

      try {
        const res = await fetch(proxyUrl);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');

        const now = new Date();
        const todayStr = now.toDateString();
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toDateString();

        let filteredTitles = [];

        items.forEach(item => {
          const pubDateText = item.querySelector('pubDate')?.textContent;
          const titleText = item.querySelector('title')?.textContent;

          if (titleText) {
            if (pubDateText) {
              const itemDate = new Date(pubDateText);
              const itemDateStr = itemDate.toDateString();
              // 僅抓取今天及昨天的即時新聞
              if (itemDateStr === todayStr || itemDateStr === yesterdayStr) {
                filteredTitles.push(titleText.trim());
              }
            } else {
              filteredTitles.push(titleText.trim());
            }
          }
        });

        if (filteredTitles.length === 0) {
          filteredTitles = Array.from(items).slice(0, 30).map(item => item.querySelector('title')?.textContent.trim());
        }

        if (filteredTitles.length > 0) {
          const formattedNews = filteredTitles.map((t, i) => `${i + 1}. ${t}`).join(' <span class="news-divider">┃</span> ');
          marqueeEl.innerHTML = formattedNews;

          // 計算寬度，啟動每秒 80px 勻速向左流動動畫
          startConstantMarquee();
        } else {
          marqueeEl.textContent = '暫無即時新聞';
        }
      } catch (err) {
        console.error('News RSS Error:', err);
        marqueeEl.textContent = '無法載入即時新聞';
      }
    }

    // 計算新聞總長度並實現每秒 80px 勻速運動
    function startConstantMarquee() {
      const marqueeEl = document.getElementById('marquee-content');
      const wrapperEl = document.getElementById('marquee-wrapper');

      const textWidth = marqueeEl.scrollWidth;
      const wrapperWidth = wrapperEl.clientWidth;

      const totalDistance = textWidth + wrapperWidth;
      const duration = totalDistance / 80; // 每秒 80px

      if (marqueeAnimKeyframes) {
        document.head.removeChild(marqueeAnimKeyframes);
      }

      const animationName = `marquee_${Math.floor(Math.random() * 100000)}`;
      marqueeAnimKeyframes = document.createElement('style');
      marqueeAnimKeyframes.innerHTML = `
        @keyframes ${animationName} {
          0% { transform: translateX(${wrapperWidth}px); }
          100% { transform: translateX(-${textWidth}px); }
        }
      `;
      document.head.appendChild(marqueeAnimKeyframes);

      marqueeEl.style.animation = `${animationName} ${duration}s linear infinite`;
    }

    // 初始化與定時刷新設定
    function init() {
      // 時鐘每秒更新
      updateClock();
      setInterval(updateClock, 1000);

      // 巴士每 30 秒自動刷新
      fetchBusData();
      setInterval(fetchBusData, 30000);

      // 天氣與新聞每 5 分鐘 (300,000 ms) 自動刷新
      fetchWeatherData();
      fetchNewsData();
      setInterval(() => {
        fetchWeatherData();
        fetchNewsData();
      }, 300000);
    }

    window.onload = init;
  </script>
</body>
</html>
