<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士及天氣資訊板</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #aaaaaa;
            --flash-red: #ff3333;
            --warning-red: #d32f2f;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        /* Top Bar */
        #top-bar {
            text-align: center;
            background-color: #000;
            padding: 8px;
            font-size: 1.2vw;
            color: var(--text-dim);
            border-bottom: 2px solid #444;
        }
        /* Main Layout */
        #main-container {
            display: flex;
            flex: 1;
            padding: 10px;
            gap: 15px;
        }
        /* Left Column - Bus */
        #left-col {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bus-row {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }
        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 2.2vw;
            font-weight: bold;
        }
        .route-badge {
            padding: 5px 12px;
            border-radius: 8px;
            margin-right: 15px;
            color: white;
            font-size: 2.5vw;
        }
        .eta-list {
            font-size: 1.8vw;
            color: #ddd;
            display: flex;
            align-items: center;
        }
        .eta-item { margin-right: 15px; }
        .separator { color: #555; margin-right: 15px; }
        
        @keyframes flash {
            0%, 100% { opacity: 1; color: var(--flash-red); }
            50% { opacity: 0.5; color: #ff9999; }
        }
        .flashing-red {
            animation: flash 1s infinite;
            font-weight: bold;
        }

        /* Right Column - Weather & Time */
        #right-col {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .time-panel {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid #444;
        }
        #clock {
            font-size: 8vw;
            font-weight: bold;
            color: #FFEB3B;
            line-height: 1;
            margin-bottom: 10px;
        }
        #date {
            font-size: 2vw;
            color: #ddd;
        }
        .weather-panel {
            padding: 10px;
            font-size: 2.2vw;
            border-bottom: 2px solid #444;
        }
        .weather-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }
        #weather-icon {
            width: 5vw; /* 圖標大小，適合平板 */
            height: auto;
            display: none; /* 預設隱藏，讀取到資料後顯示 */
        }
        .warning-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .warning-badge {
            background-color: var(--warning-red);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1.8vw;
            font-weight: bold;
        }
        .special-tips {
            border: 2px dashed #FFEB3B;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.6vw;
            color: #eee;
            flex: 1;
            overflow-y: auto;
        }
        .tips-title {
            color: #FFEB3B;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="top-bar">🕒 最後更新：<span id="last-update">--:--:--</span> (每30秒自動刷新)</div>
    
    <div id="main-container">
        <div id="left-col" id="bus-container">
            </div>

        <div id="right-col">
            <div class="time-panel">
                <div id="clock">00:00</div>
                <div id="date">----年--月--日 星期-</div>
            </div>
            
            <div class="weather-panel">
                <div class="weather-row">
                    <img id="weather-icon" src="" alt="天氣圖標">
                    <span id="current-weather">--°C</span>
                    <span>| 濕度: <span id="humidity">--</span>%</span>
                </div>
                <div class="weather-row" style="font-size: 1.8vw; gap: 30px;">
                    <span>⬇️ <span id="min-temp">--</span>°C</span> 
                    <span>⬆️ <span id="max-temp">--</span>°C</span>
                </div>
            </div>

            <div class="warning-panel" id="warning-container">
                </div>

            <div class="special-tips">
                <div class="tips-title">⚠️ 特別天氣提示：</div>
                <div id="special-tips-text">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        // 巴士路線設定
        const busRoutes = [
            { no: '249X', color: '#2196F3', dir: '往博康', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { no: '42A', color: '#4CAF50', dir: '往西九龍', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { no: '43', color: '#FF9800', dir: '往荃灣西', stop: '青桃樓', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { no: '49M', color: '#9C27B0', dir: '往青衣站', stop: '青富苑', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { no: '49M', color: '#9C27B0', dir: '往青富苑', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { no: '68E', color: '#00BCD4', dir: '往元朗', stop: '青衣站', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { no: '243M', color: '#795548', dir: '往荃灣', stop: '美景花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        // 更新時鐘
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
            
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
            document.getElementById('date').innerText = dateStr;
        }

        // 格式化時間及計算倒數
        function formatETA(etaTimestamp) {
            if (!etaTimestamp) return null;
            const etaTime = new Date(etaTimestamp);
            const now = new Date();
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 0) return null; 
            
            const timeStr = `${String(etaTime.getHours()).padStart(2, '0')}:${String(etaTime.getMinutes()).padStart(2, '0')}`;
            const isFlashing = diffMins <= 10;
            
            let html = `<span class="${isFlashing ? 'flashing-red' : ''}">`;
            if (isFlashing) html += `🚨 `;
            html += `${timeStr} (${diffMins}分鐘)</span>`;
            return html;
        }

        // 獲取巴士資訊
        async function fetchBusData() {
            const container = document.getElementById('left-col');
            container.innerHTML = ''; 
            
            for (const route of busRoutes) {
                const row = document.createElement('div');
                row.className = 'bus-row';
                
                let etaHtml = '<div class="eta-list">';
                
                try {
                    const response = await fetch(route.url);
                    const data = await response.json();
                    
                    let validEtas = (data.data || [])
                        .map(item => formatETA(item.eta))
                        .filter(item => item !== null)
                        .slice(0, 3);
                    
                    if (validEtas.length > 0) {
                        etaHtml += `▶ ${validEtas.join('<span class="separator">|</span>')}`;
                    } else {
                        etaHtml += '暫無班次資料';
                    }
                } catch (error) {
                    etaHtml += '資料載入失敗';
                }
                etaHtml += '</div>';

                row.innerHTML = `
                    <div class="bus-header">
                        <span class="route-badge" style="background-color: ${route.color}">${route.no}</span>
                        <span>${route.dir} 📍${route.stop}</span>
                    </div>
                    ${etaHtml}
                `;
                container.appendChild(row);
            }
        }

        // 獲取天氣資訊
        async function fetchWeatherData() {
            try {
                // 1. 本地氣溫、濕度與天氣圖標 (青衣)
                const rhrreadRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const rhrread = await rhrreadRes.json();
                
                // 處理天氣圖標 (使用天文台官方透明線條圖標)
                if (rhrread.icon && rhrread.icon.length > 0) {
                    const iconId = rhrread.icon[0];
                    const weatherIcon = document.getElementById('weather-icon');
                    weatherIcon.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                    weatherIcon.style.display = 'block'; // 載入後顯示圖片
                }

                // 處理氣溫 (青衣)
                const tsingYiTemp = rhrread.temperature.data.find(d => d.place === '青衣');
                if (tsingYiTemp) {
                    document.getElementById('current-weather').innerText = `${tsingYiTemp.value}°C (青衣)`;
                }
                
                // 處理濕度
                if (rhrread.humidity && rhrread.humidity.data.length > 0) {
                    document.getElementById('humidity').innerText = rhrread.humidity.data[0].value;
                }

                // 2. 今日最高/最低溫
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fnd = await fndRes.json();
                if (fnd.weatherForecast && fnd.weatherForecast.length > 0) {
                    document.getElementById('min-temp').innerText = fnd.weatherForecast[0].forecastMintemp.value;
                    document.getElementById('max-temp').innerText = fnd.weatherForecast[0].forecastMaxtemp.value;
                }

                // 3. 天氣警告
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnContainer = document.getElementById('warning-container');
                warnContainer.innerHTML = '';
                if (Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        warnContainer.innerHTML += `<div class="warning-badge">⚠️ ${warnData[key].name}</div>`;
                    }
                }

                // 4. 特別天氣提示
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await swtRes.json();
                if (swtData.swt && swtData.swt.length > 0) {
                    document.getElementById('special-tips-text').innerText = swtData.swt[0].desc;
                } else {
                    document.getElementById('special-tips-text').innerText = "現時沒有特別天氣提示。";
                }

            } catch (error) {
                console.error("天氣數據載入失敗", error);
            }
        }

        // 記錄最後更新時間
        function updateLastRefreshTime() {
            const now = new Date();
            const ampm = now.getHours() >= 12 ? '下午' : '上午';
            const hours = String(now.getHours() % 12 || 12).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('last-update').innerText = `${ampm} ${hours}:${minutes}:${seconds}`;
        }

        // 初始化與定時器
        function initApp() {
            updateClock();
            setInterval(updateClock, 1000); 

            const refreshData = () => {
                fetchBusData();
                fetchWeatherData();
                updateLastRefreshTime();
            };

            refreshData(); 
            setInterval(refreshData, 30000); 
        }

        window.onload = initApp;
    </script>
</body>
</html>
