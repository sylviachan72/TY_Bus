<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1308資訊網頁</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 隱藏整體滾動 */
        }

        /* 隱藏滾動條但保留滾動功能 */
        ::-webkit-scrollbar { display: none; }
        .scrollable { scrollbar-width: none; -ms-overflow-style: none; overflow-y: auto; }

        /* 頂部更新時間 */
        #top-bar {
            text-align: center;
            font-size: 20px;
            color: #8E8E93;
            padding: 4px 0;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }

        /* 主佈局：左右雙欄 */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左欄：巴士資訊 (60%) */
        #left-col {
            width: 60%;
            border-right: 1px solid #333333;
            padding: 10px 15px;
        }
        
        .bus-route {
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .bus-route:last-child { border-bottom: none; }
        
        .bus-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .bus-badge {
            border-radius: 12px;
            padding: 4px 14px;
            color: #FFFFFF;
        }
        
        .bus-times {
            font-size: 32px;
            line-height: 1.3;
            word-wrap: break-word;
        }
        .time-red { color: #FF3B30; }
        .time-white { color: #FFFFFF; }

        /* 右欄：時間與天氣 (40%) 極致緊湊 */
        #right-col {
            width: 40%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 時間日期 */
        #time-display {
            font-size: 96px;
            font-weight: bold;
            text-align: center;
            line-height: 1;
        }
        #date-display {
            font-size: 28px;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        /* --- 天氣資訊整合區塊 (置中、零縫隙) --- */
        #weather-info-container {
            display: flex;
            flex-direction: column;
            align-items: center; /* 強制水平置中 */
            gap: 0; /* 第一行與第二行零縫隙 */
            margin-bottom: 6px;
        }
        .weather-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center; /* 內容置中 */
            gap: 10px;
            font-size: 28px; /* 稍微放大確保清晰 */
            line-height: 1;  /* 行高設為 1，消除上下預留空白 */
            padding: 2px 0;
        }
        #weather-icon { height: 44px; vertical-align: middle; }
        .temp-red { color: #FF3B30; }
        .temp-blue { color: #007AFF; }

        /* 警告與提示圖標區 (維基百科圖庫) */
        #warnings-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px;
            min-height: 54px;
            align-items: center;
        }
        .warning-icon {
            height: 52px;
            width: auto;
            object-fit: contain;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 2px;
        }
        .warning-text-fallback {
            background-color: #FF3B30;
            color: #FFFFFF;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 24px;
            font-weight: bold;
        }
        .no-warning {
            color: #8E8E93;
            font-size: 24px;
        }

        /* 特別天氣提示跑馬燈 */
        #swt-container {
            font-size: 24px;
            line-height: 1.3;
            max-height: 3.9em; /* 約3行高度 */
            overflow: hidden;
            position: relative;
            width: 100%;
            margin-top: 4px;
        }
        .swt-text {
            position: relative;
        }
        .marquee-up {
            animation: scrollUp 15s linear infinite;
        }
        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -150%; }
        }
    </style>
</head>
<body>

    <div id="top-bar">最後更新：--:--:--（每30秒自動刷新）</div>

    <div id="main-container">
        <!-- 左欄：巴士 -->
        <div id="left-col" class="scrollable">
            <div id="bus-list">正在載入巴士資訊...</div>
        </div>

        <!-- 右欄：時間與天氣 -->
        <div id="right-col" class="scrollable">
            <div id="time-display">--:--</div>
            <div id="date-display">----年--月--日 星期-</div>
            
            <!-- 天氣區塊：置中且零縫隙 -->
            <div id="weather-info-container">
                <!-- 第一行：天氣圖標、現時溫度、濕度 -->
                <div class="weather-line" id="weather-current-data">載入天氣中...</div>
                <!-- 第二行：最低溫度、最高溫度 -->
                <div class="weather-line" id="weather-minmax-data"></div>
            </div>

            <!-- 天氣警告圖標區域 -->
            <div id="warnings-container"></div>
            
            <!-- 特別天氣提示區域 -->
            <div id="swt-container">
                <div id="swt-text" class="swt-text"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 配置區域 ---
        const busConfigs = [
            { id: "249X", color: "#007AFF", dest: "博康", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1" },
            { id: "42A", color: "#34C759", dest: "西九龍", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1" },
            { id: "43", color: "#FF9500", dest: "荃灣西", stop: "青桃樓", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1" },
            { id: "49M", color: "#AF52DE", dest: "青衣站", stop: "青富苑", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1" },
            { id: "49M", color: "#FF2D55", dest: "青富苑", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1" },
            { id: "68E", color: "#5AC8FA", dest: "元朗", stop: "青衣站", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1" },
            { id: "243M", color: "#A2845E", dest: "荃灣", stop: "美景花園", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1" }
        ];

        // 維基百科官方圖標檔名
        const warningWikiFiles = {
            "WFIREY": "Yellow_Fire_Danger_Warning.png", "WFIRER": "Red_Fire_Danger_Warning.png",
            "WRAINA": "Amber_Rainstorm_Warning_Signal_HKO.svg", "WRAINR": "Red_Rainstorm_Warning_Signal_HKO.svg", "WRAINB": "Black_Rainstorm_Warning_Signal_HKO.svg",
            "TC1": "Tropical_Cyclone_Warning_Signal_1.svg", "TC3": "Tropical_Cyclone_Warning_Signal_3.svg",
            "TC8NE": "Tropical_Cyclone_Warning_Signal_8_NE.svg", "TC8SE": "Tropical_Cyclone_Warning_Signal_8_SE.svg",
            "TC8SW": "Tropical_Cyclone_Warning_Signal_8_SW.svg", "TC8NW": "Tropical_Cyclone_Warning_Signal_8_NW.svg",
            "TC9": "Tropical_Cyclone_Warning_Signal_9.svg", "TC10": "Tropical_Cyclone_Warning_Signal_10.svg",
            "WTS": "Thunderstorm_Warning.png", "WHOT": "Very_Hot_Weather_Warning.png", "WCOLD": "Cold_Weather_Warning.png",
            "WL": "Landslip_Warning_Signal_HKO.svg", "WTMW": "Tsunami_Warning_Signal.svg", "WMSGNL": "Strong_Monsoon_Signal.svg", "WFROST": "Frost_Warning_Signal.svg"
        };

        // --- 時鐘邏輯 ---
        function updateClock() {
            const now = new Date();
            let hh = now.getHours();
            hh = hh % 12 || 12;
            hh = String(hh).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${hh}:${mm}`;

            const yyyy = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('date-display').textContent = `${yyyy}年${month}月${date}日 ${days[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 巴士邏輯 ---
        function formatBusETA(etaString) {
            const diffMins = Math.floor((new Date(etaString) - new Date()) / 60000);
            if (diffMins < 0) return null;
            const timeStr = new Date(etaString).toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit', hour12:false});
            return diffMins < 10 
                ? `<span class="time-white">${timeStr}</span>(<span class="time-red">${diffMins}分鐘</span>)`
                : `<span class="time-white">${timeStr}(${diffMins}分鐘)</span>`;
        }

        async function fetchBuses() {
            let htmlContent = '';
            for (const bus of busConfigs) {
                try {
                    const res = await fetch(bus.url);
                    const data = await res.json();
                    let etasHtml = '暫無班次資料';
                    if (data?.data?.length > 0) {
                        const validETAs = data.data.map(i => i.eta).filter(Boolean).map(formatBusETA).filter(Boolean).slice(0, 3);
                        if (validETAs.length > 0) etasHtml = validETAs.join(' | ');
                    }
                    htmlContent += `
                        <div class="bus-route">
                            <div class="bus-header"><span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span> 往${bus.dest} 📍${bus.stop}</div>
                            <div class="bus-times">${etasHtml}</div>
                        </div>`;
                } catch (e) {
                    htmlContent += `<div class="bus-route"><div class="bus-header"><span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span> 往${bus.dest} 📍${bus.stop}</div><div class="bus-times">載入失敗</div></div>`;
                }
            }
            document.getElementById('bus-list').innerHTML = htmlContent;
        }

        // --- 天氣邏輯 ---
        async function fetchWeather() {
            try {
                const [currentRes, forecastRes, warningRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                const currentData = await currentRes.json();
                const forecastData = await forecastRes.json();
                const warningData = await warningRes.json();
                let swtData = {};
                if(swtRes.status === 200) swtData = await swtRes.json();

                // 1. 第一行與第二行資料
                let tsingYiTemp = currentData.temperature.data.find(d => d.place === '青衣')?.value || '--';
                let humidity = currentData.humidity?.data[0]?.value || '--';
                let iconCode = currentData.icon[0];
                let minTemp = forecastData.weatherForecast[0].forecastMintemp.value;
                let maxTemp = forecastData.weatherForecast[0].forecastMaxtemp.value;

                document.getElementById('weather-current-data').innerHTML = `
                    <img id="weather-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png" alt="天氣圖標">
                    <span>${tsingYiTemp}°C(青衣)</span>
                    <span>💧${humidity}%</span>
                `;
                document.getElementById('weather-minmax-data').innerHTML = `
                    <span class="temp-blue">❄️${minTemp}°C</span>
                    <span class="temp-red">☀️${maxTemp}°C</span>
                `;

                // 2. 警告圖標 (維基直連)
                let warningsHtml = '';
                let hasAlerts = false;
                for (const key in warningData) {
                    const code = warningData[key].code;
                    if (code && code !== "CANCEL" && warningWikiFiles[code]) {
                        const wikiUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${warningWikiFiles[code]}?width=120`;
                        warningsHtml += `<img src="${wikiUrl}" alt="${warningData[key].name}" title="${warningData[key].name}" class="warning-icon" onerror="this.style.display='none'">`;
                        hasAlerts = true;
                    }
                }

                // 3. 特別提示
                let swtText = swtData.swt?.map(i => i.desc).join('。') || '';
                if (swtText) hasAlerts = true;

                const warnBox = document.getElementById('warnings-container');
                const swtBox = document.getElementById('swt-text');
                
                if (!hasAlerts) {
                    warnBox.innerHTML = `<div class="no-warning">現時沒有生效的警告/提示</div>`;
                    swtBox.innerHTML = '';
                    swtBox.classList.remove('marquee-up');
                } else {
                    warnBox.innerHTML = warningsHtml;
                    swtBox.innerHTML = swtText;
                    setTimeout(() => {
                        if (swtBox.scrollHeight > document.getElementById('swt-container').clientHeight) {
                            swtBox.classList.add('marquee-up');
                        } else {
                            swtBox.classList.remove('marquee-up');
                        }
                    }, 100);
                }
            } catch (e) {
                console.error("天氣獲取失敗", e);
            }
        }

        // --- 初始化與自動更新 ---
        async function updateDashboard() {
            await fetchBuses();
            await fetchWeather();
            const now = new Date();
            document.getElementById('top-bar').textContent = `最後更新：${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}（每30秒自動刷新）`;
        }

        updateDashboard();
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html>
