<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊版面</title>
    <style>
        /* ================= 基礎重置與全局設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            overflow: hidden; /* 防止整體畫面滾動 */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* ================= 兩欄式主要佈局 ================= */
        .main-container {
            display: flex;
            height: calc(100vh - 65px); /* 扣除底部跑馬燈的高度 */
            width: 100%;
        }

        .col {
            width: 50%;
            height: 100%;
            overflow-y: auto; /* 內容過多時允許隱藏滑動 */
            padding: 5px 10px;
        }

        /* 隱藏右側滾動條但保留滾動功能 (針對觸控螢幕) */
        .col::-webkit-scrollbar { width: 0px; background: transparent; }
        .col { scrollbar-width: none; } 

        .last-update {
            text-align: center;
            font-size: 20px;
            color: #CCCCCC;
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        /* ================= 左欄：巴士資訊 ================= */
        .bus-row {
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        
        .bus-head {
            font-size: 34px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .bus-badge {
            border-radius: 8px;
            padding: 0 12px;
            margin-right: 8px;
            font-weight: bold;
            display: inline-block;
        }

        .bus-dest { margin-right: 5px; }

        .bus-times {
            font-size: 32px;
            line-height: 1.2;
        }

        /* 保證單個時間區塊不被拆散跨行 */
        .eta-block {
            display: inline-block;
            white-space: nowrap;
        }

        .time-mango { color: #FFCC00; }
        .time-white { color: #FFFFFF; }
        .time-divider { color: #FFFFFF; margin: 0 3px; }

        /* ================= 右欄：時間與天氣 ================= */
        .time-container {
            text-align: center;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
        }

        .ampm-display { font-size: 40px; margin-right: 15px; }
        .time-display { font-size: 100px; font-weight: bold; line-height: 1; }
        .date-display { font-size: 30px; line-height: 1.1; margin-top: -5px; } /* 極致貼近時間 */

        .weather-container { text-align: center; margin-top: 5px; }

        .weather-row1, .weather-row2 {
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            margin: 0;
            padding: 0;
        }

        /* 天氣圖標 */
        .weather-icon {
            height: 40px;
            margin-right: 5px;
            vertical-align: bottom;
        }

        /* 警告與提示 */
        .warning-container { margin-top: 10px; text-align: center; }
        .warning-badge {
            background-color: #CC0000;
            color: #FFFFFF;
            font-size: 30px;
            border-radius: 10px;
            padding: 4px 15px;
            display: inline-block;
            margin: 2px;
            font-weight: bold;
        }

        .swt-container {
            margin-top: 10px;
            font-size: 30px;
            text-align: left;
            line-height: 1.2;
            height: 144px; /* 4行高度 (30px字體 + 行距) */
            overflow: hidden;
            position: relative;
        }
        
        .swt-content { position: absolute; width: 100%; }

        .no-data {
            color: #666666; /* 較暗的灰色 */
            font-size: 30px;
        }

        /* ================= 底部：新聞跑馬燈 ================= */
        .ticker-container {
            height: 65px;
            background: #151515;
            display: flex;
            align-items: center;
            position: relative;
            border-top: 1px solid #333;
        }

        .ticker-label {
            background-color: #CC0000;
            color: #FFFFFF;
            font-size: 45px;
            font-weight: bold;
            padding: 0 15px;
            line-height: 65px;
            position: relative;
            z-index: 10;
            white-space: nowrap;
        }

        .ticker-wrap {
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
        }

        .ticker-content {
            font-size: 45px;
            line-height: 65px;
            position: absolute;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
        
        /* 垂直分隔厚線 */
        .ticker-sep {
            color: #555;
            margin: 0 15px;
            font-size: 40px;
        }
    </style>
</head>
<body>

    <!-- 主要內容區塊 -->
    <div class="main-container">
        
        <!-- 左欄：巴士資訊 -->
        <div class="col left-col">
            <div id="bus-updated" class="last-update">最後更新：載入中...（每30秒自動刷新）</div>
            <div id="bus-data">
                <!-- 巴士資料將透過 JS 注入 -->
            </div>
        </div>

        <!-- 右欄：天氣與時間 -->
        <div class="col right-col">
            <div id="weather-updated" class="last-update">最後更新：載入中...（每5分鐘自動刷新）</div>
            
            <div class="time-container">
                <div class="clock-row">
                    <span class="ampm-display" id="ampm-display"></span>
                    <span class="time-display" id="time-display"></span>
                </div>
                <div class="date-display" id="date-display"></div>
            </div>

            <div class="weather-container">
                <div class="weather-row1" id="weather-row1"></div>
                <div class="weather-row2" id="weather-row2"></div>
                
                <div class="warning-container" id="weather-warn"></div>
                
                <div class="swt-container" id="swt-container">
                    <div class="swt-content" id="swt-content"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- 底部跑馬燈：即時新聞 -->
    <div class="ticker-container">
        <div class="ticker-label">即時新聞</div>
        <div class="ticker-wrap" id="ticker-wrap">
            <div class="ticker-content" id="ticker-content">新聞載入中...</div>
        </div>
    </div>

    <script>
        /* ================= 共用工具函數 ================= */
        const get24Time = () => new Date().toTimeString().split(' ')[0]; // 取得 HH:MM:SS
        const get12Time = (dateObj) => {
            let h = dateObj.getHours() % 12 || 12;
            let m = dateObj.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        /* ================= 右欄：時鐘邏輯 ================= */
        function updateClock() {
            const now = new Date();
            // 時間
            let hours = now.getHours();
            let ampm = hours >= 12 ? '下午' : '上午';
            document.getElementById('ampm-display').innerText = ampm;
            document.getElementById('time-display').innerText = get12Time(now);

            // 日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date-display').innerText = `${year}年${month}月${date}日 ${days[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* ================= 左欄：巴士 ETA 邏輯 ================= */
        const BUS_ROUTES = [
            { route: '249X', dest: '博康', stop: '青桃樓', color: '#0052CC', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', dest: '西九龍', stop: '青桃樓', color: '#007A33', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', dest: '荃灣西', stop: '青桃樓', color: '#C64B00', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', dest: '青衣站', stop: '青富苑', color: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', dest: '青富苑', stop: '青衣站', color: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', dest: '元朗', stop: '青衣站', color: '#006666', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', dest: '荃灣', stop: '美景花園', color: '#5C3A21', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' },
        ];

        async function fetchBusData() {
            let busHtml = '';
            for (let b of BUS_ROUTES) {
                busHtml += `<div class="bus-row">
                    <div class="bus-head">
                        <span class="bus-badge" style="background-color: ${b.color};">${b.route}</span>
                        <span class="bus-dest">往${b.dest} 📍${b.stop}</span>
                    </div>
                    <div class="bus-times">`;
                
                try {
                    const res = await fetch(b.url);
                    const data = await res.json();
                    
                    // 過濾有效數據並只取前三個班次
                    let etas = data.data.filter(eta => eta.eta != null).slice(0, 3);
                    
                    if (etas.length === 0) {
                        busHtml += `<span>暫無班次資料</span>`;
                    } else {
                        let etaStrings = etas.map(eta => {
                            let etaDate = new Date(eta.eta);
                            let now = new Date();
                            let diffMins = Math.max(0, Math.floor((etaDate - now) / 60000));
                            let timeStr = get12Time(etaDate);
                            
                            // 剩餘時間判斷 (少於10分鐘顯示芒果黃)
                            let minColorClass = (diffMins <= 10) ? 'time-mango' : 'time-white';
                            
                            return `<span class="eta-block"><span class="time-white">${timeStr}(</span><span class="${minColorClass}">${diffMins}分鐘</span><span class="time-white">)</span></span>`;
                        });
                        busHtml += etaStrings.join('<span class="time-divider"> | </span>');
                    }
                } catch (e) {
                    busHtml += `<span>載入失敗</span>`;
                }
                busHtml += `</div></div>`;
            }
            
            document.getElementById('bus-data').innerHTML = busHtml;
            document.getElementById('bus-updated').innerText = `最後更新：${get24Time()}（每30秒自動刷新）`;
        }
        setInterval(fetchBusData, 30000);
        fetchBusData();

        /* ================= 右欄：天氣邏輯 ================= */
        const WARN_MAP = {
            'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
            'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
            'TC1': '一號戒備信號', 'TC3': '三號強風信號', 'TC8NE': '八號東北烈風或暴風信號',
            'TC8SE': '八號東南烈風或暴風信號', 'TC8SW': '八號西南烈風或暴風信號',
            'TC8NW': '八號西北烈風或暴風信號', 'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號'
        };

        // 保存特別天氣提示滾動動畫的全域變數
        let swtAnimation = null;

        async function fetchWeatherData() {
            try {
                const [rhrRes, fndRes, warnRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                const rhrData = await rhrRes.json();
                const fndData = await fndRes.json();
                const warnData = await warnRes.json();
                const swtData = await swtRes.json();

                // 1. 溫濕度與天氣圖標 (優先取青衣，若無則回退預設)
                let tempInfo = rhrData.temperature.data.find(d => d.place === '青衣') || rhrData.temperature.data[0];
                let humidity = rhrData.humidity.data[0].value;
                let iconId = rhrData.icon[0];
                let maxTemp = fndData.weatherForecast[0].forecastMaxtemp.value;
                let minTemp = fndData.weatherForecast[0].forecastMintemp.value;

                document.getElementById('weather-row1').innerHTML = `
                    <img class="weather-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png"> 
                    ${tempInfo.value}°C(${tempInfo.place}) 💧${humidity}%
                `;
                document.getElementById('weather-row2').innerHTML = `
                    ❄️<span style="color:#3399FF">${minTemp}°C</span> ☀️<span style="color:#FF3333">${maxTemp}°C</span>
                `;

                // 2. 天氣警告
                let warnHtml = '';
                if (warnData && Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        let w = warnData[key];
                        if (w.actionCode === 'CANCEL') continue;
                        let wCode = w.subtype || w.code;
                        let wText = WARN_MAP[wCode] || w.name;
                        if(wText) warnHtml += `<div class="warning-badge">${wText}</div>`;
                    }
                }
                document.getElementById('weather-warn').innerHTML = warnHtml || `<div class="no-data">現時沒有生效的警告</div>`;

                // 3. 特別天氣提示 (SWT)
                let swtContent = document.getElementById('swt-content');
                if (swtData && swtData.swt && swtData.swt.length > 0) {
                    swtContent.innerHTML = swtData.swt.map((t, i) => `${i + 1}. ${t.desc}`).join('<br>');
                } else {
                    swtContent.innerHTML = `<div class="no-data">現時沒有特別天氣提示</div>`;
                }

                // SWT 動畫邏輯：若高度超過 4行(144px)，啟動 WAAPI 由下往上跑馬燈
                if (swtAnimation) swtAnimation.cancel();
                swtContent.style.transform = 'translateY(0)';
                
                let sHeight = swtContent.scrollHeight;
                if (sHeight > 144) {
                    let speed = 25; // 像素/秒
                    let duration = (sHeight + 144) / speed * 1000;
                    swtAnimation = swtContent.animate([
                        { transform: 'translateY(144px)' },
                        { transform: `translateY(-${sHeight}px)` }
                    ], {
                        duration: duration,
                        iterations: Infinity
                    });
                }

                document.getElementById('weather-updated').innerText = `最後更新：${get24Time()}（每5分鐘自動刷新）`;
            } catch (e) {
                console.error("天氣資料載入失敗", e);
            }
        }
        setInterval(fetchWeatherData, 300000);
        fetchWeatherData();

        /* ================= 底部：即時新聞 RSS 邏輯 ================= */
        const tickerWrap = document.getElementById('ticker-wrap');
        const tickerContent = document.getElementById('ticker-content');

        async function fetchAndPlayNews() {
            try {
                // 透過 corsproxy 請求明報 RSS
                const rssUrl = encodeURIComponent('https://news.mingpao.com/rss/ins/all.xml');
                const res = await fetch('https://corsproxy.io/?' + rssUrl);
                const xmlText = await res.text();
                const xml = new DOMParser().parseFromString(xmlText, "text/xml");
                const items = Array.from(xml.querySelectorAll("item"));

                // 篩選今天與昨天的新聞
                let now = new Date();
                let startOfYesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                
                let newsHtml = '';
                let count = 1;

                items.forEach(item => {
                    let pubDate = new Date(item.querySelector("pubDate").textContent);
                    if (pubDate >= startOfYesterday) {
                        newsHtml += `<span>${count}. ${item.querySelector("title").textContent}</span><span class="ticker-sep">▌</span>`;
                        count++;
                    }
                });

                tickerContent.innerHTML = newsHtml || "暫無即時新聞";
                
                // 動態計算動畫持續時間 (恆定速度：80px/s)
                const containerWidth = tickerWrap.offsetWidth;
                const textWidth = tickerContent.offsetWidth;
                const distance = containerWidth + textWidth;
                const durationMs = (distance / 80) * 1000;

                // 使用 Web Animations API 控制流動
                const anim = tickerContent.animate([
                    { transform: `translateX(${containerWidth}px)` },
                    { transform: `translateX(-${textWidth}px)` }
                ], {
                    duration: durationMs,
                    iterations: 1 // 跑完一次即觸發 onfinish
                });

                // 當走馬燈走完時，重新拉取 RSS 進行下一輪播放
                anim.onfinish = fetchAndPlayNews;

            } catch (e) {
                console.error("新聞 RSS 載入失敗，30秒後重試", e);
                setTimeout(fetchAndPlayNews, 30000);
            }
        }
        
        // 等待字體和佈局穩定後啟動新聞跑馬燈
        window.addEventListener('load', () => {
            setTimeout(fetchAndPlayNews, 500); 
        });

    </script>
</body>
</html>
