<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊面板</title>
    <style>
        /* 全局設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden; /* 防止整個網頁滾動 */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 隱藏捲軸的共用 class */
        .hide-scrollbar {
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }

        /* 頂部最後更新列 */
        #top-bar {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        /* 主內容區塊 */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左右欄基本設定 */
        .col-left {
            width: 60%;
            border-right: 1px solid #444;
            padding: 8px;
        }
        .col-right {
            width: 40%;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 巴士資訊區塊 CSS */
        .bus-item {
            border-bottom: 1px solid #333;
            padding: 8px 0;
        }
        .bus-item:last-child {
            border-bottom: none;
        }
        .bus-header {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .route-badge {
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 8px;
            color: white;
            font-size: 24px;
        }
        .bus-times {
            font-size: 20px;
            color: #ddd;
            line-height: 1.4;
        }
        .blink-red {
            color: #ff4c4c;
            animation: blink 1s infinite;
            font-weight: bold;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 右欄：時間日期 */
        .time-box {
            text-align: center;
            margin-bottom: 5px;
        }
        #clock {
            font-size: 64px;
            color: #FFD700;
            font-weight: bold;
            line-height: 1;
        }
        #date {
            font-size: 18px;
            color: #ccc;
            margin-top: 4px;
        }

        /* 右欄：實時天氣 (緊湊版) */
        .weather-box {
            text-align: center;
            background: #111;
            border-radius: 10px;
            padding: 8px;
            border: 1px solid #333;
        }
        .weather-current {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            gap: 10px;
        }
        .weather-current img {
            height: 40px;
        }
        .weather-minmax {
            font-size: 22px;
            margin-top: 4px;
        }
        .temp-min { color: #4DA8DA; }
        .temp-max { color: #FF4C4C; }

        /* 右欄：警告與提示 */
        .warning-box, .special-tip-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .box-inactive {
            border: 1px dashed #555;
            color: #777;
        }
        .box-active-warning {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .warn-badge {
            background-color: #d32f2f;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 18px;
        }
        .box-active-tip {
            border: 2px solid #FFD700;
            color: #FFD700;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
        }
        
        /* 跑馬燈動畫 */
        .marquee {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div id="top-bar">🕒 最後更新：<span id="update-time">載入中...</span> (每30秒自動刷新)</div>

    <div id="main-container">
        <!-- 左欄：巴士資訊 -->
        <div class="col-left hide-scrollbar" id="bus-list">
            <!-- 巴士資料將由 JS 動態生成 -->
        </div>

        <!-- 右欄：天氣與時間 -->
        <div class="col-right hide-scrollbar">
            <!-- 時間日期 -->
            <div class="time-box">
                <div id="clock">--:--</div>
                <div id="date">----年--月--日 星期-</div>
            </div>

            <!-- 天氣資訊 -->
            <div class="weather-box">
                <div class="weather-current">
                    <img id="weather-icon" src="" alt="" style="display:none;">
                    <span id="current-temp">--°C</span>
                    <span style="color:#aaa; font-size:18px;">(青衣)</span> | 
                    <span>💧<span id="current-hum">--%</span></span>
                </div>
                <div class="weather-minmax">
                    ❄️ <span class="temp-min" id="min-temp">--°C</span> — ☀️ <span class="temp-max" id="max-temp">--°C</span>
                </div>
            </div>

            <!-- 天氣警告 -->
            <div id="warning-container" class="warning-box box-inactive">
                現時沒有生效的警告
            </div>

            <!-- 特別天氣提示 -->
            <div id="tip-container" class="special-tip-box box-inactive">
                現時沒有特別天氣提示
            </div>
        </div>
    </div>

    <script>
        // --- 巴士資料設定 ---
        const busRoutes = [
            { route: '249X', dest: '博康', stop: '青桃樓', color: '#1E90FF', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', dest: '西九龍', stop: '青桃樓', color: '#32CD32', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', dest: '荃灣西', stop: '青桃樓', color: '#FF8C00', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', dest: '青衣站', stop: '青富苑', color: '#8A2BE2', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', dest: '青富苑', stop: '青衣站', color: '#8A2BE2', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', dest: '元朗', stop: '青衣站', color: '#00CED1', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', dest: '荃灣', stop: '美景花園', color: '#A0522D', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        // --- 處理時鐘與日期 ---
        function updateClock() {
            const now = new Date();
            const hkTime = new Date(now.toLocaleString('en-US', {timeZone: 'Asia/Hong_Kong'}));
            
            const hours = String(hkTime.getHours()).padStart(2, '0');
            const minutes = String(hkTime.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${hkTime.getFullYear()}年${hkTime.getMonth() + 1}月${hkTime.getDate()}日 ${days[hkTime.getDay()]}`;
            document.getElementById('date').innerText = dateStr;
        }

        // --- 更新最後更新時間 ---
        function setLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-HK', { hour12: true });
            document.getElementById('update-time').innerText = timeString;
        }

        // --- 抓取並渲染巴士 ETA ---
        async function fetchBusData() {
            const busListDiv = document.getElementById('bus-list');
            busListDiv.innerHTML = ''; // 清空現有內容

            for (const bus of busRoutes) {
                let html = `
                    <div class="bus-item">
                        <div class="bus-header">
                            <span class="route-badge" style="background-color: ${bus.color}">${bus.route}</span>
                            往 ${bus.dest} &nbsp;📍<span style="color:#ffd700; font-size:18px;">${bus.stop}</span>
                        </div>
                        <div class="bus-times">▶ `;

                try {
                    const response = await fetch(bus.url);
                    const data = await response.json();
                    
                    if (data.data && data.data.length > 0) {
                        const now = new Date();
                        // 過濾並取得最近三個有效班次
                        let validEtas = data.data.filter(item => item.eta && new Date(item.eta) > now).slice(0, 3);

                        if (validEtas.length > 0) {
                            let timeStrings = validEtas.map(item => {
                                const etaTime = new Date(item.eta);
                                const diffMs = etaTime - now;
                                const diffMins = Math.floor(diffMs / 60000);
                                const hh = String(etaTime.getHours()).padStart(2, '0');
                                const mm = String(etaTime.getMinutes()).padStart(2, '0');
                                
                                if (diffMins <= 10) {
                                    return `${hh}:${mm}(<span class="blink-red">${diffMins}分鐘</span>)`;
                                } else {
                                    return `${hh}:${mm}(${diffMins}分鐘)`;
                                }
                            });
                            html += timeStrings.join(' &nbsp;|&nbsp; ');
                        } else {
                            html += '暫無預計時間';
                        }
                    } else {
                        html += '暫無班次資料';
                    }
                } catch (error) {
                    html += '資料載入失敗';
                }
                html += `</div></div>`;
                busListDiv.innerHTML += html;
            }
        }

        // --- 抓取天氣資料 ---
        async function fetchWeatherData() {
            try {
                // 實時天氣
                const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const rhrData = await rhrRes.json();
                
                // 天氣圖標
                if(rhrData.icon && rhrData.icon.length > 0) {
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rhrData.icon[0]}.png`;
                    iconImg.style.display = 'inline-block';
                }

                // 溫度 (嘗試找青衣，否則用全港平均)
                let temp = "--";
                const qyTempObj = rhrData.temperature.data.find(t => t.place === "青衣");
                if(qyTempObj) { temp = qyTempObj.value; } 
                else if (rhrData.temperature.data.length > 0) { temp = rhrData.temperature.data[0].value; }
                document.getElementById('current-temp').innerText = `${temp}°C`;

                // 濕度
                if(rhrData.humidity && rhrData.humidity.data.length > 0) {
                    document.getElementById('current-hum').innerText = `${rhrData.humidity.data[0].value}%`;
                }

                // 九天天氣預報 (取今天最高最低溫)
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                if(fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const todayFnd = fndData.weatherForecast[0];
                    document.getElementById('min-temp').innerText = `${todayFnd.forecastMintemp.value}°C`;
                    document.getElementById('max-temp').innerText = `${todayFnd.forecastMaxtemp.value}°C`;
                }

                // 天氣警告
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnContainer = document.getElementById('warning-container');
                const warnKeys = Object.keys(warnData);
                
                if (warnKeys.length > 0) {
                    warnContainer.className = 'warning-box box-active-warning';
                    warnContainer.innerHTML = '';
                    warnKeys.forEach(key => {
                        warnContainer.innerHTML += `<span class="warn-badge">⚠️ ${warnData[key].name}</span>`;
                    });
                } else {
                    warnContainer.className = 'warning-box box-inactive';
                    warnContainer.innerText = '現時沒有生效的警告';
                }

                // 特別天氣提示
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await swtRes.json();
                const tipContainer = document.getElementById('tip-container');

                if (swtData.swt && swtData.swt.length > 0) {
                    tipContainer.className = 'special-tip-box box-active-tip';
                    let combinedTips = swtData.swt.map(t => t.desc).join(' | ');
                    tipContainer.innerHTML = `<span class="marquee">⚠️ 特別天氣提示：${combinedTips}</span>`;
                } else {
                    tipContainer.className = 'special-tip-box box-inactive';
                    tipContainer.innerText = '現時沒有特別天氣提示';
                }

            } catch (error) {
                console.error("天氣資料載入失敗", error);
            }
        }

        // --- 初始化與定時更新 ---
        function updateAllData() {
            setLastUpdateTime();
            fetchBusData();
            fetchWeatherData();
        }

        // 啟動時鐘 (每秒)
        setInterval(updateClock, 1000);
        updateClock();

        // 啟動 API 資料更新 (每 30 秒)
        updateAllData();
        setInterval(updateAllData, 30000);

    </script>
</body>
</html>
