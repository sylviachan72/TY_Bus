<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長者專用 - 巴士天氣資訊看板</title>
<style>
    /* 全局重置與設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #000;
        color: #FFF;
        font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* 上半部：左右分欄 */
    #main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
    }

    /* 左右欄共用設定 */
    .col {
        width: 50%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
    }
    .col:last-child { border-right: none; }
    
    /* 頂部最後更新時間 (20px) */
    .header-time {
        font-size: 20px;
        text-align: center;
        padding: 5px 0;
        background-color: #111;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
    }

    /* 滾動內容區域 (隱藏滾動條) */
    .scrollable-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }
    .scrollable-content::-webkit-scrollbar { display: none; } /* 隱藏捲軸 */
    
    /* ========== 左欄：巴士資訊 ========== */
    .bus-item {
        border-bottom: 1px solid #333;
        padding: 10px 0;
    }
    .bus-item:last-child { border-bottom: none; }
    
    .bus-title {
        font-size: 34px;
        line-height: 1.2;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
    }
    .bus-badge {
        display: inline-block;
        padding: 0 12px;
        border-radius: 8px;
        margin-right: 10px;
        font-weight: bold;
    }
    .bus-eta-container {
        font-size: 32px;
        line-height: 1.2;
        word-wrap: break-word;
    }
    .eta-mango { color: #FFCC00; }
    .eta-white { color: #FFF; }
    .no-bus { color: #888; font-size: 32px; }

    /* ========== 右欄：天氣與時間 ========== */
    #right-col-content {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 時間與日期 */
    #time-container {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin-top: 10px;
        line-height: 1;
    }
    #ampm { font-size: 40px; margin-right: 10px; }
    #time-val { font-size: 100px; font-weight: bold; }
    #date-val { font-size: 30px; margin-bottom: 15px; margin-top: 5px; }

    /* 天氣資訊 (極致緊湊) */
    .weather-row {
        font-size: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.1;
    }
    #weather-icon { height: 40px; vertical-align: middle; margin-right: 8px; }
    .temp-red { color: #FF3333; }
    .temp-blue { color: #3399FF; }

    /* 天氣警告 */
    #weather-warn-container {
        margin-top: 15px;
        text-align: center;
        min-height: 40px;
    }
    .warn-badge {
        background-color: #CC0000;
        color: #FFF;
        font-size: 30px;
        padding: 5px 15px;
        border-radius: 10px;
        display: inline-block;
        margin: 5px;
    }
    .no-warn { color: #888; font-size: 30px; }

    /* 特別天氣提示 (跑馬燈) */
    #weather-tips-container {
        width: 95%;
        margin-top: 15px;
        height: 144px; /* 約4行 30px 的高度 */
        overflow: hidden;
        position: relative;
    }
    #weather-tips-content {
        font-size: 30px;
        line-height: 1.2;
        position: absolute;
        width: 100%;
        text-align: left;
    }

    /* ========== 底部：新聞跑馬燈 ========== */
    #news-footer {
        height: 70px;
        background-color: #1a1a1a;
        display: flex;
        align-items: center;
        border-top: 2px solid #444;
        flex-shrink: 0;
    }
    #news-label {
        background-color: #CC0000;
        color: #FFF;
        font-size: 45px;
        font-weight: bold;
        padding: 0 15px;
        height: 100%;
        display: flex;
        align-items: center;
        white-space: nowrap;
        z-index: 10;
        box-shadow: 5px 0 15px rgba(0,0,0,0.8);
    }
    #news-marquee-container {
        flex: 1;
        overflow: hidden;
        position: relative;
        height: 100%;
    }
    #news-marquee {
        font-size: 45px;
        white-space: nowrap;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
    }
    .news-separator {
        color: #888;
        font-weight: bold;
        margin: 0 20px;
    }
</style>
</head>
<body>

<div id="main-content">
    <!-- 左欄：巴士資訊 -->
    <div class="col">
        <div class="header-time" id="bus-update-time">最後更新：--:--:--（每30秒自動刷新）</div>
        <div class="scrollable-content" id="bus-list">
            <!-- 巴士資料將由 JS 動態生成 -->
        </div>
    </div>

    <!-- 右欄：天氣與時間 -->
    <div class="col">
        <div class="header-time" id="weather-update-time">最後更新：--:--:--（每5分鐘自動刷新）</div>
        <div class="scrollable-content" id="right-col-content">
            <!-- 時間與日期 -->
            <div id="time-container">
                <span id="ampm"></span>
                <span id="time-val">--:--</span>
            </div>
            <div id="date-val">----年--月--日 星期-</div>
            
            <!-- 天氣溫度濕度 -->
            <div class="weather-row" id="weather-row1">
                <img id="weather-icon" src="" alt="icon" style="display:none;"> 
                <span id="current-temp">--°C(青衣)</span> &nbsp;💧<span id="current-hum">--%</span>
            </div>
            <div class="weather-row">
                ❄️<span class="temp-blue" id="min-temp">--°C</span> &nbsp;☀️<span class="temp-red" id="max-temp">--°C</span>
            </div>

            <!-- 天氣警告 -->
            <div id="weather-warn-container">
                <span class="no-warn">載入中...</span>
            </div>

            <!-- 特別天氣提示 -->
            <div id="weather-tips-container">
                <div id="weather-tips-content">
                    <span class="no-warn">載入中...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 底部：即時新聞 -->
<div id="news-footer">
    <div id="news-label">即時新聞</div>
    <div id="news-marquee-container">
        <div id="news-marquee">載入中...</div>
    </div>
</div>

<script>
/* ================= 系統與時間設定 ================= */
function updateClock() {
    const now = new Date();
    
    // 時鐘
    let h = now.getHours();
    let m = now.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? '下午' : '上午';
    h = h % 12;
    if (h === 0) h = 12;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('time-val').textContent = `${h}:${m}`;
    
    // 日期
    const days = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('date-val').textContent = 
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
}
setInterval(updateClock, 1000);
updateClock();

function get24hTimeString() {
    const now = new Date();
    return now.getHours().toString().padStart(2, '0') + ':' + 
           now.getMinutes().toString().padStart(2, '0') + ':' + 
           now.getSeconds().toString().padStart(2, '0');
}

/* ================= 巴士資訊系統 (30秒更新) ================= */
const busConfig = [
    { id: '249X', dir: '博康', stop: '青桃樓', color: '#0052CC', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
    { id: '42A', dir: '西九龍', stop: '青桃樓', color: '#007A33', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
    { id: '43', dir: '荃灣西', stop: '青桃樓', color: '#C64B00', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
    { id: '49M', dir: '青衣站', stop: '青富苑', color: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
    { id: '49M', dir: '青富苑', stop: '青衣站', color: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
    { id: '68E', dir: '元朗', stop: '青衣站', color: '#006666', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
    { id: '243M', dir: '荃灣', stop: '美景花園', color: '#5C3A21', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
];

async function fetchBusData() {
    const container = document.getElementById('bus-list');
    container.innerHTML = ''; 
    const now = new Date();
    
    for (const bus of busConfig) {
        let busHTML = `
            <div class="bus-item">
                <div class="bus-title">
                    <span class="bus-badge" style="background-color: ${bus.color};">${bus.id}</span>
                    往${bus.dir} 📍${bus.stop}
                </div>
                <div class="bus-eta-container">
        `;
        
        try {
            const res = await fetch(bus.url);
            const data = await res.json();
            const etas = data.data.filter(eta => eta.eta !== null);
            
            if (etas.length === 0) {
                busHTML += `<span class="no-bus">暫無班次資料</span>`;
            } else {
                // 取最近三班車
                const times = etas.slice(0, 3).map(etaData => {
                    const etaTime = new Date(etaData.eta);
                    const diffMs = etaTime - now;
                    let diffMins = Math.floor(diffMs / 60000);
                    if (diffMins < 0) diffMins = 0;
                    
                    // 12小時制 (不含上下午)
                    let h12 = etaTime.getHours() % 12;
                    if (h12 === 0) h12 = 12;
                    let m = etaTime.getMinutes().toString().padStart(2, '0');
                    const timeStr = `${h12}:${m}`;
                    
                    const colorClass = diffMins < 10 ? 'eta-mango' : 'eta-white';
                    return `<span class="eta-white">${timeStr}</span><span class="${colorClass}">(${diffMins}分鐘)</span>`;
                });
                busHTML += times.join(' | ');
            }
        } catch (e) {
            busHTML += `<span class="no-bus">資料擷取失敗</span>`;
        }
        
        busHTML += `</div></div>`;
        container.innerHTML += busHTML;
    }
    document.getElementById('bus-update-time').textContent = `最後更新：${get24hTimeString()}（每30秒自動刷新）`;
}
fetchBusData();
setInterval(fetchBusData, 30000);

/* ================= 天氣資訊系統 (5分鐘更新) ================= */
const HKO_RHRREAD = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
const HKO_FND = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';
const HKO_WARN = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';
const HKO_SWT = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc';

async function fetchWeather() {
    try {
        // 1. 現時天氣 (青衣溫度、整體濕度、圖標)
        const resRhr = await fetch(HKO_RHRREAD);
        const rhrData = await resRhr.json();
        
        const tyTemp = rhrData.temperature.data.find(d => d.place === '青衣');
        if (tyTemp) document.getElementById('current-temp').textContent = `${tyTemp.value}°C(青衣)`;
        
        const humidity = rhrData.humidity.data[0].value;
        document.getElementById('current-hum').textContent = `${humidity}%`;
        
        const iconId = rhrData.icon[0];
        const iconEl = document.getElementById('weather-icon');
        iconEl.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
        iconEl.style.display = 'inline-block';

        // 2. 預報 (最高低溫)
        const resFnd = await fetch(HKO_FND);
        const fndData = await resFnd.json();
        const todayForecast = fndData.weatherForecast[0];
        document.getElementById('max-temp').textContent = `${todayForecast.forecastMaxtemp.value}°C`;
        document.getElementById('min-temp').textContent = `${todayForecast.forecastMintemp.value}°C`;

        // 3. 天氣警告
        const resWarn = await fetch(HKO_WARN);
        const warnData = await resWarn.json();
        const warnContainer = document.getElementById('weather-warn-container');
        if (Object.keys(warnData).length === 0 || warnData.details === undefined) {
             warnContainer.innerHTML = `<span class="no-warn">現時沒有生效的警告</span>`;
        } else {
             let warnHtml = '';
             for (const key in warnData) {
                 warnHtml += `<div class="warn-badge">${warnData[key].name}</div>`;
             }
             warnContainer.innerHTML = warnHtml;
        }

        // 4. 特別天氣提示
        const resSwt = await fetch(HKO_SWT);
        const swtData = await resSwt.json();
        const tipsContent = document.getElementById('weather-tips-content');
        if (!swtData.swt || swtData.swt.length === 0) {
            tipsContent.innerHTML = `<span class="no-warn">現時沒有特別天氣提示</span>`;
            tipsContent.style.transform = 'translateY(0)'; // 重置動畫
        } else {
            let tipsStr = swtData.swt.map((item, index) => `${index + 1}. ${item.desc}`).join('<br>');
            tipsContent.innerHTML = tipsStr;
            setupWeatherTipsAnimation();
        }

        document.getElementById('weather-update-time').textContent = `最後更新：${get24hTimeString()}（每5分鐘自動刷新）`;
    } catch (e) {
        console.error("Weather API Error:", e);
    }
}
fetchWeather();
setInterval(fetchWeather, 300000);

// 特別天氣提示 Y 軸跑馬燈處理
let tipsAnimation;
function setupWeatherTipsAnimation() {
    const container = document.getElementById('weather-tips-container');
    const content = document.getElementById('weather-tips-content');
    
    if (tipsAnimation) tipsAnimation.cancel();
    content.style.transform = 'translateY(0)';
    
    const containerHeight = container.clientHeight;
    const contentHeight = content.scrollHeight;
    
    if (contentHeight > containerHeight) {
        // 從下往上滾動
        const duration = (contentHeight / 30) * 1000; // 每秒30px
        tipsAnimation = content.animate([
            { transform: `translateY(${containerHeight}px)` },
            { transform: `translateY(-${contentHeight}px)` }
        ], {
            duration: duration,
            iterations: Infinity,
            easing: 'linear'
        });
    }
}

/* ================= 新聞跑馬燈系統 (動態計算 80px/s 勻速) ================= */
const RSS_URL = 'https://news.mingpao.com/rss/ins/all.xml';
const PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(RSS_URL);

let newsAnimation;

async function fetchAndAnimateNews() {
    try {
        const res = await fetch(PROXY_URL);
        const str = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(str, "text/xml");
        const items = xmlDoc.querySelectorAll("item");
        
        let newsTitles = [];
        let index = 1;
        
        // 讀取當天與昨天的邏輯（簡單化：直接抓取 RSS 內的即時新聞，因為這通常只包含近兩日的資訊）
        items.forEach(item => {
            const title = item.querySelector("title").textContent;
            newsTitles.push(`${index}. ${title}`);
            index++;
        });

        const marqueeEl = document.getElementById('news-marquee');
        if (newsTitles.length === 0) {
            marqueeEl.innerHTML = "暫無新聞資料";
            return;
        }

        // 以厚垂直線 ▌ 隔開
        marqueeEl.innerHTML = newsTitles.join('<span class="news-separator">▌</span>');
        
        // 準備計算像素級勻速 (80px/sec)
        const containerWidth = document.getElementById('news-marquee-container').clientWidth;
        const textWidth = marqueeEl.scrollWidth;
        const distance = containerWidth + textWidth;
        const duration = (distance / 80) * 1000; // 毫秒
        
        if (newsAnimation) newsAnimation.cancel();
        
        newsAnimation = marqueeEl.animate([
            { transform: `translateX(${containerWidth}px)` },
            { transform: `translateX(-${textWidth}px)` }
        ], {
            duration: duration,
            iterations: 1,
            easing: 'linear'
        });

        // 動畫結束後自動重新擷取並再次滾動
        newsAnimation.onfinish = fetchAndAnimateNews;
        
    } catch (e) {
        console.error("News API Error:", e);
        document.getElementById('news-marquee').innerHTML = "即時新聞載入失敗，稍後重試...";
        setTimeout(fetchAndAnimateNews, 10000);
    }
}

// 啟動新聞跑馬燈
fetchAndAnimateNews();

// 視窗大小改變時，重新計算高度和動畫
window.addEventListener('resize', () => {
    setupWeatherTipsAnimation();
});
</script>
</body>
</html>
