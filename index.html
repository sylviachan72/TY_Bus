<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TY0902儀表板</title>
  <style>
    /* ==========================================
       全域樣式設定
       ========================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 主內容雙欄區塊 */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* 通用欄位與滾動條設定 (隱藏滾動條但保持可滑動) */
    .column {
      width: 50%;
      padding: 8px 12px;
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    .column::-webkit-scrollbar {
      display: none; /* Chrome / Safari */
    }

    .left-column {
      border-right: 1px solid #222222;
    }

    /* 頂部最後更新時間標籤 */
    .update-header {
      font-size: 20px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    /* ==========================================
       左欄：巴士資訊樣式
       ========================================== */
    .bus-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bus-item {
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 8px;
    }

    .bus-header {
      font-size: 34px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 巴士號碼圓角標籤 */
    .bus-tag {
      padding: 2px 12px;
      border-radius: 8px;
      color: #ffffff;
      display: inline-block;
      font-weight: bold;
    }

    .bus-dest-stop {
      color: #ffffff;
    }

    /* 巴士班次容器 */
    .bus-eta-container {
      font-size: 32px;
      color: #ffffff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      row-gap: 4px;
    }

    /* 每一組班次 (到達時間 + 倒數分鐘)，強制不跨行拆分 */
    .eta-group {
      white-space: nowrap;
      display: inline-block;
    }

    .eta-time {
      color: #ffffff;
    }

    /* 少於10分鐘顯示芒果黃，其餘顯示白色 */
    .eta-min-yellow {
      color: #FFC107;
      font-weight: bold;
    }
    .eta-min-white {
      color: #ffffff;
    }

    .eta-sep {
      color: #ffffff;
      margin: 0 6px;
    }

    .no-eta {
      font-size: 32px;
      color: #888888;
    }

    /* ==========================================
       右欄：時間與天氣樣式
       ========================================== */
    .weather-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-section {
      text-align: center;
      margin-bottom: 0px;
      width: 100%;
    }

    .time-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      margin-bottom: 2px;
    }

    .ampm {
      font-size: 40px;
      color: #ffffff;
      margin-right: 12px;
      font-weight: bold;
    }

    .clock {
      font-size: 100px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: -2px;
    }

    .date-display {
      font-size: 30px;
      color: #ffffff;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* 天氣數據列 (零縫隙極致緊湊) */
    .weather-data-box {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .weather-row-1 {
      font-size: 32px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      line-height: 1.1;
    }

    .weather-icon {
      height: 42px;
      width: auto;
      vertical-align: middle;
    }

    .weather-row-2 {
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 0;
      padding: 0;
      line-height: 1.1;
    }

    .temp-min {
      color: #4D94FF; /* 鮮藍色 */
      font-weight: bold;
    }

    .temp-max {
      color: #FF4D4D; /* 鮮紅色 */
      font-weight: bold;
    }

    /* 天氣警告與特別提示區塊 */
    .info-block {
      width: 100%;
      text-align: left;
      margin-top: 6px;
    }

    .warning-badge {
      font-size: 30px;
      background-color: #E53935;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 8px;
      display: inline-block;
      font-weight: bold;
      margin-bottom: 6px;
      margin-right: 6px;
    }

    .warning-none, .swt-none {
      font-size: 30px;
      color: #888888;
      text-align: left;
    }

    /* 特別天氣提示跑馬燈容器 */
    .swt-container {
      font-size: 30px;
      color: #ffffff;
      line-height: 1.35;
      text-align: left;
      max-height: 160px;
      overflow: hidden;
      position: relative;
    }

    .swt-scroll-content {
      display: inline-block;
    }

    @keyframes verticalMarquee {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .swt-animated {
      animation: verticalMarquee 15s linear infinite;
    }
    .swt-animated:hover {
      animation-play-state: paused;
    }

    /* ==========================================
       底部：即時新聞跑馬燈 (使用 CSS 硬件加速)
       ========================================== */
    .news-bar {
      height: 65px;
      background-color: #000000;
      border-top: 2px solid #333333;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      width: 100vw;
    }

    .news-label {
      background-color: #E53935;
      color: #ffffff;
      font-size: 45px;
      font-weight: bold;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
      white-space: nowrap;
    }

    .news-track-wrapper {
      flex: 1;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
    }

    /* CSS 硬件加速跑馬燈軌道 */
    .news-track {
      position: absolute;
      white-space: nowrap;
      font-size: 45px;
      color: #ffffff;
      display: flex;
      align-items: center;
      /* 開啟 GPU 硬件加速 */
      will-change: transform;
      transform: translateZ(0);
    }

    /* 動態建立動畫位移量 */
    @keyframes marqueeNews {
      0% { transform: translateX(var(--start-x)); }
      100% { transform: translateX(var(--end-x)); }
    }
  </style>
</head>
<body>

  <!-- 主內容區劃分為兩欄 -->
  <div class="main-container">
    
    <!-- 左欄：巴士實時報站資訊 -->
    <div class="column left-column">
      <div class="update-header" id="bus-update-header">最後更新：--:--:--（每30秒自動刷新）</div>
      <div class="bus-list" id="bus-list-container">
        <!-- 由 JavaScript 自動動態生成巴士路線 -->
      </div>
    </div>

    <!-- 右欄：時間與天氣資訊 -->
    <div class="column weather-column">
      <div class="update-header" id="weather-update-header">最後更新：--:--:--（每5分鐘自動刷新）</div>
      
      <!-- 現在時間與日期 -->
      <div class="time-section">
        <div class="time-display">
          <span class="ampm" id="clock-ampm">--</span>
          <span class="clock" id="clock-time">--:--</span>
        </div>
        <div class="date-display" id="date-display">----年--月--日 星期-</div>
      </div>

      <!-- 天氣數據列 (零縫隙) -->
      <div class="weather-data-box">
        <div class="weather-row-1">
          <img id="wx-icon" class="weather-icon" src="" alt="" style="display:none;">
          <span id="tsing-yi-temp">--°C(青衣)</span>
          <span id="humidity">💧--%</span>
        </div>
        <div class="weather-row-2">
          <span class="temp-min" id="temp-min">❄️--°C</span>
          <span class="temp-max" id="temp-max">☀️--°C</span>
        </div>
      </div>

      <!-- 天氣警告區塊 -->
      <div class="info-block">
        <div id="warning-container">
          <div class="warning-none">現時沒有生效的警告</div>
        </div>
      </div>

      <!-- 特別天氣提示區塊 -->
      <div class="info-block" style="margin-top: 10px;">
        <div id="swt-container" class="swt-container">
          <div class="swt-none">現時沒有特別天氣提示</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 底部：即時新聞跑馬燈 -->
  <div class="news-bar">
    <div class="news-label">即時新聞</div>
    <div class="news-track-wrapper" id="news-wrapper">
      <div class="news-track" id="news-track">正在載入即時新聞...</div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. 巴士路線資料配置與邏輯
       ========================================== */
    const BUS_ROUTES = [
      { id: '249X', routeDisplay: '249X', dest: '往博康', stop: '📍青桃樓', bg: '#0052CC', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', filterDir: null },
      { id: '42A',  routeDisplay: '42A',  dest: '往西九龍', stop: '📍青桃樓', bg: '#007A33', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', filterDir: null },
      { id: '43',   routeDisplay: '43',   dest: '往荃灣西', stop: '📍青桃樓', bg: '#C64B00', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', filterDir: null },
      { id: '49M_1',routeDisplay: '49M',  dest: '往青衣站', stop: '📍青富苑', bg: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', filterDir: null },
      { id: '49M_2',routeDisplay: '49M',  dest: '往青富苑', stop: '📍青衣站', bg: '#6B238E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', filterDir: null },
      { id: '68E',  routeDisplay: '68E',  dest: '往元朗',   stop: '📍青衣站', bg: '#006666', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', filterDir: null },
      { id: '243M', routeDisplay: '243M', dest: '往荃灣',   stop: '📍美景花園', bg: '#5C3A21', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', filterDir: 'O' }
    ];

    function initBusLayout() {
      const container = document.getElementById('bus-list-container');
      container.innerHTML = '';
      BUS_ROUTES.forEach(route => {
        const item = document.createElement('div');
        item.className = 'bus-item';
        item.innerHTML = `
          <div class="bus-header">
            <span class="bus-tag" style="background-color: ${route.bg};">${route.routeDisplay}</span>
            <span class="bus-dest-stop">${route.dest} ${route.stop}</span>
          </div>
          <div class="bus-eta-container" id="eta-box-${route.id}">
            <span class="no-eta">更新中...</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function formatTime12h(dateObj) {
      let hours = dateObj.getHours();
      let minutes = dateObj.getMinutes();
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMins = minutes < 10 ? '0' + minutes : minutes;
      return `${strHours}:${strMins}`;
    }

    async function fetchBusData() {
      const now = new Date();
      document.getElementById('bus-update-header').innerText = `最後更新：${format24hTime(now)}（每30秒自動刷新）`;

      for (const route of BUS_ROUTES) {
        try {
          const res = await fetch(route.url);
          if (!res.ok) throw new Error('API Error');
          const json = await res.json();
          let dataList = json.data || [];

          if (route.filterDir) {
            dataList = dataList.filter(item => item.dir === route.filterDir);
          }

          const validEtas = dataList
            .filter(item => item.eta)
            .sort((a, b) => new Date(a.eta) - new Date(b.eta))
            .slice(0, 3);

          const etaBox = document.getElementById(`eta-box-${route.id}`);

          if (validEtas.length === 0) {
            etaBox.innerHTML = `<span class="no-eta">暫無班次資料</span>`;
            continue;
          }

          const etaHtmlParts = validEtas.map(item => {
            const etaDate = new Date(item.eta);
            const timeStr = formatTime12h(etaDate);
            const diffMins = Math.max(0, Math.floor((etaDate - now) / 60000));

            const minClass = diffMins < 10 ? 'eta-min-yellow' : 'eta-min-white';
            return `<span class="eta-group"><span class="eta-time">${timeStr}</span><span class="${minClass}">(${diffMins}分鐘)</span></span>`;
          });

          etaBox.innerHTML = etaHtmlParts.join('<span class="eta-sep">|</span>');

        } catch (err) {
          console.error(`Bus fetch error [${route.id}]:`, err);
          const etaBox = document.getElementById(`eta-box-${route.id}`);
          if (etaBox) etaBox.innerHTML = `<span class="no-eta">暫無班次資料</span>`;
        }
      }
    }

    /* ==========================================
       2. 時鐘與日期邏輯
       ========================================== */
    function format24hTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const ampm = hours >= 12 ? '下午' : '上午';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMins = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('clock-ampm').innerText = ampm;
      document.getElementById('clock-time').innerText = `${strHours}:${strMins}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const weekStr = weekDays[now.getDay()];

      document.getElementById('date-display').innerText = `${year}年${month}月${day}日 ${weekStr}`;
    }


    /* ==========================================
       3. 天氣報告與警告邏輯
       ========================================== */
    const WARNING_CODE_MAP = {
      'WFIREY': '黃色火災危險警告',
      'WFIRER': '紅色火災危險警告',
      'WRAINA': '黃色暴雨警告信號',
      'WRAINR': '紅色暴雨警告信號',
      'WRAINB': '黑色暴雨警告信號',
      'TC1': '一號戒備信號',
      'TC3': '三號強風信號',
      'TC8NE': '八號東北烈風或暴風信號',
      'TC8SE': '八號東南烈風或暴風信號',
      'TC8SW': '八號西南烈風或暴風信號',
      'TC8NW': '八號西北烈風或暴風信號',
      'TC9': '九號烈風或暴風風力增強信號',
      'TC10': '十號颶風信號',
      'CANCEL': '取消所有熱帶氣旋警告信號'
    };

    async function fetchWeatherData() {
      const now = new Date();
      document.getElementById('weather-update-header').innerText = `最後更新：${format24hTime(now)}（每5分鐘自動刷新）`;

      try {
        const resRhr = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dataRhr = await resRhr.json();

        if (dataRhr.humidity && dataRhr.humidity.data.length > 0) {
          document.getElementById('humidity').innerText = `💧${dataRhr.humidity.data[0].value}%`;
        }

        if (dataRhr.temperature && dataRhr.temperature.data) {
          const tsingYiData = dataRhr.temperature.data.find(t => t.place === '青衣') || dataRhr.temperature.data[0];
          if (tsingYiData) {
            document.getElementById('tsing-yi-temp').innerText = `${tsingYiData.value}°C(青衣)`;
          }
        }

        if (dataRhr.icon && dataRhr.icon.length > 0) {
          const iconCode = dataRhr.icon[0];
          const iconImg = document.getElementById('wx-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
          iconImg.style.display = 'inline-block';
        }
      } catch (e) {
        console.error('Error fetching rhrread:', e);
      }

      try {
        const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const dataFnd = await resFnd.json();
        if (dataFnd.weatherForecast && dataFnd.weatherForecast.length > 0) {
          const todayFnd = dataFnd.weatherForecast[0];
          document.getElementById('temp-min').innerText = `❄️${todayFnd.forecastMintemp.value}°C`;
          document.getElementById('temp-max').innerText = `☀️${todayFnd.forecastMaxtemp.value}°C`;
        }
      } catch (e) {
        console.error('Error fetching fnd:', e);
      }

      try {
        const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const dataWarn = await resWarn.json();
        const warnContainer = document.getElementById('warning-container');
        warnContainer.innerHTML = '';

        let activeWarnings = [];
        if (dataWarn && Object.keys(dataWarn).length > 0) {
          for (const key in dataWarn) {
            const warnObj = dataWarn[key];
            const code = warnObj.code || key;
            const name = WARNING_CODE_MAP[code] || warnObj.name || code;
            if (code !== 'CANCEL') {
              activeWarnings.push(name);
            }
          }
        }

        if (activeWarnings.length > 0) {
          activeWarnings.forEach(wName => {
            const badge = document.createElement('div');
            badge.className = 'warning-badge';
            badge.innerText = wName;
            warnContainer.appendChild(badge);
          });
        } else {
          warnContainer.innerHTML = `<div class="warning-none">現時沒有生效的警告</div>`;
        }
      } catch (e) {
        console.error('Error fetching warnsum:', e);
        document.getElementById('warning-container').innerHTML = `<div class="warning-none">現時沒有生效的警告</div>`;
      }

      try {
        const resSwt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
        const dataSwt = await resSwt.json();
        const swtContainer = document.getElementById('swt-container');
        swtContainer.innerHTML = '';

        if (dataSwt && dataSwt.swt && dataSwt.swt.length > 0) {
          const tips = dataSwt.swt;
          let tipTexts = tips.map((t, idx) => `${idx + 1}. ${t.desc}`);
          
          const fullContent = tipTexts.join('<br>');
          const wrapper = document.createElement('div');
          
          if (tips.length >= 2 || fullContent.length > 80) {
            wrapper.className = 'swt-scroll-content swt-animated';
            wrapper.innerHTML = `${fullContent}<br><br>${fullContent}<br><br>`;
          } else {
            wrapper.className = 'swt-scroll-content';
            wrapper.innerHTML = fullContent;
          }
          swtContainer.appendChild(wrapper);
        } else {
          swtContainer.innerHTML = `<div class="swt-none">現時沒有特別天氣提示</div>`;
        }
      } catch (e) {
        console.error('Error fetching swt:', e);
        document.getElementById('swt-container').innerHTML = `<div class="swt-none">現時沒有特別天氣提示</div>`;
      }
    }

    /* ==========================================
       4. 明報 RSS 即時新聞 (改用 AllOrigins 代理抓取完整清單)
       ========================================== */
    async function fetchAndStartNewsMarquee() {
      const track = document.getElementById('news-track');
      const wrapper = document.getElementById('news-wrapper');

      // 暫停動畫以重新配置
      track.style.animation = 'none';

      try {
        // 使用 allorigins 代理獲取完整的 RSS 原始檔，解除 10 筆限制
        const rssUrl = 'https://news.mingpao.com/rss/ins/all.xml';
        const apiUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
        
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('News API fetch error');
        
        // 解析完整的 XML
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = Array.from(xmlDoc.querySelectorAll('item'));

        // 定義今天與昨天的時間範圍
        const now = new Date();
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        yesterday.setHours(0, 0, 0, 0); // 昨天的 00:00:00

        const filteredTitles = [];
        
        // 遍歷所有新聞項目，過濾出昨天與今天的內容
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent;
          const pubDateStr = item.querySelector('pubDate')?.textContent;
          
          if (title) {
            if (pubDateStr) {
              const pubDate = new Date(pubDateStr);
              if (pubDate >= yesterday) {
                filteredTitles.push(title.trim());
              }
            } else {
              // 假如沒有時間戳，也一併加入
              filteredTitles.push(title.trim());
            }
          }
        });

        if (filteredTitles.length === 0) {
          track.innerText = '暫無即時新聞內容';
          return;
        }

        // 串接所有符合條件的新聞標題
        const formattedNews = filteredTitles.map((t, idx) => `${idx + 1}. ${t}`).join(' &nbsp;|&nbsp; ');
        track.innerHTML = `&nbsp;&nbsp;${formattedNews}&nbsp;&nbsp;`;

        // 計算動畫需要的參數
        const wrapperWidth = wrapper.offsetWidth;
        const trackWidth = track.scrollWidth;
        const totalDistance = wrapperWidth + trackWidth;
        const speedPxPerSec = 80;
        const durationSec = totalDistance / speedPxPerSec;

        track.style.setProperty('--start-x', `${wrapperWidth}px`);
        track.style.setProperty('--end-x', `-${trackWidth}px`);

        // 強制瀏覽器重繪 (Reflow) 以重啟動畫
        void track.offsetWidth;

        // 綁定 CSS 動畫
        track.style.animation = `marqueeNews ${durationSec}s linear forwards`;

        // 監聽動畫結束事件，結束後重新抓取並播放
        track.onanimationend = () => {
          fetchAndStartNewsMarquee();
        };

      } catch (e) {
        console.error('News marquee error:', e);
        track.innerText = '即時新聞載入失敗，將於稍後重試';
        setTimeout(fetchAndStartNewsMarquee, 10000); // 10秒後重試
      }
    }

    /* ==========================================
       5. 頁面初始化與定時刷新器
       ========================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initBusLayout();
      updateClock();
      setInterval(updateClock, 1000);
      fetchBusData();
      setInterval(fetchBusData, 30000);
      fetchWeatherData();
      setInterval(fetchWeatherData, 300000);
      fetchAndStartNewsMarquee();
    });
  </script>
</body>
</html>
