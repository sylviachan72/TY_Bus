<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊面板</title>
    <style>
        /* 重置與全域設定 */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #000000;
            color: #FFFFFF;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部：最後更新時間 */
        .header {
            text-align: center;
            font-size: 20px;
            color: #888888;
            padding: 4px 0;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
            background-color: #000;
        }

        /* 中間主體：左右雙欄 */
        .main-content {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 100px);
        }
        .col {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 10px 15px;
            /* 隱藏滾動條 */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .col::-webkit-scrollbar { display: none; }
        .col-left { border-right: 1px solid #333333; }

        /* 左欄：巴士資訊 */
        .bus-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222222;
        }
        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .bus-no {
            font-size: 34px;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 12px;
            color: white;
            line-height: 1.2;
        }
        .bus-desc {
            font-size: 34px;
            color: white;
            line-height: 1.2;
        }
        .bus-etas {
            font-size: 32px;
            line-height: 1.4;
            word-wrap: break-word;
            color: #FFFFFF;
        }
        .mango { color: #FFB300; } /* 芒果黃 */

        /* 右欄：時間與天氣 */
        .time-container { text-align: center; margin-bottom: 0px; }
        .time-clock { font-size: 100px; font-weight: bold; line-height: 1; margin: 0; }
        .time-ampm { font-size: 40px; }
        .date-text { font-size: 30px; text-align: center; margin-top: 5px; margin-bottom: 15px; }

        .weather-info { text-align: center; font-size: 32px; margin-bottom: 10px; }
        .weather-row { display: flex; justify-content: center; align-items: center; gap: 8px; line-height: 1.1; }
        .weather-row2 { line-height: 1.1; margin-top: 0px; }
        .weather-icon { height: 42px; vertical-align: middle; }
        .temp-blue { color: #4facfe; }
        .temp-red { color: #ff4b2b; }

        .warning-container { text-align: center; margin-bottom: 10px; min-height: 40px; }
        .warning-badge {
            display: inline-block;
            background-color: #CC0000;
            color: white;
            font-size: 30px;
            padding: 6px 14px;
            border-radius: 10px;
            margin: 4px;
        }
        .no-warning { color: #555555; font-size: 30px; }

        /* 特別天氣提示 (支援跑馬燈) */
        .swt-wrapper {
            position: relative;
            height: 180px; /* 限制最高 5 行 (30px * 1.2 * 5) */
            overflow: hidden;
            width: 100%;
        }
        .swt-content {
            font-size: 30px;
            line-height: 1.2;
            margin: 0;
            text-align: left;
            width: 100%;
            position: absolute;
        }
        .swt-scroll {
            animation: scrollUp 15s linear infinite;
        }
        @keyframes scrollUp {
            0% { transform: translateY(180px); }
            100% { transform: translateY(-100%); }
        }

        /* 底部：即時新聞 */
        .news-bar {
            height: 65px;
            background: #111111;
            display: flex;
            align-items: center;
            border-top: 1px solid #333333;
            flex-shrink: 0;
        }
        .news-label {
            background: #E60000;
            color: white;
            font-size: 45px;
            line-height: 65px;
            padding: 0 15px;
            font-weight: bold;
            white-space: nowrap;
            z-index: 10;
        }
        .news-marquee-container {
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 100%;
        }
        .news-marquee-text {
            display: inline-block;
            font-size: 45px;
            line-height: 65px;
            padding-left: 100%;
            animation: marquee 30s linear infinite;
        }
        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="header" id="last-update">最後更新：加載中...</div>

    <div class="main-content">
        <div class="col col-left">
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #1890ff;">249X</div>
                    <div class="bus-desc">往博康 📍青桃樓</div>
                </div>
                <div class="bus-etas" id="eta-249X">資料加載中...</div>
            </div>
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #52c41a;">42A</div>
                    <div class="bus-desc">往西九龍 📍青桃樓</div>
                </div>
                <div class="bus-etas" id="eta-42A">資料加載中...</div>
            </div>
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #fa8c16;">43</div>
                    <div class="bus-desc">往荃灣西 📍青桃樓</div>
                </div>
                <div class="bus-etas" id="eta-43">資料加載中...</div>
            </div>
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #eb2f96;">49M</div>
                    <div class="bus-desc">往青衣站 📍青富苑</div>
                </div>
                <div class="bus-etas" id="eta-49M_TY">資料加載中...</div>
            </div>
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #eb2f96;">49M</div>
                    <div class="bus-desc">往青富苑 📍青衣站</div>
                </div>
                <div class="bus-etas" id="eta-49M_QF">資料加載中...</div>
            </div>
            <div class="bus-item">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #fadb14; color: black;">68E</div>
                    <div class="bus-desc">往元朗 📍青衣站</div>
                </div>
                <div class="bus-etas" id="eta-68E">資料加載中...</div>
            </div>
            <div class="bus-item" style="border-bottom: none;">
                <div class="bus-header">
                    <div class="bus-no" style="background-color: #722ed1;">243M</div>
                    <div class="bus-desc">往荃灣 📍美景花園</div>
                </div>
                <div class="bus-etas" id="eta-243M">資料加載中...</div>
            </div>
        </div>

        <div class="col col-right">
            <div class="time-container">
                <div class="time-clock" id="clock-time"><span class="time-ampm">--</span> --:--</div>
                <div class="date-text" id="clock-date">----年--月--日 星期-</div>
            </div>

            <div class="weather-info">
                <div class="weather-row" id="weather-row1">
                    <span style="color:#666;">天氣載入中...</span>
                </div>
                <div class="weather-row2" id="weather-row2"></div>
            </div>

            <div class="warning-container" id="warning-box">
                <div class="no-warning">現時沒有生效的警告</div>
            </div>

            <div class="swt-wrapper">
                <div class="swt-content" id="swt-content">
                    <div class="no-warning" style="text-align: center; margin-top: 50px;">現時沒有特別天氣提示</div>
                </div>
            </div>
        </div>
    </div>

    <div class="news-bar">
        <div class="news-label">即時新聞</div>
        <div class="news-marquee-container">
            <div class="news-marquee-text" id="news-marquee-text">新聞載入中...</div>
        </div>
    </div>

    <script>
        // ==========================
        // 時鐘與更新時間邏輯
        // ==========================
        const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        function updateClock() {
            let now = new Date();
            let hh = now.getHours();
            let mm = String(now.getMinutes()).padStart(2, '0');
            let ampm = hh >= 12 ? '下午' : '上午';
            let displayH = hh % 12 || 12;
            
            document.getElementById('clock-time').innerHTML = `<span class="time-ampm">${ampm}</span> ${displayH}:${mm}`;
            document.getElementById('clock-date').innerHTML = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
        }
        
        function updateUpdateTimer() {
            let now = new Date();
            let hh = String(now.getHours()).padStart(2, '0');
            let mm = String(now.getMinutes()).padStart(2, '0');
            let ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('last-update').innerText = `最後更新：${hh}:${mm}:${ss}`;
        }

        // ==========================
        // 巴士 ETA 獲取邏輯
        // ==========================
        const busRoutes = [
            { id: 'eta-249X', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', destPrefix: '博康' },
            { id: 'eta-42A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', destPrefix: '西九' },
            { id: 'eta-43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', destPrefix: '荃灣' },
            { id: 'eta-49M_TY', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', destPrefix: '青衣' },
            { id: 'eta-49M_QF', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', destPrefix: '青富' },
            { id: 'eta-68E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', destPrefix: '元朗' },
            { id: 'eta-243M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', destPrefix: '荃灣' }
        ];

        async function updateBuses() {
            for (let bus of busRoutes) {
                try {
                    let res = await fetch(bus.url);
                    let json = await res.json();
                    
                    // 過濾目的地並確保包含 ETA
                    let etas = json.data.filter(d => d.eta && d.dest_tc.includes(bus.destPrefix));
                    etas.sort((a,b) => new Date(a.eta) - new Date(b.eta));
                    let next3 = etas.slice(0, 3);
                    
                    if (next3.length === 0) {
                        document.getElementById(bus.id).innerHTML = '<span style="color:#666">暫時沒有班次資料</span>';
                        continue;
                    }

                    let html = next3.map((etaObj, index) => {
                        let etaTime = new Date(etaObj.eta);
                        let diffMs = etaTime - new Date();
                        let diffMins = Math.max(0, Math.floor(diffMs / 60000));
                        let hh = String(etaTime.getHours()).padStart(2, '0');
                        let mm = String(etaTime.getMinutes()).padStart(2, '0');
                        
                        // 少於10分鐘顯示芒果黃
                        let colorCls = diffMins < 10 ? 'mango' : '';
                        let separator = index < next3.length - 1 ? ' | ' : '';
                        
                        return `<span>${hh}:${mm}(<span class="${colorCls}">${diffMins}分鐘</span>)${separator}</span>`;
                    }).join('');

                    document.getElementById(bus.id).innerHTML = html;
                } catch (e) {
                    console.error('Bus API Error:', bus.id, e);
                }
            }
            updateUpdateTimer();
        }

        // ==========================
        // 天氣 API 獲取邏輯
        // ==========================
        async function updateWeather() {
            try {
                let [rhrRes, fndRes, warnRes, swtRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')
                ]);

                let rhr = await rhrRes.json();
                let fnd = await fndRes.json();
                let warn = await warnRes.json();
                let swt = await swtRes.json();

                // 1. 現時天氣
                let tyTemp = rhr.temperature.data.find(d => d.place === '青衣') || rhr.temperature.data[0];
                let humidity = rhr.humidity.data[0].value;
                let iconId = rhr.icon[0];
                
                document.getElementById('weather-row1').innerHTML = 
                    `<img class="weather-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png"> ` +
                    `${tyTemp.value}°C(青衣) 💧${humidity}%`;

                // 2. 今日最高/最低溫度
                let todayFnd = fnd.weatherForecast[0];
                document.getElementById('weather-row2').innerHTML = 
                    `<span class="temp-blue">❄️${todayFnd.forecastMintemp.value}°C</span> &nbsp; ` + 
                    `<span class="temp-red">☀️${todayFnd.forecastMaxtemp.value}°C</span>`;

                // 3. 天氣警告
                let warningHTML = '';
                if (Object.keys(warn).length > 0) {
                    for (let code in warn) {
                        warningHTML += `<div class="warning-badge">${warn[code].name}</div>`;
                    }
                } else {
                    warningHTML = `<div class="no-warning">現時沒有生效的警告</div>`;
                }
                document.getElementById('warning-box').innerHTML = warningHTML;

                // 4. 特別天氣提示 (防溢出 + 跑馬燈)
                let swtContent = document.getElementById('swt-content');
                if (swt.swt && swt.swt.length > 0) {
                    swtContent.innerHTML = swt.swt.map(item => item.desc).join('<br><br>');
                    swtContent.style.color = '#FFFFFF';
                    swtContent.style.textAlign = 'left';
                    swtContent.style.position = 'absolute';
                    
                    // 等待 DOM 渲染後判斷高度
                    setTimeout(() => {
                        if (swtContent.scrollHeight > 180) {
                            swtContent.classList.add('swt-scroll');
                        } else {
                            swtContent.classList.remove('swt-scroll');
                            swtContent.style.position = 'static'; // 若高度夠，則靜態顯示
                        }
                    }, 50);
                } else {
                    swtContent.innerHTML = '<div style="text-align: center; margin-top: 60px; color: #555;">現時沒有特別天氣提示</div>';
                    swtContent.classList.remove('swt-scroll');
                    swtContent.style.position = 'static';
                }
            } catch (e) {
                console.error('Weather API Error:', e);
            }
        }

        // ==========================
        // 新聞 RSS 獲取邏輯
        // ==========================
        async function updateNews() {
            try {
                // 使用 Proxy 繞過 RSS 的跨網域 (CORS) 問題
                let res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://rthk.hk/rthk/news/rss/c_expressnews_bcc.xml')}`);
                let json = await res.json();
                
                let parser = new DOMParser();
                let xmlDoc = parser.parseFromString(json.contents, "text/xml");
                let items = xmlDoc.getElementsByTagName("item");
                let newsTitles = [];
                
                for (let i = 0; i < items.length; i++) {
                    newsTitles.push(items[i].getElementsByTagName("title")[0].textContent);
                }
                
                if(newsTitles.length > 0) {
                    // 使用間隔符號將新聞串接
                    document.getElementById('news-marquee-text').innerHTML = newsTitles.join(' &nbsp;&nbsp;&nbsp;&nbsp; ｜ &nbsp;&nbsp;&nbsp;&nbsp; ');
                }
            } catch (e) {
                console.error('News API Error:', e);
                document.getElementById('news-marquee-text').innerHTML = '暫時無法獲取即時新聞...';
            }
        }

        // ==========================
        // 初始化與排程
        // ==========================
        setInterval(updateClock, 1000);   // 時鐘每 1 秒
        setInterval(updateBuses, 30000);  // 巴士每 30 秒
        setInterval(updateWeather, 30000);// 天氣每 30 秒
        setInterval(updateNews, 300000);  // 新聞每 5 分鐘
        
        // 首次加載執行
        updateClock();
        updateBuses();
        updateWeather();
        updateNews();

    </script>
</body>
</html>
