<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士天氣資訊板</title>
    <style>
        /* 全局重置與深色背景 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部更新時間 */
        .top-bar {
            text-align: center;
            font-size: 20px;
            color: #A0A0A0;
            padding: 4px 0;
            background-color: #000000;
            flex-shrink: 0;
        }

        /* 主內容區：左右分欄 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-bottom: 2px solid #222;
        }

        /* 欄位共同設定（隱藏滾動條） */
        .column {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 0 10px;
            -ms-overflow-style: none;  /* IE/Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .column::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* 左欄：巴士資訊 */
        .left-column {
            border-right: 1px solid #222;
        }
        .bus-route-box {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            word-wrap: break-word;
        }
        .bus-header {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .bus-badge {
            font-size: 34px;
            font-weight: bold;
            color: #FFFFFF;
            padding: 2px 12px;
            border-radius: 10px;
            margin-right: 12px;
            display: inline-block;
            text-align: center;
            min-width: 110px;
        }
        .bus-info {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: bold;
        }
        .bus-eta-row {
            font-size: 32px;
            color: #FFFFFF;
            padding-left: 4px;
            line-height: 1.3;
        }
        .eta-item {
            display: inline-block;
        }
        .eta-now {
            color: #FFC107; /* 芒果黃 */
            font-weight: bold;
        }
        .eta-normal {
            color: #FFFFFF;
        }

        /* 右欄：時間與天氣（置中佈局） */
        .right-column {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-box {
            margin-top: 5px;
            line-height: 1;
        }
        .time-text {
            font-size: 100px;
            font-weight: bold;
            color: #FFFFFF;
        }
        .ampm-text {
            font-size: 40px;
            color: #FFFFFF;
            margin-right: 10px;
            font-weight: bold;
        }
        .date-text {
            font-size: 30px;
            color: #FFFFFF;
            margin-top: -2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* 天氣數據列 */
        .weather-info-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .weather-row1 {
            font-size: 32px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin-bottom: 0px;
        }
        .weather-icon {
            width: 45px;
            height: 45px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .weather-row2 {
            font-size: 32px;
            line-height: 1;
            margin-top: 0px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .temp-low {
            color: #5bc0de; /* 藍色 */
            margin-right: 15px;
        }
        .temp-high {
            color: #d9534f; /* 紅色 */
        }

        /* 天氣警告 */
        .warning-box {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 12px;
            width: 100%;
            padding: 0 10px;
        }
        .warning-badge {
            background-color: #d9534f; /* 紅色圓角底 */
            color: #FFFFFF;
            padding: 4px 14px;
            border-radius: 8px;
            display: inline-block;
            margin: 3px;
        }
        .no-warning {
            color: #555555; /* 暗灰色 */
            font-size: 30px;
        }

        /* 特別天氣提示垂直跑馬燈 */
        .swt-box {
            width: 100%;
            font-size: 30px;
            padding: 0 15px;
            text-align: left;
            border-top: 1px solid #111;
            padding-top: 8px;
        }
        .no-swt {
            color: #555555;
            text-align: center;
        }
        .swt-marquee-container {
            height: 165px; /* 約5行高度 */
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .swt-marquee-content {
            position: absolute;
            width: 100%;
            animation: scrollUp 20s linear infinite;
        }
        /* 暫停特效：手指點擊或滑鼠懸停時暫停跑馬燈方便長者閱讀 */
        .swt-marquee-content:hover {
            animation-play-state: paused;
        }
        @keyframes scrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        .swt-p {
            margin-bottom: 8px;
            line-height: 1.1;
            color: #FFA500; /* 橙色醒目提示 */
        }

        /* 底部：即時新聞跑馬燈 */
        .bottom-news-bar {
            height: 65px;
            background-color: #000000;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .news-label {
            background-color: #FF0000;
            color: #FFFFFF;
            font-size: 45px;
            font-weight: bold;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 5px 0 10px rgba(0,0,0,0.5);
        }
        .news-marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            padding-left: 210px; /* 留出放標籤的空間 */
        }
        .news-marquee-content {
            display: inline-block;
            font-size: 45px;
            color: #FFFFFF;
            font-weight: bold;
            animation: marqueeLeft 45s linear infinite;
            padding-left: 20%;
        }
        @keyframes marqueeLeft {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="top-bar" id="last-update">最後更新：--:--:--（每30秒自動刷新）</div>

    <div class="main-container">
        
        <div class="column left-column" id="bus-column">
            <div class="bus-route-box" id="route-249X">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #0056B3;">249X</span>
                    <span class="bus-info">往博康 📍青桃樓</span>
                </div>
                <div class="bus-eta-row" id="eta-249X">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-42A">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #28A745;">42A</span>
                    <span class="bus-info">往西九龍 📍青桃樓</span>
                </div>
                <div class="bus-eta-row" id="eta-42A">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-43">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #FD7E14;">43</span>
                    <span class="bus-info">往荃灣西 📍青桃樓</span>
                </div>
                <div class="bus-eta-row" id="eta-43">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-49M-ty">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #6F42C1;">49M</span>
                    <span class="bus-info">往青衣站 📍青富苑</span>
                </div>
                <div class="bus-eta-row" id="eta-49M-ty">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-49M-kf">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #E83E8C;">49M</span>
                    <span class="bus-info">往青富苑 📍青衣站</span>
                </div>
                <div class="bus-eta-row" id="eta-49M-kf">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-68E">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #20C997;">68E</span>
                    <span class="bus-info">往元朗 📍青衣站</span>
                </div>
                <div class="bus-eta-row" id="eta-68E">載入中...</div>
            </div>

            <div class="bus-route-box" id="route-243M">
                <div class="bus-header">
                    <span class="bus-badge" style="background-color: #17A2B8;">243M</span>
                    <span class="bus-info">往荃灣 📍美景花園</span>
                </div>
                <div class="bus-eta-row" id="eta-243M">載入中...</div>
            </div>
        </div>

        <div class="column right-column">
            <div class="time-box">
                <span class="ampm-text" id="time-ampm">上午</span><span class="time-text" id="time-clock">00:00</span>
            </div>
            <div class="date-text" id="date-display">2026年7月13日 星期一</div>

            <div class="weather-info-container">
                <div class="weather-row1">
                    <img src="" alt="天氣" class="weather-icon" id="wx-icon" style="display:none;">
                    <span id="current-temp">--°C(青衣)</span>
                    <span id="current-humidity" style="margin-left: 15px;">💧--%</span>
                </div>
                <div class="weather-row2">
                    <span class="temp-low" id="forecast-low">❄️--°C</span><span class="temp-high" id="forecast-high">☀️--°C</span>
                </div>
            </div>

            <div class="warning-box" id="warning-container">
                <div class="no-warning">正在獲取警告資訊...</div>
            </div>

            <div class="swt-box" id="swt-container">
                <div class="no-swt">正在獲取特別天氣提示...</div>
            </div>
        </div>

    </div>

    <div class="bottom-news-bar">
        <div class="news-label">即時新聞</div>
        <div class="news-marquee-container">
            <div class="news-marquee-content" id="news-marquee-text">正在加載香港電台即時新聞綜合頻道...</div>
        </div>
    </div>

    <script>
        // 配置參數與資料來源網址
        const BUS_CONFIG = {
            '249X': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1',
            '42A': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1',
            '43': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1',
            '49M-ty': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1',
            '49M-kf': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1',
            '68E': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1',
            '243M': 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1'
        };

        const WEATHER_URLS = {
            rhrread: 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',
            fnd: 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc',
            warnsum: 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc',
            swt: 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc'
        };

        const NEWS_RSS_URLS = [
            'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_greaterchina.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cfinance.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_csport.xml'
        ];

        // 使用公用 CORS 代理來讀取香港電台 RSS（以解決跨網域抓取限制）
        const CORS_PROXY = "https://api.allorigins.win/raw?url=";

        // 更新系統時間與日期
        function updateTime() {
            const now = new Date();
            
            // 24小時制用於上方更新時間
            const pad = (n) => n.toString().padStart(2, '0');
            const time24 = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('last-update').innerText = `最後更新：${time24}（每30秒自動刷新）`;

            // 12小時制用於右側大時鐘
            let hours = now.getHours();
            const ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0點應顯示為12點
            const minutes = pad(now.getMinutes());
            
            document.getElementById('time-ampm').innerText = ampm;
            document.getElementById('time-clock').innerText = `${pad(hours)}:${minutes}`;

            // 日期與星期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
            document.getElementById('date-display').innerText = dateStr;
        }

        // 獲取巴士實時 ETA
        async function fetchBusETA(id, url) {
            try {
                const response = await fetch(url);
                const json = await response.json();
                const container = document.getElementById(`eta-${id}`);
                
                if (!json.data || json.data.length === 0) {
                    container.innerText = "暫無班次數據";
                    return;
                }

                // 篩選出有明確時間的預計班次，並按時間排序
                let etas = json.data
                    .filter(item => item.eta)
                    .map(item => {
                        const etaTime = new Date(item.eta);
                        const diffMs = etaTime - new Date();
                        const diffMins = Math.max(0, Math.floor(diffMs / 1000 / 60));
                        
                        // 格式化為 HH:mm
                        const hhmm = etaTime.toTimeString().substring(0, 5);
                        return { hhmm, diffMins };
                    });

                // 取前三個班次
                etas = etas.slice(0, 3);

                if (etas.length === 0) {
                    container.innerText = "暫無最近班次";
                    return;
                }

                // 渲染成一條包含精準倒數顏色邏輯的 HTML 字串
                const htmlArray = etas.map((item) => {
                    const isLessThanTen = item.diffMins < 10;
                    const countdownClass = isLessThanTen ? 'eta-now' : 'eta-normal';
                    return `<span class="eta-item">${item.hhmm}(<span class="${countdownClass}">${item.diffMins}分鐘</span>)</span>`;
                });

                container.innerHTML = htmlArray.join(' | ');
            } catch (error) {
                console.error(`Error fetching bus ${id}:`, error);
                document.getElementById(`eta-${id}`).innerText = "連線超時";
            }
        }

        // 全局巴士更新控制器
        function refreshAllBuses() {
            for (const [id, url] of Object.entries(BUS_CONFIG)) {
                fetchBusETA(id, url);
            }
        }

        // 獲取並解析香港天文台天氣數據
        async function fetchWeather() {
            try {
                // 1. 現時天氣 (rhrread)
                const rhrResponse = await fetch(WEATHER_URLS.rhrread);
                const rhrData = await rhrResponse.json();

                // 找青衣的現時溫度
                let tsingYiTemp = "--";
                if (rhrData.temperature && rhrData.temperature.data) {
                    const tyObj = rhrData.temperature.data.find(item => item.place === '青衣');
                    if (tyObj) tsingYiTemp = tyObj.value;
                    else if (rhrData.temperature.data.length > 0) tsingYiTemp = rhrData.temperature.data[0].value;
                }
                document.getElementById('current-temp').innerText = `${tsingYiTemp}°C(青衣)`;

                // 濕度
                if (rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    document.getElementById('current-humidity').innerText = `💧${rhrData.humidity.data[0].value}%`;
                }

                // 天氣線條圖標 (HKOWxIconOutline)
                if (rhrData.icon && rhrData.icon.length > 0) {
                    const iconId = rhrData.icon[0];
                    const iconImg = document.getElementById('wx-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                    iconImg.style.display = 'inline-block';
                }

                // 2. 當天最高最低溫預測 (fnd)
                const fndResponse = await fetch(WEATHER_URLS.fnd);
                const fndData = await fndResponse.json();
                if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const todayForecast = fndData.weatherForecast[0];
                    document.getElementById('forecast-low').innerText = `❄️${todayForecast.forecastMintemp.value}°C`;
                    document.getElementById('forecast-high').innerText = `☀️${todayForecast.forecastMaxtemp.value}°C`;
                }

                // 3. 天氣警告對應子類型轉換 (warnsum)
                const warnResponse = await fetch(WEATHER_URLS.warnsum);
                const warnData = await warnResponse.json();
                const warnContainer = document.getElementById('warning-container');
                
                let warningBadges = [];
                
                // 定義需要特別對應對齊的子類型文字字典
                const warningMap = {
                    'WFIREY': '黃色火災危險警告',
                    'WFIRER': '紅色火災危險警告',
                    'WRAINA': '黃色暴雨警告信號',
                    'WRAINR': '紅色暴雨警告信號',
                    'WRAINB': '黑色暴雨警告信號',
                    'TC1': '一號戒備信號',
                    'TC3': '三號強風信號',
                    'TC8NE': '八號東北烈風或暴風信號',
                    'TC8SE': '八號東南烈風或暴風信號',
                    'TC8SW': '八號西南烈風或暴風信號',
                    'TC8NW': '八號西北烈風或暴風信號',
                    'TC9': '九號烈風或暴風風力增強信號',
                    'TC10': '十號颶風信號'
                };

                if (warnData && Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        const item = warnData[key];
                        if (item && item.code) {
                            const code = item.code;
                            if (warningMap[code]) {
                                warningBadges.push(`<span class="warning-badge">${warningMap[code]}</span>`);
                            } else if (item.name) {
                                warningBadges.push(`<span class="warning-badge">${item.name}</span>`);
                            }
                        }
                    }
                }

                if (warningBadges.length > 0) {
                    warnContainer.innerHTML = warningBadges.join('');
                } else {
                    warnContainer.innerHTML = `<div class="no-warning">現時沒有生效的警告</div>`;
                }

                // 4. 特別天氣提示動態跑馬燈 (swt)
                const swtResponse = await fetch(WEATHER_URLS.swt);
                const swtData = await swtResponse.json();
                const swtContainer = document.getElementById('swt-container');

                if (swtData && swtData.swt && swtData.swt.length > 0) {
                    let swtHtml = `<div class="swt-marquee-container"><div class="swt-marquee-content">`;
                    swtData.swt.forEach(tip => {
                        if (tip.desc) {
                            swtHtml += `<p class="swt-p">${tip.desc}</p>`;
                        }
                    });
                    swtHtml += `</div></div>`;
                    swtContainer.innerHTML = swtHtml;
                } else {
                    swtContainer.innerHTML = `<div class="no-swt">現時沒有特別天氣提示</div>`;
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
            }
        }

        // 獲取與混合香港電台的 5 個 RSS 頻道新聞
        async function fetchNews() {
            try {
                let allTitles = [];
                
                // 異步平行請求所有 RSS 頻道
                const requests = NEWS_RSS_URLS.map(url => 
                    fetch(CORS_PROXY + encodeURIComponent(url))
                        .then(res => res.text())
                        .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                        .then(data => {
                            const items = data.querySelectorAll("item");
                            items.forEach(item => {
                                const title = item.querySelector("title")?.textContent;
                                if (title) allTitles.push(title.trim());
                            });
                        })
                        .catch(e => console.error("RSS fetch error:", e))
                );

                await Promise.all(requests);

                if (allTitles.length > 0) {
                    // 打散混合同步顯示，用雙菱形標誌分隔
                    const marqueeText = allTitles.join(' &nbsp;&nbsp;&nbsp;&nbsp;◇&nbsp;&nbsp;&nbsp;&nbsp; ');
                    document.getElementById('news-marquee-text').innerHTML = marqueeText;
                    
                    // 動態計算長度來優化滾動速度 (每100字約增加1.5秒，保持平滑適中的速度)
                    const speed = Math.max(30, Math.floor(allTitles.length * 1.5));
                    document.getElementById('news-marquee-text').style.animationDuration = `${speed}s`;
                } else {
                    document.getElementById('news-marquee-text').innerText = "暫時未能讀取最新新聞。";
                }
            } catch (error) {
                console.error("Error fetching news:", error);
                document.getElementById('news-marquee-text').innerText = "即時新聞連線伺服器慢，重試中...";
            }
        }

        // 初始化定時器排程
        updateTime();
        setInterval(updateTime, 1000); // 時鐘秒針每秒更新

        // 巴士、時間、天氣：每30秒全面重刷一次
        refreshAllBuses();
        fetchWeather();
        setInterval(() => {
            refreshAllBuses();
            fetchWeather();
        }, 30000);

        // 即時新聞：每5分鐘更新一次
        fetchNews();
        setInterval(fetchNews, 300000);

    </script>
</body>
</html>
