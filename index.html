<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊面板</title>
    <style>
        /* 基礎設置與變數 */
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-accent: #FFD700;
            --danger-red: #FF4D4F;
            --warning-bg: #820014;
            --border-color: #333333;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 頂部更新時間 */
        #header {
            text-align: center;
            padding: 5px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            color: #AAAAAA;
        }

        /* 佈局：左 60% 右 40% */
        #container {
            display: flex;
            height: calc(100vh - 40px);
            width: 100vw;
        }

        #left-panel {
            width: 60%;
            padding: 10px 15px;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: hidden; /* 緊湊顯示，不捲動 */
        }

        #right-panel {
            width: 40%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- 左欄：巴士資訊樣式 --- */
        .bus-row {
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .bus-row:last-child {
            border-bottom: none;
        }

        .bus-header {
            display: flex;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .bus-badge {
            padding: 2px 10px;
            border-radius: 8px;
            margin-right: 10px;
            color: white;
            font-size: 1.5rem;
            min-width: 65px;
            text-align: center;
        }

        .bus-dest {
            margin-right: 10px;
        }

        .bus-stop {
            color: var(--text-accent);
            font-size: 1.2rem;
        }

        .bus-eta-container {
            display: flex;
            font-size: 1.4rem;
            align-items: center;
        }

        .eta-item {
            margin-right: 15px;
        }

        /* 閃爍動畫 */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .eta-urgent {
            color: var(--danger-red);
            font-weight: bold;
            animation: blink 1s infinite;
        }

        /* --- 右欄：時間與天氣樣式 --- */
        #clock-section {
            text-align: center;
            margin-bottom: 10px;
        }

        #time-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--text-accent);
            line-height: 1;
        }

        #date-display {
            font-size: 1.4rem;
            margin-top: 5px;
        }

        #weather-basic {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 1.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        #weather-icon {
            width: 60px;
            height: 60px;
        }

        #weather-temps {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.4rem;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        #warnings-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .warning-box {
            background-color: var(--warning-bg);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #ff4d4f;
        }

        #special-tips {
            border: 2px dashed var(--text-accent);
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            line-height: 1.4;
            margin-top: auto;
        }
        
        .tips-title {
            color: var(--text-accent);
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 響應式設計：針對 4吋平板/較小螢幕自動縮小 */
        @media (max-width: 800px) {
            html { font-size: 12px; }
            .bus-header { font-size: 1.2rem; }
            .bus-badge { font-size: 1.2rem; min-width: 50px; }
            .bus-stop { font-size: 1.1rem; }
            .bus-eta-container { font-size: 1.2rem; }
            #time-display { font-size: 3.5rem; }
            #weather-basic { font-size: 1.5rem; }
            #weather-temps { font-size: 1.2rem; }
            .warning-box { font-size: 1rem; }
            #special-tips { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="header">🕒 最後更新：<span id="last-update">載入中...</span> (每30秒自動刷新)</div>

    <div id="container">
        <div id="left-panel">
            </div>

        <div id="right-panel">
            <div id="clock-section">
                <div id="time-display">00:00</div>
                <div id="date-display">載入中...</div>
            </div>

            <div id="weather-basic">
                <img id="weather-icon" src="" alt="天氣圖" style="display:none;">
                <div><span id="current-temp">--</span>°C</div>
                <div>|</div>
                <div>濕度: <span id="current-humidity">--</span>%</div>
            </div>

            <div id="weather-temps">
                <div>❄️ <span id="min-temp">--</span>°C</div>
                <div>|</div>
                <div>☀️ <span id="max-temp">--</span>°C</div>
            </div>

            <div id="warnings-container">
                </div>

            <div id="special-tips" style="display:none;">
                <div class="tips-title">⚠️ 特別天氣提示：</div>
                <div id="tips-content"></div>
            </div>
        </div>
    </div>

    <script>
        // 巴士路線設定資料
        const busRoutes = [
            { route: '249X', dest: '往 博康', stop: '長青邨青桃樓', color: '#1890FF', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1' },
            { route: '42A', dest: '往 西九龍', stop: '長青邨青桃樓', color: '#52C41A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1' },
            { route: '43', dest: '往 荃灣西', stop: '長青邨青桃樓', color: '#FA8C16', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1' },
            { route: '49M', dest: '往 青衣站', stop: '青富苑', color: '#722ED1', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1' },
            { route: '49M', dest: '往 青富苑', stop: '青衣站', color: '#722ED1', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1' },
            { route: '68E', dest: '往 元朗', stop: '青衣站', color: '#13C2C2', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1' },
            { route: '243M', dest: '往 荃灣', stop: '美景花園', color: '#8D6E63', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1' }
        ];

        // 格式化時間 (補零)
        const padZero = (num) => num.toString().padStart(2, '0');

        // 更新時鐘與日期
        function updateClock() {
            const now = new Date();
            const hours = padZero(now.getHours());
            const minutes = padZero(now.getMinutes());
            document.getElementById('time-display').innerText = `${hours}:${minutes}`;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dayStr = days[now.getDay()];
            document.getElementById('date-display').innerText = `${year}年${month}月${date}日 星期${dayStr}`;
        }

        // 更新最後更新時間
        function updateLastUpdateTime() {
            const now = new Date();
            const ampm = now.getHours() >= 12 ? '下午' : '上午';
            const h = padZero(now.getHours() % 12 || 12);
            const m = padZero(now.getMinutes());
            const s = padZero(now.getSeconds());
            document.getElementById('last-update').innerText = `${ampm} ${h}:${m}:${s}`;
        }

        // 抓取並渲染巴士資料
        async function fetchBusData() {
            const panel = document.getElementById('left-panel');
            let html = '';
            const now = new Date();

            for (const bus of busRoutes) {
                try {
                    const response = await fetch(bus.url);
                    const json = await response.json();
                    
                    // 過濾掉沒有 eta 的資料，並限制最多 3 班車
                    let etas = json.data.filter(item => item.eta !== null).slice(0, 3);
                    
                    let etaHtml = '';
                    if (etas.length === 0) {
                        etaHtml = '<span style="color:#888;">暫時沒有預定班次</span>';
                    } else {
                        etas.forEach((item, index) => {
                            const etaDate = new Date(item.eta);
                            const diffMs = etaDate - now;
                            const diffMins = Math.floor(diffMs / 60000);
                            
                            const timeStr = `${padZero(etaDate.getHours())}:${padZero(etaDate.getMinutes())}`;
                            
                            // 少於 10 分鐘使用緊急樣式
                            if (diffMins <= 10 && diffMins >= 0) {
                                etaHtml += `<span class="eta-item eta-urgent">🚨 ${timeStr}(${diffMins}分鐘)</span>`;
                            } else if (diffMins < 0) {
                                etaHtml += `<span class="eta-item">▶ ${timeStr}(即將抵達)</span>`;
                            } else {
                                etaHtml += `<span class="eta-item">▶ ${timeStr}(${diffMins}分鐘)</span>`;
                            }
                            
                            // 加上分隔線 (最後一個不加)
                            if (index < etas.length - 1) {
                                etaHtml += '<span style="color:#555; margin-right:15px;">|</span>';
                            }
                        });
                    }

                    html += `
                        <div class="bus-row">
                            <div class="bus-header">
                                <div class="bus-badge" style="background-color: ${bus.color};">${bus.route}</div>
                                <div class="bus-dest">${bus.dest}</div>
                                <div class="bus-stop">📍${bus.stop}</div>
                            </div>
                            <div class="bus-eta-container">
                                ${etaHtml}
                            </div>
                        </div>
                    `;
                } catch (error) {
                    console.error(`Error fetching bus ${bus.route}:`, error);
                    html += `<div class="bus-row"><div class="bus-header"><div class="bus-badge" style="background-color: ${bus.color};">${bus.route}</div><div class="bus-dest">資料載入失敗</div></div></div>`;
                }
            }
            panel.innerHTML = html;
        }

        // 抓取並渲染天氣資料
        async function fetchWeatherData() {
            try {
                // 1. 現時天氣 (溫度、濕度、圖標)
                const resCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const dataCurrent = await resCurrent.json();
                
                // 尋找香港天文台的溫度
                const hkoTemp = dataCurrent.temperature.data.find(d => d.place === '香港天文台') || dataCurrent.temperature.data[0];
                document.getElementById('current-temp').innerText = hkoTemp.value;
                document.getElementById('current-humidity').innerText = dataCurrent.humidity.data[0].value;
                
                if (dataCurrent.icon && dataCurrent.icon.length > 0) {
                    const iconImg = document.getElementById('weather-icon');
                    // 天文台官方圖標網址
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${dataCurrent.icon[0]}.png`;
                    iconImg.style.display = 'block';
                }

                // 2. 預報 (最高/最低溫度)
                const resForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const dataForecast = await resForecast.json();
                const todayForecast = dataForecast.weatherForecast[0];
                document.getElementById('min-temp').innerText = todayForecast.forecastMintemp.value;
                document.getElementById('max-temp').innerText = todayForecast.forecastMaxtemp.value;

                // 3. 天氣警告
                const resWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const dataWarn = await resWarn.json();
                const warnContainer = document.getElementById('warnings-container');
                warnContainer.innerHTML = '';
                
                // 檢查是否有警告
                if (Object.keys(dataWarn).length > 0) {
                    for (const key in dataWarn) {
                        const warnName = dataWarn[key].name;
                        warnContainer.innerHTML += `<div class="warning-box">⚠️ ${warnName}</div>`;
                    }
                }

                // 4. 特別天氣提示
                const resTips = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const dataTips = await resTips.json();
                const tipsBox = document.getElementById('special-tips');
                const tipsContent = document.getElementById('tips-content');
                
                if (dataTips.swt && dataTips.swt.length > 0) {
                    // 取最新的一條提示
                    tipsContent.innerText = dataTips.swt[0].desc;
                    tipsBox.style.display = 'block';
                } else {
                    tipsBox.style.display = 'none';
                }

            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        // 初始化與定時更新機制
        function init() {
            // 首次執行
            updateClock();
            fetchBusData();
            fetchWeatherData();
            updateLastUpdateTime();

            // 每秒更新時鐘
            setInterval(updateClock, 1000);

            // 每 30 秒更新巴士與天氣資料
            setInterval(() => {
                fetchBusData();
                fetchWeatherData();
                updateLastUpdateTime();
            }, 30000);
        }

        // 網頁載入完成後啟動
        window.onload = init;

    </script>
</body>
</html>
