<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1巴士天氣即時資訊平台</title>
    <style>
        /* 全局與佈局設定 */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            height: 100%;
            overflow: hidden;
        }

        /* 頂部最後更新時間 */
        .top-bar {
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 20px;
            color: #AAAAAA;
            background-color: #000000;
            border-bottom: 1px solid #222;
        }

        /* 中間主要內容雙欄區塊 */
        .main-container {
            position: absolute;
            top: 40px;
            bottom: 80px;
            left: 0;
            right: 0;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .column {
            display: table-cell;
            width: 50%;
            height: 100%;
            vertical-align: top;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .left-column {
            border-right: 2px solid #222;
        }

        .right-column {
            text-align: center;
        }

        .column::-webkit-scrollbar { width: 6px; }
        .column::-webkit-scrollbar-thumb { background-color: #333; border-radius: 3px; }

        /* 左欄：巴士實時資訊樣式 */
        .bus-row {
            border-bottom: 2px solid #222;
            padding: 14px 0;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .bus-row:last-child { border-bottom: none; }

        .bus-badge {
            display: inline-block;
            color: #ffffff;
            font-size: 34px;
            font-weight: bold;
            padding: 2px 14px;
            border-radius: 12px;
            margin-right: 12px;
            vertical-align: middle;
            text-align: center;
            min-width: 110px;
        }

        .bus-meta {
            font-size: 34px;
            color: #ffffff;
            vertical-align: middle;
            font-weight: bold;
        }

        .bus-eta-container {
            font-size: 32px;
            color: #ffffff;
            margin-top: 6px;
            padding-left: 5px;
        }

        .eta-item {
            display: inline-block;
            margin-right: 24px;
            white-space: nowrap;
        }

        .countdown-urgent { color: #FFC107; font-weight: bold; }
        .countdown-normal { color: #ffffff; }

        /* 右欄：時間、日期與天氣資訊樣式 */
        .time-section { margin-bottom: 0px; padding: 0; }

        .time-period {
            font-size: 40px;
            color: #ffffff;
            font-weight: bold;
            vertical-align: bottom;
            margin-right: 8px;
        }

        .time-clock {
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            line-height: 0.95;
        }

        .date-text {
            font-size: 30px;
            color: #ffffff;
            margin-top: 0px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* 天氣數據列 */
        .weather-row1 {
            font-size: 32px;
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.0;
            display: block;
            font-weight: bold;
        }

        .weather-icon {
            height: 48px;
            width: auto;
            vertical-align: middle;
            margin-right: 8px;
            margin-top: -6px;
        }

        .weather-row2 {
            font-size: 32px;
            margin: 0;
            padding: 0;
            line-height: 1.0;
            display: block;
            font-weight: bold;
        }

        .temp-min { color: #3399FF; }
        .temp-max { color: #FF3333; }

        /* 天氣警告 */
        .warning-container {
            margin-top: 15px;
            min-height: 45px;
            text-align: center;
        }

        .warning-badge {
            font-size: 30px;
            color: #ffffff;
            background-color: #FF3333;
            padding: 4px 14px;
            border-radius: 10px;
            display: inline-block;
            margin: 4px;
            font-weight: bold;
        }

        .no-warning, .no-swt {
            font-size: 30px;
            color: #808080;
            font-weight: bold;
        }

        /* 特別天氣提示垂直走馬燈 */
        .swt-container {
            margin-top: 15px;
            text-align: left;
            padding: 0 10px;
            height: 160px;
            overflow: hidden;
            position: relative;
            border-top: 1px solid #111;
            padding-top: 10px;
        }

        .swt-scroll-box {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
        }

        .swt-animate {
            animation: scrollUp 25s linear infinite;
        }

        .swt-item {
            font-size: 30px;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.3;
            font-weight: bold;
        }

        .no-swt {
            text-align: center;
            margin-top: 20px;
        }

        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* 底部新聞跑馬燈 */
        .news-ticker-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #111111;
            border-top: 3px solid #333333;
            z-index: 9999;
            overflow: hidden;
        }

        .news-label {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-color: #FF3333;
            color: #ffffff;
            font-size: 45px;
            font-weight: bold;
            padding: 0 20px;
            line-height: 77px;
            z-index: 10000;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .news-track {
            height: 100%;
            margin-left: 210px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .news-content {
            display: inline-block;
            padding-left: 100%;
            line-height: 77px;
            font-size: 45px;
            color: #ffffff;
            font-weight: bold;
            animation: marqueeHorizontal 180s linear infinite; /* 特慢速 180秒循環 */
        }

        @keyframes marqueeHorizontal {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="top-bar" id="update-timestamp">最後更新：--:--:--（每30秒自動刷新）</div>

    <div class="main-container">
        <div class="column left-column" id="bus-panel">
            <div class="bus-row"><div class="bus-badge" style="background-color: #0047AB;">249X</div><span class="bus-meta">往博康 📍青桃樓</span><div class="bus-eta-container" id="eta-249X">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #006400;">42A</div><span class="bus-meta">往西九龍 📍青桃樓</span><div class="bus-eta-container" id="eta-42A">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #E65100;">43</div><span class="bus-meta">往荃灣西 📍青桃樓</span><div class="bus-eta-container" id="eta-43">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #6A0DAD;">49M</div><span class="bus-meta">往青衣站 📍青富苑</span><div class="bus-eta-container" id="eta-49M-ty">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #6A0DAD;">49M</div><span class="bus-meta">往青富苑 📍青衣站</span><div class="bus-eta-container" id="eta-49M-kf">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #5D4037;">68E</div><span class="bus-meta">往元朗 📍青衣站</span><div class="bus-eta-container" id="eta-68E">載入中...</div></div>
            <div class="bus-row"><div class="bus-badge" style="background-color: #00695C;">243M</div><span class="bus-meta">往荃灣 📍美景花園</span><div class="bus-eta-container" id="eta-243M">載入中...</div></div>
        </div>

        <div class="column right-column">
            <div class="time-section">
                <span class="time-period" id="clock-period">下午</span>
                <span class="time-clock" id="clock-time">12:00</span>
            </div>
            <div class="date-text" id="date-display">2026年7月13日 星期一</div>

            <div class="weather-row1">
                <img src="" class="weather-icon" id="wx-icon" style="display:none;" alt="天氣圖標">
                <span id="current-temp">--°C</span>(青衣) <span style="margin-left:10px;">💧</span><span id="current-humidity">--%</span>
            </div>
            <div class="weather-row2">
                <span class="temp-min">❄️ <span id="forecast-min">--</span>°C</span> 
                <span class="temp-max" style="margin-left: 20px;">☀️ <span id="forecast-max">--</span>°C</span>
            </div>

            <div class="warning-container" id="warning-panel">
                <div class="no-warning">現時沒有生效的警告</div>
            </div>

            <div class="swt-container" id="swt-panel">
                <div class="no-swt">現時沒有特別天氣提示</div>
            </div>
        </div>
    </div>

    <div class="news-ticker-container">
        <div class="news-label">即時新聞</div>
        <div class="news-track">
            <div class="news-content" id="news-stream">正在獲取香港電台即時新聞綜合物資...</div>
        </div>
    </div>

    <script>
        const busRoutes = [
            { id: '249X', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/CA60760D2303E6D0/249X/1', targetId: 'eta-249X' },
            { id: '42A', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/42A/1', targetId: 'eta-42A' },
            { id: '43', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B085DDE8E381E370/43/1', targetId: 'eta-43' },
            { id: '49M-ty', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/333E9F98EEB84849/49M/1', targetId: 'eta-49M-ty' },
            { id: '49M-kf', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/68CD99B45DDE014B/49M/1', targetId: 'eta-49M-kf' },
            { id: '68E', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/83D9B6BE39530EEF/68E/1', targetId: 'eta-68E' },
            { id: '243M', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/97411601C5B851AD/243M/1', targetId: 'eta-243M' }
        ];

        const warningCodeMap = {
            'WFIREY': '黃色火災危險警告', 'WFIRER': '紅色火災危險警告',
            'WRAINA': '黃色暴雨警告信號', 'WRAINR': '紅色暴雨警告信號', 'WRAINB': '黑色暴雨警告信號',
            'TC1': '一號戒備信號', 'TC3': '三號強風信號',
            'TC8NE': '八號東北烈風或暴風信號', 'TC8SE': '八號東南烈風或暴風信號', 'TC8SW': '八號西南烈風或暴風信號', 'TC8NW': '八號西北烈風或暴風信號',
            'TC9': '九號烈風或暴風風力增強信號', 'TC10': '十號颶風信號', 'CANCEL': '取消所有熱帶氣旋警告信號'
        };

        const newsFeeds = [
            'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_greaterchina.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_cfinance.xml',
            'https://rthk.hk/rthk/news/rss/c_expressnews_csport.xml'
        ];

        const corsProxy = "https://api.allorigins.win/raw?url=";

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date-display').innerText = `${year}年${month}月${date}日 ${weekdays[now.getDay()]}`;

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const period = hours >= 12 ? '下午' : '上午';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            
            document.getElementById('clock-period').innerText = period;
            document.getElementById('clock-time').innerText = `${hours}:${minutes}`;
        }

        function updateRefreshTimestamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('update-timestamp').innerText = `最後更新：${h}:${m}:${s}（每30秒自動刷新）`;
        }

        async function fetchBusData() {
            for (const bus of busRoutes) {
                try {
                    const response = await fetch(bus.url);
                    const json = await response.json();
                    
                    if (json && json.data) {
                        let parsedEtas = json.data
                            .filter(item => item.eta)
                            .map(item => {
                                const diffMins = Math.max(0, Math.ceil((new Date(item.eta) - new Date()) / 60000));
                                return { timeStr: item.eta.substring(11, 16), mins: diffMins };
                            })
                            .sort((a, b) => a.mins - b.mins)
                            .slice(0, 3);

                        const container = document.getElementById(bus.targetId);
                        if (parsedEtas.length === 0) {
                            container.innerHTML = `<span style="color:#808080;">現時沒有預計班次</span>`;
                            continue;
                        }

                        container.innerHTML = parsedEtas.map(item => `
                            <span class="eta-item">${item.timeStr}(<span class="${item.mins < 10 ? 'countdown-urgent' : 'countdown-normal'}">${item.mins}分鐘</span>)</span>
                        `).join('');
                    }
                } catch (e) { document.getElementById(bus.targetId).innerHTML = `<span style="color:#FF3333;">連線失敗</span>`; }
            }
        }

        async function fetchWeatherCurrent() {
            try {
                const data = await (await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc')).json();
                if (data) {
                    let temp = data.temperature?.data?.find(i => i.place === '青衣')?.value || data.temperature?.data?.find(i => i.place === '香港天文台')?.value || '--';
                    document.getElementById('current-temp').innerText = `${temp}°C`;
                    if (data.humidity?.data?.[0]) document.getElementById('current-humidity').innerText = `${data.humidity.data[0].value}%`;
                    if (data.icon?.[0]) {
                        const iconImg = document.getElementById('wx-icon');
                        iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.icon[0]}.png`;
                        iconImg.style.display = 'inline-block';
                    }
                }
            } catch (e) {}
        }

        async function fetchWeatherForecast() {
            try {
                const data = await (await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc')).json();
                if (data?.weatherForecast?.[0]) {
                    document.getElementById('forecast-min').innerText = data.weatherForecast[0].forecastMinTemp.value;
                    document.getElementById('forecast-max').innerText = data.weatherForecast[0].forecastMaxTemp.value;
                }
            } catch (e) {}
        }

        async function fetchWeatherWarnings() {
            try {
                const data = await (await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')).json();
                const panel = document.getElementById('warning-panel');
                let html = '';
                for (const key in data) {
                    const code = data[key].code;
                    const title = warningCodeMap[code] || data[key].name;
                    if (title) html += `<div class="warning-badge">${title}</div>`;
                }
                panel.innerHTML = html !== '' ? html : `<div class="no-warning">現時沒有生效的警告</div>`;
            } catch (e) {}
        }

        async function fetchSpecialWeatherTips() {
            try {
                const data = await (await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc')).json();
                const panel = document.getElementById('swt-panel');
                if (data?.swf?.length > 0) {
                    let htmlStr = `<div class="swt-scroll-box" id="swt-mover">` + data.swf.map((t, i) => `<div class="swt-item">${i + 1}. ${t.desc}</div>`).join('') + `</div>`;
                    panel.innerHTML = htmlStr;
                    setTimeout(() => {
                        const mover = document.getElementById('swt-mover');
                        if (mover && mover.clientHeight > panel.clientHeight) {
                            mover.innerHTML += mover.innerHTML;
                            mover.classList.add('swt-animate');
                        }
                    }, 300);
                } else {
                    panel.innerHTML = `<div class="no-swt">現時沒有特別天氣提示</div>`;
                }
            } catch (e) {}
        }

        async function fetchRTHKNews() {
            let combinedTitles = [];
            const results = await Promise.allSettled(newsFeeds.map(async (url) => {
                const text = await (await fetch(corsProxy + encodeURIComponent(url))).text();
                const items = new DOMParser().parseFromString(text, "text/xml").getElementsByTagName("item");
                return Array.from(items).slice(0, 4).map(i => i.getElementsByTagName("title")[0]?.textContent.trim()).filter(Boolean);
            }));
            results.forEach(r => { if (r.status === 'fulfilled') combinedTitles = combinedTitles.concat(r.value); });
            document.getElementById('news-stream').innerText = combinedTitles.length > 0 ? combinedTitles.join(' ｜ ') + ' ｜ ' : '未能獲取新聞。';
        }

        function initDashboard() {
            updateClock();
            setInterval(updateClock, 1000);
            const refreshFastData = async () => {
                await Promise.all([fetchBusData(), fetchWeatherCurrent(), fetchWeatherForecast(), fetchWeatherWarnings(), fetchSpecialWeatherTips()]);
                updateRefreshTimestamp();
            };
            refreshFastData();
            setInterval(refreshFastData, 30000);
            fetchRTHKNews();
            setInterval(fetchRTHKNews, 300000);
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
